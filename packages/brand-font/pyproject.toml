[project]
name = "altruvex-brand-font"
version = "0.1.0"
description = "Altruvex Sans (Track A): interim OFL derivative of Outfit and Vazirmatn"
requires-python = ">=3.12"
dependencies = [
    "fonttools==4.66.0",
    "brotli==1.2.0",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "shapely==2.1.2",
]

[dependency-groups]
dev = [
    "freetype-py==2.5.1",
    "numpy==2.5.3",
    "playwright>=1.50,<2",
    "pytest>=9.0.3,<10",
    "uharfbuzz==0.56.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
markers = ["browser: renders in Playwright engines (slower; needs `uv run playwright install chromium firefox webkit`)"]
