<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Statement read on scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens: copied from packages/ui/src/styles/tokens.css + apps/www/app/globals.css ── */
:root {
  color-scheme: light;
  --background: hsl(0 0% 98%);            /* tokens.css:157 → --n-0 (134) */
  --foreground: hsl(0 0% 6%);             /* tokens.css:158 → --n-8 (142) */
  --muted: hsl(0 0% 91%);                 /* tokens.css:169 → --n-2 (136) */
  --muted-foreground: hsl(0 0% 40%);      /* tokens.css:170 */
  --surface: hsl(0 0% 94%);               /* tokens.css:163 */
  --border-subtle: hsl(0 0% 6% / 0.1);    /* tokens.css:189,192 (--s-border) */
  --brand: hsl(214 89% 48%);              /* tokens.css:145 */
  --brand-fg: hsl(0 0% 98%);              /* tokens.css:153 */
  --soft-title: hsl(0 0% 6% / 0.45);      /* section-heading "soft" tone: text-foreground/45 */

  --font-outfit: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
  --font-vazirmatn: "Vazirmatn", sans-serif;               /* globals.css:57 */
  --font-serif: Georgia, "Times New Roman", serif;         /* globals.css:18 */

  --section-y-top: clamp(5rem, 10vh, 8rem);                /* globals.css:58 */
  --section-y-bottom: clamp(5rem, 14vh, 10rem);            /* globals.css:59 */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-theme: 400ms;                                 /* tokens.css --duration-theme */
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: hsl(0 0% 7%);             /* tokens.css:225 */
  --foreground: hsl(0 0% 94%);            /* tokens.css:226 */
  --muted: hsl(0 0% 16%);                 /* tokens.css:233 */
  --muted-foreground: hsl(0 0% 58%);      /* tokens.css:234 */
  --surface: hsl(0 0% 11%);               /* tokens.css:228 */
  --border-subtle: hsl(0 0% 98% / 0.1);   /* tokens.css:246 */
  --soft-title: hsl(0 0% 94% / 0.45);
}
/* Orange world — globals.css:279-290 */
.accent-world-orange {
  --local-accent: hsl(27 90% 35%);
  --local-accent-text: var(--local-accent);
}
:root[data-theme="dark"] .accent-world-orange {
  --local-accent: hsl(27 78% 61%);
  --local-accent-text: var(--local-accent);
}

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-inter);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  transition: background-color var(--duration-theme) var(--ease), color var(--duration-theme) var(--ease);
}
[dir="rtl"] body { font-family: var(--font-vazirmatn), var(--font-inter), sans-serif; line-height: 1.9; }
[dir="rtl"] * { letter-spacing: 0 !important; }
h2, p { margin: 0; }

/* Container — components/shared/container.tsx: max-w-352 px-6 sm:px-8 md:px-12 lg:px-16 */
.container { width: 100%; max-width: 1408px; margin-inline: auto; padding-inline: 24px; }
@media (min-width: 640px)  { .container { padding-inline: 32px; } }
@media (min-width: 768px)  { .container { padding-inline: 48px; } }
@media (min-width: 1024px) { .container { padding-inline: 64px; } }

/* Eyebrow — globals.css:720-740 */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted-foreground);
}
[dir="rtl"] .eyebrow { font-family: var(--font-vazirmatn), sans-serif; letter-spacing: 0; text-transform: none; }

/* Section title — globals.css:729 (.section-title) + section-heading.tsx */
.section-title {
  font-family: var(--font-outfit);
  font-weight: 400;
  font-size: clamp(28px, 4.5vw, 52px);
  line-height: 1.08;
  letter-spacing: -0.02em;
  text-wrap: balance;
  color: var(--foreground);
}
[dir="rtl"] .section-title { font-family: var(--font-vazirmatn), var(--font-outfit), sans-serif; line-height: 1.3; }
.section-title .soft {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
  color: var(--soft-title);
}
[dir="rtl"] .section-title .soft {
  font-family: var(--font-vazirmatn), sans-serif;
  font-style: normal;
  font-weight: 700;
  color: var(--muted-foreground);
}
.section-title br { display: none; }
@media (min-width: 768px) { .section-title br { display: block; } }

/* ── Prototype chrome ── */
.proto-label {
  position: fixed; top: 12px; left: 16px; z-index: 50;
  max-width: calc(100vw - 32px - 196px);
  font-family: var(--font-mono); font-size: 11px; line-height: 1.4; letter-spacing: 0.04em;
  color: var(--muted-foreground);
  background: var(--background);
  padding: 6px 8px; border: 1px solid var(--border-subtle); border-radius: 6px;
}
.toolbar {
  position: fixed; top: 12px; right: 16px; z-index: 50;
  display: flex; gap: 6px;
}
.seg {
  display: inline-flex; background: var(--background);
  border: 1px solid var(--border-subtle); border-radius: 999px; padding: 2px;
}
.seg button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  color: var(--muted-foreground);
  min-width: 40px; height: 28px; padding: 0 8px; border-radius: 999px;
  transition: background-color 200ms var(--ease), color 200ms var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--foreground); color: var(--background); }
.seg button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ── Context stub above: the tail of the hero ── */
.stub-hero {
  min-height: 100svh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding-bottom: 3rem;
}
.stub-hero .rule { height: 2px; background: var(--foreground); margin-bottom: 1rem; }
.stub-hero p { color: var(--muted-foreground); font-size: 0.9375rem; }

/* ── The section ── */
.problem { padding-block: var(--section-y-top) var(--section-y-bottom); }
.problem .heading { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 56px; }
@media (min-width: 768px) { .problem .heading { margin-bottom: 80px; } }

.read {
  font-family: var(--font-outfit);
  font-weight: 400;
  font-size: clamp(2rem, 4.4vw, 4rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  max-width: 17em;
  overflow-wrap: break-word;
}
[dir="rtl"] .read { font-family: var(--font-vazirmatn), var(--font-outfit), sans-serif; font-weight: 500; line-height: 1.45; }

/* Unread state. Colour only — the scrub tweens `color`, never opacity. */
.read .w { color: var(--muted-foreground); }
@media (prefers-reduced-motion: reduce) {
  .read .w { color: var(--foreground); }
  .read .w[data-accent] { color: var(--local-accent-text); }
}

.after {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid var(--border-subtle);
  color: var(--muted-foreground);
  font-size: 0.9375rem;
}
@media (min-width: 768px) { .after { margin-top: 80px; } }

/* ── Context stub below: the next section's head ── */
.stub-next { padding-top: var(--section-y-top); min-height: 90svh; }
.stub-next .heading { display: flex; flex-direction: column; gap: 0.75rem; }
</style>
</head>
<body>

<p class="proto-label" dir="ltr">Prototype B — Statement read on scroll</p>

<div class="toolbar" dir="ltr" role="group" aria-label="Prototype controls">
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ar" aria-pressed="false" lang="ar">AR</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-theme-btn="light" aria-pressed="true">Light</button>
    <button type="button" data-theme-btn="dark" aria-pressed="false">Dark</button>
  </div>
</div>

<main>
  <div class="stub-hero container" aria-hidden="true">
    <div class="rule"></div>
    <p data-copy="heroStub"></p>
  </div>

  <section class="problem accent-world-orange" aria-labelledby="problem-heading">
    <div class="container">
      <div class="heading">
        <p class="eyebrow" data-copy="eyebrow"></p>
        <h2 id="problem-heading" class="section-title">
          <span data-copy="title"></span><br> <span class="soft" data-copy="titleItalic"></span>
        </h2>
      </div>

      <p class="read" id="read"></p>

      <p class="after" data-copy="after"></p>
    </div>
  </section>

  <div class="stub-next container" aria-hidden="true">
    <div class="heading">
      <p class="eyebrow" data-copy="nextIndex"></p>
      <p class="section-title" data-copy="nextTitle"></p>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function () {
  "use strict";

  var COPY = {
    en: {
      heroStub: "This page, measured in your browser",
      eyebrow: "The Industry Problem",
      title: "Most businesses aren't getting engineering.",
      titleItalic: "They're getting templates.",
      read: "You paid for a custom website. You got a theme your competitors also bought, a password and a zip file on launch day, and a coordinator who relays your questions to a team you will never meet. It was built to pass the approval meeting — not to grow with you.",
      accents: ["a theme your competitors also bought", "a password and a zip file", "not to grow with you"],
      after: "Every line above is what we're built to undo.",
      nextIndex: "03",
      nextTitle: "What you actually own"
    },
    ar: {
      heroStub: "هذه الصفحة، مقيسة في متصفحك",
      eyebrow: "مشكلة الصناعة",
      title: "معظم الشركات لا تحصل على هندسة برمجية.",
      titleItalic: "هي تحصل على قوالب جاهزة.",
      read: "دفعت ثمن موقع مخصص. واستلمت قالبًا اشتراه منافسوك أيضًا، وكلمة مرور وملفًا مضغوطًا يوم الإطلاق، ومنسّقًا ينقل أسئلتك إلى فريق لن تلتقيه أبدًا. بُني ليجتاز اجتماع الموافقة — لا لينمو معك.",
      accents: ["قالبًا اشتراه منافسوك أيضًا", "كلمة مرور وملفًا مضغوطًا", "لا لينمو معك"],
      after: "كل ما سبق هو ما بُنينا لإصلاحه.",
      nextIndex: "٠٣",
      nextTitle: "ما تملكه فعلًا"
    }
  };

  // Same values as MOTION in apps/www/lib/motion/tokens.ts (stagger.word, scroll.readStart/readEnd).
  var READ = { stagger: 0.05, start: "top 78%", end: "bottom 45%" };

  var root = document.documentElement;
  var readEl = document.getElementById("read");
  var section = document.querySelector(".problem");
  var state = { lang: "en", theme: "light" };
  var mm = null;

  if (window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

  // Punctuation (Latin + Arabic) that may be split off a word's edge without
  // breaking a letter join — Arabic letters never join to these.
  var PUNCT = /^[\s.,;:!?—–\-"'“”‘’()،؛؟]+$/;

  /**
   * Words split on spaces only (Arabic joins; letters are never split).
   * A word is accented when it overlaps an accent phrase. If the only part
   * outside the phrase is punctuation ("bought," / "أيضًا،"), that
   * punctuation becomes its own plain span; otherwise the whole word is accented.
   */
  function tokens(text, phrases) {
    var ranges = [];
    phrases.forEach(function (p) {
      var i = text.indexOf(p);
      if (i >= 0) ranges.push([i, i + p.length]);
    });
    var out = [];
    var re = /\S+/g, m;
    while ((m = re.exec(text))) {
      var s = m.index, e = s + m[0].length, hit = null;
      for (var r = 0; r < ranges.length; r++) {
        if (s < ranges[r][1] && e > ranges[r][0]) { hit = ranges[r]; break; }
      }
      var gap = out.length && s > out[out.length - 1].end;
      if (!hit) { out.push({ t: m[0], a: false, space: gap, end: e }); continue; }
      var a0 = Math.max(s, hit[0]), a1 = Math.min(e, hit[1]);
      var pre = text.slice(s, a0), mid = text.slice(a0, a1), post = text.slice(a1, e);
      if ((pre && !PUNCT.test(pre)) || (post && !PUNCT.test(post))) {
        out.push({ t: m[0], a: true, space: gap, end: e });
        continue;
      }
      if (pre) out.push({ t: pre, a: false, space: gap, end: a0 });
      out.push({ t: mid, a: true, space: gap && !pre, end: a1 });
      if (post) out.push({ t: post, a: false, space: false, end: e });
    }
    return out;
  }

  function renderRead(c) {
    readEl.textContent = "";
    tokens(c.read, c.accents).forEach(function (tk) {
      if (tk.space) readEl.appendChild(document.createTextNode(" "));
      var span = document.createElement("span");
      span.className = "w";
      span.setAttribute("data-word", "");
      if (tk.a) span.setAttribute("data-accent", "");
      span.textContent = tk.t;
      readEl.appendChild(span);
    });
  }

  // Resolve a CSS colour inside the section (so the orange world applies) to rgb()
  // — GSAP cannot interpolate var().
  function resolve(value) {
    var probe = document.createElement("span");
    probe.style.color = value;
    section.appendChild(probe);
    var c = getComputedStyle(probe).color;
    probe.remove();
    return c;
  }

  function buildMotion() {
    if (mm) { mm.revert(); mm = null; }
    if (!window.gsap || !window.ScrollTrigger) return;
    mm = gsap.matchMedia();
    mm.add("(prefers-reduced-motion: no-preference)", function () {
      var dim = resolve("var(--muted-foreground)");
      var ink = resolve("var(--foreground)");
      var accent = resolve("var(--local-accent-text)");
      gsap.fromTo(
        readEl.querySelectorAll("[data-word]"),
        { color: dim },
        {
          color: function (i, el) { return el.hasAttribute("data-accent") ? accent : ink; },
          ease: "none",
          stagger: READ.stagger,
          scrollTrigger: { trigger: readEl, start: READ.start, end: READ.end, scrub: true }
        }
      );
    });
    // Reduced motion: no tween is created; the CSS media query paints the final colours.
    ScrollTrigger.refresh();
  }

  function applyLang(lang) {
    state.lang = lang;
    var c = COPY[lang];
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-copy]").forEach(function (el) {
      el.textContent = c[el.getAttribute("data-copy")];
    });
    renderRead(c);
    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    buildMotion();
  }

  function applyTheme(theme) {
    state.theme = theme;
    if (theme === "dark") root.setAttribute("data-theme", "dark");
    else root.setAttribute("data-theme", "light");
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-btn") === theme));
    });
    // Colours were resolved to rgb for the tween; resolve them again on the new ground.
    buildMotion();
  }

  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      var l = b.getAttribute("data-lang");
      if (l !== state.lang) applyLang(l);
    });
  });
  document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-theme-btn");
      if (t !== state.theme) applyTheme(t);
    });
  });

  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  state.theme = prefersDark ? "dark" : "light";
  root.setAttribute("data-theme", state.theme);
  document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-btn") === state.theme));
  });
  applyLang("en");

  // Web fonts change line breaks and therefore trigger positions.
  if (document.fonts && document.fonts.ready && window.ScrollTrigger) {
    document.fonts.ready.then(function () { ScrollTrigger.refresh(); });
  }
})();
</script>
</body>
</html>
