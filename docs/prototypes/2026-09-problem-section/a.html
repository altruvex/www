<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Recognise any of these?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Theme before paint: follow the OS unless a toggle says otherwise.
  (function () {
    var dark = false;
    try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
/* ── Tokens — copied from the live code, not picked ─────────────────────
   packages/ui/src/styles/tokens.css  :root  → n-0, n-8, brand, muted-fg, s-border
   packages/ui/src/styles/tokens.css  .dark  → background, foreground, muted-fg, s-border
   apps/www/app/globals.css  .accent-world-orange / .dark .accent-world-orange
   apps/www/app/globals.css  .section-title, .eyebrow, --font-serif, --section-y-* */
:root {
  --n-0: 0 0% 98%;
  --n-8: 0 0% 6%;
  --brand: 214 89% 48%;
  --brand-hover: 214 89% 41%;

  --background: var(--n-0);
  --foreground: var(--n-8);
  --muted-foreground: 0 0% 40%;
  --surface: 0 0% 94%;
  --s-border: hsl(var(--n-8) / 0.1);
  --border-subtle: var(--s-border);
  /* A control's own boundary: foreground/45, never border-mid (1.5:1). */
  --control-edge: hsl(var(--foreground) / 0.45);

  /* accent-world-orange (light) */
  --local-accent: hsl(27 90% 35%);
  --local-accent-text: var(--local-accent);
  --local-accent-fg: hsl(var(--n-0));

  --font-outfit: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
  --font-vazirmatn: "Vazirmatn", sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;

  --section-y-top: clamp(5rem, 10vh, 8rem);
  --section-y-bottom: clamp(5rem, 14vh, 10rem);

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --d-fast: 200ms;
  --d-mid: 320ms;
  --d-slow: 500ms;

  color-scheme: light;
}

[data-theme="dark"] {
  --background: 0 0% 7%;
  --foreground: 0 0% 94%;
  --muted-foreground: 0 0% 58%;
  --surface: 0 0% 11%;
  --s-border: hsl(var(--n-0) / 0.1);

  /* .dark .accent-world-orange */
  --local-accent: hsl(27 78% 61%);
  --local-accent-text: var(--local-accent);
  --local-accent-fg: hsl(0 0% 12%);

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-inter);
  font-size: 17px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  transition: background-color 400ms var(--ease), color 400ms var(--ease);
}
[dir="rtl"] body { font-family: var(--font-vazirmatn); }

.container {
  width: 100%;
  max-width: 1408px;
  margin-inline: auto;
  padding-inline: 24px;
}
@media (min-width: 640px)  { .container { padding-inline: 32px; } }
@media (min-width: 768px)  { .container { padding-inline: 48px; } }
@media (min-width: 1024px) { .container { padding-inline: 64px; } }

/* ── Prototype chrome (always LTR, physical sides) ───────────────────── */
.proto-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  line-height: 1.5;
  color: hsl(var(--muted-foreground));
  padding: 72px 16px 0 16px;
  text-align: left;
}
@media (min-width: 640px) { .proto-label { padding: 20px 260px 0 20px; } }

.toolbar {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 50;
  display: flex;
  gap: 8px;
}
.seg {
  display: flex;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--control-edge);
  background: hsl(var(--background));
}
.seg button {
  font: 500 12px/1 var(--font-inter);
  color: hsl(var(--muted-foreground));
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 9px 12px;
  min-width: 44px;
  min-height: 32px;
  cursor: pointer;
  transition: color var(--d-fast) var(--ease), background-color var(--d-fast) var(--ease);
}
.seg button[aria-pressed="true"] {
  background: hsl(var(--foreground));
  color: hsl(var(--background));
}
.seg button:focus-visible { outline: 2px solid hsl(var(--brand)); outline-offset: 2px; }

/* ── House type ──────────────────────────────────────────────────────── */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: hsl(var(--muted-foreground));
}
[dir="rtl"] .eyebrow {
  font-family: var(--font-vazirmatn);
  letter-spacing: 0;
  text-transform: none;
}

.section-title {
  font-family: var(--font-outfit);
  font-weight: 400;
  font-size: clamp(28px, 4.5vw, 52px);
  line-height: 1.08;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
[dir="rtl"] .section-title {
  font-family: var(--font-vazirmatn);
  letter-spacing: 0;
  line-height: 1.3;
}

/* Highlight: serif italic in LTR; bold sans, upright, in RTL. */
.hl {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
}
[dir="rtl"] .hl {
  font-family: var(--font-vazirmatn);
  font-style: normal;
  font-weight: 700;
}
/* tone "soft": foreground/45 LTR, solid muted in RTL (alpha-ghosting rule). */
.hl-soft { color: hsl(var(--foreground) / 0.45); }
[dir="rtl"] .hl-soft { color: hsl(var(--muted-foreground)); }
.title-second { display: block; margin-top: 0.5rem; }
@media (min-width: 768px) { .title-second { margin-top: 0; } }

.num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
[dir="rtl"] .num { font-family: var(--font-vazirmatn); }

/* ── Context stubs ───────────────────────────────────────────────────── */
.stub-above { padding-top: 48px; padding-bottom: 48px; }
.stub-above .rule { height: 2px; background: hsl(var(--foreground)); }
.stub-above p { padding-top: 16px; font-size: 0.9375rem; color: hsl(var(--muted-foreground)); }

.stub-below {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--section-y-top);
  padding-bottom: 40vh;
}
.stub-below .section-title { color: hsl(var(--foreground) / 0.35); }

/* ── The section ─────────────────────────────────────────────────────── */
.problem {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--section-y-top);
  padding-bottom: var(--section-y-bottom);
}
.heading { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 3.5rem; }
@media (min-width: 768px) { .heading { margin-bottom: 5rem; } }

/* Register head: the 2px ledger-head-rule, then the instruction + live count. */
.register { border-top: 2px solid hsl(var(--foreground)); }
.register-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
  padding-block: 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.register-head .eyebrow { color: hsl(var(--foreground)); }
.count {
  font-size: 0.875rem;
  color: hsl(var(--muted-foreground));
  white-space: nowrap;
}
.count b { font-weight: 500; color: hsl(var(--foreground)); transition: color var(--d-fast) var(--ease); }
.count b[data-lit="true"] { color: var(--local-accent-text); }

.rows { list-style: none; }

.row {
  position: relative;
  display: grid;
  grid-template-columns: 2.25rem minmax(0, 1fr) auto;
  align-items: baseline;
  column-gap: 1rem;
  width: 100%;
  padding-block: 1.75rem;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: start;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (min-width: 640px)  { .row { grid-template-columns: 2.75rem minmax(0, 1fr) auto; column-gap: 1.5rem; padding-block: 2rem; } }
@media (min-width: 768px)  { .row { grid-template-columns: 3.5rem minmax(0, 1fr) auto; padding-block: 2.5rem; } }
@media (min-width: 1024px) { .row { column-gap: 2.5rem; } }

.row:focus-visible {
  outline: 2px solid hsl(var(--brand));
  outline-offset: 2px;
  border-radius: 2px;
}

.row .idx {
  font-size: 0.875rem;
  color: hsl(var(--muted-foreground));
  transition: color var(--d-mid) var(--ease);
}
@media (min-width: 768px) { .row .idx { font-size: 1rem; } }

.row .say {
  font-family: var(--font-outfit);
  font-weight: 400;
  font-size: clamp(1.75rem, 3.6vw, 3.25rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: hsl(var(--muted-foreground));
  overflow-wrap: break-word;
  text-wrap: pretty;
  transition: color var(--d-mid) var(--ease);
}
[dir="rtl"] .row .say {
  font-family: var(--font-vazirmatn);
  letter-spacing: 0;
  line-height: 1.4;
}

/* The check marker: a square that fills and draws its tick. */
.mark {
  align-self: center;
  width: 1.5rem;
  height: 1.5rem;
  border: 1.5px solid var(--control-edge);
  border-radius: 2px;
  display: grid;
  place-items: center;
  transition: background-color var(--d-mid) var(--ease), border-color var(--d-mid) var(--ease);
}
@media (min-width: 768px) { .mark { width: 2rem; height: 2rem; } }
.mark svg { width: 80%; height: 80%; overflow: visible; }
.mark path {
  fill: none;
  stroke: var(--local-accent-fg);
  stroke-width: 2.25;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 22;
  stroke-dashoffset: 22;
  transition: stroke-dashoffset var(--d-slow) var(--ease) 80ms;
}

/* The accent bar: 2px, grows along the row's foot from its start edge. */
.row::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  bottom: -1px;
  height: 2px;
  background: var(--local-accent);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform var(--d-slow) var(--ease);
  pointer-events: none;
}
[dir="rtl"] .row::after { transform-origin: right center; }

.row[aria-pressed="true"] .say,
.row[aria-pressed="true"] .idx { color: hsl(var(--foreground)); }
.row[aria-pressed="true"] .mark { background: var(--local-accent); border-color: var(--local-accent); }
.row[aria-pressed="true"] .mark path { stroke-dashoffset: 0; }
.row[aria-pressed="true"]::after { transform: scaleX(1); }

@media (hover: hover) and (pointer: fine) {
  .row:hover .say { color: hsl(var(--foreground)); }
  .row:hover .mark { border-color: hsl(var(--foreground)); }
  .row[aria-pressed="true"]:hover .mark { border-color: var(--local-accent); }
}

/* ── Verdict ─────────────────────────────────────────────────────────── */
.verdict {
  margin-top: 2.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1.25rem 2rem;
}
@media (min-width: 1024px) { .verdict { margin-top: 3.5rem; } }

/* The clip the line slides through — transform only, never opacity. */
.v-clip {
  overflow: hidden;
  padding-block: 0.12em;
  padding-inline-end: 0.12em;
  flex: 1 1 18rem;
  min-width: 0;
}
.v-line {
  font-family: var(--font-outfit);
  font-weight: 400;
  font-size: clamp(1.5rem, 2.8vw, 2.5rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  text-wrap: balance;
  color: hsl(var(--foreground));
  will-change: transform;
}
[dir="rtl"] .v-line { font-family: var(--font-vazirmatn); letter-spacing: 0; line-height: 1.45; }
.v-line[data-tone="muted"] { color: hsl(var(--muted-foreground)); }
.v-line .hl { color: var(--local-accent-text); }

.cta {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  border-radius: 999px;
  padding: 14px 22px;
  background: hsl(var(--brand));
  color: hsl(var(--n-0));
  font: 500 15px/1 var(--font-inter);
  text-decoration: none;
  white-space: nowrap;
  transition: background-color var(--d-fast) var(--ease), transform var(--d-mid) var(--ease);
}
[dir="rtl"] .cta { font-family: var(--font-vazirmatn); }
.cta .arrow { display: inline-block; transition: transform var(--d-mid) var(--ease); }
.cta:focus-visible { outline: 2px solid hsl(var(--brand)); outline-offset: 3px; }
@media (hover: hover) and (pointer: fine) {
  .cta:hover { background: hsl(var(--brand-hover)); }
  .cta:hover .arrow { transform: translateX(3px); }
  [dir="rtl"] .cta:hover .arrow { transform: translateX(-3px); }
}
.cta-wrap { overflow: hidden; padding: 4px; margin: -4px; }
.cta-wrap[hidden] { display: none; }
.cta-wrap .cta { transform: translateY(0); }
.cta-wrap.entering .cta { transform: translateY(120%); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0ms !important;
    transition-delay: 0ms !important;
    animation: none !important;
  }
}
</style>
</head>
<body>

<div class="toolbar" dir="ltr" role="group" aria-label="Prototype controls">
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ar" aria-pressed="false" lang="ar">AR</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
    <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
  </div>
</div>

<p class="proto-label" dir="ltr">Prototype A — Recognise any of these?</p>

<!-- Stub: the thin end of the hero, so the section is judged in place. -->
<div class="container stub-above" aria-hidden="true">
  <div class="rule"></div>
  <p data-i18n="stubAbove"></p>
</div>

<section class="problem" aria-labelledby="problem-title">
  <div class="container">
    <div class="heading">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h2 id="problem-title" class="section-title">
        <span data-i18n="title"></span>
        <em class="hl hl-soft title-second" data-i18n="titleSecond"></em>
      </h2>
    </div>

    <div class="register">
      <div class="register-head">
        <p class="eyebrow" id="rows-label" data-i18n="instruction"></p>
        <p class="count"><span class="num"><b id="count-n">0</b> <span id="count-of"></span></span></p>
      </div>

      <ul class="rows" id="rows" aria-labelledby="rows-label"></ul>
    </div>

    <div class="verdict">
      <div class="v-clip" aria-live="polite" aria-atomic="true">
        <p class="v-line" id="verdict"></p>
      </div>
      <div class="cta-wrap" id="cta-wrap" hidden>
        <a class="cta" href="#estimate"><span data-i18n="cta"></span> <span class="arrow" aria-hidden="true" data-i18n="ctaArrow"></span></a>
      </div>
    </div>
  </div>
</section>

<!-- Stub: the next section's heading. -->
<div class="stub-below" aria-hidden="true">
  <div class="container">
    <p class="section-title" data-i18n="stubBelow"></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COPY = {
    en: {
      stubAbove: "This page, measured in your browser",
      eyebrow: "The Industry Problem",
      title: "Most businesses aren't getting engineering.",
      titleSecond: "They're getting templates.",
      instruction: "Tap what's true for your current site",
      of: "of",
      rows: [
        "My site looks like my competitors' sites.",
        "It's slow on phones.",
        "I can't change anything without going back to the agency.",
        "Every new feature costs more than the last one.",
        "I've never spoken to whoever writes the code."
      ],
      verdict: {
        none: "Good. You may not need us.",
        some: "Some of this is fixable — ask us which.",
        many: ["You paid for engineering and got a ", "template", "."]
      },
      cta: "Get an estimate",
      ctaArrow: "→",
      stubBelow: "03 — What you actually own"
    },
    ar: {
      stubAbove: "هذه الصفحة، مقيسة في متصفحك",
      eyebrow: "مشكلة الصناعة",
      title: "معظم الشركات لا تحصل على هندسة برمجية.",
      titleSecond: "هي تحصل على قوالب جاهزة.",
      instruction: "اضغط على ما ينطبق على موقعك الحالي",
      of: "من",
      rows: [
        "موقعي يشبه مواقع منافسيّ.",
        "موقعي بطيء على الهاتف.",
        "لا أستطيع تغيير أي شيء دون الرجوع إلى الشركة.",
        "كل خاصية جديدة تكلّفني أكثر من التي قبلها.",
        "لم أتحدث يومًا مع من يكتب الكود."
      ],
      verdict: {
        none: "جيد. قد لا تحتاج إلينا.",
        some: "بعض هذا قابل للإصلاح — اسألنا أيّه.",
        many: ["دفعت ثمن هندسة، واستلمت ", "قالبًا", "."]
      },
      cta: "احصل على تقدير",
      ctaArrow: "←",
      stubBelow: "٠٣ — ما تملكه فعلًا"
    }
  };

  var ARABIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";
  var root = document.documentElement;
  var rowsEl = document.getElementById("rows");
  var verdictEl = document.getElementById("verdict");
  var countN = document.getElementById("count-n");
  var countOf = document.getElementById("count-of");
  var ctaWrap = document.getElementById("cta-wrap");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  var lang = "en";
  var pressed = [false, false, false, false, false];
  var bucket = null;
  var swapToken = 0;

  function digits(str) {
    return lang === "ar" ? String(str).replace(/\d/g, function (d) { return ARABIC_DIGITS[d]; }) : String(str);
  }
  function pad(n) { return digits(n < 10 ? "0" + n : String(n)); }

  function buildRows() {
    rowsEl.textContent = "";
    COPY[lang].rows.forEach(function (text, i) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "row";
      btn.setAttribute("aria-pressed", pressed[i] ? "true" : "false");
      btn.dataset.i = i;

      var idx = document.createElement("span");
      idx.className = "idx num";
      idx.setAttribute("aria-hidden", "true");
      idx.textContent = pad(i + 1);

      var say = document.createElement("span");
      say.className = "say";
      say.textContent = text;

      var mark = document.createElement("span");
      mark.className = "mark";
      mark.setAttribute("aria-hidden", "true");
      mark.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

      btn.appendChild(idx);
      btn.appendChild(say);
      btn.appendChild(mark);
      li.appendChild(btn);
      rowsEl.appendChild(li);
    });
  }

  function countPressed() {
    return pressed.reduce(function (a, p) { return a + (p ? 1 : 0); }, 0);
  }

  function bucketFor(n) { return n === 0 ? "none" : n < 3 ? "some" : "many"; }

  function fillVerdict(b) {
    var v = COPY[lang].verdict[b];
    verdictEl.textContent = "";
    if (Array.isArray(v)) {
      verdictEl.appendChild(document.createTextNode(v[0]));
      var em = document.createElement("em");
      em.className = "hl";
      em.textContent = v[1];
      verdictEl.appendChild(em);
      verdictEl.appendChild(document.createTextNode(v[2]));
    } else {
      verdictEl.textContent = v;
    }
    verdictEl.dataset.tone = b === "none" ? "muted" : "foreground";
  }

  function showCta(show, animate) {
    if (!show) { ctaWrap.hidden = true; ctaWrap.classList.remove("entering"); return; }
    if (!ctaWrap.hidden) return;
    ctaWrap.hidden = false;
    if (!animate) return;
    ctaWrap.classList.add("entering");
    // Two frames so the start state is painted before the transition runs.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { ctaWrap.classList.remove("entering"); });
    });
  }

  /* The verdict slides up through its clip: out, swap, in. Transform only,
     so Arabic display type never has its opacity touched. */
  function renderVerdict(animate) {
    var n = countPressed();
    var next = bucketFor(n);

    countN.textContent = digits(n);
    countN.dataset.lit = n > 0 ? "true" : "false";

    if (next === bucket && animate) return;
    var prev = bucket;
    bucket = next;
    var token = ++swapToken;

    if (!animate || prev === null || reduce.matches || !verdictEl.animate) {
      fillVerdict(next);
      showCta(next === "many", false);
      return;
    }

    // A tap mid-swap: drop whatever is still running so nothing stays parked off-screen.
    verdictEl.getAnimations().forEach(function (a) { a.cancel(); });

    var goingUp = order(next) > order(prev);
    var outTo = goingUp ? "-110%" : "110%";
    var inFrom = goingUp ? "110%" : "-110%";
    if (next !== "many") showCta(false);

    var out = verdictEl.animate(
      [{ transform: "translateY(0)" }, { transform: "translateY(" + outTo + ")" }],
      { duration: 200, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" }
    );
    out.onfinish = function () {
      if (token !== swapToken) return;
      fillVerdict(next);
      var inn = verdictEl.animate(
        [{ transform: "translateY(" + inFrom + ")" }, { transform: "translateY(0)" }],
        { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
      );
      inn.onfinish = function () { if (token === swapToken) { inn.cancel(); out.cancel(); } };
      if (next === "many") showCta(true, true);
    };
  }

  function order(b) { return b === "none" ? 0 : b === "some" ? 1 : 2; }

  function applyCopy() {
    var c = COPY[lang];
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = c[el.getAttribute("data-i18n")];
    });
    countOf.textContent = c.of + " " + digits(5);
    buildRows();
    bucket = null;
    renderVerdict(false);
  }

  function setLang(next) {
    lang = next;
    root.lang = next;
    root.dir = next === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.lang === next ? "true" : "false");
    });
    applyCopy();
  }

  function setTheme(next) {
    root.setAttribute("data-theme", next);
    document.querySelectorAll("[data-theme-set]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.themeSet === next ? "true" : "false");
    });
  }

  // Native <button>: Enter and Space toggle with no extra key handling.
  rowsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".row");
    if (!btn) return;
    var i = Number(btn.dataset.i);
    pressed[i] = !pressed[i];
    btn.setAttribute("aria-pressed", pressed[i] ? "true" : "false");
    renderVerdict(true);
  });

  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.dataset.lang); });
  });
  document.querySelectorAll("[data-theme-set]").forEach(function (b) {
    b.addEventListener("click", function () { setTheme(b.dataset.themeSet); });
  });

  setTheme(root.getAttribute("data-theme") || "light");
  setLang("en");
})();
</script>
