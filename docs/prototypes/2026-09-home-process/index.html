<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homepage process — prototypes v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* v2 (2026-10-01): built ONLY from /process's own pieces (docs/prototypes/2026-09-process, A as shipped):
   the hairline phase index, light Outfit names, the word-by-word headline, the gate line with its
   accent dash, the two scope bars. The ground is the homepage's: the services wrapper's inverted
   scene (dark in the light site, paper in the dark site), world = brand blue. Numbers =
   processPhases({min:2,max:8}), the same 10 – 40 working days /process shows. */
:root {
  --bg: hsl(0 0% 9%);
  --fg: hsl(0 0% 100% / .92);
  --muted: hsl(0 0% 100% / .58);
  --border: hsl(0 0% 100% / .1);
  --border-strong: hsl(0 0% 100% / .2);
  --accent: hsl(214 95% 70%);
  --accent-fill: hsl(214 89% 52%);
  --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --section-y: clamp(6rem, 11vw, 10rem);
}
html[data-theme="dark"] {
  --bg: hsl(0 0% 98%);
  --fg: hsl(0 0% 8% / .9);
  --muted: hsl(0 0% 8% / .66);
  --border: hsl(0 0% 8% / .1);
  --border-strong: hsl(0 0% 8% / .2);
  --accent: hsl(214 89% 40%);
  --accent-fill: hsl(214 89% 48%);
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow-x: clip; }
[dir="rtl"] body { font-family: Vazirmatn, Inter, sans-serif; }
h2, h3 { font-family: Outfit, sans-serif; margin: 0; }
[dir="rtl"] :is(h2, h3, .t, .say, .big) { font-family: Vazirmatn, Outfit, sans-serif; letter-spacing: 0 !important; }
p, ul, ol { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 84rem; margin: 0 auto; padding-inline: clamp(1.25rem, 4vw, 3rem); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: .8125rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .eyebrow { font-family: Vazirmatn, sans-serif; letter-spacing: 0; font-size: .875rem; }
.mono { font-family: "Geist Mono", monospace; font-variant-numeric: tabular-nums; }
[dir="rtl"] .mono { font-family: Vazirmatn, sans-serif; }
.muted { color: var(--muted); }
.rv { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease-smooth), transform .8s var(--ease-smooth); transition-delay: calc(var(--i, 0) * 80ms); }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }

/* prototype chrome */
.bar { position: fixed; inset-block-start: 12px; inset-inline: 12px; z-index: 60; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
.bar > * { pointer-events: auto; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: hsl(0 0% 12% / .85); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); }
.seg button, .seg a { padding: 7px 12px; border-radius: 9px; color: hsl(0 0% 80%); font: 500 13px/1 Inter, sans-serif; }
.seg button[aria-pressed="true"] { background: #fff; color: hsl(0 0% 8%); }
details.note { position: fixed; inset-block-end: 12px; inset-inline-start: 12px; z-index: 60; max-width: 30rem; padding: 12px 14px; border-radius: 12px; background: hsl(0 0% 12% / .92); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); color: hsl(0 0% 82%); font: 400 12.5px/1.5 Inter, sans-serif; direction: ltr; text-align: left; }
details.note summary { cursor: pointer; font-weight: 500; color: #fff; }
details.note b { color: #fff; font-weight: 500; }
.spacer { height: 30vh; display: grid; place-items: end start; }

/* ══ the /process pieces, unchanged ══ */
.sec { padding-block: var(--section-y); }
.head { display: grid; gap: 1.5rem 4rem; }
@media (min-width: 1024px) { .head { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: end; } }
.head h2 { font-size: clamp(2.5rem, 5.2vw, 4.75rem); line-height: 1.02; letter-spacing: -.035em; font-weight: 600; }
.head h2 span { display: block; }
.head h2 .soft { color: var(--muted); }
.head .lede { font-size: clamp(1.0625rem, 1.2vw, 1.1875rem); line-height: 1.65; color: var(--muted); max-width: 30rem; }
.head .lede strong { color: var(--fg); font-weight: 500; }

/* phase index — /process .a-index */
.index { border-top: 1px solid var(--border-strong); }
.index .row { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 1rem; align-items: baseline; padding: 1.1rem 0; border-bottom: 1px solid var(--border); width: 100%; transition: color .3s; }
.index .row:hover { color: var(--accent); }
.index .n { font-size: .8125rem; color: var(--muted); }
.index .t { font: 300 clamp(1.375rem, 2.2vw, 1.875rem)/1.2 Outfit, sans-serif; letter-spacing: -.02em; }
.index .l { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* chapter parts — /process .a-ch */
.big { font: 300 clamp(3.25rem, 10vw, 9.5rem)/.92 Outfit, sans-serif; letter-spacing: -.05em; }
[dir="rtl"] .big { line-height: 1.25; }
.say { font: 300 clamp(1.5rem, 3vw, 2.75rem)/1.15 Outfit, sans-serif; letter-spacing: -.025em; max-width: 22ch; text-wrap: balance; }
[dir="rtl"] .say { line-height: 1.45; }
.say .w { color: var(--border-strong); transition: color .5s var(--ease-smooth); }
.say .w.lit { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .say .w { color: var(--fg); } }
.gate { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
.gate i { width: 2rem; height: 2px; background: var(--accent-fill); transform-origin: left; transform: scaleX(0); transition: transform .9s var(--ease-strong) .2s; }
[dir="rtl"] .gate i { transform-origin: right; }
.gate.in i { transform: none; }
@media (prefers-reduced-motion: reduce) { .gate i { transform: none; } }
.gate .eyebrow { color: var(--accent); }

/* scope bars — /process .a-bars */
.bars { display: grid; gap: 2.25rem; }
.sbar .lbl { display: flex; justify-content: space-between; gap: 1rem; font-size: .9375rem; margin-bottom: .75rem; }
.sbar .lbl span { color: var(--muted); }
.sbar .lbl b { font-weight: 500; font-variant-numeric: tabular-nums; }
.track { display: flex; gap: 6px; height: 14px; }
.track span { flex-grow: 0; flex-basis: 0; min-width: 0; border-radius: 999px; background: color-mix(in srgb, var(--fg) 20%, transparent); transition: flex-grow 1.2s var(--ease-strong); }
.track span.b { background: var(--accent-fill); }
.in .track span { flex-grow: var(--g); }
@media (prefers-reduced-motion: reduce) { .track span { flex-grow: var(--g); transition: none; } }
.keys { display: none; gap: 6px; margin-top: .6rem; font-size: .75rem; color: var(--muted); }
@media (min-width: 768px) { .keys { display: flex; } }
.keys span { flex: var(--g) 0 0; min-width: 0; overflow: hidden; white-space: nowrap; }

.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem 3rem; }
.foot p { max-width: 46ch; font-size: clamp(1.0625rem, 1.5vw, 1.25rem); }
.more { display: inline-flex; align-items: center; gap: .6rem; height: 3rem; padding-inline: 1.35rem; border-radius: 10px; background: hsl(214 89% 48%); color: #fff; font-weight: 500; font-size: .9375rem; }
.arrow { display: inline-block; }
[dir="rtl"] .arrow { transform: scaleX(-1); }

/* ══ A · Index + scope ══ */
.A .index { margin-top: clamp(3.5rem, 6vw, 5rem); }
.A .scope { margin-top: clamp(3.5rem, 6vw, 5rem); }
.A .scope-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 2rem; margin-bottom: 2rem; }
.A .scope-h p:last-child { font-size: .9375rem; color: var(--muted); }
.A .foot { margin-top: clamp(3rem, 5vw, 4rem); }

/* ══ B · Open index ══ */
.B .index { margin-top: clamp(3.5rem, 6vw, 5rem); }
.B .item .row { cursor: pointer; }
.B .item.open .row { color: var(--fg); border-bottom-color: transparent; }
.B .item.open .row .n { color: var(--accent); }
.B .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s var(--ease-strong); border-bottom: 1px solid var(--border); }
.B .item:not(.open) .panel { border-bottom: 0; }
.B .item.open .panel { grid-template-rows: 1fr; }
.B .panel > div { overflow: clip; min-height: 0; }
.B .inner { display: grid; gap: 2rem; padding: .5rem 0 2.5rem; }
@media (min-width: 1024px) { .B .inner { grid-template-columns: 3rem minmax(0, 1fr); column-gap: 1rem; } .B .inner > * { grid-column: 2; } }
.B .inner .go { color: var(--accent); font-size: .9375rem; }
.B .scope { margin-top: clamp(3.5rem, 6vw, 5rem); }
.B .foot { margin-top: clamp(3rem, 5vw, 4rem); }

/* ══ C · Short chapters ══ */
.C .chapters { margin-top: clamp(3.5rem, 6vw, 5rem); }
/* rail hidden below lg */
.C .rail { display: none; }
@media (min-width: 1024px) {
  .C .chapters { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 4rem; }
  .C .rail { display: block; position: sticky; top: 40vh; align-self: start; }
  .C .rail li { display: flex; gap: .75rem; padding: .35rem 0; font-size: .875rem; color: var(--muted); transition: color .35s; }
  .C .rail li.on { color: var(--fg); }
  .C .rail li .mono { font-size: .75rem; width: 1.5rem; }
  .C .rail li.on .mono { color: var(--accent); }
}
.C .ch { display: grid; gap: 2rem; padding-block: 2.5rem 3rem; border-top: 1px solid var(--border); }
.C .ch .top { display: flex; justify-content: space-between; gap: 1rem; font-size: .875rem; }
.C .ch .big { font-size: clamp(2.75rem, 7vw, 6.5rem); }
.C .ch .row2 { display: grid; gap: 2rem 3rem; align-items: end; }
@media (min-width: 900px) { .C .ch .row2 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } .C .gate { border-top: 0; padding-top: 0; justify-content: flex-end; } }
.C .scope { margin-top: clamp(3rem, 5vw, 4rem); padding-top: clamp(3rem, 5vw, 4rem); border-top: 1px solid var(--border-strong); }
.C .foot { margin-top: clamp(3rem, 5vw, 4rem); }
</style>
</head>
<body>
<div class="bar">
  <div class="seg" id="opt"><button data-v="a" aria-pressed="true">A · Index + scope</button><button data-v="b" aria-pressed="false">B · Open index</button><button data-v="c" aria-pressed="false">C · Short chapters</button></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="seg"><a href="../2026-09-process/index.html" target="_blank">/process ↗</a></div>
    <div class="seg" id="lang"><button data-v="en" aria-pressed="true">EN</button><button data-v="ar" aria-pressed="false">AR</button></div>
    <div class="seg" id="theme"><button data-v="light" aria-pressed="true">Site light</button><button data-v="dark" aria-pressed="false">Site dark</button></div>
  </div>
</div>
<details class="note"><summary id="note-title">Notes</summary><div id="note-body" style="margin-top:.5rem"></div></details>
<main id="root"></main>

<script>
document.documentElement.classList.add("js");
const PHASES = [
  { key: "discovery", min: 1, max: 1, unit: "session" },
  { key: "wireframe", min: 2, max: 5, unit: "days" },
  { key: "design", min: 2, max: 7, unit: "days" },
  { key: "development", min: 3, max: 22, unit: "days" },
  { key: "launch", min: 2, max: 5, unit: "days" },
];
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

/* Every string exists today (process.* and process.page.*) except those marked NEW. */
const COPY = {
  en: {
    eyebrow: "Delivery Model", title: "Clear phases.", titleSoft: "Accountable outcomes.",
    subtitle: "Every project moves through discovery, wireframe, design, development and launch - <strong>with one owner responsible from start to delivery.</strong>",
    scopeTitle: "Scope stretches the phases. It never skips one.",
    smallest: "Smallest scope", largest: "Largest scope", total: n => `${n} working days`,
    footer: "A clear system before implementation. A working product after delivery.",
    more: "See the whole process", // NEW
    readChapter: "Read the full phase", // NEW
    yourRole: "Your role", gateNext: n => `Then ${n} starts.`, gateLast: "Then the system is yours.",
    session: "1 session", days: n => `${n} ${n === 1 ? "day" : "days"}`, range: (a, b) => `${a} – ${b} days`,
    phases: {
      discovery: { title: "Discovery", headline: "Understand the problem before proposing a solution.", role: "Share" },
      wireframe: { title: "Wireframe", headline: "Define the system before the interface.", role: "Approve" },
      design: { title: "Design", headline: "Agree on the whole design before a line of code.", role: "Review" },
      development: { title: "Development", headline: "Build the system behind the idea.", role: "Review" },
      launch: { title: "Launch", headline: "Turn the system into something ready to operate.", role: "Launch" },
    },
  },
  ar: {
    eyebrow: "نموذج التسليم", title: "مراحل واضحة.", titleSoft: "نتائج محددة المسؤولية.",
    subtitle: "كل مشروع يمر بخمس مراحل: استكشاف، تصميم أولي، تصميم، تطوير، وإطلاق - <strong>تحت إشراف مسؤول واحد من البداية حتى التسليم.</strong>",
    scopeTitle: "النطاق يمدّ المراحل. ولا يتخطى أيًا منها.",
    smallest: "أصغر نطاق", largest: "أكبر نطاق", total: n => `${n} يوم عمل`,
    footer: "نظام واضح قبل التنفيذ. منتج فعّال بعد التسليم.",
    more: "شاهد المنهجية كاملة",
    readChapter: "اقرأ المرحلة كاملة",
    yourRole: "دورك", gateNext: n => `ثم تبدأ مرحلة ${n}.`, gateLast: "ثم يصبح النظام ملكك.",
    session: "جلسة واحدة", days: n => n === 1 ? "يوم واحد" : n === 2 ? "يومان" : n <= 10 ? `${ar(n)} أيام` : `${ar(n)} يومًا`,
    range: (a, b) => `${a} – ${b} يوم`,
    phases: {
      discovery: { title: "الاستكشاف", headline: "نفهم المشكلة قبل أن نقترح أي حل.", role: "شارك" },
      wireframe: { title: "التصميم الأولي", headline: "نُعرّف النظام قبل الواجهة.", role: "اعتمد" },
      design: { title: "التصميم", headline: "نتفق على التصميم كاملًا قبل سطر كود واحد.", role: "راجع" },
      development: { title: "التطوير", headline: "نبني النظام خلف الفكرة.", role: "راجع" },
      launch: { title: "الإطلاق", headline: "نُجهّز النظام ليعمل فعليًا.", role: "أطلق" },
    },
  },
};

const state = { v: "a", lang: "en", theme: "light", open: 3 };
const num = n => state.lang === "ar" ? ar(n) : String(n);
const idx = i => num(String(i + 1).padStart(2, "0"));
const len = (c, p) => p.unit === "session" ? c.session : p.min === p.max ? c.days(p.min) : c.range(num(p.min), num(p.max));
const sum = k => PHASES.reduce((s, p) => s + p[k], 0);
const words = s => s.split(" ").map(w => `<span class="w">${w}</span>`).join(" ");
const href = p => `/process#phase-${p.key}`;

const head = c => `<div class="head">
  <div><p class="eyebrow rv">${c.eyebrow}</p>
    <h2 class="rv" style="--i:1;margin-top:1.25rem"><span>${c.title}</span><span class="soft">${c.titleSoft}</span></h2></div>
  <p class="lede rv" style="--i:2">${c.subtitle}</p></div>`;
const indexRow = (c, p, i, tag = "a") => `<${tag} ${tag === "a" ? `href="${href(p)}"` : `type="button" data-open="${i}" aria-expanded="${state.open === i}"`} class="row">
  <span class="n mono">${idx(i)}</span><span class="t">${c.phases[p.key].title}</span><span class="l">${len(c, p)}</span></${tag}>`;
const gate = (c, i) => {
  const ph = c.phases[PHASES[i].key], next = PHASES[i + 1];
  return `<div class="gate rv"><i></i><span class="eyebrow">${c.yourRole} · ${ph.role}</span><span>${next ? c.gateNext(c.phases[next.key].title) : c.gateLast}</span></div>`;
};
const bars = c => `<div class="bars">${["min", "max"].map(k => `
  <div class="sbar rv"><div class="lbl"><span>${k === "min" ? c.smallest : c.largest}</span><b>${c.total(num(sum(k)))}</b></div>
    <div class="track" aria-hidden="true">${PHASES.map(p => `<span style="--g:${p[k]}" class="${p.key === "development" ? "b" : ""}"></span>`).join("")}</div>
    <div class="keys" aria-hidden="true">${PHASES.map((p, i) => `<span style="--g:${p[k]}">${idx(i)}</span>`).join("")}</div></div>`).join("")}</div>`;
const foot = c => `<div class="foot rv"><p>${c.footer}</p><a class="more" href="/process">${c.more} <span class="arrow">→</span></a></div>`;
const spacer = () => `<div class="spacer wrap"><p class="eyebrow">↓ homepage · services above</p></div>`;

function renderA(c) {
  return `${spacer()}<section class="sec A"><div class="wrap">${head(c)}
    <nav class="index" aria-label="Phases">${PHASES.map((p, i) => indexRow(c, p, i)).join("")}</nav>
    <div class="scope"><div class="scope-h"><p class="eyebrow">${c.scopeTitle}</p></div>${bars(c)}</div>
    ${foot(c)}</div></section>${spacer()}`;
}
function renderB(c) {
  return `${spacer()}<section class="sec B"><div class="wrap">${head(c)}
    <ol class="index">${PHASES.map((p, i) => `<li class="item ${state.open === i ? "open" : ""}">${indexRow(c, p, i, "button")}
      <div class="panel"><div><div class="inner">
        <p class="big">${c.phases[p.key].title}</p>
        <p class="say">${words(c.phases[p.key].headline)}</p>
        ${gate(c, i)}
        <a class="go" href="${href(p)}">${c.readChapter} <span class="arrow">→</span></a>
      </div></div></div></li>`).join("")}</ol>
    <div class="scope"><p class="eyebrow" style="margin-bottom:2rem">${c.scopeTitle}</p>${bars(c)}</div>
    ${foot(c)}</div></section>${spacer()}`;
}
function renderC(c) {
  return `${spacer()}<section class="sec C"><div class="wrap">${head(c)}
    <div class="chapters">
      <ol class="rail" aria-hidden="true">${PHASES.map((p, i) => `<li data-k="${i}"><span class="mono">${idx(i)}</span>${c.phases[p.key].title}</li>`).join("")}</ol>
      <div>${PHASES.map((p, i) => `<article class="ch" data-ch="${i}">
        <div class="top"><span class="mono" style="color:var(--accent)">${idx(i)}</span><span class="muted">${len(c, p)}</span></div>
        <a href="${href(p)}"><h3 class="big">${c.phases[p.key].title}</h3></a>
        <div class="row2"><p class="say">${words(c.phases[p.key].headline)}</p>${gate(c, i)}</div>
      </article>`).join("")}</div>
    </div>
    <div class="scope"><p class="eyebrow" style="margin-bottom:2rem">${c.scopeTitle}</p>${bars(c)}</div>
    ${foot(c)}</div></section>${spacer()}`;
}

const NOTES = {
  a: `<b>/process's opening, condensed.</b> The same hairline phase index that opens /process (light names, mono indices, lengths), every row linking to its chapter, then the same two scope bars, then one door to /process. Nothing is new to learn between the two pages; the homepage is the table of contents. About 1.3 viewports. The Gantt signature (SIG-022, "drawn to scale from the one model") is now carried by the scope bars, which are drawn from the same model. <b>Risk:</b> the quietest of the three; no word-read moment.`,
  b: `<b>The index opens into a chapter.</b> The same index; one phase is open at a time (Development by default, the longest). The open row unfolds the /process chapter in miniature: the huge light name, the headline lit word by word, the gate line with its accent dash, and a link to that chapter. Click another row to switch. Then the scope bars and the door. About 1.6 viewports with one phase open. An honest accordion, not a pin (RUL-084). <b>Risk:</b> four phases hidden behind a click.`,
  c: `<b>/process's chapters, shortened.</b> The same sticky rail on lg (CSS sticky, not a pin), and five short chapters: index + length, the huge name, the headline lit word by word beside the gate line. Description and deliverables stay on /process only. Then the scope bars and the door. Closest to /process, and the longest: about 3.5 viewports. <b>Risk:</b> the homepage's longest section.`,
};

function onScroll() {
  const vh = innerHeight;
  document.querySelectorAll(".say").forEach(el => {
    const r = el.getBoundingClientRect();
    const ws = el.querySelectorAll(".w");
    const p = Math.max(0, Math.min(1, (vh * .85 - r.top) / (vh * .4)));
    ws.forEach((w, i) => w.classList.toggle("lit", i < Math.round(p * ws.length)));
  });
  let cur = null;
  document.querySelectorAll(".ch").forEach(ch => { const r = ch.getBoundingClientRect(); if (r.top < vh * .5 && r.bottom > vh * .5) cur = ch.dataset.ch; });
  document.querySelectorAll(".rail li").forEach(li => li.classList.toggle("on", li.dataset.k === cur));
}
let raf = 0;
addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(onScroll); }, { passive: true });
addEventListener("resize", onScroll);

function observe() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
}
function render() {
  const c = COPY[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = state.theme;
  document.getElementById("root").innerHTML = { a: renderA, b: renderB, c: renderC }[state.v](c);
  document.getElementById("note-title").textContent = "Notes — " + document.querySelector(`#opt [data-v="${state.v}"]`).textContent;
  document.getElementById("note-body").innerHTML = NOTES[state.v];
  observe(); onScroll();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open]");
  if (t) {
    state.open = +t.dataset.open;
    document.querySelectorAll(".B .item").forEach((li, i) => {
      li.classList.toggle("open", i === state.open);
      li.querySelector("[data-open]").setAttribute("aria-expanded", i === state.open);
      if (i === state.open) li.querySelectorAll(".rv").forEach(el => el.classList.add("in"));
    });
    setTimeout(onScroll, 650);
    return;
  }
  if (e.target.closest("a[href^='/process']")) e.preventDefault();
});
function seg(id, key) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    state[key] = b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    const y = key === "v" ? 0 : scrollY; render(); scrollTo(0, y);
  }));
}
seg("opt", "v"); seg("lang", "lang"); seg("theme", "theme");
render();
</script>
