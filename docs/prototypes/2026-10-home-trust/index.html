<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage trust section — prototypes A / B / C</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Standalone prototype. House values mirrored from packages/ui/src/styles/tokens.css;
   not production code. The build reads the real tokens. */
:root{
  --bg:#fff;--fg:#1a1a1a;--muted:#666;--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.45);
  --brand:hsl(214 89% 48%);--brand-text:hsl(214 89% 42%);
  --serif:Georgia,"Times New Roman",serif;--mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--gutter:clamp(16px,4vw,56px);
}
html[data-theme="dark"]{
  --bg:#121212;--fg:#f0f0f0;--muted:#949494;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.45);
  --brand-text:hsl(214 95% 68%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:clip;line-height:1.6}
[dir="rtl"] body{font-family:Vazirmatn,Inter,sans-serif}
h2,h3,.display{font-family:Outfit,sans-serif;font-weight:300;letter-spacing:-.035em;line-height:1.04}
[dir="rtl"] :is(h2,h3,.display,blockquote){font-family:Vazirmatn,sans-serif;letter-spacing:0!important;line-height:1.3}
em.acc{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--brand-text);letter-spacing:-.02em}
[dir="rtl"] em.acc{font-family:inherit;font-style:normal;font-weight:500}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .eyebrow{font-family:Vazirmatn,sans-serif;letter-spacing:0;font-size:14px}
.mono{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
[dir="rtl"] .mono{font-family:Vazirmatn,sans-serif}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gutter)}
.neighbour{padding:56px 0;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.neighbour.after{border-bottom:0;border-top:1px solid var(--line)}

section.trust{padding:clamp(96px,14vh,168px) 0 clamp(96px,14vh,168px);display:none}
section.trust.on{display:block}

/* shared heading — SectionHeading shape: eyebrow, two-part title, description at the end */
.head{display:grid;grid-template-columns:8fr 4fr;gap:32px 48px;align-items:end;margin-bottom:clamp(56px,8vh,88px)}
.head h2{font-size:clamp(34px,4.4vw,68px);max-width:20ch;margin-top:20px}
.head p{color:var(--muted);font-size:17px;max-width:40ch}
.head p strong{color:var(--fg);font-weight:500}
@media (max-width:900px){.head{grid-template-columns:1fr}}

/* shared: client quotes as two open columns (kept from the live section) */
.quotes-label{display:flex;align-items:baseline;gap:16px;margin-top:clamp(72px,10vh,112px)}
.quotes-label i{flex:1;height:1px;background:var(--line)}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:48px 64px;margin-top:44px}
.quotes blockquote{font-size:clamp(17px,1.35vw,21px);line-height:1.6;max-width:52ch}
.quotes figcaption{margin-top:24px;padding-top:12px;border-top:1px solid var(--line-strong);font-size:14px;display:flex;flex-direction:column;gap:2px}
.quotes figcaption b{font-weight:500}
.quotes figcaption span,.quotes figcaption a{color:var(--muted)}
@media (max-width:900px){.quotes{grid-template-columns:1fr}}

/* shared: photo close with the founder's line (kept; photo moved into the blue world) */
.close{margin:clamp(80px,12vh,128px) var(--gutter) 0;border-radius:14px;overflow:hidden;position:relative;height:clamp(416px,62vh,608px)}
.close img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 2.4s var(--ease)}
.close.in img{transform:scale(1)}
.close::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.35) 55%,rgba(0,0,0,.1))}
.close figure{position:absolute;inset:auto 0 0 0;z-index:1;padding:clamp(28px,5vw,80px);color:#fff}
.close blockquote{font-family:Outfit,sans-serif;font-weight:400;font-size:clamp(22px,3.2vw,36px);line-height:1.2;letter-spacing:-.02em;max-width:46ch}
.close blockquote span{color:rgba(255,255,255,.6)}
.close figcaption{margin-top:24px;font-size:14px;color:rgba(255,255,255,.65)}
.close figcaption b{color:#fff;font-weight:500}

/* ───────── A · The name stays ───────── */
.a-grid{display:grid;grid-template-columns:5fr 7fr;gap:64px;border-top:2px solid var(--fg);padding-top:28px}
.a-plate{position:sticky;top:22vh;align-self:start}
.a-plate .name{font-size:clamp(44px,6.2vw,104px);margin-top:18px;max-width:8ch}
.a-plate .role{color:var(--muted);margin-top:16px;font-size:15px}
.a-plate .count{display:flex;align-items:center;gap:16px;margin-top:40px}
.a-plate .count i{flex:1;max-width:220px;height:1px;background:var(--line);position:relative}
.a-plate .count i::after{content:"";position:absolute;inset:0;background:var(--brand);transform-origin:left;transform:scaleX(var(--p,.2));transition:transform .7s var(--ease)}
[dir="rtl"] .a-plate .count i::after{transform-origin:right}
.a-plate .now{margin-top:14px;font-size:15px}
.a-stages{list-style:none}
.a-stages li{padding:clamp(40px,9vh,96px) 0;border-bottom:1px solid var(--line);color:var(--muted);transition:color .5s var(--ease)}
.a-stages li:first-child{padding-top:8px}
.a-stages li.cur{color:var(--fg)}
.a-stages h3{font-size:clamp(28px,3.6vw,56px);max-width:14ch;margin-top:14px}
.a-stages p{font-size:17px;max-width:46ch;margin-top:18px;color:var(--muted)}
@media (max-width:900px){
  .a-grid{grid-template-columns:1fr;gap:40px}
  .a-plate{position:static}
  .a-plate .count,.a-plate .now{display:none}
  .a-stages li{color:var(--fg);padding:32px 0}
}

/* ───────── B · One cell for five rows ───────── */
.b-sheet{display:grid;grid-template-columns:8fr 4fr;border-top:2px solid var(--fg)}
.b-sheet .bar{grid-column:1/-1;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
.b-sheet .bar h3{font:inherit;letter-spacing:.22em;color:var(--fg)}
.b-rows{list-style:none}
.b-rows li{display:grid;grid-template-columns:56px 4fr 6fr;gap:8px 40px;align-items:baseline;padding:34px 0;border-bottom:1px solid var(--line);padding-inline-end:48px}
.b-rows h4{font-family:Outfit,sans-serif;font-weight:500;font-size:clamp(20px,1.6vw,26px);line-height:1.3;letter-spacing:-.01em}
[dir="rtl"] .b-rows h4{font-family:Vazirmatn,sans-serif}
.b-rows p{color:var(--muted);font-size:16px;max-width:52ch}
.b-cell{position:relative;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;min-height:320px}
.b-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.14);transition:transform 2.6s var(--ease)}
.b-cell.in img{transform:scale(1)}
.b-cell::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.15) 60%)}
.b-cell .sig{position:absolute;inset:auto 0 0 0;z-index:1;padding:28px;color:#fff}
.b-cell .sig .eyebrow{color:rgba(255,255,255,.75)}
.b-cell .sig .name{font-size:clamp(30px,2.8vw,44px);margin-top:10px}
.b-cell .sig .role{font-size:14px;color:rgba(255,255,255,.7);margin-top:8px}
.b-cell .sig .rule{height:1px;background:rgba(255,255,255,.7);margin-top:20px;transform-origin:left;transform:scaleX(0);transition:transform 1.4s .5s var(--ease)}
[dir="rtl"] .b-cell .sig .rule{transform-origin:right}
.b-cell.in .sig .rule{transform:scaleX(1)}
@media (max-width:900px){
  .b-sheet{grid-template-columns:minmax(0,1fr)}
  .b-cell{grid-row:2;min-width:0;min-height:0;height:260px;border-inline-start:0}
  .b-rows li{grid-template-columns:40px minmax(0,1fr);padding-inline-end:0}
  .b-rows p{grid-column:2}
}

/* ───────── C · The clients speak first ───────── */
.c-quote{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding:clamp(40px,7vh,72px) 0;border-top:1px solid var(--line)}
.c-quote:first-of-type{border-top:2px solid var(--fg)}
.c-quote .who{grid-column:1/4;display:flex;flex-direction:column;gap:4px;font-size:14px}
.c-quote .who b{font-family:Outfit,sans-serif;font-weight:400;font-size:22px;letter-spacing:-.01em}
.c-quote .who span,.c-quote .who a{color:var(--muted)}
.c-quote .who a{margin-top:14px;text-underline-offset:4px}
.c-quote blockquote{grid-column:4/13;font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(24px,3vw,46px);line-height:1.16;letter-spacing:-.028em;max-width:26ch}
.c-quote blockquote .w{color:var(--muted);transition:color .5s var(--ease)}
.c-quote blockquote .w.lit{color:var(--fg)}
.c-note{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;border-top:1px solid var(--line);padding-top:clamp(40px,7vh,72px)}
.c-note .eyebrow{grid-column:1/4}
.c-note .text{grid-column:4/11}
.c-note .text p{font-size:clamp(19px,1.7vw,25px);line-height:1.5;max-width:40ch}
.c-note .text p u{text-decoration:none;background:linear-gradient(var(--brand),var(--brand)) 0 100%/0 1px no-repeat;transition:background-size .9s var(--ease);padding-bottom:2px}
[dir="rtl"] .c-note .text p u{background-position:100% 100%}
.c-note.in .text p u{background-size:100% 1px}
.c-note .sign{margin-top:36px;display:inline-flex;flex-direction:column;min-width:240px}
.c-note .sign .hand{font-family:var(--serif);font-style:italic;font-size:34px;line-height:1;padding:0 4px 10px;border-bottom:1px solid var(--line-strong)}
[dir="rtl"] .c-note .sign .hand{font-family:Vazirmatn,sans-serif;font-style:normal;font-weight:300}
.c-note .sign small{font-size:14px;color:var(--muted);margin-top:10px}
@media (max-width:900px){
  .c-quote .who,.c-quote blockquote,.c-note .eyebrow,.c-note .text{grid-column:1/-1}
  .c-quote .who{order:2}
}

/* prototype chrome */
.switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(20,22,28,.9);font:500 12px Inter,sans-serif;border:1px solid rgba(255,255,255,.14)}
.switch button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;color:#cbd5e1;white-space:nowrap}
.switch button.on{background:#fff;color:#07080B}
.switch button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.switch .sep{width:1px;background:rgba(255,255,255,.18);margin:6px 4px}
.about{position:fixed;top:12px;inset-inline-end:12px;z-index:60;max-width:380px;font:12px/1.5 Inter,sans-serif;background:rgba(20,22,28,.92);color:#cbd5e1;border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.14)}
.about b{color:#fff;font-weight:500}
@media (max-width:900px){.about{position:static;max-width:none;border-radius:0}}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .close img,.b-cell img{transform:none}
  .b-cell .sig .rule{transform:none}
  .c-quote blockquote .w{color:var(--fg)}
  .c-note .text p u{background-size:100% 1px}
}
</style>
</head>
<body>

<div class="about" id="about" dir="ltr"></div>

<div class="wrap neighbour">↑ work-section (verification record) sits above on the homepage</div>

<!-- ════════ A ════════ -->
<section class="trust" data-d="a" aria-labelledby="ha">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-k="eyebrow"></p><h2 id="ha" data-title></h2></div>
      <p data-k="body" data-html></p>
    </div>
    <div class="a-grid">
      <div class="a-plate">
        <p class="eyebrow" data-k="signedByLabel"></p>
        <p class="display name" data-k="name"></p>
        <p class="role" data-k="role"></p>
        <div class="count" aria-hidden="true"><span class="mono" id="a-count">01 / 05</span><i id="a-bar"></i></div>
        <p class="now" id="a-now" aria-hidden="true"></p>
      </div>
      <ol class="a-stages" data-stages="a"></ol>
    </div>
    <div class="quotes-label"><span class="eyebrow" data-k="quotesLabel"></span><i></i></div>
    <div class="quotes" data-quotes></div>
  </div>
  <div class="close" data-in><img src="img/single-lamp-dark-wall.webp" alt=""><figure><blockquote data-k="founderBody" data-html></blockquote><figcaption data-founder></figcaption></figure></div>
</section>

<!-- ════════ B ════════ -->
<section class="trust" data-d="b" aria-labelledby="hb">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-k="eyebrow"></p><h2 id="hb" data-title></h2></div>
      <p data-k="body" data-html></p>
    </div>
    <div class="b-sheet">
      <div class="bar eyebrow"><h3 data-k="sheet"></h3><span data-k="sheetCount"></span></div>
      <ol class="b-rows" data-stages="b"></ol>
      <div class="b-cell" data-in>
        <img src="img/single-lamp-dark-wall.webp" alt="">
        <div class="sig">
          <p class="eyebrow" data-k="signedByAll"></p>
          <p class="display name" data-k="name"></p>
          <p class="role" data-k="role"></p>
          <div class="rule" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div class="quotes-label"><span class="eyebrow" data-k="quotesLabel"></span><i></i></div>
    <div class="quotes" data-quotes></div>
  </div>
</section>

<!-- ════════ C ════════ -->
<section class="trust" data-d="c" aria-labelledby="hc">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-k="eyebrow"></p><h2 id="hc" data-title></h2></div>
      <p data-k="body" data-html></p>
    </div>
    <div data-cquotes></div>
    <div class="c-note" data-in>
      <p class="eyebrow" data-k="noteLabel"></p>
      <div class="text">
        <p data-k="note" data-html></p>
        <div class="sign"><span class="hand" data-k="name"></span><small data-k="role"></small></div>
      </div>
    </div>
  </div>
  <div class="close" data-in><img src="img/single-lamp-dark-wall.webp" alt=""><figure><blockquote data-k="founderBody" data-html></blockquote><figcaption data-founder></figcaption></figure></div>
</section>

<div class="wrap neighbour after">↓ transparent-by-design (the price chain row) follows on the homepage</div>

<div class="switch" role="group" aria-label="Prototype controls">
  <button data-set-d="a">A · Name stays</button>
  <button data-set-d="b">B · One cell</button>
  <button data-set-d="c">C · Clients first</button>
  <span class="sep"></span>
  <button id="lang">AR</button>
  <button id="theme">Dark</button>
</div>

<script>
// Copy: existing strings from apps/www/messages/{en,ar}/commercial.json (trust.*) and
// lib/data/testimonials.ts. Keys marked NEW are prototype copy, unreviewed.
const T = {
  en: {
    eyebrow: "Why leaders choose Altruvex",
    title: "Direct access to the engineer building your system,", titleAccent: "from first reply to launch.",
    body: "You work <strong>directly with the engineer shaping the system.</strong> Strategy, scope, implementation quality, and communication stay in one line of ownership from brief to launch.",
    name: "Ali Abdelhadi", role: "Founder & Lead Engineer",
    signedByLabel: "Signed off by",
    signedByAll: "Signed off by · all five",              // NEW
    sheet: "Sign-off sheet", sheetCount: "05 stages · one signature",
    quotesLabel: "In the client's words",
    viewCase: "View case study",
    noteLabel: "What both had in common",                 // NEW

    ],
    quotes: [

      ["Art Lighting","Premium lighting","Product pages stay fast on mobile data and inventory updates without breaking the catalog experience-that was the bar for going live."]
    ]
  },
  ar: {
    eyebrow: "لماذا تختار Altruvex؟",
    title: "تعامل مباشر مع المهندس الذي يبني نظامك،", titleAccent: "من أول رد حتى الإطلاق.",
    body: "تعمل <strong>مباشرة مع المهندس الذي يصمم موقعك.</strong> الاستراتيجية والنطاق وجودة التنفيذ والتواصل تبقى في خط ملكية واحد من البداية حتى الإطلاق.",
    name: "علي عبد الهادي", role: "المؤسس والمهندس الرئيسي",
    signedByLabel: "وقّع عليها",
    signedByAll: "وقّع عليها · الخمس كلها",
    sheet: "ورقة التوقيع", sheetCount: "05 مراحل · توقيع واحد",
    quotesLabel: "بكلمات العميل",
    viewCase: "عرض دراسة الحالة",
    noteLabel: "ما جمع بين المشروعين",
    note: "مهندس واحد <u>قرأ الطلب</u>، و<u>حدّد النطاق والسعر كتابةً</u>، و<u>صمّم البنية</u>، و<u>كتب الكود</u>، و<u>أطلقه</u> — وهو نفسه من يرد حين يحتاج شيء إلى إصلاح.",
    founderBody: "الهدف ليس الظهور بمظهر راقٍ. الهدف بناء عمل بجودة ووضوح وعمق في التصميم كافٍ يجعل الآخرين قادرين على <span>تقليد الشكل</span> - لكن ليس المعيار الذي يقف خلفه.",
    stages: [
      ["يقرأ طلبك ويرد عليك","أول رد يأتيك من المهندس الذي سيبني النظام - لا من مكتب مبيعات ينقل الملاحظات."],
      ["يحدد النطاق والسعر كتابةً","كل رقم يعود إلى الأسعار المنشورة، والخطوة التالية مسمّاة دائماً. لا يظهر في الفاتورة ما لم يكن في عرض السعر."],
      ["يصمم البنية","العربية والإنجليزية مخططتان كنظامين متساويين من أول مخطط بيانات - لا ترجمة لاحقة فوق بناء بلغة واحدة."],
      ["يكتب الكود","من متطلباتك، سطراً بسطر - لا قالب معاد تدويره، ولا حزمة إضافات، ولا مجموعة واجهات مشتراة."],
      ["يطلقه ويبقى مسؤولاً عنه","المهندس الذي نشر الموقع هو نفسه من تتواصل معه حين يحتاج شيء إلى إصلاح بعد الإطلاق."]
    ],
    quotes: [
      ["NewLight","تجارة الإضاءة","كان علينا أن يعمل متجرنا الأول بالعربية والإنجليزية دون أن يبدو كقالب مترجم. سلّمت Altruvex متجراً ثنائي اللغة سريعاً استطعنا عرضه على الموردين من اليوم الأول."],
      ["Art Lighting","إضاءة فاخرة","صفحات المنتجات تبقى سريعة على بيانات الجوال وتحديثات المخزون دون أن تكسر تجربة الكتالوج-كان هذا شرط الإطلاق."]
    ]
  }
};

const ABOUT = {
  a: "<b>A · The name stays.</b> The founder's name is set once at display size and sticks (CSS sticky, not a pin) while the five stages scroll past it; the counter and rule report the stage. What does not move is the proof. Then quotes and the photo close. Idea: sticky subject with content passing — The First The Last services stage (Awwwards SOTD), Art of Documentary founders (image overlap on scroll). <b>Risk:</b> longest of the three (~2.4 viewports); a third accordion-like register after services and process.",
  b: "<b>B · One cell for five rows.</b> The live sign-off sheet, but the five repeated initials become ONE merged cell: a brand-mood photograph (single lamp) spanning all five rows with the name signed once. One light, one name, five stages. Photo close removed (the photo moved into the sheet). Idea: Trionn's founder block (portrait + role as one unit). <b>Risk:</b> closest to today's section; the founder's closing line has no home.",
  c: "<b>C · The clients speak first.</b> The two client quotes lead at display size, read word by word (colour, never opacity), each with its case study. The five stages collapse into one signed sentence. Idea: Awwwards 'Human Notes' (testimonials as personal notes) and audio testimonial with word tracking (CMP-087, CMP-080). <b>Risk:</b> only two quotes carry the section, and authors are company names with no person (RUL-100)."
};

let lang = "en", dir = "a";
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, "0");

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $$("[data-k]").forEach(el => { const v = t[el.dataset.k]; if ("html" in el.dataset) el.innerHTML = v; else el.textContent = v; });
  $$("[data-title]").forEach(el => { el.innerHTML = `${t.title} <em class="acc">${t.titleAccent}</em>`; });
  $$("[data-founder]").forEach(el => { el.innerHTML = `<b>${t.name}</b> · ${t.role}`; });
  $$('[data-stages="a"]').forEach(el => { el.innerHTML = t.stages.map((s, i) => `<li data-i="${i}"><span class="mono">${pad(i + 1)}</span><h3>${s[0]}</h3><p>${s[1]}</p></li>`).join(""); });
  $$('[data-stages="b"]').forEach(el => { el.innerHTML = t.stages.map((s, i) => `<li><span class="mono">${pad(i + 1)}</span><h4>${s[0]}</h4><p>${s[1]}</p></li>`).join(""); });
  $$("[data-quotes]").forEach(el => { el.innerHTML = t.quotes.map(q => `<figure><blockquote>${q[2]}</blockquote><figcaption><b>${q[0]}</b><span>${q[1]}</span><a href="#">${t.viewCase}</a></figcaption></figure>`).join(""); });
  $$("[data-cquotes]").forEach(el => { el.innerHTML = t.quotes.map(q => `<figure class="c-quote"><figcaption class="who"><b>${q[0]}</b><span>${q[1]}</span><a href="#">${t.viewCase}</a></figcaption><blockquote>${q[2].split(" ").map(w => `<span class="w">${w}</span>`).join(" ")}</blockquote></figure>`).join(""); });
  $$(".trust").forEach(s => s.classList.toggle("on", s.dataset.d === dir));
  $$("[data-set-d]").forEach(b => b.classList.toggle("on", b.dataset.setD === dir));
  document.getElementById("about").innerHTML = ABOUT[dir];
  document.getElementById("lang").textContent = lang === "en" ? "AR" : "EN";
  observe();
}

let ios = [];
function observe() {
  ios.forEach(o => o.disconnect()); ios = [];
  // entrance: one class, once
  const enter = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); enter.unobserve(e.target); } }), { threshold: .25 });
  $$(".trust.on [data-in]").forEach(el => { el.classList.remove("in"); enter.observe(el); });
  ios.push(enter);
  // A: the stage crossing the viewport's middle line is current
  const t = T[lang], items = $$('.trust.on [data-stages="a"] li');
  if (items.length) {
    const set = i => {
      items.forEach((li, n) => li.classList.toggle("cur", n === i));
      document.getElementById("a-count").textContent = `${pad(i + 1)} / ${pad(items.length)}`;
      document.getElementById("a-bar").style.setProperty("--p", (i + 1) / items.length);
      document.getElementById("a-now").textContent = t.stages[i][0];
    };
    set(0);
    const mid = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) set(+e.target.dataset.i); }), { rootMargin: "-50% 0px -50% 0px" });
    items.forEach(li => mid.observe(li)); ios.push(mid);
  }
  // C: words take ink as they pass the reading line
  const words = $$(".trust.on .c-quote .w");
  if (words.length) {
    const read = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("lit"); }), { rootMargin: "0px 0px -32% 0px" });
    words.forEach(w => read.observe(w)); ios.push(read);
  }
}

$$("[data-set-d]").forEach(b => b.addEventListener("click", () => { dir = b.dataset.setD; render(); scrollTo(0, 0); }));
document.getElementById("lang").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; render(); });
document.getElementById("theme").addEventListener("click", e => {
  const h = document.documentElement, dark = h.dataset.theme !== "dark";
  h.dataset.theme = dark ? "dark" : "light"; e.target.textContent = dark ? "Light" : "Dark";
});
render();
</script>
</body>
</html>
