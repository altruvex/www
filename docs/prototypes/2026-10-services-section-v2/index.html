<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/services — where each one sits, v2</title>
<style>
/* Standalone prototype. House values mirrored from packages/ui/src/styles/tokens.css and
   apps/www/app/globals.css; not production code. The audit fee is shown as a placeholder on
   purpose — a price exists only in packages/pricing-schema. */
@font-face{font-family:"Altruvex Sans";src:url(fonts/AltruvexSansLatin-VF.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Altruvex Sans Arabic";src:url(fonts/AltruvexSansArabic-VF.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#fff;--fg:hsl(0 0% 10%);--muted:hsl(0 0% 40%);--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.45);
  --brand:hsl(214 89% 48%);--brand-text:hsl(214 90% 43%);
  --w-violet:hsl(272 72% 52%);--w-blue:hsl(214 90% 43%);--w-cyan:hsl(194 88% 31%);--w-green:hsl(158 64% 30%);
  --serif:Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,1,.36,1);--gutter:clamp(16px,4vw,56px);
  --font:"Altruvex Sans","Altruvex Sans Arabic",system-ui,sans-serif;
}
[dir="rtl"]{--font:"Altruvex Sans Arabic","Altruvex Sans",system-ui,sans-serif}
html[data-theme="dark"]{
  --bg:hsl(0 0% 7%);--fg:hsl(0 0% 94%);--muted:hsl(0 0% 58%);--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.45);
  --brand-text:hsl(214 95% 64%);
  --w-violet:hsl(268 88% 74%);--w-blue:hsl(214 95% 66%);--w-cyan:hsl(190 80% 48%);--w-green:hsl(158 40% 52%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:clip;line-height:1.55;padding-bottom:110px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:start}
a{color:inherit}
ol,ul{list-style:none}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gutter)}
.w-violet{--acc:var(--w-violet)}.w-blue{--acc:var(--w-blue)}.w-cyan{--acc:var(--w-cyan)}.w-green{--acc:var(--w-green)}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.door{display:inline-flex;gap:.6em;align-items:center;font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--fg) 45%,transparent);text-underline-offset:4px;min-height:24px;transition:color .2s}
.door:hover{color:var(--acc,var(--brand-text));text-decoration-color:currentColor}
.door .arr{display:inline-block;transition:transform .25s var(--ease)}
.door:hover .arr{transform:translateX(3px)}
[dir="rtl"] .door .arr{transform:scaleX(-1)}
[dir="rtl"] .door:hover .arr{transform:scaleX(-1) translateX(3px)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

/* context above/below so the section is judged in place */
.ctx{padding:72px 0;color:var(--muted);font-size:13px;text-align:center;border-bottom:1px solid var(--line)}
.ctx.after{border-bottom:0;border-top:1px solid var(--line);margin-top:clamp(80px,12vh,140px)}
section.v{display:none;padding-top:clamp(80px,12vh,140px)}
section.v.on{display:block}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;border-top:2px solid var(--fg);padding-top:16px;margin-bottom:clamp(40px,7vh,72px)}
.head .hint{font-size:13px;color:var(--muted)}
.title{font-size:clamp(34px,4.4vw,68px);font-weight:300;letter-spacing:-.035em;line-height:1.04;max-width:18ch;margin-bottom:clamp(48px,8vh,88px)}
[dir="rtl"] .title{letter-spacing:0;line-height:1.35}
.title em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--brand-text);letter-spacing:-.02em}
[dir="rtl"] .title em{font-family:inherit;font-style:normal;font-weight:500}
.foot{margin-top:clamp(56px,9vh,96px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;border-top:1px solid var(--line);padding-top:20px;font-size:15px;color:var(--muted)}
.foot .door{color:var(--fg)}

/* ───────────── A · the question you are asking ───────────── */
.qa{display:grid;grid-template-columns:7fr 5fr;gap:clamp(32px,5vw,96px);align-items:start}
.qa-list{border-top:1px solid var(--line)}
.qa-item{border-bottom:1px solid var(--line)}
.qa-q{display:grid;grid-template-columns:auto 1fr;gap:6px 32px;width:100%;padding:clamp(20px,3.2vh,32px) 0;align-items:baseline}
.qa-q .num{grid-row:span 2;padding-top:.6em}
.qa-moment{font-size:13px;color:var(--muted);transition:color .3s}
.qa-text{position:relative;font-size:clamp(26px,3.1vw,48px);font-weight:300;letter-spacing:-.03em;line-height:1.1;color:var(--muted);transition:color .35s var(--ease)}
[dir="rtl"] .qa-text{letter-spacing:0;line-height:1.4}
.qa-text .dot{position:absolute;inset-inline-start:-.55em;top:.48em;width:.26em;height:.26em;border-radius:50%;background:var(--acc);transform:scale(0);transition:transform .35s var(--ease)}
.qa-item.on .qa-text,.qa-q:hover .qa-text{color:var(--fg)}
.qa-item.on .qa-text .dot{transform:scale(1)}
.qa-item.on .qa-moment{color:var(--acc)}
.qa-inline{display:none}
.qa-panel{position:sticky;top:clamp(80px,14vh,140px)}
.qa-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:32px}
.qa-bar i{display:block;height:100%;width:25%;background:var(--acc);transition:transform .5s var(--ease),background .4s;transform-origin:0 0}
[dir="rtl"] .qa-bar i{margin-inline-start:auto}
.qa-body{transition:opacity .25s,transform .35s var(--ease)}
.qa-body.out{opacity:0;transform:translateY(8px)}
.qa-name{font-size:15px;font-weight:500;color:var(--acc)}
.qa-leaves{font-size:clamp(28px,2.9vw,44px);font-weight:300;letter-spacing:-.03em;line-height:1.12;margin:14px 0 36px;text-wrap:balance}
[dir="rtl"] .qa-leaves{letter-spacing:0;line-height:1.45}
.qa-list2{display:grid;gap:10px;font-size:15px;color:var(--muted);margin-bottom:28px}
.qa-list2 li{display:flex;gap:12px}
.qa-list2 li::before{content:"";flex:none;width:14px;height:1px;background:var(--line-strong);margin-top:.8em}
.qa-terms{border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted);margin-bottom:20px}
@media (max-width:900px){
  .qa{grid-template-columns:1fr}.qa-panel{display:none}
  .qa-text{color:var(--fg)}.qa-text .dot{transform:scale(1)}.qa-moment{color:var(--acc)}
  .qa-inline{display:block;padding:0 0 28px}
  .qa-inline .qa-leaves{font-size:24px;margin:8px 0 16px}
}

/* ───────────── B · three moments, three fields ───────────── */
.fields{display:grid;grid-template-columns:1fr 2fr 1.35fr;gap:10px;margin-inline-end:calc(-1 * var(--gutter))}
.field{position:relative;border-radius:20px;padding:clamp(24px,2.6vw,40px);min-height:clamp(480px,64vh,620px);display:flex;flex-direction:column;justify-content:space-between;gap:48px;
  background:color-mix(in oklab,var(--acc) 7%,var(--bg));overflow:hidden;
  clip-path:inset(0 100% 0 0 round 20px);transition:clip-path 1.1s var(--ease)}
[dir="rtl"] .field{clip-path:inset(0 0 0 100% round 20px)}
.fields.in .field{clip-path:inset(0 0 0 0 round 20px)}
.fields.in .field:nth-child(2){transition-delay:.12s}.fields.in .field:nth-child(3){transition-delay:.24s}
.field.build{background:linear-gradient(100deg,color-mix(in oklab,var(--w-violet) 8%,var(--bg)),color-mix(in oklab,var(--w-blue) 8%,var(--bg)))}
[dir="rtl"] .field.build{background:linear-gradient(-100deg,color-mix(in oklab,var(--w-violet) 8%,var(--bg)),color-mix(in oklab,var(--w-blue) 8%,var(--bg)))}
.field.live{border-start-end-radius:0;border-end-end-radius:0}
.f-top .num{display:block;margin-bottom:14px}
.f-moment{font-size:clamp(32px,3.5vw,56px);font-weight:300;letter-spacing:-.035em;line-height:1.02}
[dir="rtl"] .f-moment{letter-spacing:0;line-height:1.3}
.f-note{font-size:14px;color:var(--muted);margin-top:10px}
.f-pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,2.4vw,40px)}
.f-svc .f-name{font-size:14px;font-weight:500;color:var(--acc);display:flex;gap:8px;align-items:center}
.f-svc .f-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc)}
.f-leaves{font-size:clamp(21px,1.75vw,27px);line-height:1.2;letter-spacing:-.02em;margin:12px 0 18px;text-wrap:balance}
[dir="rtl"] .f-leaves{letter-spacing:0;line-height:1.5}
.f-terms{font-size:13px;color:var(--muted);margin-bottom:14px}
.f-months{position:absolute;inset-inline-end:0;top:clamp(24px,2.6vw,40px);display:flex;gap:18px;font-size:12px;color:var(--muted);
  mask-image:linear-gradient(to right,#000 30%,transparent);-webkit-mask-image:linear-gradient(to right,#000 30%,transparent);padding-inline-end:24px}
[dir="rtl"] .f-months{mask-image:linear-gradient(to left,#000 30%,transparent);-webkit-mask-image:linear-gradient(to left,#000 30%,transparent)}
.f-months span{display:flex;flex-direction:column;align-items:center;gap:6px}
.f-months span::before{content:"";width:1px;height:10px;background:var(--line-strong)}
.f-live-top{display:flex;justify-content:space-between;gap:16px}
.ret{display:flex;align-items:center;gap:16px;margin-top:20px;font-size:15px;color:var(--muted)}
.ret svg{flex:none;width:clamp(120px,40%,520px);height:34px;overflow:visible}
[dir="rtl"] .ret svg{transform:scaleX(-1)}
.ret path{fill:none;stroke:var(--line-strong);stroke-width:1.25;stroke-dasharray:4 5}
@media (max-width:1024px){.f-pair{grid-template-columns:1fr}}
@media (max-width:900px){
  .fields{grid-template-columns:1fr;margin-inline-end:0}
  .field{min-height:0;clip-path:none!important}
  .field.live{border-radius:20px}
  .f-months{display:none}
  .ret svg{display:none}
}

/* ───────────── C · the loop ───────────── */
.loop{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,6vw,112px);align-items:center}
.ring{position:relative;aspect-ratio:1;max-width:480px;width:72%;margin-inline:auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
[dir="rtl"] .ring svg{transform:scaleX(-1)}
.arc{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;opacity:.6;transition:stroke-width .45s var(--ease),opacity .35s;cursor:pointer}
.arc.on{stroke-width:9;opacity:1}
.arc-draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--ease),stroke-width .45s var(--ease),opacity .35s}
.loop.in .arc-draw{stroke-dashoffset:0}
.ring .tick{stroke:var(--line-strong);stroke-width:1}
.ring .head-arrow{fill:var(--w-cyan);opacity:.6}
.ring-label{position:absolute;display:flex;flex-direction:column;gap:2px;font-size:clamp(14px,1.25vw,17px);font-weight:500;white-space:nowrap;padding:6px 10px;border-radius:8px;color:var(--muted);transition:color .3s}
.ring-label.r{transform:translate(18px,-50%);align-items:flex-start;text-align:left}.ring-label.l{transform:translate(calc(-100% - 18px),-50%);align-items:flex-end;text-align:right}
.ring-label .num{font-size:11px}
.ring-label:hover,.ring-label.on{color:var(--fg)}
.ring-label.on .num{color:var(--acc)}
.ring-moment{position:absolute;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
[dir="rtl"] .ring-moment{transform:translate(50%,-50%);letter-spacing:0;font-size:13px}
.ring-centre{position:absolute;inset:28%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.ring-centre .big{font-size:clamp(48px,6vw,96px);font-weight:200;letter-spacing:-.05em;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums;transition:color .4s}
.ring-centre .small{font-size:13px;color:var(--muted);max-width:18ch}
.l-body{transition:opacity .25s,transform .35s var(--ease)}
.l-body.out{opacity:0;transform:translateY(8px)}
.l-moment{font-size:13px;color:var(--acc)}
.l-name{font-size:clamp(30px,3.2vw,50px);font-weight:300;letter-spacing:-.035em;line-height:1.05;margin:8px 0 12px}
[dir="rtl"] .l-name{letter-spacing:0;line-height:1.35}
.l-q{font-size:16px;color:var(--muted);margin-bottom:28px}
.l-leaves{font-size:clamp(22px,2vw,30px);line-height:1.2;letter-spacing:-.02em;padding-top:24px;border-top:1px solid var(--line);margin-bottom:24px;text-wrap:balance}
[dir="rtl"] .l-leaves{letter-spacing:0;line-height:1.5}
.l-terms{font-size:13px;color:var(--muted);margin-bottom:18px}
.l-nav{display:flex;gap:20px;margin-top:40px;font-size:14px;color:var(--muted)}
.l-nav button{display:inline-flex;gap:.5em;min-height:24px;align-items:center}
.l-nav button:hover{color:var(--fg)}
.l-return{margin-top:28px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
.l-return svg{flex:none}
@media (max-width:900px){.loop{grid-template-columns:1fr}.ring{width:62%}.ring-label .m,.ring-label .n{display:none}.ring-label .num{font-size:14px}.ring-label.r{transform:translate(10px,-50%)}.ring-label.l{transform:translate(calc(-100% - 10px),-50%)}.ring-moment{display:none}}

/* reduced motion: everything lands in place */
@media (prefers-reduced-motion:reduce){*{transition:none!important}.field{clip-path:none!important}.arc-draw{stroke-dashoffset:0!important}}

/* switcher */
.bar{position:fixed;inset:auto 0 16px 0;display:flex;justify-content:center;z-index:50;pointer-events:none}
.bar>div{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.08);font-size:13px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.bar button{padding:8px 12px;border-radius:9px;color:var(--muted)}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.bar .sep{width:1px;background:var(--line);margin:4px 4px}
</style>
</head>

<div class="ctx"><div class="wrap" data-t="ctxAbove"></div></div>

<main class="wrap">
  <!-- A -->
  <section class="v on" id="A" aria-labelledby="hA">
    <div class="head"><h2 id="hA" class="eyebrow" data-t="label"></h2><span class="hint" data-t="hint"></span></div>
    <p class="title" data-t="titleA"></p>
    <div class="qa">
      <ol class="qa-list" id="qaList"></ol>
      <div class="qa-panel" aria-live="polite">
        <div class="qa-bar"><i id="qaBar"></i></div>
        <div class="qa-body" id="qaBody"></div>
      </div>
    </div>
    <div class="foot"><span data-t="processLead"></span><a class="door" href="#"><span data-t="processLink"></span><span class="arr">→</span></a></div>
  </section>

  <!-- B -->
  <section class="v" id="B" aria-labelledby="hB">
    <div class="head"><h2 id="hB" class="eyebrow" data-t="label"></h2><span class="hint" data-t="hint"></span></div>
    <p class="title" data-t="titleB"></p>
    <div class="fields" id="fields"></div>
    <p class="ret"><svg viewBox="0 0 400 34" preserveAspectRatio="none" aria-hidden="true"><path d="M400 2 C 400 30, 380 32, 340 32 L 8 32 L 2 26"/><path d="M2 26 L 10 24 M2 26 L 5 18" stroke-dasharray="none"/></svg><span data-t="return"></span></p>
    <div class="foot"><span data-t="processLead"></span><a class="door" href="#"><span data-t="processLink"></span><span class="arr">→</span></a></div>
  </section>

  <!-- C -->
  <section class="v" id="C" aria-labelledby="hC">
    <div class="head"><h2 id="hC" class="eyebrow" data-t="label"></h2><span class="hint" data-t="hint"></span></div>
    <p class="title" data-t="titleC"></p>
    <div class="loop" id="loop">
      <div class="ring" id="ring"></div>
      <div aria-live="polite"><div class="l-body" id="lBody"></div>
        <div class="l-nav"><button id="lPrev"><span class="arr">←</span><span data-t="prev"></span></button><button id="lNext"><span data-t="next"></span><span class="arr">→</span></button></div>
      </div>
    </div>
    <div class="foot"><span data-t="processLead"></span><a class="door" href="#"><span data-t="processLink"></span><span class="arr">→</span></a></div>
  </section>
</main>

<div class="ctx after"><div class="wrap" data-t="ctxBelow"></div></div>

<div class="bar"><div>
  <button data-v="A" aria-pressed="true">A · Your question</button>
  <button data-v="B" aria-pressed="false">B · Three fields</button>
  <button data-v="C" aria-pressed="false">C · The loop</button>
  <span class="sep"></span>
  <button data-lang="en" aria-pressed="true">EN</button>
  <button data-lang="ar" aria-pressed="false">AR</button>
  <span class="sep"></span>
  <button data-theme-btn="light" aria-pressed="true">Light</button>
  <button data-theme-btn="dark" aria-pressed="false">Dark</button>
</div></div>

<script>

  svc:{
   audit:{name:"الاستشارات التقنية",q:"تحتاج وضوحاً قبل قرار مكلف؟",leaves:"قرار تستطيع الدفاع عنه، في خمسة أيام عمل.",terms:"[رسوم التدقيق] سعر ثابت، خمسة أيام عمل",d:["نتائج مرتبة حسب الخطورة في البنية والأداء وتحسين محركات البحث","مسار موصى به لإعادة البناء أو الإصلاح، مع مقايضاته","خارطة طريق ينفذها أي فريق — فريقنا أو فريقك"]},
   website:{name:"تصميم الواجهات",q:"تحتاج حضوراً أقوى في السوق؟",leaves:"موقع ملكك، لا مستأجر.",terms:"مشروع بنطاق محدد، يُسعَّر حسب النطاق",d:["موقع مخصص بالعربية والإنجليزية كتجربتين متكافئتين","بنية صفحات مصممة حول مسار تحويل واحد","أداء مقاس وفق مؤشرات Core Web Vitals قبل الإطلاق"]},
   portal:{name:"التطوير المخصص",q:"تحتاج طريقة عمل مخصصة أو منطق منتج؟",leaves:"تشغيل بلا الاختناق الذي كان.",terms:"مشروع بنطاق محدد، يُسعَّر حسب النطاق",d:["لوحات تحكم ومسارات عمل مبنية على طريقة عمل فريقك فعلياً","كود موثّق ومحكم الأنواع على تقنيات تملكها","خط بناء ونشر آلي منذ الإصدار الأول"]},
   maintenance:{name:"الصيانة والدعم",q:"تحتاج تنفيذاً موثوقاً بعد الإطلاق؟",leaves:"نظام يستمر في العمل بعد أن نغادر.",terms:"اشتراك شهري، ثلاث خطط تغطية",d:["مراقبة وتحديثات أمنية ونسخ احتياطي على دورة محددة","تحديثات محتوى وميزات صغيرة دون مشروع جديد","قناة مباشرة مع مهندسين يعرفون الكود"]}
  }}
};
/* Life order, world per discipline (lib/config/accent-world.ts) */
const SVC = [
 {id:"audit",moment:"before",w:"w-cyan"},
 {id:"website",moment:"build",w:"w-violet"},
 {id:"portal",moment:"build",w:"w-blue"},
 {id:"maintenance",moment:"live",w:"w-green"},
];
let lang="en", activeA=0, activeC=0;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const fmt=n=>lang==="ar"?n.toLocaleString("ar-EG",{minimumIntegerDigits:2}):pad(n);
const C=()=>COPY[lang];
const door=(t)=>`<a class="door" href="#"><span>${t}</span><span class="arr">→</span></a>`;

function fillStatic(){
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=C()[el.dataset.t]});
}

/* A */
function renderA(){
  const c=C();
  $("#qaList").innerHTML=SVC.map((s,i)=>{const v=c.svc[s.id];return `
   <li class="qa-item ${s.w} ${i===activeA?"on":""}" data-i="${i}">
    <button class="qa-q" aria-pressed="${i===activeA}">
      <span class="num">${fmt(i+1)}</span>
      <span class="qa-moment">${c.moments[s.moment][0]}</span>
      <span class="qa-text"><span class="dot" aria-hidden="true"></span>${v.q}</span>
    </button>
    <div class="qa-inline"><div class="qa-name">${v.name}</div><p class="qa-leaves">${v.leaves}</p><p class="qa-terms">${v.terms}</p>${door(c.open)}</div>
   </li>`}).join("");
  $("#qaList").querySelectorAll(".qa-item").forEach(li=>{
    const go=()=>setA(+li.dataset.i);
    li.querySelector(".qa-q").addEventListener("mouseenter",go);
    li.querySelector(".qa-q").addEventListener("focus",go);
    li.querySelector(".qa-q").addEventListener("click",go);
  });
  paintA(false);
}
function paintA(animate=true){
  const c=C(),s=SVC[activeA],v=c.svc[s.id],body=$("#qaBody"),panel=$(".qa-panel");
  panel.className="qa-panel "+s.w;
  const bar=$("#qaBar");bar.style.transform=`translateX(${(lang==="ar"?-1:1)*activeA*100}%)`;
  const html=`<div class="qa-name">${fmt(activeA+1)} · ${v.name}</div><p class="qa-leaves">${v.leaves}</p>
   <ul class="qa-list2">${v.d.map(x=>`<li>${x}</li>`).join("")}</ul><p class="qa-terms">${v.terms}</p>${door(c.open)}`;
  if(!animate){body.innerHTML=html;return}
  body.classList.add("out");setTimeout(()=>{body.innerHTML=html;body.classList.remove("out")},180);
}
function setA(i){if(i===activeA)return;activeA=i;
  document.querySelectorAll(".qa-item").forEach((li,k)=>{li.classList.toggle("on",k===i);li.querySelector(".qa-q").setAttribute("aria-pressed",k===i)});paintA()}

/* B */
function svcB(id){const s=SVC.find(x=>x.id===id),v=C().svc[id];
  return `<div class="f-svc ${s.w}"><div class="f-name">${v.name}</div><p class="f-leaves">${v.leaves}</p><p class="f-terms">${v.terms}</p>${door(C().open)}</div>`}
function renderB(){
  const c=C(),m=c.moments;
  const months=[1,2,3,4,5,6,7,8].map(n=>`<span>${c.month} ${lang==="ar"?n.toLocaleString("ar-EG"):n}</span>`).join("");
  $("#fields").innerHTML=`
   <article class="field w-cyan"><div class="f-top"><span class="num">${fmt(1)} / ${fmt(3)}</span><h3 class="f-moment">${m.before[0]}</h3><p class="f-note">${m.before[1]}</p></div>${svcB("audit")}</article>
   <article class="field build"><div class="f-top"><span class="num">${fmt(2)} / ${fmt(3)}</span><h3 class="f-moment">${m.build[0]}</h3><p class="f-note">${m.build[1]}</p></div><div class="f-pair">${svcB("website")}${svcB("portal")}</div></article>
   <article class="field live w-green"><div class="f-live-top"><div class="f-top"><span class="num">${fmt(3)} / ${fmt(3)}</span><h3 class="f-moment">${m.live[0]}</h3><p class="f-note">${m.live[1]}</p></div></div>${svcB("maintenance")}</article>`;
}

/* C — ring geometry: four equal arcs with gaps, clockwise from 12 o'clock */
function polar(cx,cy,r,a){const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
function arcPath(a0,a1,r=200){const [x0,y0]=polar(250,250,r,a0),[x1,y1]=polar(250,250,r,a1);return `M${x0} ${y0} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`}
const ARCS=[[6,84],[96,174],[186,264],[276,348]];
function renderC(){
  const c=C(),rtl=lang==="ar";
  const arcs=SVC.map((s,i)=>`<path class="arc arc-draw ${s.w} ${i===activeC?"on":""}" pathLength="1" d="${arcPath(...ARCS[i])}" data-i="${i}"/>`).join("");
  const [hx,hy]=polar(250,250,200,354);
  const svg=`<svg viewBox="0 0 500 500" aria-hidden="true">${arcs}
   <path class="head-arrow" d="M${hx} ${hy} l-11 -7 l1 14 z" transform="rotate(${354} ${hx} ${hy}) rotate(-354 ${hx} ${hy})"/></svg>`;
  const lab=SVC.map((s,i)=>{const mid=(ARCS[i][0]+ARCS[i][1])/2;let [x,y]=polar(250,250,226,mid);if(rtl)x=500-x;
    const right=x>250;
    return `<button class="ring-label ${s.w} ${i===activeC?"on":""} ${right?"r":"l"}" style="left:${x/5}%;top:${y/5}%" data-i="${i}" aria-pressed="${i===activeC}"><span class="num">${fmt(i+1)}<span class="m"> · ${c.moments[s.moment][0]}</span></span><span class="n">${c.svc[s.id].name}</span></button>`}).join("");
  const mo="";
  $("#ring").innerHTML=svg+lab+mo+`<div class="ring-centre ${SVC[activeC].w}"><span class="big" id="lBig"></span><span class="small" id="lSmall">${c.moments[SVC[activeC].moment][0]}</span></div>`;
  $("#ring").querySelectorAll("[data-i]").forEach(el=>{el.addEventListener("click",()=>setC(+el.dataset.i));if(el.tagName==="BUTTON"){el.addEventListener("mouseenter",()=>setC(+el.dataset.i))}});
  paintC(false);
}
function paintC(animate=true){
  const c=C(),s=SVC[activeC],v=c.svc[s.id],body=$("#lBody");
  $("#lBody").parentElement.className=s.w;
  const html=`<p class="l-moment">${fmt(activeC+1)} · ${c.moments[s.moment][0]}</p><h3 class="l-name">${v.name}</h3><p class="l-q">${v.q}</p>
   <p class="l-leaves">${v.leaves}</p><p class="l-terms">${v.terms}</p>${door(c.open)}
   ${s.id==="maintenance"?`<p class="l-return"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>${c.return}</p>`:""}`;
  const ring=$("#ring");
  ring.querySelectorAll(".arc").forEach((a,k)=>a.classList.toggle("on",k===activeC));
  ring.querySelectorAll(".ring-label").forEach((a,k)=>{a.classList.toggle("on",k===activeC);a.setAttribute("aria-pressed",k===activeC)});
  const centre=ring.querySelector(".ring-centre");centre.className="ring-centre "+s.w;
  $("#lBig").textContent=lang==="ar"?(activeC+1).toLocaleString("ar-EG"):pad(activeC+1);$("#lSmall").textContent=c.moments[s.moment][0];
  if(!animate){body.innerHTML=html;return}
  body.classList.add("out");setTimeout(()=>{body.innerHTML=html;body.classList.remove("out")},180);
}
function setC(i){i=(i+4)%4;if(i===activeC)return;activeC=i;paintC()}
$("#lPrev").addEventListener("click",()=>setC(activeC-1));
$("#lNext").addEventListener("click",()=>setC(activeC+1));

/* entry: B fields open, C ring draws — once */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.25});
function observe(){["#fields","#loop"].forEach(s=>{const el=$(s);el.classList.remove("in");io.observe(el)})}

function render(){fillStatic();renderA();renderB();renderC();observe()}
document.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.querySelectorAll("section.v").forEach(s=>s.classList.toggle("on",s.id===b.dataset.v));
  history.replaceState(null,"","#"+b.dataset.v);observe();
}));
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.lang;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed",x===b));render();
}));
document.querySelectorAll("[data-theme-btn]").forEach(b=>b.addEventListener("click",()=>{
  document.documentElement.dataset.theme=b.dataset.themeBtn;
  document.querySelectorAll("[data-theme-btn]").forEach(x=>x.setAttribute("aria-pressed",x===b));
}));
render();
const h=location.hash.slice(1);if(["A","B","C"].includes(h))document.querySelector(`[data-v="${h}"]`).click();
</script>
</body>
</html>
