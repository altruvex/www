<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimator — Altruvex prototype</title>
<script>
  // language + theme before first paint (no flash)
  (function () {
    var d = document.documentElement;
    if (new URLSearchParams(location.search).get("l") === "ar") { d.lang = "ar"; d.dir = "rtl"; }
    try { var th = localStorage.getItem("ax-proto-theme"); if (th === "light" || th === "dark") d.setAttribute("data-theme", th); } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Outfit:wght@300;400;600&family=Vazirmatn:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="estimator.css">
</head>
<body>
<a class="skip" href="#steps">Skip to the questions</a>

<header class="nav">
  <b>Altruvex</b>
  <span class="eyebrow" id="navTag"></span>
</header>

<main class="wrap">
  <section class="est-intro" aria-labelledby="intro-h">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="intro-h"><span id="h1a"></span> <span class="dim" id="h1b"></span></h1>
    <p class="lead" id="lead"></p>
    <ol class="chain" id="chain"></ol>
  </section>

  <!-- mobile live readout (the full result follows the questions) -->
  <div class="readout" id="readout">
    <span class="ro-fig num" id="roFig"></span>
    <span class="ro-meta"><span id="roStatus"></span> · <a href="#result" id="readoutMore"></a></span>
  </div>

  <div class="est">
    <div class="steps" id="steps"></div>

    <section class="result" id="result" aria-labelledby="rTitle">
      <p class="eyebrow"><span id="rIdx"></span> · <span id="rEyebrow"></span></p>
      <h2 class="rtitle" id="rTitle" tabindex="-1"></h2>

      <div class="figure">
        <p class="fig num"><span class="sr-only" id="figSr"></span><span class="settle" id="fig" aria-hidden="true"></span></p>
        <p class="weeks"><span class="k" id="deliveryL"></span> <span class="num" id="weeks"></span></p>
        <p class="status" id="status"></p>
        <div class="track" aria-hidden="true"><i id="bar"></i></div>
        <p class="note"><span id="widestL"></span> <span class="num" id="widest"></span> · <span id="answered"></span></p>
      </div>
      <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>

      <h3 class="dh" id="driversL"></h3>
      <dl class="drivers" id="drivers"></dl>
      <h4 class="nh" id="notesL"></h4>
      <ul class="notes" id="notesList"></ul>

      <p class="disclaimer"><span id="disclaimer"></span> <span id="vat"></span></p>

      <div class="actions">
        <button type="button" class="pill p" id="cta" aria-expanded="false" aria-controls="pform"></button>
        <a class="pill s" href="#" id="discuss"></a>
      </div>
      <p class="note" id="discussNote" role="status" hidden></p>

      <form class="pform" id="pform" novalidate hidden>
        <p class="fintro" id="fIntro"></p>
        <div class="field">
          <label for="f-phone" id="lPhone"></label>
          <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required aria-required="true" aria-describedby="e-phone">
          <p class="err" id="e-phone"></p>
        </div>
        <div class="field">
          <label for="f-name" id="lName"></label>
          <input id="f-name" name="name" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="f-email" id="lEmail"></label>
          <input id="f-email" name="email" type="email" autocomplete="email" dir="ltr" aria-describedby="e-email">
          <p class="err" id="e-email"></p>
        </div>
        <div class="field">
          <label for="f-company" id="lCompany"></label>
          <input id="f-company" name="company" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label for="f-note" id="lNote"></label>
          <textarea id="f-note" name="note" rows="3"></textarea>
        </div>
        <p class="note" id="fAttached"></p>
        <button type="submit" class="pill p" id="fSend"></button>
        <p class="sent" id="sent" role="status" hidden></p>
      </form>

      <button type="button" class="reset" id="reset"></button>
    </section>
  </div>
</main>

<footer class="wrap est-foot"><p class="note" id="footer"></p></footer>

<nav class="switch" id="switch"></nav>

<script src="data.js"></script>
<script src="estimator.js"></script>
</body>
</html>
