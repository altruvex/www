<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB · Spine + split line</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* ── A: homepage row + spine ── */
/* ---------- homepage compact form: five stages, figures only ---------- */
.a-row{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.a-row li{padding-block:22px 28px;padding-inline-end:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.a-row .hd{display:flex;align-items:baseline;gap:10px;font-size:14px}
.a-row .hd .ix{font-size:12px;color:var(--muted)}
.a-row li:not(:last-child) .hd::after{content:"→";margin-inline-start:auto;color:var(--muted)}
html[dir="rtl"] .a-row li:not(:last-child) .hd::after{content:"←"}
.a-row .fig{font-size:clamp(1.15rem,1.55vw,1.5rem);line-height:1.2}
.a-row .fig.prop{font-family:Inter,sans-serif;font-size:14px;letter-spacing:0;line-height:1.45}
html[lang="ar"] .a-row .fig.prop{font-family:Vazirmatn,sans-serif}
.a-row .fig.unk,.spine .fig.unk{color:var(--muted)}
.a-ex{margin-top:14px}
@media(max-width:900px){
  .a-row{grid-template-columns:1fr;border-bottom:0}
  .a-row li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px;padding-block:16px;padding-inline-end:0;border-bottom:1px solid var(--line)}
  .a-row .hd::after{display:none}
  .a-row .fig{text-align:end}
  .a-row .fig.prop{max-width:17ch}
}

/* ---------- 01 + 02: the spine ---------- */
.sec-head .dim{color:var(--muted)}
.a-ex2{padding:0 0 18px;margin-inline-start:calc(4.5rem + 24px)}
@media(max-width:900px){.a-ex2{margin-inline-start:0}}
.spine{list-style:none;border-top:2px solid var(--fg)}
.st{display:grid;grid-template-columns:4.5rem minmax(0,6fr) minmax(0,5fr);gap:0 24px;padding-block:34px 38px;border-bottom:1px solid var(--line);position:relative}
.st .node{display:flex;align-items:center;gap:12px;height:1.8rem;position:relative;z-index:1}
.st .dot{width:11px;height:11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);flex:none;transition:background var(--m-fast) var(--ease-strong),border-color var(--m-fast)}
.st .node .ix{font-size:12px;color:var(--muted)}
/* spine segment: from this dot down to the next; draws once as the stage enters */
.st::before{content:"";position:absolute;inset-inline-start:5px;top:calc(34px + .9rem);bottom:calc(-34px - .9rem);width:1px;background:var(--line)}
.st::after{content:"";position:absolute;inset-inline-start:5px;top:calc(34px + .9rem);bottom:calc(-34px - .9rem);width:1px;background:var(--fg);transform-origin:top;transform:scaleY(0);transition:transform 1.1s var(--ease-smooth)}
.st.last::before,.st.last::after{display:none}
.st.in .dot{background:var(--fg);border-color:var(--fg)}
.st.in::after{transform:scaleY(1)}
.st h3{font-size:clamp(1.7rem,2.6vw,2.4rem);line-height:1.1}
.st .does{color:var(--muted);font-size:15px;line-height:1.6;max-width:48ch;margin-top:10px}
.drv-l{margin-top:22px}
.drv{list-style:none;margin-top:10px;border-top:1px solid var(--line)}
.drv li{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:4px 18px;padding-block:13px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.drv .dn{font-weight:500}
.drv .dd{color:var(--muted)}
.drv .dc{grid-column:2;font-size:12px;color:var(--muted)}
.drv .dc b{font-weight:500;color:var(--fg)}
.drv .ff{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.drv .ff span{white-space:nowrap}
.drv .ff b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.res{display:flex;flex-direction:column;align-items:flex-end;text-align:end;gap:10px;padding-top:.15rem}
.res .was{font-size:13px;color:var(--muted);transition:opacity var(--m-base) var(--ease-strong)}
.res .was .lbl{margin-inline-end:6px}
.res .fig{font-size:clamp(1.75rem,3vw,2.7rem);line-height:1.1}
.res .fig.prop{font-size:clamp(1.3rem,2vw,1.7rem);line-height:1.25;max-width:16ch}
.res .cap{font:400 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .res .cap{font:400 13px/1.4 Vazirmatn,sans-serif;letter-spacing:0;text-transform:none}
.res .cap.bind{color:var(--fg)}
html.motion .st:not(.in) .was{opacity:0}
/* tail: after launch — not a stage, the spine ends dashed */
.st.tail{padding-block:26px 30px}
.st.tail .dot{border-style:dashed;background:transparent}
.st.tail h3{font-size:clamp(1.3rem,1.8vw,1.6rem)}
.st.tail .plansln{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);justify-content:flex-end}
.st.tail .plansln b{color:var(--fg);font-weight:500}
.st.tail a{font-size:13px;border-bottom:1px solid var(--line-strong);min-height:44px;display:inline-flex;align-items:center}
@media(max-width:900px){
  .st{grid-template-columns:2rem minmax(0,1fr);gap:0 14px;padding-block:28px 30px}
  .st .node{flex-direction:column;align-items:flex-start;height:auto;gap:8px;padding-top:.55rem}
  .st::before,.st::after{top:calc(28px + .55rem + 5px);bottom:calc(-28px - .55rem - 5px)}
  .st .res{grid-column:2;align-items:flex-start;text-align:start;margin-top:22px}
  .st.tail .plansln{justify-content:flex-start}
  .drv li{grid-template-columns:1fr}
  .drv .dc,.drv .ff{grid-column:1}
}
@media(prefers-reduced-motion:reduce){.st::after,.st .dot,.res .was{transition:none}}
/* ── B: split line ── */
/* ---------- the split: one frame, three columns divided by rules that draw once ---------- */
.b-frame{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,3fr) minmax(0,3fr);border-top:2px solid var(--fg);border-bottom:1px solid var(--line)}
.b-col{position:relative;min-width:0;padding-inline:28px;container-type:inline-size}
.b-col:first-child{padding-inline-start:0}
.b-col:last-child{padding-inline-end:0}
/* the dividing rule: a real 1px line, drawn top-down on entry (content never waits for it) */
.b-col+.b-col::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:1px;background:var(--line-strong);transform-origin:top;transition:transform 1.1s var(--ease-smooth)}
.b-col:nth-child(3)::before{transition-delay:.18s}
html.motion .b-frame:not(.in) .b-col+.b-col::before{transform:scaleY(0)}

/* column head */
.b-ch{display:flex;align-items:baseline;gap:12px;padding-block:22px 0}
.b-ch .ix{font-size:12px;color:var(--muted)}
.b-col h3{font-size:clamp(1.45rem,2vw,1.85rem);line-height:1.15}
.b-cl{color:var(--muted);font-size:14px;line-height:1.6;max-width:46ch;margin-top:10px}
.b-open{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:14px;font-size:13px;color:var(--muted)}
.b-open .fig{font-size:clamp(1.2rem,1.6vw,1.45rem);color:var(--fg)}

/* driver rows */
.b-drv{list-style:none;margin-top:22px;border-top:1px solid var(--line)}
.b-drv>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding-block:16px 8px;border-bottom:1px solid var(--line)}
.b-drv>li:last-child{border-bottom:0}
.b-drv .dn{font-weight:500;font-size:15px}
.b-drv .dd{color:var(--muted);font-size:14px;line-height:1.55;margin-top:3px;max-width:40ch}
.b-drv .main{min-width:0}
.fx{display:flex;flex-direction:column;align-items:flex-end;text-align:end;gap:3px;font-size:13px;line-height:1.5}
.fx .lead{font-size:clamp(1.15rem,1.5vw,1.35rem)}
.fx .cap{color:var(--muted);font-size:12px}
.fx dl{display:grid;grid-template-columns:auto auto;gap:3px 14px;justify-content:end;margin-top:3px}
.fx dt{color:var(--muted);text-align:end}
.fx dd{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{list-style:none;display:grid;gap:4px;margin-top:10px;font-size:13px;line-height:1.55;color:var(--muted)}
.chk li{padding-inline-start:14px;position:relative}
.chk li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:6px;height:1px;background:var(--line-strong)}
.plansln{list-style:none;display:grid;gap:4px;margin-top:12px;font-size:14px}
.plansln li{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px}
.plansln .pn{color:var(--muted)}
.plansln .pv{white-space:nowrap}
.plansln .fig{font-size:18px}
.plansln .cy{color:var(--muted);font-size:13px}
.b-more{display:inline-flex;align-items:center;min-height:44px;font-size:13px;border-bottom:1px solid var(--line-strong);margin-top:6px}

/* signature: which estimator question carries this driver — revealed on hover/focus */
.qref{grid-column:1/-1;display:grid;justify-items:start;color:var(--muted);font-size:13px;line-height:1.5;margin-top:2px}
.qref .qk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:400 11px/1.3 "Geist Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;transition:color var(--m-hover)}
html[lang="ar"] .qref .qk{font:400 13px/1.4 Vazirmatn,sans-serif;letter-spacing:0;text-transform:none}
.qref .qw{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--m-fast) var(--ease-strong)}
.qref .qt{overflow:hidden;min-height:0;opacity:0;transition:opacity var(--m-fast) var(--ease-strong)}
.qref .qt span{display:block;padding-bottom:10px;color:var(--fg);max-width:44ch}
.qref .qt em{font-style:normal;color:var(--muted);display:block;font-size:12px}
.b-drv>li:hover .qk,.b-drv>li:focus-within .qk{color:var(--fg)}
.b-drv>li:hover .qw,.b-drv>li:focus-within .qw{grid-template-rows:1fr}
.b-drv>li:hover .qt,.b-drv>li:focus-within .qt{opacity:1}
.qref:focus-visible{outline:none}
.qref:focus-visible .qk{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.b-hint{margin-top:14px}
/* no hover on touch: the question is simply shown */
@media(hover:none){.qref .qw{grid-template-rows:1fr}.qref .qt{opacity:1}.b-hint{display:none}}

@container (max-width:520px){
  .b-drv>li{grid-template-columns:minmax(0,1fr)}
  .fx{align-items:flex-start;text-align:start}
  .fx dl{justify-content:start;grid-template-columns:auto minmax(0,1fr)}
  .fx dt,.fx dd{text-align:start}
  .fx dd{white-space:normal}
}

/* the five-step chain: one plain sentence-line, not a diagram */
.b-chain{font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(1.25rem,2.1vw,1.8rem);letter-spacing:-.015em;line-height:1.45;padding-block:4px 30px;max-width:60ch}
html[lang="ar"] .b-chain{font-family:Vazirmatn,sans-serif;letter-spacing:0}
.b-chain .ar{color:var(--muted);margin-inline:.12em}

/* ---------- homepage compact form: the split line alone ---------- */
.b-home .b-col{padding-block:22px 30px}
.b-home .b-ch{padding-block:0}
.b-home h3{font-size:clamp(1.3rem,1.7vw,1.6rem)}
.b-home p{color:var(--muted);font-size:14px;line-height:1.6;margin-top:10px;max-width:38ch}
.b-home p .fig{font-size:16px;white-space:nowrap}
.b-home p .fig-d{display:block;font-size:clamp(1.15rem,1.5vw,1.35rem);margin-top:6px}

/* ---------- mobile: columns stack, the rule turns horizontal ---------- */
@media(max-width:900px){
  .b-frame{grid-template-columns:minmax(0,1fr)}
  .b-col,.b-col:first-child,.b-col:last-child{padding-inline:0}
  .b-col+.b-col{margin-top:10px}
  .b-col+.b-col::before{inset-inline:0;bottom:auto;width:auto;height:1px;transform-origin:left}
  html[dir="rtl"] .b-col+.b-col::before{transform-origin:right}
  html.motion .b-frame:not(.in) .b-col+.b-col::before{transform:scaleX(0)}
  .b-frame:not(.b-home) .b-col:last-child{padding-bottom:10px}
  .b-home .b-col{padding-block:20px 22px}
}
@media(prefers-reduced-motion:reduce){.b-col::before,.qref .qw,.qref .qt,.qref .qk{transition:none}}
</style></head>
<body>
<script src="data.js"></script><script src="shared.js"></script>
<script>
X.addCopy({
  en: { a: {
    lead: "Follow one project from the first conversation to the binding figure. Each cost driver sits at the stage where it acts.",
    was: "Narrowed from", acts: "Acts at this stage",
    after: "After launch", afterNote: "Not part of the build figure — billed monthly, only if you want it.",
    plansLink: "Plans in Service investment",
  } },
  ar: { a: {
    lead: "تابع مشروعاً واحداً من أول حديث حتى الرقم الملزم. كل عامل يؤثر في التكلفة موضوع عند المرحلة التي يعمل فيها.",
    was: "بعد أن كان", acts: "يؤثر في هذه المرحلة",
    after: "بعد الإطلاق", afterNote: "ليس جزءاً من رقم البناء — يُحتسب شهرياً، وفقط إن أردته.",
    plansLink: "الخطط في أسعار الخدمات",
  } },
});

function figCls(st) { return st.kind === "estimate" ? "fig-d" : st.kind === "proposal" ? "prop" : st.kind === "unknown" ? "unk" : ""; }

/* homepage compact form: the same five stages, figures only; they settle in sequence */
function homeRow() {
  const items = X.stages().map((st, i) => `<li><div class="hd"><span class="ix mono num">${X.ix(st.index)}</span><span>${X.esc(st.name)}</span></div>${X.fig(st.fig, { cls: figCls(st), delay: i * 170 })}</li>`).join("");
  return `<ol class="a-row">${items}</ol><p class="note a-ex">${X.esc(X.exampleLine())}</p>`;
}

X.addCopy({
  en: { b: {
    lead: "The estimator prices four things. Two more are settled with you in scope review, and one is billed monthly. Each sits in its own column.",
    then: "then",
    col: {
      moves: { h: "Moves your estimate", l: "The estimator prices these four. Its range opens wide and narrows with every answer.", open: "Opening range" },
      review: { h: "Settled in scope review", l: "Checked with you before the proposal is written. A form can't know them, so the estimator never prices them." },
      monthly: { h: "Billed monthly", l: "After launch, only if you want it. Never part of the build figure." },
    },
    fx: {
      from: "Every build starts here",
      byBand: "{name}, by complexity",
      brand: "Brand identity", content: "Content readiness", timeline: "Delivery",
    },
    checks: {
      integrations: ["Which gateway, CRM or APIs — and who owns each account", "What data moves between systems, and what happens when one fails"],
      performance: ["Speed and Core Web Vitals targets", "Accessibility level and SEO baseline", "Hosting and infrastructure"],
    },
    q: { label: "Estimator · Question {n}", reviewed: "Reviewed in scope — doesn't move the range", billed: "Priced separately — doesn't move the range" },
    questions: {
      scope: [1, "What are you building?"],
      complexity: [2, "How much scope?"],
      content: [4, "Project conditions — Brand identity, Content readiness"],
      timeline: [4, "Project conditions — Timeline"],
      integrations: [3, "What does it need? — Payments & third-party integrations"],
      performance: [3, "What does it need? — Performance & SEO targets"],
      operation: [3, "What does it need? — Ongoing maintenance"],
    },
    hint: "Hover or focus a driver to see which estimator question carries it.",
    plansLink: "Plans in Service investment",
    home: {
      moves: "Scope, complexity, content and timeline. {min}",
      review: "Integrations and performance — checked with you, then written into the proposal.",
      monthly: "Ongoing operation, from {p} {c}.",
    },
  } },
  ar: { b: {
    lead: "المقدّر يسعّر أربعة عوامل. عاملان آخران نحسمهما معك في مراجعة النطاق، وعامل واحد يُحتسب شهرياً. لكلٍّ منها عمود مستقل.",
    then: "ثم",
    col: {
      moves: { h: "يحرّك تقديرك", l: "هذه الأربعة يسعّرها المقدّر. يبدأ النطاق واسعاً ويضيق مع كل إجابة.", open: "النطاق الافتتاحي" },
      review: { h: "يُحسم في مراجعة النطاق", l: "نتحقق منها معك قبل كتابة عرض السعر. لا يمكن لنموذج إلكتروني أن يعرفها، لذلك لا يسعّرها المقدّر أبداً." },
      monthly: { h: "يُحتسب شهرياً", l: "بعد الإطلاق، وفقط إن أردته. لا يدخل أبداً في رقم البناء." },
    },
    fx: {
      from: "نقطة بداية أي مشروع بناء",
      byBand: "{name}، حسب درجة التعقيد",
      brand: "الهوية البصرية", content: "جاهزية المحتوى", timeline: "التسليم",
    },
    checks: {
      integrations: ["أيّ بوابة دفع أو نظام عملاء أو واجهة برمجية — ومن يملك كل حساب", "ما البيانات التي تنتقل بين الأنظمة، وماذا يحدث إن تعطّل أحدها"],
      performance: ["مستهدفات السرعة ومؤشرات Core Web Vitals", "مستوى سهولة الوصول والأساس اللازم لمحركات البحث", "الاستضافة والبنية التحتية"],
    },
    q: { label: "المقدّر · السؤال {n}", reviewed: "يُراجَع عند تحديد النطاق — لا يحرّك التقدير", billed: "يُسعَّر منفصلاً — لا يحرّك التقدير" },
    questions: {
      scope: [1, "ماذا تبني؟"],
      complexity: [2, "ما حجم النطاق؟"],
      content: [4, "ظروف المشروع — الهوية البصرية، جاهزية المحتوى"],
      timeline: [4, "ظروف المشروع — الجدول الزمني"],
      integrations: [3, "ما الذي يحتاجه؟ — المدفوعات والربط مع أنظمة خارجية"],
      performance: [3, "ما الذي يحتاجه؟ — أهداف الأداء والظهور في البحث"],
      operation: [3, "ما الذي يحتاجه؟ — صيانة مستمرة"],
    },
    hint: "مرّر المؤشر على أي عامل أو انتقل إليه بلوحة المفاتيح لترى أي سؤال في المقدّر يحمله.",
    plansLink: "الخطط في أسعار الخدمات",
    home: {
      moves: "النطاق والتعقيد والمحتوى والجدول الزمني. {min}",
      review: "التكاملات والأداء — نتحقق منها معك، ثم تُكتب في عرض السعر.",
      monthly: "التشغيل المستمر، من {p} {c}.",
    },
  } },
});

/* low end of the first cell … high end of the last: joins two schema labels, never types a figure */
function joinRange(lo, hi) {
  if (lo === hi) return lo;
  return lo.slice(0, lo.indexOf("–")) + "–" + hi.slice(hi.indexOf("–") + 1);
}
const COLS = ["moves", "review", "monthly"];

/* homepage compact form: the split line alone, three columns, one line each */
function homeSplit() {
  const b = X.c.b, D = X.D, p = X.plans().find((x) => !x.custom);
  const line = {
    moves: X.fill(X.esc(b.home.moves), { min: `<span class="fig fig-d">${X.esc(D.minimumEngagement)}</span>` }),
    review: X.esc(b.home.review),
    monthly: X.fill(X.esc(b.home.monthly), { p: `<span class="fig">${X.esc(p.price)}</span>`, c: X.esc(p.cycle) }),
  };
  return `<div class="b-frame b-home">${COLS.map((k, i) => `<div class="b-col"><div class="b-ch"><span class="ix mono num">${X.ix(i + 1)}</span><h3>${X.esc(b.col[k].h)}</h3></div><p>${line[k]}</p></div>`).join("")}</div>`;
}

function qref(d) {
  const b = X.c.b, [n, q] = b.questions[d.id];
  const sub = d.cls === "review" ? b.q.reviewed : d.cls === "monthly" ? b.q.billed : "";
  return `<a class="qref" href="${X.href("estimator.html", "#steps")}"><span class="qk">${X.esc(X.fill(b.q.label, { n: X.ix(n) }))} <span class="arr" aria-hidden="true">→</span></span><span class="qw"><span class="qt"><span>${X.esc(q)}${sub ? `<em>${X.esc(sub)}</em>` : ""}</span></span></span></a>`;
}

function effect(d) {
  const b = X.c.b, D = X.D;
  const row = (l, v) => `<dt>${X.esc(l)}</dt><dd>${X.esc(v)}</dd>`;
  if (d.id === "scope") {
    return `<div class="fx"><span class="lead fig fig-d">${X.esc(D.minimumEngagement)}</span><span class="cap">${X.esc(b.fx.from)}</span><dl>${D.matrix.rows.map((r) => row(r.name, joinRange(r.cells[0].priceLabel, r.cells[r.cells.length - 1].priceLabel))).join("")}</dl></div>`;
  }
  if (d.id === "complexity") {
    const r = D.matrix.rows.find((x) => x.serviceId === D.example.input.serviceId), bands = X.bands();
    return `<div class="fx"><span class="cap">${X.esc(X.fill(b.fx.byBand, { name: r.name }))}</span><dl>${r.cells.map((c, i) => row(bands[i].label, c.priceLabel)).join("")}</dl></div>`;
  }
  if (d.id === "content") return `<div class="fx"><dl>${row(b.fx.brand, X.factorSpan("brand"))}${row(b.fx.content, X.factorSpan("content"))}</dl></div>`;
  if (d.id === "timeline") return `<div class="fx"><dl>${row(b.fx.timeline, X.factorSpan("timeline"))}</dl></div>`;
  return "";
}

function driverRow(d) {
  const b = X.c.b;
  let extra = "";
  if (d.cls === "review") extra = `<ul class="chk">${b.checks[d.id].map((t) => `<li>${X.esc(t)}</li>`).join("")}</ul>`;
  if (d.cls === "monthly") {
    extra = `<ul class="plansln">${X.plans().map((p) => `<li><span class="pn">${X.esc(p.name)}</span><span class="pv"><span class="fig">${X.esc(p.price)}</span>${p.cycle ? ` <span class="cy">${X.esc(p.cycle)}</span>` : ""}</span></li>`).join("")}</ul><a class="b-more" href="#investment">${X.esc(b.plansLink)}</a>`;
  }
  const fx = d.cls === "moves" ? effect(d) : "";
  return `<li data-drv="${d.id}"><div class="main"><div class="dn">${X.esc(d.name)}</div><p class="dd">${X.esc(d.desc)}</p>${extra}</div>${fx}${qref(d)}</li>`;
}

function split() {
  const b = X.c.b, c = X.c.sec, drivers = X.drivers();
  const arrow = X.lang === "ar" ? "←" : "→";
  const chain = X.stages().map((s) => X.esc(s.name)).join(` <span class="ar" aria-hidden="true">${arrow}</span><span class="sr">${X.esc(b.then)}</span> `);
  const cols = COLS.map((k, i) => {
    const open = k === "moves" ? `<p class="b-open"><span>${X.esc(b.col.moves.open)}</span><span class="fig">${X.esc(X.D.widestSpan)}</span></p>` : "";
    return `<div class="b-col"><div class="b-ch"><span class="ix mono num">${X.ix(i + 1)}</span><h3>${X.esc(b.col[k].h)}</h3></div><p class="b-cl">${X.esc(b.col[k].l)}</p>${open}<ul class="b-drv">${drivers.filter((d) => d.cls === k).map(driverRow).join("")}</ul></div>`;
  }).join("");
  return `<section class="sec" id="how" aria-labelledby="h-how">
<div class="sec-head"><span class="ix mono num">${X.ix(1)}–${X.ix(2)}</span><h2 id="h-how">${X.esc(c.how)}<br><span class="dim" style="color:var(--muted)">${X.esc(c.what)}</span></h2><p>${X.esc(b.lead)}</p></div>
<p class="b-chain">${chain}</p>
<div class="b-frame b-split">${cols}</div>
<p class="note b-hint">${X.esc(b.hint)}</p></section>`;
}


X.addCopy({
  en: { ab: {
    lead1: "One project, from the first conversation to the binding figure. Each stage publishes a narrower range; only the proposal fixes one number.",
    lead2: "The estimator prices four things. Two more are settled with you in scope review, and one is billed monthly.",
  } },
  ar: { ab: {
    lead1: "مشروع واحد، من أول حديث حتى الرقم الملزم. كل مرحلة تنشر نطاقاً أضيق، والعرض وحده يثبّت رقماً واحداً.",
    lead2: "المقدّر يسعّر أربعة عوامل. عاملان آخران نحسمهما معك في مراجعة النطاق، وعامل واحد يُحتسب شهرياً.",
  } },
});

/* 01 — A's spine, figures only: the drivers live once, in the split line below */
function spineOnly() {
  const a = X.c.a, c = X.c.sec;
  const rows = X.stages().map((st, i, all) => {
    const was = st.prev && st.prev !== "—" ? `<span class="was"><span class="lbl">${X.esc(a.was)}</span>${X.esc(st.prev)}</span>` : "";
    return `<li class="st${i === all.length - 1 ? " last" : ""}" data-st="${st.id}">
  <div class="node"><span class="dot" aria-hidden="true"></span><span class="ix mono num">${X.ix(st.index)}</span></div>
  <div><h3>${X.esc(st.name)}</h3><p class="does">${X.esc(st.does)}</p></div>
  <div class="res">${was}<span class="fig ${figCls(st)}" data-fig="${X.esc(st.fig)}">${X.esc(st.fig)}</span><span class="cap${st.kind === "proposal" ? " bind" : ""}">${X.esc(st.cap)}</span></div>
</li>`;
  }).join("");
  return `<section class="sec" id="how" aria-labelledby="h-how">
<div class="sec-head"><span class="ix mono num">${X.ix(1)}</span><h2 id="h-how">${X.esc(c.how)}</h2><p>${X.esc(X.c.ab.lead1)}</p></div>
<p class="note a-ex2">${X.esc(X.exampleLine())}</p>
<ol class="spine">${rows}</ol></section>`;
}

/* 02 — B's split line, without the chain sentence (the spine above already is the chain) */
function splitOnly() {
  const b = X.c.b, c = X.c.sec, drivers = X.drivers();
  const cols = COLS.map((k, i) => {
    const open = k === "moves" ? `<p class="b-open"><span>${X.esc(b.col.moves.open)}</span><span class="fig">${X.esc(X.D.widestSpan)}</span></p>` : "";
    return `<div class="b-col"><div class="b-ch"><span class="ix mono num">${X.ix(i + 1)}</span><h3>${X.esc(b.col[k].h)}</h3></div><p class="b-cl">${X.esc(b.col[k].l)}</p>${open}<ul class="b-drv">${drivers.filter((d) => d.cls === k).map(driverRow).join("")}</ul></div>`;
  }).join("");
  return `<section class="sec" id="cost" aria-labelledby="h-cost">
<div class="sec-head"><span class="ix mono num">${X.ix(2)}</span><h2 id="h-cost">${X.esc(c.what)}</h2><p>${X.esc(X.c.ab.lead2)}</p></div>
<div class="b-frame b-split">${cols}</div>
<p class="note b-hint">${X.esc(b.hint)}</p></section>`;
}

X.boot({
  active: "ab",
  render: () => X.homeSection({ index: 7, device: homeRow() }) + X.pricingHero() + spineOnly() + splitOnly() + X.register() + X.terms() + X.closeBand(),
  /* two signatures on the page: the spine's figures settle stage by stage; the split's rules draw once */
  mount(root) {
    const sts = root.querySelectorAll(".spine .st");
    sts.forEach((li) => { const f = li.querySelector("[data-fig]"); if (f && X.motion) f.style.opacity = "0"; });
    X.reveal(sts, (li) => {
      li.classList.add("in");
      const f = li.querySelector("[data-fig]");
      if (!f || !X.motion) return;
      setTimeout(() => { f.style.opacity = ""; X.settle(f, f.dataset.fig); }, 260);
    }, { threshold: 0.35 });
    X.reveal(root.querySelectorAll(".b-frame"), (el) => el.classList.add("in"), { threshold: 0.2 });
  },
});
</script>
</body></html>
