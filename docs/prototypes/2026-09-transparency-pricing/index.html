<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transparency pricing prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&family=Geist+Mono:wght@400&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.dl{list-style:none;border-top:2px solid var(--fg);margin:8px 0 96px}
.dl a{display:grid;grid-template-columns:4.5rem minmax(0,5fr) minmax(0,6fr) auto;gap:6px 24px;align-items:baseline;padding-block:28px;border-bottom:1px solid var(--line);transition:background var(--m-hover)}
.dl a:hover .nm{color:var(--brand-text)}
.dl .ix{font-size:13px;color:var(--muted)}
.dl .nm{font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(1.7rem,2.8vw,2.5rem);letter-spacing:-.025em;line-height:1.1;transition:color var(--m-hover)}
html[lang="ar"] .dl .nm{font-family:Vazirmatn,sans-serif;letter-spacing:0;font-size:clamp(1.5rem,2.4vw,2.1rem)}
.dl .cl{font-size:16px;line-height:1.5}
.dl .pr{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.dl .go{color:var(--muted)}
html[dir="rtl"] .dl .go{transform:scaleX(-1);display:inline-block}
@media(max-width:760px){.dl a{grid-template-columns:2.75rem 1fr}.dl .cl{grid-column:2}.dl .go{display:none}}
</style></head>
<body>
<script src="data.js"></script><script src="shared.js"></script>
<script>
X.addCopy({
  en: { o: { eyebrow: "Transparency · pricing · estimator — direction prototypes · {date}", h1a: "Three ways to show", h1b: "how a price gets decided.",
    sub: "Same copy, same figures (generated from the pricing schema), same service register and terms. Only the device for 01 and 02 differs. Each file opens with the homepage section, then the /pricing page.",
    est: { name: "Estimator", claim: "What might my project require? Indicative range, weeks and the drivers behind them.", proof: "Shared by all three directions" } } },
  ar: { o: { eyebrow: "الشفافية · الأسعار · المقدّر — نماذج الاتجاهات · {date}", h1a: "ثلاث طرق لعرض", h1b: "كيف يُحدَّد السعر.",
    sub: "النص نفسه والأرقام نفسها (مولَّدة من مخطط الأسعار)، وسجل الخدمات والشروط نفسها. يختلف فقط أسلوب عرض القسمين ٠١ و٠٢. كل ملف يبدأ بقسم الصفحة الرئيسية ثم صفحة الأسعار.",
    est: { name: "المقدّر", claim: "ما الذي قد يتطلبه مشروعي؟ نطاق استرشادي ومدة، والعوامل التي تقف خلفهما.", proof: "مشترك بين الاتجاهات الثلاثة" } } },
});
X.boot({
  active: "o",
  render() {
    const o = X.c.o, d = X.c.dir;
    const item = (ix, file, name, claim, proof) => `<li><a href="${X.href(file)}"><span class="ix mono num">${ix}</span><span class="nm">${X.esc(name)}</span><span class="cl">${X.esc(claim)}<span class="pr">${X.esc(proof)}</span></span><span class="go" aria-hidden="true">→</span></a></li>`;
    return `<header class="hero"><div><div class="eyebrow">${X.esc(X.fill(o.eyebrow, { date: X.digits(window.AX.generatedOn) }))}</div><h1>${X.esc(o.h1a)}<br><span class="dim">${X.esc(o.h1b)}</span></h1></div><p>${X.esc(o.sub)}</p></header>
<ol class="dl">
${item("A", "a.html", d.a.name, d.a.claim, d.a.proof)}
${item("B", "b.html", d.b.name, d.b.claim, d.b.proof)}
${item("C", "c.html", d.c.name, d.c.claim, d.c.proof)}
${item("AB", "ab.html", X.lang === "ar" ? "العمود الفقري + خط الفصل" : "Spine + split line", X.lang === "ar" ? "٠١ يُظهر المسار، و٠٢ يُظهر الأسباب — كلٌّ مرة واحدة." : "01 shows the path, 02 shows the reasons — each once.", X.lang === "ar" ? "تسلسل + مقارنة · المختار" : "Sequence + comparison · chosen")}
${item("—", "estimator.html", o.est.name, o.est.claim, o.est.proof)}
</ol>`;
  },
});
</script>
</body></html>
