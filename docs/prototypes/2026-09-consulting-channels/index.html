<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consulting channels — prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;600&family=Source+Serif+4:ital,wght@1,300;1,400&display=swap" rel="stylesheet" />
<style>
/* Values mirror apps/www: bg-background scene, .accent-world-cyan (globals.css:332/339),
   --radius-panel-md, lib/motion/tokens.ts eases. */
:root {
  --bg: hsl(0 0% 99%);
  --fg: hsl(0 0% 6%);
  --muted: hsl(0 0% 38%);
  --border: hsl(0 0% 6% / 0.1);
  --border-strong: hsl(0 0% 6% / 0.2);
  --sheet: hsl(0 0% 100%);
  --accent: hsl(194 88% 31%);
  --grad: linear-gradient(90deg, hsl(186 92% 27%), hsl(194 88% 30%), hsl(202 84% 34%));
  --page: hsl(0 0% 94%);
  --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --panel-md: 1.75rem;
  --section-y: clamp(6rem, 11vw, 10rem);
}
html[data-theme="dark"] {
  --bg: hsl(0 0% 7%);
  --fg: hsl(0 0% 95%);
  --muted: hsl(0 0% 62%);
  --border: hsl(0 0% 100% / 0.09);
  --border-strong: hsl(0 0% 100% / 0.18);
  --sheet: hsl(0 0% 10%);
  --accent: hsl(190 80% 44%);
  --grad: linear-gradient(90deg, hsl(184 78% 46%), hsl(192 80% 48%), hsl(202 84% 54%));
  --page: hsl(0 0% 4%);
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--page); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow-x: clip; }
[dir="rtl"] body { font-family: Vazirmatn, Inter, sans-serif; }
h2, h3 { font-family: Outfit, sans-serif; margin: 0; font-weight: 400; }
[dir="rtl"] :is(h2, h3, .display) { font-family: Vazirmatn, Outfit, sans-serif; letter-spacing: 0 !important; line-height: 1.4 !important; }
p, ul, ol { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
.mono { font-family: "Geist Mono", ui-monospace, monospace; }
[dir="rtl"] .mono { font-family: Vazirmatn, sans-serif; }
.eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: .8125rem; line-height: 1.5; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .eyebrow { font-family: Vazirmatn, sans-serif; letter-spacing: 0; font-size: .875rem; }
.num { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.wrap { max-width: 84rem; margin: 0 auto; padding-inline: clamp(1.25rem, 4vw, 3rem); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

/* ── prototype chrome ── */
.bar { position: fixed; inset-block-start: 12px; inset-inline: 12px; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
.bar > * { pointer-events: auto; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: hsl(0 0% 12% / .85); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); }
.seg button { padding: 7px 12px; border-radius: 9px; color: hsl(0 0% 80%); font: 500 13px/1 Inter, sans-serif; }
.seg button[aria-pressed="true"] { background: #fff; color: hsl(0 0% 8%); }
.note { position: fixed; inset-block-end: 12px; inset-inline-start: 12px; z-index: 50; max-width: 27rem; padding: 12px 14px; border-radius: 12px; background: hsl(0 0% 12% / .92); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); color: hsl(0 0% 82%); font: 400 12.5px/1.5 Inter, sans-serif; direction: ltr; text-align: left; }
.note summary { cursor: pointer; color: #fff; font-weight: 500; }
.stub { background: var(--bg); padding: 16vh 0; border-bottom: 1px solid var(--border); }
.stub p { font: 300 clamp(1.5rem, 3vw, 2.5rem)/1.1 Outfit, sans-serif; opacity: .3; }

/* ── section frame (AuditSection) ── */
.scene { background: var(--bg); color: var(--fg); padding-block: var(--section-y); }
.head { display: grid; gap: 1.1rem; max-width: 52rem; margin-bottom: clamp(3.5rem, 6vw, 5.5rem); }
.title { font-size: clamp(2.25rem, 5vw, 4rem); line-height: 1.04; letter-spacing: -.03em; font-weight: 300; text-wrap: balance; }
.title .acc { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.desc { font-size: 1.0625rem; line-height: 1.65; color: var(--muted); max-width: 40rem; }
.honesty { margin-top: 3rem; font-size: .8125rem; line-height: 1.6; color: var(--muted); max-width: 40rem; }
.rv { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--ease-smooth), transform .7s var(--ease-smooth); transition-delay: calc(var(--i, 0) * 60ms); }
.rv.in { opacity: 1; transform: none; }
.lbl { font-family: "Geist Mono", monospace; font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .lbl { font-family: Vazirmatn, sans-serif; letter-spacing: 0; font-size: .8125rem; }

/* ── A · the question, set large ── */
.a-grid { display: grid; gap: 3rem; }
@media (min-width: 1024px) { .a-grid { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 5rem; } }
.a-index { border-top: 1px solid var(--border-strong); }
.a-index li { border-bottom: 1px solid var(--border); }
.a-tab { position: relative; display: grid; grid-template-columns: 2.5rem 1fr auto; align-items: baseline; width: 100%; padding: 1rem 0; color: var(--muted); transition: color .3s var(--ease-smooth); }
.a-tab .nm { font-size: 1.125rem; }
.a-tab::after { content: ""; position: absolute; inset-block-end: -1px; inset-inline-start: 0; height: 2px; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: var(--origin, left); transition: transform .4s var(--ease-strong); }
[dir="rtl"] .a-tab::after { --origin: right; }
.a-tab:hover, .a-tab[aria-selected="true"] { color: var(--fg); }
.a-tab[aria-selected="true"]::after { transform: scaleX(1); }
.a-tab .go { opacity: 0; transition: opacity .3s; color: var(--accent); }
.a-tab[aria-selected="true"] .go { opacity: 1; }
.a-stage { min-height: 34rem; }
.a-q { font-family: Outfit, sans-serif; font-weight: 300; font-size: clamp(2rem, 4.2vw, 3.75rem); line-height: 1.08; letter-spacing: -.03em; text-wrap: balance; }
.a-back { margin-top: clamp(2rem, 4vw, 3rem); border-top: 1px solid var(--border-strong); }
.a-back li { display: grid; grid-template-columns: 2.5rem 1fr; padding: 1.1rem 0; border-bottom: 1px solid var(--border); font-size: clamp(1.0625rem, 1.3vw, 1.25rem); line-height: 1.45; }
.a-back li .num { color: var(--accent); }
.a-look { margin-top: 2.5rem; display: grid; gap: .5rem 2rem; }
@media (min-width: 640px) { .a-look ul { display: grid; grid-template-columns: 1fr 1fr; column-gap: 2rem; } }
.a-look li { padding: .6rem 0; border-bottom: 1px solid var(--border); font-size: .9375rem; color: var(--muted); }
.swap { animation: swap .6s var(--ease-strong); }
@keyframes swap { from { opacity: 0; transform: translateY(12px); } }
.a-mobile { display: none; }
@media (max-width: 1023px) {
  .a-grid { display: none; }
  .a-mobile { display: block; }
}

/* ── B · the question ledger ── */
.b-head, .b-row { display: grid; gap: .75rem 2.5rem; }
@media (min-width: 1024px) { .b-head, .b-row { grid-template-columns: 3rem minmax(0, 7fr) minmax(0, 5fr); } }
.b-head { padding-bottom: 1rem; border-bottom: 1px solid var(--border-strong); }
.b-head > :first-child { grid-column: 1 / 3; }
@media (max-width: 1023px) { .b-head { display: none; } }
.b-row { padding: clamp(1.75rem, 3vw, 2.5rem) 0; border-bottom: 1px solid var(--border); }
.b-row .ch { display: block; margin-bottom: .75rem; color: var(--accent); }
.b-row .q { font-family: Outfit, sans-serif; font-weight: 300; font-size: clamp(1.625rem, 3vw, 2.625rem); line-height: 1.1; letter-spacing: -.025em; text-wrap: balance; }
.b-row .look { margin-top: 1rem; font-size: .875rem; line-height: 1.6; color: var(--muted); }
.b-row .look b { font-weight: 500; color: var(--fg); }
.b-back li { display: grid; grid-template-columns: 1.25rem 1fr; padding: .7rem 0; border-top: 1px solid var(--border); font-size: 1rem; line-height: 1.5; }
.b-back li:last-child { border-bottom: 1px solid var(--border); }
.b-back li::before { content: "→"; color: var(--accent); }
[dir="rtl"] .b-back li::before { content: "←"; }
@media (min-width: 1024px) { .b-back { padding-top: .4rem; } }

/* ── C · the report's contents page ── */
.c-layout { display: grid; gap: 3rem; }
@media (min-width: 1100px) { .c-layout { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 4.5rem; align-items: start; } }
.c-side p + p { margin-top: 1rem; }
.c-side .big { font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-weight: 300; font-size: clamp(1.5rem, 2.2vw, 2rem); line-height: 1.25; color: var(--fg); }
[dir="rtl"] .c-side .big { font-family: Vazirmatn, sans-serif; font-style: normal; font-weight: 500; line-height: 1.55; }
.sheet { background: var(--sheet); border: 1px solid var(--border-strong); border-radius: var(--panel-md); padding: clamp(1.5rem, 4vw, 3.5rem); box-shadow: 0 1px 0 var(--border), 0 30px 60px -40px hsl(0 0% 0% / .25); }
.sheet-top { display: flex; justify-content: space-between; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 2px solid var(--fg); }
.sheet-title { font-family: Outfit, sans-serif; font-size: clamp(1.5rem, 2.4vw, 2rem); font-weight: 400; letter-spacing: -.02em; margin-top: 1.75rem; }
.chap { position: relative; display: grid; gap: .75rem 2rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
@media (min-width: 760px) { .chap { grid-template-columns: 2.5rem minmax(0, 1fr) minmax(0, 13rem); } }
.chap::before { content: ""; position: absolute; inset-inline-start: calc(-1 * clamp(1.5rem, 4vw, 3.5rem)); inset-block: 1.5rem; width: 3px; border-radius: 3px; background: var(--accent); transform: scaleY(0); transition: transform .35s var(--ease-strong); }
.chap:hover::before, .chap:focus-within::before { transform: scaleY(1); }
.chap .n { font-family: Outfit, sans-serif; font-size: 1.25rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.chap h3 { font-size: clamp(1.25rem, 1.9vw, 1.625rem); line-height: 1.2; letter-spacing: -.015em; font-weight: 400; text-wrap: balance; }
.chap .sub { margin-top: .9rem; display: grid; gap: .4rem; }
.chap .sub li { display: grid; grid-template-columns: 2.75rem 1fr; font-size: .9375rem; line-height: 1.5; color: var(--fg); }
.chap .sub li span { color: var(--muted); font-variant-numeric: tabular-nums; }
.chap .margin { font-size: .8125rem; line-height: 1.55; color: var(--muted); }
@media (min-width: 760px) { .chap .margin { border-inline-start: 1px solid var(--border); padding-inline-start: 1rem; } }
.chap .margin .lbl { display: block; margin-bottom: .4rem; }
.sheet-foot { margin-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem 2rem; font-size: .8125rem; color: var(--muted); }
</style>
</head>
<body>

<div class="bar" dir="ltr">
  <div class="seg" id="opt">
    <button data-v="a" aria-pressed="true">A · The question, set large</button>
    <button data-v="b" aria-pressed="false">B · Question ledger</button>
    <button data-v="c" aria-pressed="false">C · The report's contents</button>
  </div>
  <div style="display:flex;gap:8px">
    <div class="seg" id="lang"><button data-v="en" aria-pressed="true">EN</button><button data-v="ar" aria-pressed="false">AR</button></div>

<details class="note" open>

<main class="scene"><div class="wrap" id="root"></div></main>

const COPY = {

      ownership: ["إجابة مكتوبة عمّن يملك ماذا", "كل ما ينقص كي تنقل النظام إلى جهة أخرى"],
    },
  },
};
const NOTES = {
  a: "<b>Idea:</b> the six channels become the six questions an owner already asks. Small index on one side, the chosen question set at display size on the other (TFTL services, SIT-001), what comes back numbered in cyan, what we look at demoted to a quiet two-column list. Hover/focus/click switches. No card, no pin; mobile shows all six stacked.",
  b: "<b>Idea:</b> no interaction at all — a ledger where every question is visible at once, with what comes back beside it. Reads like the review's own scope sheet. Calmest, most scannable; weakest motion moment.",
  c: "<b>Idea:</b> the thing you buy is a document, so the section shows its contents page: six chapters, each titled by the question, sub-entries = what comes back, margin = what we look at. The one box on the page is spent here because the content IS a document (consulting rule). No page numbers — nothing invented.",
};
const state = { v: "a", lang: "en", theme: "light", on: 0 };
const digits = (s, lang) => lang === "ar" ? String(s).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(s);
const pad = (n, lang) => digits(String(n).padStart(2, "0"), lang);

function heading(c) {
  return `<header class="head rv">
    <p class="eyebrow">${c.eyebrow}</p>
    <h2 class="title">${c.t1} <span class="acc">${c.t2}</span></h2>
    <p class="desc">${c.desc}</p>
  </header>`;
}
const honesty = c => `<p class="honesty rv">${c.honesty}</p>`;

function aStage(c, i, lang) {
  const id = IDS[i];
  return `<p class="lbl" style="margin-bottom:1.25rem">${c.chLabel} ${pad(i + 1, lang)} · ${c.names[id]}</p>
    <p class="a-q">${c.q[id]}</p>
    <div class="a-back"><p class="lbl" style="padding:1rem 0 .25rem">${c.backLabel}</p>
      <ol>${c.returns[id].map((r, k) => `<li><span class="num mono">${pad(k + 1, lang)}</span>${r}</li>`).join("")}</ol></div>
    <div class="a-look"><p class="lbl">${c.lookLabel}</p><ul>${c.examines[id].map(e => `<li>${e}</li>`).join("")}</ul></div>`;
}
function renderA(c, lang) {
  const arrow = lang === "ar" ? "←" : "→";
  return heading(c) + `
  <div class="a-grid rv">
    <ol class="a-index" role="tablist" aria-orientation="vertical">${IDS.map((id, i) => `
      <li><button class="a-tab" role="tab" aria-selected="${i === state.on}" data-i="${i}">
        <span class="num mono">${pad(i + 1, lang)}</span><span class="nm">${c.names[id]}</span><span class="go">${arrow}</span>
      </button></li>`).join("")}</ol>
    <div class="a-stage" role="tabpanel" aria-live="polite"><div id="a-stage">${aStage(c, state.on, lang)}</div></div>
  </div>
  <div class="a-mobile">${IDS.map((id, i) => `<div class="rv" style="padding:2.5rem 0;border-top:1px solid var(--border-strong)">${aStage(c, i, lang)}</div>`).join("")}</div>` + honesty(c);
}

function renderB(c, lang) {
  return heading(c) + `
  <div class="b-head rv"><p class="lbl">${c.qLabel}</p><p class="lbl">${c.backLabel}</p></div>
  <ol>${IDS.map((id, i) => `
    <li class="b-row rv" style="--i:${i}">
      <span class="num mono">${pad(i + 1, lang)}</span>
      <div>
        <span class="lbl ch">${c.names[id]}</span>
        <h3 class="q">${c.q[id]}</h3>
        <p class="look"><b>${c.lookLabel}:</b> ${c.examines[id].join(lang === "ar" ? "، " : " · ")}</p>
      </div>
      <ul class="b-back">${c.returns[id].map(r => `<li>${r}</li>`).join("")}</ul>
    </li>`).join("")}</ol>` + honesty(c);
}

function renderC(c, lang) {
  return heading(c) + `
  <div class="c-layout">
    <div class="c-side rv">
      <p class="big">${c.sideBig}</p>
      <p class="desc" style="font-size:1rem">${c.sideBody}</p>
    </div>
    <article class="sheet rv" aria-label="${c.sheetKicker} — ${c.sheetTitle}">
      <div class="sheet-top"><span class="lbl">${c.sheetKicker}</span><span class="lbl">${c.sheetMeta}</span></div>
      <h3 class="sheet-title">${c.sheetTitle}</h3>
      <ol style="margin-top:.75rem">${IDS.map((id, i) => `
        <li class="chap rv" style="--i:${i}" tabindex="0">
          <span class="n">${digits(i + 1, lang)}</span>
          <div>
            <p class="lbl" style="margin-bottom:.35rem">${c.names[id]}</p>
            <h3>${c.q[id]}</h3>
            <ol class="sub">${c.returns[id].map((r, k) => `<li><span>${digits(`${i + 1}.${k + 1}`, lang)}</span>${r}</li>`).join("")}</ol>
          </div>
          <aside class="margin"><span class="lbl">${c.lookLabel}</span>${c.examines[id].join("<br>")}</aside>
        </li>`).join("")}</ol>
      <div class="sheet-foot"><span>${c.sheetFoot1}</span><span>${c.sheetFoot2}</span></div>
    </article>
  </div>` + honesty(c);
}

let io;
function render() {
  const c = COPY[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = state.theme;
  document.getElementById("stub-top").textContent = c.stubTop;
  document.getElementById("stub-bot").textContent = c.stubBot;
  document.getElementById("root").innerHTML = { a: renderA, b: renderB, c: renderC }[state.v](c, state.lang);
  document.getElementById("note-title").textContent = document.querySelector(`#opt [data-v="${state.v}"]`).textContent;
  document.getElementById("note-body").innerHTML = NOTES[state.v];
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -15% 0px" });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
  const fine = matchMedia("(hover: hover)").matches;
  document.querySelectorAll(".a-tab").forEach(b => {
    const pick = () => selectA(+b.dataset.i);
    b.addEventListener("click", pick);
    b.addEventListener("focus", pick);
    if (fine) b.addEventListener("mouseenter", pick);
  });
}
function selectA(i) {
  if (i === state.on) return;
  state.on = i;
  document.querySelectorAll(".a-tab").forEach(t => t.setAttribute("aria-selected", +t.dataset.i === i));
  const s = document.getElementById("a-stage");
  s.innerHTML = aStage(COPY[state.lang], i, state.lang);
  s.classList.remove("swap"); void s.offsetWidth; s.classList.add("swap");
}
function seg(id, key) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    state[key] = b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    const y = scrollY; render(); scrollTo(0, y);
  }));
}
seg("opt", "v"); seg("lang", "lang"); seg("theme", "theme");
render();
</script>
</body>
</html>
