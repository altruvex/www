<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Process page — prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* Values mirror apps/www: bg-background, .accent-world-green (globals.css:309/316/416/424),
   --brand (packages/ui tokens.css:145), lib/motion eases. Phase lengths come from
   lib/process-phases.ts processPhases({min: 2, max: 8}) — the price matrix's delivery window.
   Copy is messages/{en,ar}/process.json; strings marked NEW below do not exist yet. */
:root {
  --bg: hsl(0 0% 99%);
  --surface: hsl(0 0% 96.5%);
  --fg: hsl(0 0% 6%);
  --muted: hsl(0 0% 38%);
  --border: hsl(0 0% 6% / 0.1);
  --border-strong: hsl(0 0% 6% / 0.2);
  --accent: hsl(158 64% 30%);
  --accent-soft: hsl(158 64% 30% / 0.08);
  --grad: linear-gradient(90deg, hsl(162 70% 34%), hsl(152 62% 38%), hsl(168 72% 36%));
  --brand: hsl(214 89% 48%);
  --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --section-y: clamp(6rem, 11vw, 10rem);
}
html[data-theme="dark"] {
  --bg: hsl(0 0% 7%);
  --surface: hsl(0 0% 9.5%);
  --fg: hsl(0 0% 95%);
  --muted: hsl(0 0% 62%);
  --border: hsl(0 0% 100% / 0.09);
  --border-strong: hsl(0 0% 100% / 0.18);
  --accent: hsl(158 36% 49%);
  --accent-soft: hsl(158 36% 49% / 0.1);
  --grad: linear-gradient(90deg, hsl(156 54% 52%), hsl(148 46% 54%), hsl(170 58% 50%));
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow-x: clip; }
[dir="rtl"] body { font-family: Vazirmatn, Inter, sans-serif; }
h1, h2, h3 { font-family: Outfit, sans-serif; margin: 0; font-weight: 300; }
[dir="rtl"] :is(h1, h2, h3, .display) { font-family: Vazirmatn, Outfit, sans-serif; letter-spacing: 0 !important; line-height: 1.35 !important; }
p, ul, ol { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 84rem; margin: 0 auto; padding-inline: clamp(1.25rem, 4vw, 3rem); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: .8125rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .eyebrow { font-family: Vazirmatn, sans-serif; letter-spacing: 0; font-size: .875rem; }
.mono { font-family: "Geist Mono", monospace; font-variant-numeric: tabular-nums; }
[dir="rtl"] .mono { font-family: Vazirmatn, sans-serif; }
.muted { color: var(--muted); }
/* Highlight tone=world: serif italic in EN, bold sans in AR (hero-section rule). */
.hl { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-inline-end: .06em; }
[dir="rtl"] .hl { font-family: Vazirmatn, sans-serif; font-style: normal; font-weight: 700; }
.rv { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease-smooth), transform .8s var(--ease-smooth); transition-delay: calc(var(--i, 0) * 80ms); }
.rv.in { opacity: 1; transform: none; }

/* ── prototype chrome ── */
.bar { position: fixed; inset-block-start: 12px; inset-inline: 12px; z-index: 60; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
.bar > * { pointer-events: auto; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: hsl(0 0% 12% / .85); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); }
.seg button { padding: 7px 12px; border-radius: 9px; color: hsl(0 0% 80%); font: 500 13px/1 Inter, sans-serif; }
.seg button[aria-pressed="true"] { background: #fff; color: hsl(0 0% 8%); }
.note { position: fixed; inset-block-end: 12px; inset-inline-start: 12px; z-index: 60; max-width: 28rem; padding: 12px 14px; border-radius: 12px; background: hsl(0 0% 12% / .92); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); color: hsl(0 0% 82%); font: 400 12.5px/1.5 Inter, sans-serif; direction: ltr; text-align: left; }
.note summary { cursor: pointer; color: #fff; font-weight: 500; }
.note b { color: #fff; font-weight: 500; }

/* ── shared hero + close ── */
.hero { padding-block: clamp(9rem, 16vw, 13rem) clamp(4rem, 7vw, 6rem); }
.hero-grid { display: grid; gap: 2rem 4rem; align-items: end; }
@media (min-width: 1024px) { .hero-grid { grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); } }
.h1 { font-size: clamp(3rem, 8.4vw, 8rem); line-height: .98; letter-spacing: -.045em; }
.h1 span { display: block; }
.lede { font-size: clamp(1.0625rem, 1.2vw, 1.1875rem); line-height: 1.65; color: var(--muted); max-width: 26rem; }
.close { padding-block: var(--section-y); border-top: 1px solid var(--border); }
.close h2 { font-size: clamp(2.5rem, 6vw, 5.5rem); line-height: 1; letter-spacing: -.04em; }
.close h2 span { display: block; }
.close-grid { display: grid; gap: 3rem 4rem; margin-top: 3rem; }
@media (min-width: 1024px) { .close-grid { grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); align-items: end; } }
.close p.body { font-size: 1.0625rem; line-height: 1.7; color: var(--muted); max-width: 34rem; }
.close p.body strong { color: var(--fg); font-weight: 500; }
.ctas { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; height: 3rem; padding-inline: 1.35rem; border-radius: 10px; font-weight: 500; font-size: .9375rem; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.ghost { border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent); }
.starts { border-top: 1px solid var(--border); padding-top: 1.5rem; }
.starts .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: .9rem; }
.starts .name { font: 400 clamp(1.5rem, 2.4vw, 2rem)/1.2 Outfit, sans-serif; letter-spacing: -.02em; }
[dir="rtl"] .starts .name { font-family: Vazirmatn, sans-serif; letter-spacing: 0; }
.starts p { margin-top: .6rem; font-size: .9375rem; line-height: 1.6; color: var(--muted); max-width: 32rem; }

/* ══ A · Chapters ══ */
.a-band { position: relative; margin-inline: 12px; border-radius: 28px; overflow: hidden; aspect-ratio: 21 / 8; min-height: 16rem; background: #0b1a14; }
.a-band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: hue-rotate(-62deg) saturate(.8) brightness(.85); transform: scale(1.08); transition: transform 1.6s var(--ease-strong); }
.a-band.in img { transform: none; }
.a-band figcaption { position: absolute; inset-block-end: clamp(1.25rem, 3vw, 2.5rem); inset-inline: clamp(1.25rem, 4vw, 3rem); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; color: hsl(0 0% 100% / .88); }
.a-band figcaption .eyebrow { color: hsl(0 0% 100% / .78); }
.a-index { display: grid; border-top: 1px solid var(--border-strong); margin-top: var(--section-y); }
.a-index a { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 1rem; align-items: baseline; padding: 1.1rem 0; border-bottom: 1px solid var(--border); transition: color .3s; }
.a-index a:hover { color: var(--accent); }
.a-index .n { font-size: .8125rem; color: var(--muted); }
.a-index .t { font: 300 clamp(1.375rem, 2.2vw, 1.875rem)/1.2 Outfit, sans-serif; letter-spacing: -.02em; }
[dir="rtl"] .a-index .t { font-family: Vazirmatn, sans-serif; letter-spacing: 0; }
.a-index .l { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.a-chapters { position: relative; margin-top: var(--section-y); }
.a-rail { display: none; }
@media (min-width: 1024px) {
  .a-chapters { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 4rem; }
  .a-rail { display: block; position: sticky; top: 40vh; align-self: start; }
  .a-rail li { display: flex; gap: .75rem; padding: .35rem 0; font-size: .875rem; color: var(--muted); transition: color .35s; }
  .a-rail li.on { color: var(--fg); }
  .a-rail li .mono { font-size: .75rem; width: 1.5rem; }
  .a-rail li.on .mono { color: var(--accent); }
}
.a-ch { min-height: 92svh; display: grid; align-content: space-between; gap: 3rem; padding-block: 3rem; border-top: 1px solid var(--border); }
.a-ch .top { display: flex; justify-content: space-between; gap: 1rem; }
.a-ch h3 { font-size: clamp(3.25rem, 10vw, 9.5rem); line-height: .92; letter-spacing: -.05em; margin-top: 1.5rem; }
.a-ch .say { font: 300 clamp(1.5rem, 3vw, 2.75rem)/1.15 Outfit, sans-serif; letter-spacing: -.025em; max-width: 22ch; margin-top: 2rem; text-wrap: balance; }
[dir="rtl"] .a-ch .say { font-family: Vazirmatn, sans-serif; letter-spacing: 0; line-height: 1.45; }
.a-ch .say .w { color: var(--border-strong); transition: color .5s var(--ease-smooth); }
.a-ch .say .w.lit { color: var(--fg); }
.a-foot { display: grid; gap: 1.5rem 3rem; }
@media (min-width: 900px) { .a-foot { grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); align-items: end; } }
.a-foot p { font-size: 1.0625rem; line-height: 1.7; color: var(--muted); max-width: 38rem; }
.a-foot .dl { font-size: .9375rem; line-height: 1.8; }
.a-gate { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
.a-gate i { width: 2rem; height: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .9s var(--ease-strong) .2s; }
[dir="rtl"] .a-gate i { transform-origin: right; }
.in .a-gate i, .a-gate.in i { transform: none; }
.a-gate .eyebrow { color: var(--accent); }
.a-scope { margin-top: var(--section-y); padding-block: var(--section-y); border-top: 1px solid var(--border); }
.a-scope h2 { font-size: clamp(2.25rem, 5vw, 4.25rem); line-height: 1.02; letter-spacing: -.035em; max-width: 18ch; }
.a-scope h2 span { display: block; }
.a-bars { margin-top: 4rem; display: grid; gap: 2.25rem; }
.a-bar .lbl { display: flex; justify-content: space-between; gap: 1rem; font-size: .9375rem; margin-bottom: .75rem; }
.a-bar .lbl b { font-weight: 500; font-variant-numeric: tabular-nums; }
.a-track { display: flex; gap: 6px; height: 14px; }
.a-track span { flex-grow: 0; flex-basis: 0; min-width: 0; border-radius: 999px; background: color-mix(in srgb, var(--fg) 20%, transparent); transition: flex-grow 1.2s var(--ease-strong); }
.a-track span.b { background: var(--accent); }
.in .a-track span { flex-grow: var(--g); }
.a-keys { display: flex; gap: 6px; margin-top: .6rem; font-size: .75rem; color: var(--muted); }
.a-keys span { flex: var(--g) 0 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: clip; }
.a-scope .fine { margin-top: 3rem; font-size: .9375rem; line-height: 1.65; color: var(--muted); max-width: 44rem; }

/* ══ B · Your part ══ */
.b-hero .h1 { font-size: clamp(3.25rem, 11vw, 11rem); }
.b-bar { position: sticky; top: 52px; /* below the prototype chrome; top: 0 under the site nav in the real build */ z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-block: 1px solid var(--border); }
.b-bar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 2rem; padding-block: .8rem; padding-top: 3.9rem; }
@media (min-width: 900px) { .b-bar .wrap { padding-top: .8rem; } }
.b-stat { display: flex; gap: 2rem; font-size: .875rem; color: var(--muted); }
.b-stat b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.b-stat .fixed b { color: var(--accent); }
.b-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent); }
.b-seg button { padding: 7px 12px; border-radius: 7px; font-size: .8125rem; color: var(--muted); }
.b-seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.b-seq { padding-block: clamp(3rem, 6vw, 5rem) var(--section-y); }
.b-phase { display: grid; gap: 1rem 3rem; padding-block: clamp(2.5rem, 5vw, 4rem); transition: color .6s var(--ease-smooth); color: var(--muted); }
.b-phase.open { color: var(--fg); }
@media (min-width: 1024px) { .b-phase { grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) minmax(0, 3fr); } }
.b-phase .n { font-size: .8125rem; color: var(--muted); }
.b-phase.open .n { color: var(--accent); }
.b-phase h3 { font-size: clamp(2rem, 3.6vw, 3.25rem); line-height: 1; letter-spacing: -.035em; margin-top: .6rem; }
.b-phase .len { margin-top: .75rem; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.b-phase .len b { font-weight: 500; display: inline-block; transition: transform .5s var(--ease-strong), opacity .3s; }
.b-phase .len b.tick { transform: translateY(-6px); opacity: 0; }
.b-phase p.d { font-size: 1.0625rem; line-height: 1.7; max-width: 40rem; }
.b-phase ul { font-size: .9375rem; line-height: 1.9; }
.b-gate { position: relative; display: grid; gap: .25rem 2rem; align-items: center; padding-block: clamp(1.75rem, 3.5vw, 2.75rem); }
@media (min-width: 1024px) { .b-gate { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); } }
.b-gate::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 2px; background: var(--border-strong); }
.b-gate .line { position: absolute; inset-inline-start: 0; top: 0; height: 2px; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--p, 0)); }
[dir="rtl"] .b-gate .line { transform-origin: right; }
.b-gate .who { font-size: .875rem; color: var(--muted); }
.b-gate .verb { font-size: clamp(2.75rem, 7vw, 6rem); line-height: 1.05; letter-spacing: -.03em; }
.b-gate .then { font-size: 1.0625rem; color: var(--muted); }
.b-gate .then b { color: var(--fg); font-weight: 500; }
.b-gate .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 2rem; }

/* ══ C · What you hold ══ */
.c-body { display: grid; gap: 3rem; padding-bottom: var(--section-y); }
@media (min-width: 1024px) { .c-body { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 5rem; } }
.c-phase { min-height: 78svh; padding-block: 3rem; border-top: 1px solid var(--border); display: grid; align-content: start; gap: 1.25rem; }
.c-phase .top { display: flex; justify-content: space-between; gap: 1rem; font-size: .875rem; color: var(--muted); }
.c-phase .top .mono { color: var(--accent); }
.c-phase h3 { font-size: clamp(2.5rem, 5.5vw, 5rem); line-height: .98; letter-spacing: -.045em; }
.c-phase .say { font: 300 clamp(1.25rem, 2vw, 1.625rem)/1.3 Outfit, sans-serif; letter-spacing: -.015em; max-width: 26ch; text-wrap: balance; }
[dir="rtl"] .c-phase .say { font-family: Vazirmatn, sans-serif; letter-spacing: 0; line-height: 1.5; }
.c-phase p.d { font-size: 1.0625rem; line-height: 1.7; color: var(--muted); max-width: 36rem; }
.c-phase .role { display: inline-flex; gap: .6rem; align-items: center; font-size: .9375rem; }
.c-phase .role i { width: 1.5rem; height: 2px; background: var(--accent); }
.c-hold { position: sticky; top: 14vh; align-self: start; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); padding: clamp(1.5rem, 2.5vw, 2rem); }
.c-hold header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.c-hold .count { font: 300 clamp(2.5rem, 4vw, 3.5rem)/1 Outfit, sans-serif; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
[dir="rtl"] .c-hold .count { font-family: Vazirmatn, sans-serif; letter-spacing: 0; }
.c-hold .count small { font-size: .35em; color: var(--muted); letter-spacing: 0; margin-inline-start: .35rem; }
.c-group { padding-block: .9rem; border-bottom: 1px solid var(--border); display: none; }
.c-group.shown { display: block; animation: drop .6s var(--ease-strong); }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.c-group .g { font-size: .75rem; color: var(--muted); }
.c-group ul { margin-top: .35rem; font-size: .9375rem; line-height: 1.75; }
.c-group.latest .g { color: var(--accent); }
.c-empty { padding-block: 1.25rem; font-size: .9375rem; color: var(--muted); }
.c-final { padding-top: 1.1rem; font: 400 1.25rem/1.3 Outfit, sans-serif; display: none; }
[dir="rtl"] .c-final { font-family: Vazirmatn, sans-serif; }
.c-final.shown { display: block; animation: drop .6s var(--ease-strong); }
.c-hold .days { margin-top: 1rem; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 1023px) {
  .c-hold { position: sticky; top: auto; bottom: 12px; order: 2; padding: 1rem 1.1rem; border-radius: 14px; box-shadow: 0 10px 30px hsl(0 0% 0% / .12); }
  .c-hold .c-group:not(.latest), .c-hold .days, .c-empty { display: none !important; }
  .c-hold .count { font-size: 1.75rem; }
  .c-body { display: flex; flex-direction: column; }
  .c-list { order: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .rv, .a-band img, .a-gate i, .a-track span, .b-phase, .c-group, .c-final { transition: none !important; animation: none !important; opacity: 1 !important; transform: none !important; }
  .a-ch .say .w { color: var(--fg) !important; }
}
</style>
</head>
<body>

<div class="bar" dir="ltr">
  <div class="seg" id="opt">
    <button data-v="a" aria-pressed="true">A · Chapters</button>
    <button data-v="b" aria-pressed="false">B · Your part</button>
    <button data-v="c" aria-pressed="false">C · What you hold</button>
  </div>
  <div style="display:flex;gap:8px">
    <div class="seg" id="lang"><button data-v="en" aria-pressed="true">EN</button><button data-v="ar" aria-pressed="false">AR</button></div>
    <div class="seg" id="theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark" aria-pressed="false">Dark</button></div>
  </div>
</div>

<details class="note">
  <summary id="note-title"></summary>
  <div id="note-body" style="margin-top:6px"></div>
</details>

<main id="root"></main>

<script>
/* processPhases({ min: 2, max: 8 }) — FIXED bounds + development takes the remainder. */
const PHASES = [
  { key: "discovery", min: 1, max: 1, unit: "session" },
  { key: "wireframe", min: 2, max: 5, unit: "days" },
  { key: "design", min: 2, max: 7, unit: "days" },
  { key: "development", min: 3, max: 22, unit: "days" },
  { key: "launch", min: 2, max: 5, unit: "days" },
];
const CEILING = 12; // MAX_DELIVERY_WEEKS

const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
function arDays(n) { if (n === 1) return "يوم واحد"; if (n === 2) return "يومان"; if (n <= 10) return `${ar(n)} أيام`; return `${ar(n)} يومًا`; }
const COPY = {
  en: {
    eyebrow: "10 - Our Process", title: "How we work.", titleItalic: "every time.",
    description: "A framework, not a formula. Every engagement follows the same backbone - calibrated to what the scope actually demands.",
    phases: {
      discovery: { title: "Discovery", headline: "Understand the problem before proposing a solution.", description: "We listen before we build. 60 minutes. No sales pitch - only the questions that surface the real constraints.", deliverables: "Requirements summary | Technical audit | Project roadmap", role: "Share" },
      wireframe: { title: "Wireframe", headline: "Define the system before the interface.", description: "You approve the architecture before any visual work begins. No downstream surprises.", deliverables: "Sitemap | Page structure | Key flows", role: "Approve" },
      design: { title: "Design", headline: "Agree on the whole design before a line of code.", description: "You review the full design system before a single line of code is written. Revisions are within scope.", deliverables: "Visual mockups | Responsive layouts | Brand alignment", role: "Review" },
      development: { title: "Development", headline: "Build the system behind the idea.", description: "We build. You track live progress via a staging link. No black boxes.", deliverables: "Working system | Live preview link | Weekly updates", role: "Review" },
      launch: { title: "Launch", headline: "Turn the system into something ready to operate.", description: "You receive everything: source code, hosting setup, full documentation. Zero lock-in.", deliverables: "Source code | Hosting setup | Documentation", role: "Launch" },
    },
    yourRole: "Your role", deliverables: "Deliverables",
    gateNext: n => `Then ${n} starts.`, gateLast: "Then the system is yours.",
    session: "1 session", days: n => `${n} ${n === 1 ? "day" : "days"}`,
    range: (a, b) => `${a} – ${b} days`,
    stripLabel: "One engagement, in working days", smallest: "Smallest scope", largest: "Largest scope",
    total: n => `${n} working days`,
    scopeTitle: "Scope stretches the phases.", scopeItalic: "It never skips one.", // NEW
    note: `Scope stretches every phase after discovery - development most. It never adds a phase, reorders one, or skips a sign-off. Both ends come from our published price ranges; a flexible deadline or content written from scratch can stretch a quote to ${CEILING} weeks, never further. Discovery counts as one day.`,
    closeTitle: "The process serves", closeItalic: "the project.",
    closeBody: "These phases are a framework, not a rigid contract. Some projects need deeper discovery. Others need to ship fast. We adjust the intensity - <strong>never the discipline.</strong>",
    startsHere: "Your project starts here", primary: "Discuss your requirements", secondary: "Estimate your project",
    // NEW strings
    photoCaption: "Five phases · one owner · no skipped sign-off",
    bScope: "Scope", bLength: "From the first call to launch", bGates: "Sign-offs", bGatesVal: "5, at any scope",
    bYour: "Your part",
    holdTitle: "In your hands", holdOf: n => `of ${n}`, holdEmpty: "Nothing yet. Discovery is a conversation - the first things you hold come out of it.",
    holdDays: (a, b) => `Working days so far: ${a} – ${b}`,
    stubClose: "",
  },
  ar: {
    eyebrow: "١٠ - منهجية العمل", title: "كيف نعمل.", titleItalic: "في كل مرة.",
    description: "إطار عمل، لا وصفة جاهزة. كل مشروع يسير على نفس التصميم الأساسي - معدّل حسب متطلبات النطاق الفعلي.",
    phases: {
      discovery: { title: "الاستكشاف", headline: "نفهم المشكلة قبل أن نقترح أي حل.", description: "نستمع قبل أن نبني. ٦٠ دقيقة. لا عروض ترويجية - فقط الأسئلة التي تكشف القيود الحقيقية.", deliverables: "ملخص المتطلبات | مراجعة تقني | خارطة طريق المشروع", role: "شارك" },
      wireframe: { title: "التصميم الأولي", headline: "نُعرّف النظام قبل الواجهة.", description: "تعتمد البنية قبل أي عمل بصري. لا مفاجآت في مراحل لاحقة.", deliverables: "خريطة الموقع | تصميم الصفحات | المسارات الرئيسية", role: "اعتمد" },
      design: { title: "التصميم", headline: "نتفق على التصميم كاملًا قبل سطر كود واحد.", description: "تراجع نظام التصميم الكامل قبل كتابة سطر كود واحد. المراجعات ضمن النطاق.", deliverables: "النماذج البصرية | التخطيطات المتجاوبة | توافق الهوية البصرية", role: "راجع" },
      development: { title: "التطوير", headline: "نبني النظام خلف الفكرة.", description: "نبني. تتابع التقدم مباشرة عبر رابط بيئة الاختبار. لا صناديق مظلمة.", deliverables: "نظام عامل | رابط معاينة حي | تحديثات أسبوعية", role: "راجع" },
      launch: { title: "الإطلاق", headline: "نُجهّز النظام ليعمل فعليًا.", description: "تستلم كل شيء: كود المصدر، إعداد الاستضافة، توثيق كامل. صفر تبعية.", deliverables: "كود المصدر | إعداد الاستضافة | التوثيق", role: "أطلق" },
    },
    yourRole: "دورك", deliverables: "المخرجات",
    gateNext: n => `ثم تبدأ مرحلة ${n}.`, gateLast: "ثم يصبح النظام ملكك.",
    session: "جلسة واحدة", days: n => arDays(n),
    range: (a, b) => `${a} – ${b} يوم`,
    stripLabel: "مشروع واحد، بأيام العمل", smallest: "أصغر نطاق", largest: "أكبر نطاق",
    total: n => `${n} يوم عمل`,
    scopeTitle: "النطاق يمدّ المراحل.", scopeItalic: "ولا يتخطى أيًا منها.",
    note: `النطاق يمدّ كل مرحلة بعد الاستكشاف - والتطوير أكثرها. لا يضيف مرحلة، ولا يغيّر ترتيبها، ولا يتخطى اعتمادًا. الطرفان من نطاقات أسعارنا المنشورة، والموعد المرن أو كتابة المحتوى من الصفر قد يمدّ عرض السعر حتى ${ar(CEILING)} أسبوعاً، لا أكثر. الاستكشاف يُحسب يومًا واحدًا.`,
    closeTitle: "المنهجية في خدمة", closeItalic: "المشروع.",
    closeBody: "هذه المراحل إطار عمل لا عقد صارم. بعض المشاريع تحتاج استكشافاً أعمق. وبعضها يحتاج إطلاقاً سريعاً. نضبط كثافة المراحل - <strong>لا نتنازل عن الانضباط.</strong>",
    startsHere: "مشروعك يبدأ من هنا", primary: "ناقش متطلباتك معنا", secondary: "قدّر مشروعك",
    photoCaption: "خمس مراحل · مسؤول واحد · لا اعتماد يُتخطّى",
    bScope: "النطاق", bLength: "من أول مكالمة حتى الإطلاق", bGates: "الاعتمادات", bGatesVal: "٥، في أي نطاق",
    bYour: "دورك",
    holdTitle: "بين يديك", holdOf: n => `من ${n}`, holdEmpty: "لا شيء بعد. الاستكشاف محادثة - وأول ما تستلمه يخرج منها.",
    holdDays: (a, b) => `أيام العمل حتى الآن: ${a} – ${b}`,
  },
};

const state = { v: "a", lang: "en", theme: "light", scope: "max" };
const num = (n) => state.lang === "ar" ? ar(n) : String(n);
const idx = (i) => num(String(i + 1).padStart(2, "0"));
const len = (c, p, which) => p.unit === "session" ? c.session : (which ? c.days(p[which]) : (p.min === p.max ? c.days(p.min) : c.range(num(p.min), num(p.max))));
const items = (c, p) => c.phases[p.key].deliverables.split(" | ");
const sum = (k) => PHASES.reduce((s, p) => s + p[k], 0);

function hero(c, extra = "") {
  return `<section class="hero ${extra}"><div class="wrap hero-grid">
    <div><p class="eyebrow rv">${c.eyebrow}</p>
    <h1 class="h1 rv" style="--i:1;margin-top:1.5rem"><span>${c.title}</span><span class="hl">${c.titleItalic}</span></h1></div>
    <p class="lede rv" style="--i:2">${c.description}</p>
  </div></section>`;
}
function close(c) {
  const first = PHASES[0];
  return `<section class="close"><div class="wrap">
    <h2 class="rv"><span>${c.closeTitle}</span><span class="hl">${c.closeItalic}</span></h2>
    <div class="close-grid">
      <div class="rv" style="--i:1"><p class="body">${c.closeBody}</p>
        <div class="ctas"><a class="btn primary" href="#">${c.primary} →</a><a class="btn ghost" href="#">${c.secondary}</a></div></div>
      <div class="starts rv" style="--i:2"><p class="eyebrow" style="color:var(--accent)">${c.startsHere}</p>
        <div class="row"><span class="name">${c.phases[first.key].title}</span><span class="muted">${len(c, first)}</span></div>
        <p>${c.phases[first.key].description}</p></div>
    </div></div></section>`;
}

/* ── A · Chapters ── */
function renderA(c) {
  const words = s => s.split(" ").map(w => `<span class="w">${w}</span>`).join(" ");
  return hero(c) + `
  <figure class="a-band rv" style="margin:0 12px"><img src="blue-folds.webp" alt="" />
    <figcaption><span class="eyebrow">${c.stripLabel}</span><span class="eyebrow">${c.photoCaption}</span></figcaption></figure>
  <div class="wrap">
    <nav class="a-index" aria-label="Phases">${PHASES.map((p, i) => `
      <a href="#ch-${p.key}" class="rv" style="--i:${i}"><span class="n mono">${idx(i)}</span><span class="t">${c.phases[p.key].title}</span><span class="l">${len(c, p)}</span></a>`).join("")}
    </nav>
    <div class="a-chapters">
      <ol class="a-rail" aria-hidden="true">${PHASES.map((p, i) => `<li data-k="${p.key}"><span class="mono">${idx(i)}</span>${c.phases[p.key].title}</li>`).join("")}</ol>
      <div>${PHASES.map((p, i) => {
        const ph = c.phases[p.key], next = PHASES[i + 1];
        return `<article class="a-ch" id="ch-${p.key}" data-k="${p.key}">
          <div><div class="top"><span class="mono" style="color:var(--accent)">${idx(i)}</span><span class="muted">${len(c, p)}</span></div>
            <h3>${ph.title}</h3>
            <p class="say">${words(ph.headline)}</p></div>
          <div class="a-foot">
            <p>${ph.description}</p>
            <div class="dl"><p class="eyebrow" style="margin-bottom:.5rem">${c.deliverables}</p>${items(c, p).join("<br>")}</div>
            <div class="a-gate rv"><i></i><span class="eyebrow">${c.yourRole} · ${ph.role}</span><span>${next ? c.gateNext(c.phases[next.key].title) : c.gateLast}</span></div>
          </div></article>`;
      }).join("")}</div>
    </div>
    <section class="a-scope">
      <h2 class="rv"><span>${c.scopeTitle}</span><span class="hl">${c.scopeItalic}</span></h2>
      <div class="a-bars rv" style="--i:1">${["min", "max"].map(k => `
        <div class="a-bar"><div class="lbl"><span>${k === "min" ? c.smallest : c.largest}</span><b>${c.total(num(sum(k)))}</b></div>
          <div class="a-track">${PHASES.map(p => `<span style="--g:${p[k]}" class="${p.key === "development" ? "b" : ""}"></span>`).join("")}</div>
          <div class="a-keys">${PHASES.map((p, i) => `<span style="--g:${p[k]}">${idx(i)}</span>`).join("")}</div></div>`).join("")}
      </div>
      <p class="fine rv" style="--i:2">${c.note}</p>
    </section>
  </div>` + close(c);
}

/* ── B · Your part ── */
function renderB(c) {
  const s = state.scope;
  return hero(c, "b-hero") + `
  <div class="b-bar"><div class="wrap">
    <div class="b-stat"><span>${c.bLength} · <b id="b-total">${c.total(num(sum(s)))}</b></span><span class="fixed">${c.bGates} · <b>${c.bGatesVal}</b></span></div>
    <div class="b-seg" role="group" aria-label="${c.bScope}">
      <button data-s="min" aria-pressed="${s === "min"}">${c.smallest}</button><button data-s="max" aria-pressed="${s === "max"}">${c.largest}</button></div>
  </div></div>
  <div class="wrap b-seq">${PHASES.map((p, i) => {
    const ph = c.phases[p.key], next = PHASES[i + 1];
    return `<section class="b-phase${i === 0 ? " open" : ""}" data-i="${i}">
        <div><span class="n mono">${idx(i)}</span><h3>${ph.title}</h3><p class="len"><b data-len="${i}">${len(c, p, s)}</b></p></div>
        <p class="d">${ph.description}</p>
        <ul>${items(c, p).map(x => `<li>${x}</li>`).join("")}</ul>
      </section>
      <div class="b-gate" data-g="${i}"><span class="line"></span>
        <span class="who">${c.bYour}</span>
        <div class="row"><span class="verb display hl">${ph.role}.</span><span class="then">${next ? c.gateNext(`<b>${c.phases[next.key].title}</b>`) : `<b>${c.gateLast}</b>`}</span></div>
      </div>`;
  }).join("")}
    <p class="muted" style="margin-top:3rem;max-width:44rem;line-height:1.65;font-size:.9375rem">${c.note}</p>
  </div>` + close(c);
}
function bindB() {
  document.querySelectorAll(".b-seg button").forEach(b => b.addEventListener("click", () => {
    state.scope = b.dataset.s;
    const c = COPY[state.lang];
    document.querySelectorAll(".b-seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.getElementById("b-total").textContent = c.total(num(sum(state.scope)));
    document.querySelectorAll("[data-len]").forEach(el => {
      const p = PHASES[+el.dataset.len];
      if (p.unit === "session") return;
      el.classList.add("tick");
      setTimeout(() => { el.textContent = len(c, p, state.scope); el.classList.remove("tick"); }, 180);
    });
  }));
}

/* ── C · What you hold ── */
function renderC(c) {
  const all = PHASES.reduce((s, p) => s + items(c, p).length, 0);
  return hero(c) + `
  <div class="wrap c-body">
    <div class="c-list">${PHASES.map((p, i) => {
      const ph = c.phases[p.key], next = PHASES[i + 1];
      return `<article class="c-phase" data-i="${i}">
        <div class="top"><span class="mono">${idx(i)}</span><span>${len(c, p)}</span></div>
        <h3>${ph.title}</h3>
        <p class="say">${ph.headline}</p>
        <p class="d">${ph.description}</p>
        <p class="role"><i></i><span class="eyebrow" style="color:var(--accent)">${c.yourRole} · ${ph.role}</span><span class="muted">${next ? c.gateNext(c.phases[next.key].title) : c.gateLast}</span></p>
      </article>`;
    }).join("")}</div>
    <aside class="c-hold" aria-live="polite">
      <header><span class="eyebrow">${c.holdTitle}</span><span class="count"><span id="c-count">${num(0)}</span><small>${c.holdOf(num(all))}</small></span></header>
      <p class="c-empty" id="c-empty">${c.holdEmpty}</p>
      ${PHASES.map((p, i) => `<div class="c-group" data-g="${i}"><p class="g mono">${idx(i)} · ${c.phases[p.key].title}</p><ul>${items(c, p).map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}
      <p class="c-final" id="c-final">${c.gateLast}</p>
      <p class="days" id="c-days"></p>
    </aside>
  </div>` + close(c);
}

/* ── scroll-linked states (one rAF'd handler; nothing idles) ── */
function onScroll() {
  const vh = innerHeight;
  if (state.v === "a") {
    let cur = null;
    document.querySelectorAll(".a-ch").forEach(ch => {
      const r = ch.getBoundingClientRect();
      if (r.top < vh * .5 && r.bottom > vh * .5) cur = ch.dataset.k;
      const ws = ch.querySelectorAll(".say .w");
      const p = Math.max(0, Math.min(1, (vh * .85 - r.top) / (vh * .5)));
      ws.forEach((w, i) => w.classList.toggle("lit", i < Math.round(p * ws.length)));
    });
    document.querySelectorAll(".a-rail li").forEach(li => li.classList.toggle("on", li.dataset.k === cur));
  }
  if (state.v === "b") {
    document.querySelectorAll(".b-gate").forEach(g => {
      const r = g.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, (vh * .8 - r.top) / (vh * .3)));
      g.style.setProperty("--p", p);
      const next = document.querySelector(`.b-phase[data-i="${+g.dataset.g + 1}"]`);
      if (next) next.classList.toggle("open", p >= 1);
    });
  }
  if (state.v === "c") {
    const c = COPY[state.lang];
    let done = -1;
    document.querySelectorAll(".c-phase").forEach(ph => { if (ph.getBoundingClientRect().top < vh * .45) done = +ph.dataset.i; });
    let n = 0, a = 0, b = 0;
    document.querySelectorAll(".c-group").forEach(g => {
      const i = +g.dataset.g, on = i <= done;
      if (on !== g.classList.contains("shown")) g.classList.toggle("shown", on);
      g.classList.toggle("latest", i === done);
      if (on) { n += items(c, PHASES[i]).length; a += PHASES[i].min; b += PHASES[i].max; }
    });
    document.getElementById("c-count").textContent = num(n);
    document.getElementById("c-empty").style.display = done < 0 ? "" : "none";
    document.getElementById("c-final").classList.toggle("shown", done === PHASES.length - 1);
    document.getElementById("c-days").textContent = done < 0 ? "" : c.holdDays(num(a), num(b));
  }
}
let raf = 0;
addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(onScroll); }, { passive: true });
addEventListener("resize", onScroll);

const NOTES = {
  a: `<b>Idea source:</b> Revelatio /approach (Awwwards SOTD 2026-08-12, SIT-247, checked live today) — a hairline index, then each phase as its own near-full-viewport chapter: one huge name, one line, body at the foot. <b>Mine:</b> the headline lights up word by word on scroll (the benchmark pages' "kinetic moments saved for scroll"); a CSS-sticky phase rail beside the chapters (sticky, not a pin — RUL-084); each chapter closes on its gate. Scope proof kept as two static bars, smallest vs largest. <b>Flag:</b> the photo is brand-blue <i>blue-folds</i> hue-shifted to the green world in CSS; RUL-118 wants it tinted to the page's world, so shipping needs a real green encode or a move to the blue world.`,
  b: `<b>Idea source:</b> open territory — the research found no award site that draws "no phase skips your sign-off" as a device, so this one is mine. The page alternates two voices: our phase (quiet), then <i>your part</i> as one verb at display size in the world serif-italic. Each gate's line draws as you scroll to it, and only then does the next phase come to full ink (colour, never opacity on display type). A sticky bar holds the scope switch: lengths change in place, "Sign-offs · 5" never does — the comparison lives inside the sequence instead of a separate strip. Outcome-first framing from Lineage's "4 Step Process" element (unverified live).`,
  c: `<b>Idea source:</b> The Designers Club "Design process" (Awwwards element, sticky step-by-step; not verified live) + accumulation as the proof shape (07 §2). Phases scroll on the start side; a CSS-sticky "In your hands" card on the end side collects each phase's deliverables as it passes, with a running count and working days so far, ending on "Then the system is yours." Claim: every phase ends with something you keep. On mobile the card becomes a bottom-docked counter. <b>Risk:</b> the only card on the page (edge role A); RUL-007 — check it reads without decoding.`,
};

function render() {
  const c = COPY[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = state.theme;
  document.getElementById("root").innerHTML = { a: renderA, b: renderB, c: renderC }[state.v](c);
  document.getElementById("note-title").textContent = document.querySelector(`#opt [data-v="${state.v}"]`).textContent;
  document.getElementById("note-body").innerHTML = NOTES[state.v];
  if (state.v === "b") bindB();
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".rv, .a-band").forEach(el => io.observe(el));
  onScroll();
}
function seg(id, key) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    state[key] = b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    const y = key === "v" ? 0 : scrollY; render(); scrollTo(0, y);
  }));
}
seg("opt", "v"); seg("lang", "lang"); seg("theme", "theme");
render();
</script>
</body>
</html>
