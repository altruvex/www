<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/services stage — round 2 · D / E / F</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Standalone prototype, round 2. House values mirrored from packages/ui/src/styles/tokens.css
   and apps/www/app/globals.css; not production code. The build reads the real tokens. */
:root{
  --bg:#fff;--fg:#1a1a1a;--muted:#666;--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.45);
  --brand-text:hsl(214 89% 42%);
  --w-violet:hsl(272 72% 55%);--w-blue:hsl(214 89% 42%);--w-cyan:hsl(194 88% 31%);--w-green:hsl(158 64% 30%);
  --serif:Georgia,"Times New Roman",serif;--mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--gutter:clamp(16px,4vw,56px);
}
html[data-theme="dark"]{
  --bg:#121212;--fg:#f0f0f0;--muted:#949494;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.45);
  --brand-text:hsl(214 95% 68%);
  --w-violet:hsl(268 88% 74%);--w-blue:hsl(214 95% 68%);--w-cyan:hsl(190 80% 44%);--w-green:hsl(158 36% 49%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:clip;line-height:1.6;padding-bottom:96px}
[dir="rtl"] body{font-family:Vazirmatn,Inter,sans-serif}
h1,h2,h3,.display{font-family:Outfit,sans-serif;font-weight:300;letter-spacing:-.035em;line-height:1.04}
[dir="rtl"] :is(h1,h2,h3,.display){font-family:Vazirmatn,sans-serif;letter-spacing:0!important;line-height:1.3}
em.acc{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--brand-text);letter-spacing:-.02em}
[dir="rtl"] em.acc{font-family:inherit;font-style:normal;font-weight:500}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .eyebrow{font-family:Vazirmatn,sans-serif;letter-spacing:0;font-size:14px}
.mono{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
[dir="rtl"] .mono{font-family:Vazirmatn,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:start}
img{display:block;max-width:100%}
ul,ol{list-style:none}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gutter)}
.w-violet{--acc:var(--w-violet)}.w-blue{--acc:var(--w-blue)}.w-cyan{--acc:var(--w-cyan)}.w-green{--acc:var(--w-green)}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:4px}

.hero{padding:clamp(120px,18vh,200px) 0 clamp(56px,8vh,96px);display:grid;grid-template-columns:8fr 4fr;gap:32px 48px;align-items:end}
.hero h1{font-size:clamp(40px,5.6vw,88px);max-width:16ch;margin-top:20px}
.hero p{color:var(--muted);font-size:17px;max-width:40ch}
.hero p strong{color:var(--fg);font-weight:500}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.neighbour{margin-top:clamp(96px,14vh,160px);padding:56px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

/* kept from the live page (Ali's ruling): the photograph carrying "Constant across all four".
   Live it opens on scroll; here it is static so the section below is judged in place. */
.photo{position:relative;overflow:hidden;height:min(86vh,760px);color:#fff}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.25) 60%,rgba(0,0,0,.1))}
.plate{position:absolute;inset:auto 0 0 0;z-index:1;padding:clamp(24px,4vw,56px) var(--gutter)}
.plate .eyebrow{color:rgba(255,255,255,.75)}
.plate ul{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:20px;border-top:1px solid rgba(255,255,255,.35);padding-top:20px}
.plate li{font-family:Outfit,sans-serif;font-size:clamp(17px,1.5vw,22px);line-height:1.25;letter-spacing:-.015em;max-width:20ch}
[dir="rtl"] .plate li{font-family:Vazirmatn,sans-serif;letter-spacing:0;line-height:1.5}
@media (max-width:1000px){.plate ul{grid-template-columns:1fr 1fr;gap:16px 24px}}

section.stage{display:none;padding-top:clamp(88px,13vh,150px)}
section.stage.on{display:block}

.arrow{width:16px;height:16px;flex:none;transition:transform .3s var(--ease)}
[dir="rtl"] .arrow{transform:scaleX(-1)}
.door{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;border-bottom:1px solid var(--line-strong);padding-bottom:3px;transition:border-color .2s,color .2s}
.door:hover{color:var(--acc,var(--brand-text));border-color:currentColor}
.door:hover .arrow{transform:translateX(3px)}
[dir="rtl"] .door:hover .arrow{transform:scaleX(-1) translateX(3px)}
.leaves{font-family:var(--serif);font-style:italic;letter-spacing:-.01em;line-height:1.2}
[dir="rtl"] .leaves{font-family:Vazirmatn,sans-serif;font-style:normal;font-weight:500;line-height:1.5}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;border-top:2px solid var(--fg);padding-top:16px}
.process-line{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:clamp(56px,8vh,88px);padding-top:20px;color:var(--muted);font-size:15px}

/* ───────── D · Which one is yours? — four questions stacked, each answer opens under its question ───────── */
.d-list{margin-top:clamp(24px,4vh,40px)}
.d-item{border-bottom:1px solid var(--line)}
.d-q{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;padding:clamp(22px,3.6vh,36px) 0;font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(26px,3.6vw,54px);letter-spacing:-.03em;line-height:1.1;color:var(--muted);transition:color .35s var(--ease)}
[dir="rtl"] .d-q{font-family:Vazirmatn,sans-serif;letter-spacing:0;line-height:1.4}
.d-q:hover,.d-q[aria-expanded="true"]{color:var(--fg)}
.d-q i{flex:none;position:relative;width:18px;height:18px}
.d-q i::before,.d-q i::after{content:"";position:absolute;inset:50% 0 auto 0;height:1.5px;background:currentColor;transition:transform .5s var(--ease)}
.d-q i::after{transform:rotate(90deg)}
.d-q[aria-expanded="true"] i::after{transform:rotate(0)}
.d-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.d-q[aria-expanded="true"]+.d-a{grid-template-rows:1fr}
.d-a>div{overflow:hidden}
.d-body{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,5vw,80px);padding:4px 0 clamp(32px,5vh,52px)}
.d-body .leaves{font-size:clamp(24px,2.4vw,36px);color:var(--acc);margin-top:12px;max-width:18ch}
.d-body li{padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
.d-body li:first-child{border-top:0;padding-top:0}
.d-body .foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
@media (max-width:1000px){.d-body{grid-template-columns:1fr;gap:24px}}

/* ───────── E · The index — four full-width rows, each one a link ───────── */
.e-rows{margin-top:clamp(24px,4vh,40px)}
.e-row{display:grid;grid-template-columns:64px 6fr 5fr auto;gap:32px;align-items:center;padding:clamp(28px,5vh,52px) 0;border-bottom:1px solid var(--line);position:relative}
.e-row h3{font-size:clamp(34px,5vw,76px);transition:transform .5s var(--ease),color .3s}
.e-row .q{color:var(--muted);font-size:15px;margin-top:10px}
.e-row .leaves{font-size:clamp(20px,1.8vw,27px);max-width:22ch;transition:color .3s}
.e-row .eng{display:block;margin-top:10px}
.e-row .go{display:grid;place-items:center;width:52px;height:52px;border:1px solid var(--line-strong);border-radius:50%;transition:background .3s,color .3s,border-color .3s}
.e-row:hover h3{transform:translateX(14px);color:var(--acc)}
[dir="rtl"] .e-row:hover h3{transform:translateX(-14px)}
.e-row:hover .leaves{color:var(--acc)}
.e-row:hover .go{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.e-rows:hover .e-row:not(:hover){opacity:.5}
.e-row{transition:opacity .3s}
@media (max-width:1000px){
  .e-row{grid-template-columns:1fr auto;gap:14px 20px;align-items:start}
  .e-row .n{grid-column:1/-1}
  .e-row .l{grid-column:1}
  .e-row .go{grid-column:2;grid-row:2;width:44px;height:44px}
}

/* ───────── F · Two situations — the four sorted by where the client stands ───────── */
.f-group{display:grid;grid-template-columns:4fr 8fr;gap:clamp(32px,5vw,80px);padding:clamp(40px,7vh,72px) 0;border-bottom:1px solid var(--line)}
.f-group h3{font-size:clamp(30px,3.4vw,50px);max-width:12ch}
.f-group .sub{color:var(--muted);font-size:15px;margin-top:14px;max-width:28ch}
.f-item{display:grid;grid-template-columns:1fr auto;gap:8px 32px;align-items:center;padding:24px 0;border-top:1px solid var(--line)}
.f-item:first-child{border-top:0;padding-top:0}
.f-item h4{font-family:Outfit,sans-serif;font-weight:400;font-size:clamp(22px,2vw,30px);letter-spacing:-.02em;line-height:1.15;transition:color .3s}
[dir="rtl"] .f-item h4{font-family:Vazirmatn,sans-serif;letter-spacing:0;line-height:1.4}
.f-item .leaves{font-size:19px;color:var(--acc);margin-top:8px}
.f-item .eng{display:block;margin-top:8px}
.f-item:hover h4{color:var(--acc)}
.f-item:hover .arrow{transform:translateX(4px)}
[dir="rtl"] .f-item:hover .arrow{transform:scaleX(-1) translateX(4px)}
@media (max-width:1000px){.f-group{grid-template-columns:1fr;gap:28px}}

.bar{position:fixed;inset:auto 0 16px 0;display:flex;justify-content:center;z-index:50;pointer-events:none}
.bar div{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;background:rgba(20,20,20,.92);color:#fff;padding:6px;border-radius:12px;font-size:13px}
.bar button{color:rgba(255,255,255,.7);padding:8px 12px;border-radius:8px}
.bar button.on{background:#fff;color:#111}
.bar span{width:1px;background:rgba(255,255,255,.2);margin:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div><p class="eyebrow" data-t="eyebrow"></p><h1><span data-t="title"></span> <em class="acc" data-t="titleItalic"></em></h1></div>
    <p data-h="description"></p>
  </header>
</div>

<figure class="photo"><img src="img/blue-folds.webp" alt=""><figcaption class="plate" id="plate"></figcaption></figure>

<section class="stage on" id="D"><div class="wrap" id="D-root"></div></section>
<section class="stage" id="E"><div class="wrap" id="E-root"></div></section>
<section class="stage" id="F"><div class="wrap" id="F-root"></div></section>

<div class="wrap"><div class="neighbour">↓ SectionEndCta (unchanged) — “Every system you own asks the next question.”</div></div>

<div class="bar"><div>
  <button data-v="D" class="on">D · Which one is yours?</button>
  <button data-v="E">E · The index</button>
  <button data-v="F">F · Two situations</button>
  <span></span>
  <button data-l="en" class="on">EN</button><button data-l="ar">AR</button>
  <span></span>
  <button data-m="light" class="on">Light</button><button data-m="dark">Dark</button>
</div></div>

<script>
/* Copy is the live servicesPage.* copy unless marked NEW (unreviewed).
   The audit's fixed fee is left as words here; the build reads it from the pricing schema. */
const COPY = {
 en:{
  eyebrow:"Services",title:"Four focused disciplines.",titleItalic:"One uncompromising standard.",
  description:"Each service is structured around <strong>a single business outcome</strong> - so scope, investment, and next steps all point in the same direction.",
  plateEyebrow:"Constant across all four",
  plate:["Scope and price written down before work begins.","Built from your requirements — never a recycled theme.","Arabic and English engineered as equals.","Code, accounts and findings stay in your name."],
  open:"What it includes",
  /* NEW */ dLabel:"Which one is yours?",dHint:"Four questions — pick the one you are asking",
  eLabel:"The four disciplines",
  fLabel:"Where you stand",
  groups:[["Building something new","Nothing live yet, or what is live is being replaced.",["website","portal"]],["You already have a system","It runs today. The question is what to do with it.",["audit","maintenance"]]],
  processQ:"How a build runs, phase by phase",processA:"See the process",
  s:{
   audit:{name:"Technical Consulting",q:"Need clarity before a costly decision?",leaves:"A decision you can defend, in five days.",d:["Risk-ranked findings across architecture, performance and SEO","A recommended rebuild-or-repair path, with its trade-offs","A roadmap any team can execute — ours or yours"],eng:"Fixed fee, five business days"},
   website:{name:"Interface Design",q:"Need a stronger market-facing presence?",leaves:"A site that is yours, not rented.",d:["A custom site with English and Arabic engineered as equals","Page structures designed around one conversion path","Performance measured against Core Web Vitals before launch"],eng:"Fixed-scope project, priced per scope"},
   portal:{name:"Custom Development",q:"Need custom workflows or product logic?",leaves:"Your operation, without the bottleneck.",d:["Dashboards and workflows modelled on how your team actually operates","A typed, documented codebase on a stack you own","An automated build-and-deploy pipeline from the first release"],eng:"Fixed-scope project, priced per scope"},
   maintenance:{name:"Maintenance & Support",q:"Need reliable execution after launch?",leaves:"A system that keeps working after we leave.",d:["Monitoring, patching and backups on a defined cycle","Content and small feature updates without a new project","A direct channel to engineers who know the codebase"],eng:"Monthly retainer, three coverage plans"}
  }
 },
 ar:{
  eyebrow:"الخدمات",title:"أربعة تخصصات محددة.",titleItalic:"معيار واحد لا نتنازل عنه.",
  description:"كل خدمة مصممة حول <strong>نتيجة تجارية واحدة</strong> - حتى يشير النطاق والاستثمار والخطوات التالية إلى الاتجاه نفسه.",
  plateEyebrow:"ثابت في الخدمات الأربع",
  plate:["النطاق والسعر مكتوبان قبل أن يبدأ العمل.","مبني من متطلباتك — لا من قالب معاد تدويره.","العربية والإنجليزية مصممتان كتجربتين متكافئتين.","الكود والحسابات والنتائج تبقى باسمك."],
  open:"ما الذي تشمله",
  dLabel:"أيّها يخصّك؟",dHint:"أربعة أسئلة — اختر السؤال الذي تطرحه",
  eLabel:"التخصصات الأربعة",
  fLabel:"أين تقف الآن",
  groups:[["تبني شيئاً جديداً","لا شيء يعمل بعد، أو ما يعمل سيُستبدل.",["website","portal"]],["لديك نظام قائم","يعمل اليوم. والسؤال هو ماذا تفعل به.",["audit","maintenance"]]],
  processQ:"كيف يسير البناء، مرحلة بمرحلة",processA:"شاهد طريقة العمل",
  s:{
   audit:{name:"الاستشارات التقنية",q:"تحتاج وضوحاً قبل قرار مكلف؟",leaves:"قرار تستطيع الدفاع عنه، في خمسة أيام عمل.",d:["نتائج مرتبة حسب الخطورة في البنية والأداء وتحسين محركات البحث","مسار موصى به لإعادة البناء أو الإصلاح، مع مقايضاته","خارطة طريق ينفذها أي فريق — فريقنا أو فريقك"],eng:"سعر ثابت، خمسة أيام عمل"},
   website:{name:"تصميم الواجهات",q:"تحتاج حضوراً أقوى في السوق؟",leaves:"موقع ملكك، لا مستأجر.",d:["موقع مخصص بالعربية والإنجليزية كتجربتين متكافئتين","بنية صفحات مصممة حول مسار تحويل واحد","أداء مقاس وفق مؤشرات Core Web Vitals قبل الإطلاق"],eng:"مشروع بنطاق محدد، يُسعَّر حسب النطاق"},
   portal:{name:"التطوير المخصص",q:"تحتاج طريقة عمل مخصصة أو منطق منتج؟",leaves:"تشغيل بلا الاختناق الذي كان.",d:["لوحات تحكم ومسارات عمل مبنية على طريقة عمل فريقك فعلياً","كود موثّق ومحكم الأنواع على تقنيات تملكها","خط بناء ونشر آلي منذ الإصدار الأول"],eng:"مشروع بنطاق محدد، يُسعَّر حسب النطاق"},
   maintenance:{name:"الصيانة والدعم",q:"تحتاج تنفيذاً موثوقاً بعد الإطلاق؟",leaves:"نظام يستمر في العمل بعد أن نغادر.",d:["مراقبة وتحديثات أمنية ونسخ احتياطي على دورة محددة","تحديثات محتوى وميزات صغيرة دون مشروع جديد","قناة مباشرة مع مهندسين يعرفون الكود"],eng:"اشتراك شهري، ثلاث خطط تغطية"}
  }
 }
};
const WORLD={website:"violet",portal:"blue",audit:"cyan",maintenance:"green"};
const ORDER=["website","portal","audit","maintenance"];   /* SERVICE_ORDER on the live site */
const ARROW='<svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const num=(i,l)=>{const s=String(i).padStart(2,"0");return l==="ar"?s.replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):s};
let lang="en",active="website";

const door=c=>`<a class="door" href="#">${c.open}${ARROW}</a>`;
const head=(label,hint="")=>`<div class="head"><p class="eyebrow">${label}</p><p class="mono">${hint}</p></div>`;
const processLine=c=>`<div class="process-line"><span>${c.processQ}</span><a class="door" href="#">${c.processA}${ARROW}</a></div>`;

function renderD(c){
  const qs=ORDER.map(id=>{const s=c.s[id];return `<li class="d-item w-${WORLD[id]}">
    <button class="d-q" data-id="${id}" aria-expanded="${id===active}" aria-controls="d-${id}"><span>${s.q}</span><i></i></button>
    <div class="d-a" id="d-${id}"><div><div class="d-body"><div><span class="mono">${num(ORDER.indexOf(id)+1,lang)} · ${s.name}</span><p class="leaves">${s.leaves}</p></div>
    <div><ul>${s.d.map(x=>`<li>${x}</li>`).join("")}</ul><div class="foot"><span class="mono">${s.eng}</span>${door(c)}</div></div></div></div></div></li>`}).join("");
  return `${head(c.dLabel,c.dHint)}<ul class="d-list">${qs}</ul>${processLine(c)}`;
}
function renderE(c){
  const rows=ORDER.map((id,i)=>{const s=c.s[id];return `<a class="e-row w-${WORLD[id]}" href="#">
    <span class="mono n">${num(i+1,lang)}</span>
    <div><h3>${s.name}</h3><p class="q">${s.q}</p></div>
    <div class="l"><p class="leaves">${s.leaves}</p><span class="mono eng">${s.eng}</span></div>
    <span class="go">${ARROW}</span></a>`}).join("");
  return `${head(c.eLabel,num(4,lang))}<div class="e-rows">${rows}</div>${processLine(c)}`;
}
function renderF(c){
  const g=c.groups.map(([t,sub,ids])=>`<div class="f-group"><div><h3>${t}</h3><p class="sub">${sub}</p></div><div>${ids.map(id=>{const s=c.s[id];
    return `<a class="f-item w-${WORLD[id]}" href="#"><div><h4>${s.name}</h4><p class="leaves">${s.leaves}</p><span class="mono eng">${s.eng}</span></div>${ARROW}</a>`}).join("")}</div></div>`).join("");
  return `${head(c.fLabel)}${g}${processLine(c)}`;
}
function render(){
  const c=COPY[lang];
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=c[e.dataset.t]);
  document.querySelectorAll("[data-h]").forEach(e=>e.innerHTML=c[e.dataset.h]);
  document.getElementById("plate").innerHTML=`<p class="eyebrow">${c.plateEyebrow}</p><ul>${c.plate.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  document.getElementById("D-root").innerHTML=renderD(c);
  document.getElementById("E-root").innerHTML=renderE(c);
  document.getElementById("F-root").innerHTML=renderF(c);
}
/* D: click a question to open its answer under it; one open at a time. No pin, no scroll coupling. */
document.getElementById("D-root").addEventListener("click",e=>{
  const btn=e.target.closest(".d-q");if(!btn)return;
  active=btn.getAttribute("aria-expanded")==="true"?null:btn.dataset.id;
  document.querySelectorAll(".d-q").forEach(b=>b.setAttribute("aria-expanded",b.dataset.id===active));
});
function pick(sel,btn){document.querySelectorAll(sel).forEach(b=>b.classList.toggle("on",b===btn))}
document.querySelector(".bar").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v){pick("[data-v]",b);document.querySelectorAll(".stage").forEach(s=>s.classList.toggle("on",s.id===b.dataset.v))}
  if(b.dataset.l){pick("[data-l]",b);lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";render()}
  if(b.dataset.m){pick("[data-m]",b);document.documentElement.dataset.theme=b.dataset.m}
});
render();
</script>
</body>
</html>
