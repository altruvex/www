<!--
  Prototype D for /standards — "This page audits itself".
  Every figure on this page is measured live, in the visitor's browser, on this page:
  nothing is typed in, nothing is a demo. What a browser cannot measure is said in words.

  Serve with:  python3 serve.py   →  http://127.0.0.1:8741/d-self-audit.html
  Query switches (verification): ?lang=ar&theme=dark&still=1  (still = final state, no motion)

  COPY: English hero copy is apps/www/messages/en/standards.json `hero`; the Arabic hero is
  messages/ar/standards.json. All other copy, English AND Arabic, was written for this
  prototype and is UNREVIEWED.

<script>
  // Theme before paint: ?theme= wins, else follow the OS.
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = false;
    try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    if (q === "dark" || q === "light") dark = q === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

<style>
/* ── Tokens — mirrored from packages/ui/src/styles/tokens.css and
   apps/www/app/globals.css (n-*, brand, brand-text-on-light/dark, danger,
   surface, muted-foreground, s-border, [data-scene="inverted"], .accent-iris),
   and apps/www/lib/motion/tokens.ts (ease.strong / smooth, --motion-*). ──── */
:root {
  --n-0: 0 0% 98%;
  --n-8: 0 0% 6%;
  --brand: 214 89% 48%;
  --brand-text: 214 90% 43%;
  --danger: 0 65% 51%;

  --background: var(--n-0);
  --foreground: var(--n-8);
  --surface: 0 0% 94%;
  --muted-foreground: 0 0% 40%;
  --border-subtle: hsl(var(--n-8) / 0.1);
  --border-strong: hsl(var(--n-8) / 0.28);
  --control-edge: hsl(var(--foreground) / 0.45);

  /* .accent-iris — the h1 only */
  --grad-from: hsl(218 86% 48%);
  --grad-via: hsl(250 76% 58%);
  --grad-to: hsl(272 72% 56%);

  --font-outfit: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
  --font-vazirmatn: "Vazirmatn", sans-serif;

  --section-y-top: clamp(5rem, 10vh, 8rem);
  --section-y-bottom: clamp(5rem, 14vh, 10rem);

  --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --motion-fast: 400ms;
  --motion-base: 700ms;
  --motion-display: 1100ms;

  color-scheme: light;
}

[data-theme="dark"] {
  --background: 0 0% 7%;
  --foreground: 0 0% 94%;
  --surface: 0 0% 11%;
  --muted-foreground: 0 0% 58%;
  --brand-text: 214 95% 64%;
  --danger: 0 74% 68%;
  --border-subtle: hsl(var(--n-0) / 0.1);
  --border-strong: hsl(0 0% 100% / 0.26);
  --grad-from: hsl(212 96% 64%);
  --grad-via: hsl(250 92% 70%);
  --grad-to: hsl(276 88% 72%);
  color-scheme: dark;
}

/* The one dark moment: the page close. Flips to paper in dark, as on the site. */
[data-scene="inverted"] {
  --background: 0 0% 9%;
  --foreground: 0 0% 94%;
  --muted-foreground: 0 0% 60%;
  --brand-text: 214 95% 64%;
  --border-subtle: hsl(0 0% 100% / 0.1);
  --border-strong: hsl(0 0% 100% / 0.26);
  color-scheme: dark;
  background-color: hsl(var(--background));
  color: hsl(var(--foreground));
}
[data-theme="dark"] [data-scene="inverted"] {
  --background: 0 0% 98%;
  --foreground: 0 0% 6%;
  --muted-foreground: 0 0% 40%;
  --brand-text: 214 90% 43%;
  --border-subtle: hsl(0 0% 6% / 0.1);
  --border-strong: hsl(0 0% 6% / 0.28);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* No colour transitions anywhere: the contrast audit reads computed colours the
   moment the theme flips, and a colour mid-transition would be a false reading. */
body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-inter);
  font-size: 17px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

.container { width: 100%; max-width: 1408px; margin-inline: auto; padding-inline: 16px; }

@media (min-width: 768px)  { .container { padding-inline: 48px; } }
@media (min-width: 1024px) { .container { padding-inline: 64px; } }

.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── Prototype chrome (always LTR, physical sides) ───────────────────── */

}

.toolbar { position: fixed; top: 12px; right: 12px; z-index: 50; display: flex; gap: 8px; }

.seg button {
  font: 500 12px/1 var(--font-inter);
  color: hsl(var(--muted-foreground));
  background: hsl(var(--background));
  border: 0; border-radius: 999px;

}
.seg button[lang="ar"] { font-family: var(--font-vazirmatn); }
.seg button[aria-pressed="true"] { background: hsl(var(--foreground)); color: hsl(var(--background)); }
.seg button:focus-visible { outline: 2px solid hsl(var(--brand)); outline-offset: 2px; }

/* ── House type ──────────────────────────────────────────────────────── */
.eyebrow {

  font-size: 0.875rem;

}
[dir="rtl"] .eyebrow { font-family: var(--font-vazirmatn); letter-spacing: 0; text-transform: none; }

.prov {
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.5;
  color: hsl(var(--muted-foreground));
  overflow-wrap: anywhere;
}
[dir="rtl"] .prov { font-family: var(--font-vazirmatn); }
.prov .api { font-family: var(--font-mono); }

/* ── Hero: the shared arrival only — line masks rise ─────────────────── */
.hero { padding-top: var(--section-y-top); padding-bottom: clamp(3.5rem, 8vh, 6rem); }
.mask { display: block; overflow: clip; padding-bottom: 0.1em; margin-bottom: -0.1em; }
.ln { display: block; }
.arrive .ln { animation: rise var(--motion-display) var(--ease-strong) both; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes rise { from { transform: translateY(105%); } }

.h1 {
  margin-top: 20px;
  max-width: 20ch;
  font-family: var(--font-outfit);
  font-weight: 300;
  font-size: clamp(2.5rem, 5.2vw, 4.75rem);
  line-height: 1.04;
  letter-spacing: -0.03em;
}
[dir="rtl"] .h1 { font-family: var(--font-vazirmatn); font-weight: 400; letter-spacing: 0; line-height: 1.3; }
/* Vazirmatn sets wider than the fallback face: reserve the lines it will take, so the
   font swap does not push the page down (this page measures its own layout shift). */
@media (max-width: 639px) { [dir="rtl"] .h1 { min-height: calc(3 * 1.3em); } }
.iris {
  background-image: linear-gradient(to right, var(--grad-from), var(--grad-via), var(--grad-to));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
[dir="rtl"] .iris { background-image: linear-gradient(to left, var(--grad-from), var(--grad-via), var(--grad-to)); }
.hero-desc {
  margin-top: 28px;
  max-width: 40ch;
  font-size: clamp(1.0625rem, 1.1vw, 1.125rem);
  color: hsl(var(--muted-foreground));
}
.claim {
  margin-top: 40px;
  max-width: 44ch;
  font-size: clamp(1.0625rem, 1.2vw, 1.25rem);
  line-height: 1.6;
}
.status {
  margin-top: 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-height: 1.5em;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  line-height: 1.5;
  color: hsl(var(--foreground));
}
[dir="rtl"] .status { font-family: var(--font-vazirmatn); font-size: 0.875rem; }
.status .pulse {
  flex: none;
  width: 8px; height: 8px; margin-top: 0.4em;
  border-radius: 50%;
  background: hsl(var(--brand));
}
.status.done .pulse { background: hsl(var(--foreground)); }
@media (prefers-reduced-motion: no-preference) {
  html:not(.still) .status:not(.done) .pulse { animation: pulse 1.2s var(--ease-smooth) infinite alternate; }
}
@keyframes pulse { to { opacity: 0.35; } }

/* ── Sections: hairlines and whitespace, never cards ─────────────────── */
.sec { border-top: 1px solid var(--border-subtle); padding-top: var(--section-y-top); padding-bottom: var(--section-y-bottom); }
.sec-head { max-width: 60ch; }
.h2 {
  margin-top: 16px;
  font-family: var(--font-outfit);
  font-weight: 300;
  font-size: clamp(1.875rem, 3.4vw, 2.75rem);
  line-height: 1.08;
  letter-spacing: -0.02em;
}
[dir="rtl"] .h2 { font-family: var(--font-vazirmatn); font-weight: 400; letter-spacing: 0; line-height: 1.3; }
.lede { margin-top: 20px; max-width: 54ch; color: hsl(var(--muted-foreground)); font-size: clamp(1.0625rem, 1.05vw, 1.125rem); }

.sec-body { margin-top: 56px; display: grid; gap: 48px; }
@media (min-width: 1024px) {
  .sec-body { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; }
  .sec-body > .figs { grid-column: span 4; }
  .sec-body > .chart { grid-column: 6 / span 7; }
}

/* Figures */
.fig { border-top: 1px solid var(--border-strong); padding-top: 16px; padding-bottom: 32px; }
.fig + .fig { margin-top: 8px; }
.fig-label { font-size: 0.9375rem; line-height: 1.4; font-weight: 500; }
.fig-num {
  margin-top: 8px;
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--font-outfit);
  font-weight: 300;
  font-size: clamp(2.5rem, 4vw, 3.25rem);
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.fig-main .fig-num { font-size: clamp(4.5rem, 9vw, 7.5rem); letter-spacing: -0.04em; }
.fig-num .unit { font-size: 0.34em; letter-spacing: 0; color: hsl(var(--muted-foreground)); font-weight: 400; }
.fig-main .fig-num .unit { font-size: 0.24em; }
[dir="rtl"] .fig-num .unit { font-family: var(--font-vazirmatn); }
.fig-num.fail .ltr { color: hsl(var(--danger)); }
.fig-verdict { margin-top: 12px; font-size: 0.9375rem; line-height: 1.5; }
.fig-verdict .line-word { color: hsl(var(--brand-text)); font-weight: 500; }
.fig-note { margin-top: 6px; font-size: 0.875rem; line-height: 1.55; color: hsl(var(--muted-foreground)); max-width: 44ch; }
.fig-wait { margin-top: 10px; font-size: 0.9375rem; line-height: 1.5; color: hsl(var(--muted-foreground)); }
.fig-main { min-height: 15rem; }
.fig-small { min-height: 9.5rem; }

/* ── Waterfall ───────────────────────────────────────────────────────── */
.wf { --wf-label: 0px; --row: 30px; min-height: 22rem; }
@media (min-width: 640px) { .wf { --wf-label: 15rem; } }
@media (min-width: 1024px) { .wf { --wf-label: 13.5rem; } }
@media (min-width: 1280px) { .wf { --wf-label: 16rem; } }
.chart-head {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px;
  border-top: 2px solid hsl(var(--foreground));
  padding: 14px 0 20px;
}
.chart-title { font-size: 0.9375rem; font-weight: 500; line-height: 1.4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8125rem; line-height: 1.4; color: hsl(var(--muted-foreground)); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: block; width: 18px; height: 8px; border-radius: 2px; }
.legend .sw-wait { background: hsl(var(--foreground) / 0.5); }
.legend .sw-recv { background: hsl(var(--foreground)); }
.legend .sw-line { width: 2px; height: 14px; border-radius: 0; background: hsl(var(--brand)); }

.wf-marks { position: relative; margin-inline-start: var(--wf-label); }
.mk {
  position: absolute; bottom: 0;
  font-family: var(--font-mono); font-size: 0.75rem; line-height: 20px;
  white-space: nowrap;
  color: hsl(var(--muted-foreground));
}
.mk.start { border-inline-start: 1px solid hsl(var(--foreground) / 0.6); padding-inline-start: 6px; }
.mk.end { border-inline-end: 1px solid hsl(var(--foreground) / 0.6); padding-inline-end: 6px; text-align: end; }
.mk.is-line { color: hsl(var(--brand-text)); font-weight: 500; border-color: hsl(var(--brand)); border-width: 2px; }
.mk.is-lcp { color: hsl(var(--foreground)); font-weight: 500; border-color: hsl(var(--foreground)); }
.mk.start.is-line { margin-inline-start: -1px; }
.mk.end.is-line { margin-inline-end: -1px; }

.wf-body { position: relative; }
.wf-rows { list-style: none; position: relative; }
.wf-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  border-bottom: 1px solid var(--border-subtle);
  min-height: var(--row);
  padding-block: 6px;
}
@media (min-width: 640px) { .wf-row { grid-template-columns: var(--wf-label) minmax(0, 1fr); align-items: center; padding-block: 0; } }
.wf-lab { display: flex; align-items: baseline; gap: 10px; min-width: 0; padding-inline-end: 16px; font-size: 0.8125rem; line-height: 1.4; position: relative; z-index: 1; }
.wf-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] .wf-name.local { direction: rtl; }
.wf-kind { flex: none; font-family: var(--font-mono); font-size: 0.75rem; color: hsl(var(--muted-foreground)); }
.wf-size { flex: none; margin-inline-start: auto; font-family: var(--font-mono); font-size: 0.75rem; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
.wf-track { position: relative; height: 16px; margin-top: 4px; }
@media (min-width: 640px) { .wf-track { margin-top: 0; height: var(--row); } }
.bar {
  position: absolute; top: 50%; height: 8px; margin-top: -4px;
  min-width: 2px;
  background: hsl(var(--foreground));
  border-radius: 1px;
  transform-origin: left center;
  transition: transform var(--motion-base) var(--ease-strong);
}
[dir="rtl"] .bar { transform-origin: right center; }
.bar .wait { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; background: hsl(var(--background)); }
.bar .wait::after { content: ""; position: absolute; inset: 0; background: hsl(var(--foreground) / 0.5); }
.wf-track .over { position: absolute; inset-inline-end: 0; top: 50%; margin-top: -9px; padding-inline-start: 6px; background: hsl(var(--background)); font-family: var(--font-mono); font-size: 0.75rem; line-height: 18px; white-space: nowrap; color: hsl(var(--foreground)); }

.wf-over { position: absolute; top: 0; bottom: 0; inset-inline-start: var(--wf-label); inset-inline-end: 0; pointer-events: none; }
.ov { position: absolute; top: 0; bottom: 0; width: 0; transform-origin: top; transition: transform var(--motion-base) var(--ease-strong); }
.ov.line { border-inline-start: 2px solid hsl(var(--brand)); margin-inline-start: -1px; }
.ov.lcp { border-inline-start: 1px solid hsl(var(--foreground)); }

.wf-axis { position: relative; margin-inline-start: var(--wf-label); height: 26px; border-top: 1px solid hsl(var(--foreground) / 0.45); }
.ax { position: absolute; top: 4px; font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.4; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; transform: translateX(-50%); }
[dir="rtl"] .ax { transform: translateX(50%); }
.ax.first { transform: none; }
.ax.last { transform: none; inset-inline-start: auto !important; inset-inline-end: 0; }
.ax::before { content: ""; position: absolute; top: -4px; left: 50%; width: 1px; height: 4px; background: hsl(var(--foreground) / 0.45); }
.ax.first::before, .ax.last::before { display: none; }
.wf-more { margin-top: 10px; font-size: 0.8125rem; color: hsl(var(--muted-foreground)); }

.armed .bar { transform: scaleX(0); }
.armed .ov { transform: scaleY(0); }

/* ── Contrast strip plot ─────────────────────────────────────────────── */
.strip { min-height: 16rem; }
.lane { padding-top: 14px; }
.lane + .lane { margin-top: 10px; }
.lane-label { font-size: 0.8125rem; line-height: 1.4; color: hsl(var(--muted-foreground)); }
.lane-label b { font-weight: 500; color: hsl(var(--foreground)); }
.lane-plot { position: relative; height: 64px; margin-top: 8px; border-bottom: 1px solid var(--border-subtle); }
.tk {
  position: absolute; width: 2px; height: 14px; margin-inline-start: -1px;
  background: hsl(var(--foreground));
  border-radius: 1px;
  transform-origin: bottom;
  transition: transform var(--motion-fast) var(--ease-strong);
}
.lane.large .tk { width: 4px; height: 10px; margin-inline-start: -2px; border-radius: 2px; background: transparent; box-shadow: inset 0 0 0 1.5px hsl(var(--foreground)); }
.tk.fail { background: hsl(var(--danger)); }
.lane.large .tk.fail { box-shadow: inset 0 0 0 1.5px hsl(var(--danger)); }
.settling .tk { transition: left 900ms var(--ease-strong), right 900ms var(--ease-strong), top 900ms var(--ease-strong); transition-delay: var(--d, 0ms); }
.armed .tk { transform: scaleY(0); }
.aa { position: absolute; top: -6px; bottom: 0; width: 0; border-inline-start: 2px solid hsl(var(--brand)); margin-inline-start: -1px; }
.aa-lab {
  position: absolute; top: -26px;
  font-family: var(--font-mono); font-size: 0.75rem; line-height: 18px; font-weight: 500; white-space: nowrap;
  color: hsl(var(--brand-text));

}
.st-axis { position: relative; height: 26px; border-top: 1px solid hsl(var(--foreground) / 0.45); margin-top: -1px; }
.st-cap { margin-top: 6px; font-size: 0.8125rem; color: hsl(var(--muted-foreground)); }
@media (max-width: 639px) { .ax.opt { display: none; } }

.lowest-what { margin-top: 12px; font-size: 0.9375rem; line-height: 1.55; overflow-wrap: anywhere; }

/* DOM audit: counts that should read 0 */
.dom { margin-top: 72px; }
.dom-h { font-size: 1rem; font-weight: 500; line-height: 1.4; }
.dom-list { list-style: none; margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 768px) { .dom-list { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; } }
@media (min-width: 1280px) { .dom-list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ── Headers ─────────────────────────────────────────────────────────── */
.hdrs { list-style: none; margin-top: 56px; border-top: 2px solid hsl(var(--foreground)); }
.hdr { display: grid; gap: 4px 24px; grid-template-columns: minmax(0, 1fr); border-bottom: 1px solid var(--border-subtle); padding: 16px 0; }
@media (min-width: 768px) { .hdr { grid-template-columns: 17rem 11rem minmax(0, 1fr); align-items: baseline; } }
@media (min-width: 1024px) { .hdr { grid-template-columns: 19rem 14rem minmax(0, 1fr); } }
.hdr-name { font-family: var(--font-mono); font-size: 0.875rem; line-height: 1.5; direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
[dir="rtl"] .hdr-name { text-align: right; }
.hdr-state { font-size: 0.9375rem; line-height: 1.5; font-weight: 500; }
.hdr-state.no { color: hsl(var(--muted-foreground)); font-weight: 400; }
.hdr-val {
  min-width: 0;
  font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.6;
  color: hsl(var(--muted-foreground));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  direction: ltr; unicode-bidi: isolate; text-align: start;
  border-radius: 2px;

        el.classList.toggle("fail", !it.pass);
      });
      strip.querySelector(".st-lab-body").textContent = t("a11y.count", { n: body.length });
      strip.querySelector(".st-lab-large").textContent = t("a11y.count", { n: large.length });

        return '<div class="lane ' + cls + '"><p class="lane-label"><b>' + esc(label) + "</b> · " + esc(t("a11y.line")) + ' <span class="ltr">' + lineR + ':1</span> · <span class="st-lab-' + cls + '">' + esc(t("a11y.count", { n: list.length })) + "</span></p>" +
          '<div class="lane-plot">' + tk + '<i class="aa" style="inset-inline-start:' + xOf(lineR) + '%" aria-hidden="true"></i></div></div>';

      var ax = [1, 2, 3, 4.5, 7, 10, 15, 21].map(function (v, i, arr) {

        return '<span class="ax' + opt + (i === 0 ? " first" : i === arr.length - 1 ? " last" : "") + '" style="inset-inline-start:' + xOf(v) + '%"><span class="ltr">' + v + (i === 0 || i === arr.length - 1 ? ":1" : "") + "</span></span>";
      }).join("");
      strip.innerHTML =
        '<div class="chart-head"><p class="chart-title">' + esc(t("a11y.chart")) + "</p>" +
        '<p class="legend" aria-hidden="true"><span><i class="sw-line"></i>' + esc(t("speed.ourLine")) + " (WCAG AA)</span></p></div>" +
        '<div class="st-plot" role="img" aria-label="' + esc(stripLabel(A, loB, loL)) + '">' +
        lane(body, "body", 4.5, t("a11y.body")) + lane(large, "large", 3, t("a11y.large")) +

    }

    var D = A.dom;
    function row(n, bad, label, of) {
      return '<li><p class="dom-n' + (bad ? " fail" : "") + '"><span class="ltr">' + bad + '</span></p><p class="dom-l">' + esc(label) + '</p><p class="dom-of">' + esc(of) + "</p></li>";
    }
    $("dom").innerHTML =
      '<h3 class="dom-h">' + esc(t("a11y.domH")) + "</h3>" +
      '<ul class="dom-list">' +
      row(D.imgs.n, D.imgs.bad, t("a11y.imgs"), D.imgs.n ? t("a11y.ofImgs", { n: D.imgs.n }) : t("a11y.noImgs")) +
      row(D.ctls.n, D.ctls.bad, t("a11y.ctls"), t("a11y.ofCtls", { n: D.ctls.n })) +
      row(D.fields.n, D.fields.bad, t("a11y.fields"), D.fields.n ? t("a11y.ofFields", { n: D.fields.n }) : t("a11y.noFields")) +
      row(D.heads.n, D.heads.bad, t("a11y.heads"), t("a11y.ofHeads", { n: D.heads.n })) +

  }
  function stripLabel(A, loB, loL) {
    return t("a11y.stripLabel", { n: A.items.length, b: loB ? floor2(loB.r) : "—", g: loL ? floor2(loL.r) : "—" });
  }

  /* ── Draw once, when the data is in and the chart is in view ── */
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;

      if (key && !drawn[key] && e.target.classList.contains("armed") && e.target.querySelector(key === "wf" ? ".bar" : ".tk")) {

  /* ── Static copy ── */
  function renderCopy() {
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.dataset.t); });
    $("gates").innerHTML = t("ci.gates").map(function (g) {
      return '<li><span class="gate-l">' + esc(g[0]) + '</span><span class="gate-v">' + esc(g[1]) + "</span></li>";
    }).join("");
    document.title = lang === "ar" ? "D · صفحة تفحص نفسها" : "D · This page audits itself";
  }

  /* ── Toggles ── */
  function setLang(next, initial) {

    renderStatus();

    if (M.audit) nextFrames(2).then(function () { runAudit("lang"); return nextFrames(1); }).then(function () { runAudit("lang"); });
  }
  function setTheme(next) {
    root.setAttribute("data-theme", next);
    document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.themeSet === next ? "true" : "false"); });
    // Signature: the contrast audit re-runs and every tick re-settles to its new ratio.
    if (M.audit) nextFrames(2).then(function () { runAudit("theme"); });
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) { b.addEventListener("click", function () { if (b.dataset.lang !== lang) setLang(b.dataset.lang); }); });
  document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.addEventListener("click", function () { if (b.dataset.themeSet !== root.getAttribute("data-theme")) setTheme(b.dataset.themeSet); }); });
  var onNarrow = function () { if (M.speed) { renderWaterfall(); if (M.audit) nextFrames(2).then(function () { runAudit("layout"); }); } };
  if (narrow.addEventListener) narrow.addEventListener("change", onNarrow);

  setTheme(root.getAttribute("data-theme") || "light");
  setLang(lang, true);
  if (!calm()) root.classList.add("arrive");

  /* ── Sequence: headers now; speed once the load (and fonts) settle; then the
        contrast audit last, so every piece of text on the page exists. ── */
  var loaded = new Promise(function (r) { if (document.readyState === "complete") r(); else window.addEventListener("load", r, { once: true }); });

  var speedDone = Promise.all([loaded, fontsReady, headersDone]).then(function () { return wait(800); }).then(finalizeSpeed);
  Promise.all([speedDone, headersDone]).then(function () { return nextFrames(2); })
    .then(function () { runAudit("first"); return nextFrames(1); })
    .then(function () { runAudit("first"); });

  window.__protoD = { M: M, contrastAudit: contrastAudit, domAudit: domAudit, ratio: ratio };
})();
