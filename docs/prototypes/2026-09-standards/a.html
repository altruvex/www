<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Zoned tracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<script>
  // Theme before paint: follow the OS unless a toggle says otherwise.
  (function () {
    var dark = false;
    try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    var root = document.documentElement;
    root.setAttribute("data-theme", dark ? "dark" : "light");
    root.classList.add("js");
  })();
</script>
<style>
/* ── Tokens — copied from the live code, not picked ─────────────────────
   packages/ui/src/styles/tokens.css  :root / .dark → neutrals, brand, fg, muted-fg, surface, s-border
   apps/www/app/globals.css  .accent-world-green / .dark .accent-world-green (the page's world)
   apps/www/app/globals.css  .eyebrow, --font-serif, --section-y-*
   apps/www/lib/motion/tokens.ts  ease.strong / gentle / smooth, duration.fast / slow, stagger.base,
                                  trigger.inView ("top 60%") */
:root {
  --n-0: 0 0% 98%;
  --n-8: 0 0% 6%;
  --brand: 214 89% 48%;

  --background: var(--n-0);
  --foreground: var(--n-8);
  --muted-foreground: 0 0% 40%;
  --surface: 0 0% 94%;
  --s-border: hsl(var(--n-8) / 0.1);
  --border-subtle: var(--s-border);
  /* A control's own boundary: foreground/45, never border-mid (1.5:1). */
  --control-edge: hsl(var(--foreground) / 0.45);

  /* .accent-world-green (light) */
  --local-accent: hsl(158 64% 30%);
  --local-accent-text: var(--local-accent);

  --font-outfit: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
  --font-vazirmatn: "Vazirmatn", sans-serif;

  --section-y-top: clamp(5rem, 10vh, 8rem);
  --section-y-bottom: clamp(5rem, 14vh, 10rem);

  /* lib/motion/tokens.ts */
  --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-gentle: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur-fast: 400ms;
  --dur-base: 700ms;
  --dur-slow: 1000ms;
  --dur-theme: 400ms;

  color-scheme: light;
}

[data-theme="dark"] {
  --background: 0 0% 7%;
  --foreground: 0 0% 94%;
  --muted-foreground: 0 0% 58%;
  --surface: 0 0% 11%;
  --s-border: hsl(var(--n-0) / 0.1);

  /* .dark .accent-world-green */
  --local-accent: hsl(158 36% 49%);
  --local-accent-text: var(--local-accent);

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-inter);
  font-size: 17px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--dur-theme) var(--ease-smooth), color var(--dur-theme) var(--ease-smooth);
  overflow-x: clip;
}
[dir="rtl"] body { font-family: var(--font-vazirmatn); }

.container {
  width: 100%;
  max-width: 1408px;
  margin-inline: auto;
  padding-inline: 24px;
}
@media (min-width: 640px)  { .container { padding-inline: 32px; } }
@media (min-width: 768px)  { .container { padding-inline: 48px; } }
@media (min-width: 1024px) { .container { padding-inline: 64px; } }

/* ── Prototype chrome (always LTR, physical sides) ───────────────────── */
.proto-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  line-height: 1.5;
  color: hsl(var(--muted-foreground));
  padding: 72px 16px 0 16px;
  text-align: left;
}
@media (min-width: 640px) { .proto-label { padding: 20px 260px 0 20px; } }

.toolbar {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 50;
  display: flex;
  gap: 8px;
}
.seg {
  display: flex;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--control-edge);
  background: hsl(var(--background));
}
.seg button {
  font: 500 12px/1 var(--font-inter);
  color: hsl(var(--muted-foreground));
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 9px 12px;
  min-width: 44px;
  min-height: 32px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] {
  background: hsl(var(--foreground));
  color: hsl(var(--background));
}
.seg button:focus-visible { outline: 2px solid hsl(var(--brand)); outline-offset: 2px; }

/* ── House type ──────────────────────────────────────────────────────── */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: hsl(var(--muted-foreground));
}
[dir="rtl"] .eyebrow { font-family: var(--font-vazirmatn); letter-spacing: 0; text-transform: none; }

/* Small mono caps: axis ends, zone names, sources. */
.mono-cap {
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.35;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: hsl(var(--muted-foreground));
}
[dir="rtl"] .mono-cap { font-family: var(--font-vazirmatn); font-size: 12px; letter-spacing: 0; text-transform: none; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
[dir="rtl"] .num { font-family: var(--font-vazirmatn); }

/* ── Context stubs ───────────────────────────────────────────────────── */
.stub-above { padding-top: 48px; padding-bottom: 48px; }
.stub-above .rule { height: 2px; background: hsl(var(--foreground)); }
.stub-above p { padding-top: 16px; font-size: 0.9375rem; color: hsl(var(--muted-foreground)); }
.stub-below {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--section-y-top);
  padding-bottom: 30vh;
}
.stub-below p {
  font-family: var(--font-outfit);
  font-size: clamp(28px, 4.5vw, 52px);
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: hsl(var(--foreground) / 0.35);
}
[dir="rtl"] .stub-below p { font-family: var(--font-vazirmatn); letter-spacing: 0; line-height: 1.3; color: hsl(var(--muted-foreground)); }

/* ── Chapter (one standard) ──────────────────────────────────────────── */
.chapter {
  display: grid;
  gap: 48px;
  border-top: 1px solid var(--border-subtle);
  padding-block: var(--section-y-top);
}
@media (min-width: 1024px) {
  .chapter { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .chapter .text { grid-column: 1 / span 5; }
  .chapter .sheet { grid-column: 7 / span 6; padding-top: 40px; }
}
.chapter .idx { font-family: var(--font-mono); font-size: 0.875rem; letter-spacing: 0.2em; color: var(--local-accent-text); }
[dir="rtl"] .chapter .idx { font-family: var(--font-vazirmatn); letter-spacing: 0; }
.chapter h2 {
  margin-top: 16px;
  max-width: 18ch;
  font-family: var(--font-outfit);
  font-weight: 300;
  font-size: clamp(1.875rem, 3.4vw, 2.75rem);
  line-height: 1.08;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
[dir="rtl"] .chapter h2 { font-family: var(--font-vazirmatn); font-weight: 400; letter-spacing: 0; line-height: 1.3; }
.chapter .body {
  margin-top: 24px;
  max-width: 52ch;
  font-size: clamp(1.0625rem, 1.05vw, 1.125rem);
  line-height: 1.75;
  color: hsl(var(--muted-foreground));
}
.chapter .body strong { font-weight: 600; color: hsl(var(--foreground)); }
.chapter .body .dim { color: hsl(var(--foreground) / 0.6); }
[dir="rtl"] .chapter .body .dim { color: hsl(var(--muted-foreground)); }
.built { margin-top: 40px; }
.chips { list-style: none; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li {
  border: 1px solid var(--border-subtle);
  background: hsl(var(--surface));
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.875rem;
  line-height: 1.43;
}

/* ── The pass-line sheet ─────────────────────────────────────────────── */
.sheet-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 24px;
  border-top: 2px solid hsl(var(--foreground));
  padding-top: 16px;
  padding-bottom: 8px;
}
.sheet-head .eyebrow { color: hsl(var(--foreground)); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 0.875rem; color: hsl(var(--muted-foreground)); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw-pass { width: 20px; height: 8px; border-radius: 999px; background: var(--local-accent); }
.sw-fail { width: 20px; height: 8px; border-radius: 999px; background: hsl(var(--foreground) / 0.1); }
.sw-bead { width: 10px; height: 10px; border-radius: 999px; background: hsl(var(--foreground)); }
.sw-demo { width: 11px; height: 11px; border-radius: 999px; border: 2px solid hsl(var(--foreground)); }

.checks { list-style: none; }
.check { border-bottom: 1px solid var(--border-subtle); padding-block: 24px; }
.check-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 24px; }
.check-head h3 { font-weight: 400; font-size: 1rem; line-height: 1.4; }
.check-head .pass { font-weight: 500; font-size: 1rem; line-height: 1.4; color: var(--local-accent-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (min-width: 768px) { .check-head h3, .check-head .pass { font-size: 1.0625rem; } }

/* Track geometry. Every position is inset-inline-start, so RTL mirrors it. */
.track { margin-top: 20px; }
.track.has-demo { margin-top: 44px; }
.rail { position: relative; height: 16px; }
.seg-bar {
  position: absolute;
  top: 50%;
  height: 8px;
  transform: translateY(-50%);
  overflow: clip;
  background: hsl(var(--foreground) / 0.1);
}
.seg-bar.r-start { border-start-start-radius: 999px; border-end-start-radius: 999px; }
.seg-bar.r-end   { border-start-end-radius: 999px; border-end-end-radius: 999px; }
/* Google's "poor" has no ceiling: an open cap, hatched, off the numbered scale. */
.seg-bar.open {
  background-color: hsl(var(--foreground) / 0.1);
  background-image: repeating-linear-gradient(-45deg, hsl(var(--foreground) / 0.3) 0 1.5px, transparent 1.5px 5px);
}
.seg-bar.clear { background: transparent; }
.fill { display: block; width: 100%; height: 100%; background: var(--local-accent); }
.fill.from-start { transform-origin: left center; }
.fill.from-end   { transform-origin: right center; }
[dir="rtl"] .fill.from-start { transform-origin: right center; }
[dir="rtl"] .fill.from-end   { transform-origin: left center; }

/* The line: a bead on the thread, like a sign-off - a point, not a cut. */
.bead {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-top: -7px;
  margin-inline-start: -7px;
  border-radius: 999px;
  background: hsl(var(--foreground));
  box-shadow: 0 0 0 4px hsl(var(--background));
  z-index: 2;
}

/* Demo reading: a hollow dot that travels to its value, with a pin above. */
.demo {
  position: absolute;
  top: 50%;
  width: 0;
  height: 0;
  z-index: 3;
}
.demo .dot {
  position: absolute;
  width: 16px;
  height: 16px;
  top: -8px;
  inset-inline-start: -8px;
  border-radius: 999px;
  border: 2px solid hsl(var(--foreground));
  background: hsl(var(--background));
}
.demo .leader {
  position: absolute;
  bottom: 8px;
  inset-inline-start: -0.5px;
  width: 1px;
  height: 12px;
  background: hsl(var(--foreground) / 0.45);
}
.demo .pin {
  position: absolute;
  bottom: 20px;
  inset-inline-start: -8px;
  white-space: nowrap;
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}
.demo .pin b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: hsl(var(--foreground)); font-variant-numeric: tabular-nums; }
[dir="rtl"] .demo .pin b { font-family: var(--font-vazirmatn); font-size: 14px; }

.axis { position: relative; height: 18px; margin-top: 8px; font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
[dir="rtl"] .axis { font-family: var(--font-vazirmatn); font-size: 13px; }
.axis span { position: absolute; top: 0; white-space: nowrap; }
.axis .a-start { inset-inline-start: 0; }
.axis .a-end { inset-inline-end: 0; }
.axis .a-at { transform: translateX(-50%); }
[dir="rtl"] .axis .a-at { transform: translateX(50%); }
.axis .a-line { color: hsl(var(--foreground)); font-weight: 500; }

.zones { position: relative; margin-top: 6px; min-height: 30px; }
.zones span { position: absolute; top: 0; padding-inline-end: 4px; }
.zones .z-good { color: var(--local-accent-text); }
.source { margin-top: 10px; }
.source b { font-weight: 500; color: hsl(var(--foreground)); }

/* Grade ladder, worst to best; the line sits between B and A. */
.ladder { position: relative; margin-top: 20px; }
.ladder ol { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.ladder li {
  display: flex; align-items: center; justify-content: center;
  height: 32px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1;
  background: hsl(var(--foreground) / 0.04);
  color: hsl(var(--muted-foreground));
}
.ladder li.ok {
  background: hsl(158 64% 30% / 0.1);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--local-accent) 50%, transparent);
  color: hsl(var(--foreground));
  font-weight: 500;
}
[data-theme="dark"] .ladder li.ok { background: hsl(158 36% 49% / 0.1); }
.ladder .bead { top: 16px; }

/* Zero counts: one numeral, fixed. */
.zero { margin-top: 16px; display: flex; align-items: flex-end; gap: 16px; }
.zero .clip { overflow: clip; padding-block: 4px; line-height: 0; }
.zero .digit {
  display: inline-block;
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: clamp(3rem, 5vw, 4rem);
  line-height: 1;
  color: var(--local-accent-text);
  font-variant-numeric: tabular-nums;
}
/* Latin 0 in both locales, deliberately: the Arabic-Indic zero is a dot-sized
   glyph that reads as a bullet at display size, and this numeral quotes tool
   output (eslint / npm audit print "0"). Every other number is localized. */
.zero .cap { display: grid; gap: 2px; padding-bottom: 8px; }

.footnote { margin-top: 16px; font-size: 0.875rem; line-height: 1.6; color: hsl(var(--muted-foreground)); max-width: 60ch; }
.footnote .sw-demo { display: inline-block; vertical-align: -1px; margin-inline-end: 6px; }

/* ── Draw-in, once. The markup is the finished sheet; only .js hides it. ── */
.js .sheet .bead { transition: transform var(--dur-fast) var(--ease-strong) var(--d, 0ms); }
.js .sheet .fill { transition: transform var(--dur-slow) var(--ease-gentle) var(--d, 0ms); }
.js .sheet .ladder li { transition: opacity var(--dur-fast) var(--ease-smooth) var(--d, 0ms); }
.js .sheet .zero .digit { transition: transform var(--dur-base) var(--ease-strong) var(--d, 0ms); }
.js .sheet .demo { transition: opacity 200ms var(--ease-smooth); }
.js .sheet:not(.drawn) .bead { transform: scale(0); }
.js .sheet:not(.drawn) .fill { transform: scaleX(0); }
.js .sheet:not(.drawn) .ladder li { opacity: 0; }
.js .sheet:not(.drawn) .zero .digit { transform: translateY(105%); }
.js .sheet:not(.drawn) .demo { opacity: 0; }
.sheet.instant *, .sheet.instant { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; transition-delay: 0ms !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="toolbar" dir="ltr" role="group" aria-label="Prototype controls">
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ar" aria-pressed="false" lang="ar">AR</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
    <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
  </div>
</div>

<p class="proto-label" dir="ltr">Prototype A — Zoned tracks · /standards pass-line sheet</p>

<div class="container stub-above" aria-hidden="true">
  <div class="rule"></div>
  <p id="stub-above"></p>
</div>

<section id="standards" aria-labelledby="sr-label">
  <h2 id="sr-label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></h2>
  <div class="container" id="chapters"></div>
</section>

<div class="stub-below" aria-hidden="true">
  <div class="container"><p id="stub-below"></p></div>
</div>

<script>
(function () {
  "use strict";

  /* STANDARDS — copied verbatim from
     apps/www/app/[locale]/(main)/(marketing)/standards/pass-line.tsx.
     Nothing on this page is a number that is not either here or in ZONES. */
  var STANDARDS = [
    { id: "code", checks: [
      { id: "lint", kind: "zero" },
      { id: "coverage", kind: "scale", min: 0, max: 100, threshold: 80, pass: "over", unit: "percent" },
      { id: "apiDocs", kind: "rule" }
    ] },
    { id: "performance", checks: [
      { id: "lighthouse", kind: "scale", min: 0, max: 100, threshold: 95, pass: "atLeast", unit: "score" },
      { id: "lcp", kind: "scale", min: 0, max: 4, threshold: 2.5, pass: "under", unit: "seconds" },
      { id: "cls", kind: "scale", min: 0, max: 0.25, threshold: 0.1, pass: "under", unit: "plain" }
    ] },
    { id: "accessibility", checks: [
      { id: "lighthouse", kind: "scale", min: 0, max: 100, threshold: 95, pass: "atLeast", unit: "score" },
      { id: "aria", kind: "zero" },
      { id: "contrast", kind: "scale", min: 1, max: 21, threshold: 4.5, pass: "atLeast", unit: "ratio" }
    ] },
    { id: "security", checks: [
      { id: "headers", kind: "grade", grades: ["F", "E", "D", "C", "B", "A", "A+"], passFrom: "A" },
      { id: "cves", kind: "zero" },
      { id: "patches", kind: "rule" }
    ] }
  ];
  var CHECK_COUNT = STANDARDS.reduce(function (s, x) { return s + x.checks.length; }, 0);

  /* Google's published Core Web Vitals bands (web.dev/articles/vitals):
     LCP good <= 2.5 s, poor > 4 s; CLS good <= 0.1, poor > 0.25.
     "poor" has no upper bound, so it is drawn as an open cap off the scale. */
  var ZONES = {
    "performance.lcp": [2.5, 4],
    "performance.cls": [0.1, 0.25]
  };

  /* DEMO readings — illustrative only, labelled as such on screen.
     The real page would read this page's own LCP/CLS with web-vitals. */
  var DEMO = {
    "performance.lcp": { value: 1.4, decimals: 1 },
    "performance.cls": { value: 0.03, decimals: 2 }
  };

  var SCALE_OF_ZONED = 86; // percent of the rail the numbered scale takes; the rest is the open "poor" cap

  var COPY = {
    en: {
      stubAbove: "{s} standards · {c} checks · one gate every deploy passes through",
      stubBelow: "The gate — Accountability built in.",
      sectionLabel: "The standards and their pass lines",
      builtWith: "Built with",
      passLine: "The pass line",
      legend: { pass: "Passes", fail: "Fails", line: "Our line", demo: "Demo reading" },
      pass: { atLeast: "{v} or higher", over: "Over {v}", under: "Under {v}", zero: "None allowed", grade: "Grade {v} or higher" },
      unit: { seconds: "{v} s", percent: "{v}%", ratio: "{v}:1" },
      zones: { good: "Good", ni: "Needs improvement", poor: "Poor" },
      cwvSource: "Bands: <b>Google Core Web Vitals</b>. Our line is the edge of good.",
      ladderSource: "Ladder: <b>securityheaders.com</b>, worst to best.",
      zero: { allowed: "Allowed", stops: "{one} stops the deploy" },
      demoNote: "Demo readings are illustrative - not measurements. On the live page these two dots are this page's own LCP and CLS, read in your browser.",
      categories: {
        code: {
          title: "Clean, Maintainable Code",
          description: "Code is read far more often than it is written. We optimize for clarity, consistency, and maintainability - <dim>not clever shortcuts that create future debt.</dim> Strict typing catches the class of bugs that QA cycles miss, and a component-based architecture means a new developer can trace a feature from route to render without a walkthrough call. This matters commercially: the codebase you inherit at handoff is the one your next hire has to extend, and unreadable code is a recurring tax on every future change.",
          requirements: "Strict TypeScript | Component-based architecture | Automated testing | Continuous integration",
          checks: { lint: { label: "Lint errors" }, coverage: { label: "Test coverage" }, apiDocs: { label: "API endpoints documented", value: "Every endpoint" } }
        },
        performance: {
          title: "Speed as a Revenue Driver",

  var root = document.documentElement;
  var chaptersEl = document.getElementById("chapters");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var lang = "en";
  var drawn = {};      // sheet id -> true once it has played
  var observer = null;

  /* ── Formatting (mirrors lib/utils/number.ts localizeNumbers) ─────── */
  var AR = "٠١٢٣٤٥٦٧٨٩";
  function localize(s) {
    s = String(s);
    if (lang !== "ar") return s;
    s = s.replace(/\d/g, function (d) { return AR[d]; });
    s = s.replace(/([٠-٩])\.(?=[٠-٩])/g, "$1٫");
    s = s.replace(/([٠-٩])(\s*)%/g, "$1$2٪");
    return s;
  }
  function fill(tpl, map) { return tpl.replace(/\{(\w+)\}/g, function (_, k) { return map[k]; }); }
  function fmt(value, unit) {
    var t = COPY[lang].unit[unit];
    return localize(t ? fill(t, { v: String(value) }) : String(value));
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function marks(s) {
    return esc(s)
      .replace(/&lt;strong&gt;(.*?)&lt;\/strong&gt;/g, "<strong>$1</strong>")
      .replace(/&lt;dim&gt;(.*?)&lt;\/dim&gt;/g, '<span class="dim">$1</span>');
  }
  function pad2(n) { return localize(n < 10 ? "0" + n : String(n)); }

  /* ── Tracks ───────────────────────────────────────────────────────── */
  function pctOf(check, value, span) {
    return ((value - check.min) / (check.max - check.min)) * span;
  }
  function at(p) { return "inset-inline-start:" + p.toFixed(3) + "%"; }
  function between(a, b, gapStart, gapEnd) {
    // A segment from a% to b% with a hairline of ground at each join.
    return "inset-inline-start:calc(" + a.toFixed(3) + "% + " + gapStart + "px);width:calc(" + (b - a).toFixed(3) + "% - " + (gapStart + gapEnd) + "px)";
  }

  function scaleTrack(stdId, check) {
    var key = stdId + "." + check.id;
    var zones = ZONES[key];
    var demo = DEMO[key];
    var c = COPY[lang];
    var span = zones ? SCALE_OF_ZONED : 100;
    var t = pctOf(check, check.threshold, span);
    var h = "";

    if (zones) {
      // good | needs improvement | poor (open cap). The pass band is "good",
      // grown from our line back towards zero.
      var ni = pctOf(check, zones[1], span);
      h += '<span class="seg-bar r-start" style="' + between(0, t, 0, 2) + '"><span class="fill from-end" data-band></span></span>';
      h += '<span class="seg-bar" style="' + between(t, ni, 2, 3) + '"></span>';
      h += '<span class="seg-bar open r-end" style="' + between(ni, 100, 3, 0) + '"></span>';
    } else {
      h += '<span class="seg-bar r-start r-end" style="inset-inline:0"></span>';
      var passesUp = check.pass !== "under";
      h += passesUp
        ? '<span class="seg-bar clear r-end" style="' + between(t, 100, 0, 0) + '"><span class="fill from-start" data-band></span></span>'
        : '<span class="seg-bar clear r-start" style="' + between(0, t, 0, 0) + '"><span class="fill from-end" data-band></span></span>';
    }
    h += '<span class="bead" data-mark style="' + at(t) + '"></span>';

    if (demo) {
      h += '<span class="demo" data-demo data-from="' + pctOf(check, check.min, span) + '" data-to="' + pctOf(check, demo.value, span) +
        '" data-min="' + check.min + '" data-value="' + demo.value + '" data-decimals="' + demo.decimals + '" data-unit="' + check.unit +
        '" style="' + at(pctOf(check, demo.value, span)) + '">' +
        '<span class="leader"></span><span class="dot"></span>' +
        '<span class="pin"><span class="mono-cap">' + esc(c.legend.demo) + '</span><b data-demo-value>' + fmt(demo.value.toFixed(demo.decimals), check.unit) + '</b></span></span>';
    }

    var axis = '<span class="a-start">' + fmt(check.min, check.unit) + '</span>';
    // The line's own number, unless it would crowd an end (the header says it anyway).
    if (t > 12 && t < 88) axis += '<span class="a-at a-line" style="' + at(t) + '">' + fmt(check.threshold, check.unit) + '</span>';
    axis += zones
      ? '<span class="a-at" style="' + at(span) + '">' + fmt(check.max, check.unit) + '</span>'
      : '<span class="a-end">' + fmt(check.max, check.unit) + '</span>';

    var out = '<div class="track' + (demo ? " has-demo" : "") + '" aria-hidden="true"><div class="rail">' + h + '</div><div class="axis">' + axis + '</div>';
    if (zones) {
      var niP = pctOf(check, zones[1], span);
      out += '<div class="zones">' +
        '<span class="mono-cap z-good" style="' + at(0) + ';width:' + t.toFixed(3) + '%">' + esc(c.zones.good) + '</span>' +
        '<span class="mono-cap" style="' + at(t) + ';width:' + (niP - t).toFixed(3) + '%;padding-inline-start:6px">' + esc(c.zones.ni) + '</span>' +
        '<span class="mono-cap" style="' + at(niP) + ';width:' + (100 - niP).toFixed(3) + '%;padding-inline-start:6px">' + esc(c.zones.poor) + '</span>' +
        '</div>';
    }
    return out + '</div>';
  }

  function gradeTrack(check) {
    var first = check.grades.indexOf(check.passFrom);
    var n = check.grades.length;
    var cells = check.grades.map(function (g, i) {
      return '<li data-grade class="' + (i >= first ? "ok" : "") + '">' + esc(g) + '</li>';
    }).join("");
    // The line between the last failing grade and the first passing one.
    // Cells are (W - 6·4px)/7 wide, so the gap centre sits at first·W/n + (first/n − ½)·4px.
    var line = "calc(" + (first * 100 / n).toFixed(3) + "% + " + ((first / n - 0.5) * 4).toFixed(3) + "px)";
    return '<div class="ladder" aria-hidden="true"><ol>' + cells + '</ol><span class="bead" data-mark style="inset-inline-start:' + line + '"></span></div>' +
      '<p class="mono-cap source">' + COPY[lang].ladderSource + '</p>';
  }

  function zeroCount() {
    var c = COPY[lang];
    return '<div class="zero" aria-hidden="true"><span class="clip"><span class="digit" data-zero>0</span></span>' +
      '<span class="cap"><span class="mono-cap">' + esc(c.zero.allowed) + '</span><span class="mono-cap">' + esc(fill(c.zero.stops, { one: localize(1) })) + '</span></span></div>';
  }

  function passText(stdId, check) {
    var c = COPY[lang];
    switch (check.kind) {
      case "scale": return fill(c.pass[check.pass], { v: fmt(check.threshold, check.unit) });
      case "zero": return c.pass.zero;
      case "grade": return fill(c.pass.grade, { v: check.passFrom });
      case "rule": return c.categories[stdId].checks[check.id].value;
    }
  }

  function sheet(std) {
    var c = COPY[lang];
    var hasDemo = std.checks.some(function (k) { return DEMO[std.id + "." + k.id]; });
    var hasZones = std.checks.some(function (k) { return ZONES[std.id + "." + k.id]; });
    var hasLine = std.checks.some(function (k) { return k.kind === "scale" || k.kind === "grade"; });

    var legend = '<span><span class="sw-pass"></span>' + esc(c.legend.pass) + '</span>' +
      '<span><span class="sw-fail"></span>' + esc(c.legend.fail) + '</span>' +
      (hasLine ? '<span><span class="sw-bead"></span>' + esc(c.legend.line) + '</span>' : "") +
      (hasDemo ? '<span><span class="sw-demo"></span>' + esc(c.legend.demo) + '</span>' : "");

    var rows = std.checks.map(function (check) {
      var label = c.categories[std.id].checks[check.id].label;
      var body = "";
      if (check.kind === "scale") body = scaleTrack(std.id, check);
      if (check.kind === "grade") body = gradeTrack(check);
      if (check.kind === "zero") body = zeroCount();
      var src = ZONES[std.id + "." + check.id] ? '<p class="mono-cap source">' + c.cwvSource + '</p>' : "";
      return '<li class="check"><div class="check-head"><h3>' + esc(label) + '</h3><p class="pass">' + esc(passText(std.id, check)) + '</p></div>' + body + src + '</li>';
    }).join("");

    var note = hasDemo ? '<p class="footnote"><span class="sw-demo" aria-hidden="true"></span>' + esc(c.demoNote) + '</p>' : "";

    return '<div class="sheet" data-sheet="' + std.id + '"><div class="sheet-head"><p class="eyebrow">' + esc(c.passLine) + '</p><p class="legend" aria-hidden="true">' + legend + '</p></div>' +
      '<ul class="checks">' + rows + '</ul>' + note + '</div>';
  }

  function render() {
    var c = COPY[lang];
    document.getElementById("stub-above").textContent = localize(fill(c.stubAbove, { s: STANDARDS.length, c: CHECK_COUNT }));
    document.getElementById("stub-below").textContent = c.stubBelow;
    document.getElementById("sr-label").textContent = c.sectionLabel;

    chaptersEl.innerHTML = STANDARDS.map(function (std, i) {
      var cat = c.categories[std.id];
      var chips = cat.requirements.split(" | ").map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("");
      return '<article class="chapter" id="standard-' + std.id + '" aria-labelledby="t-' + std.id + '">' +
        '<div class="text"><span class="idx">' + pad2(i + 1) + '</span>' +
        '<h2 id="t-' + std.id + '">' + esc(cat.title) + '</h2>' +
        '<p class="body">' + marks(cat.description) + '</p>' +
        '<div class="built"><p class="eyebrow">' + esc(c.builtWith) + '</p><ul class="chips">' + chips + '</ul></div></div>' +
        sheet(std) + '</article>';
    }).join("");

    arm();
  }

  /* ── Draw-in: once per sheet, when its top reaches 60% of the viewport
     (MOTION.trigger.inView). Beads drop in, then each pass band grows out of
     its bead towards the side that passes, then the demo dot travels. ── */
  var STAGGER = 60, FAST = 400, SLOW = 1000, TRAVEL = 1000;

  function schedule(sheetEl) {
    var beads = sheetEl.querySelectorAll("[data-mark]");
    var bands = sheetEl.querySelectorAll("[data-band]");
    var grades = sheetEl.querySelectorAll("[data-grade]");
    var zeros = sheetEl.querySelectorAll("[data-zero]");
    beads.forEach(function (el, i) { el.style.setProperty("--d", i * STAGGER + "ms"); });
    var bandsAt = Math.max(0, (beads.length - 1) * STAGGER + FAST - 200);
    bands.forEach(function (el, i) { el.style.setProperty("--d", bandsAt + i * STAGGER + "ms"); });
    grades.forEach(function (el, i) { el.style.setProperty("--d", bandsAt + i * STAGGER + "ms"); });
    zeros.forEach(function (el, i) { el.style.setProperty("--d", i * STAGGER + "ms"); });
    return bandsAt + (bands.length ? (bands.length - 1) * STAGGER + SLOW * 0.6 : 0);
  }

  // cubic-bezier(0.23, 1, 0.32, 1) — MOTION.ease.strong, solved for x.
  function bezier(p1x, p1y, p2x, p2y) {
    function a(a1, a2) { return 1 - 3 * a2 + 3 * a1; }
    function b(a1, a2) { return 3 * a2 - 6 * a1; }
    function cc(a1) { return 3 * a1; }
    function calc(t, a1, a2) { return ((a(a1, a2) * t + b(a1, a2)) * t + cc(a1)) * t; }
    function slope(t, a1, a2) { return 3 * a(a1, a2) * t * t + 2 * b(a1, a2) * t + cc(a1); }
    return function (x) {
      var t = x;
      for (var i = 0; i < 8; i++) {
        var s = slope(t, p1x, p2x);
        if (s === 0) break;
        t -= (calc(t, p1x, p2x) - x) / s;
      }
      return calc(Math.min(1, Math.max(0, t)), p1y, p2y);
    };
  }
  var strong = bezier(0.23, 1, 0.32, 1);

  function travel(demoEl, delay) {
    var from = +demoEl.dataset.from, to = +demoEl.dataset.to;
    var min = +demoEl.dataset.min, value = +demoEl.dataset.value, dec = +demoEl.dataset.decimals, unit = demoEl.dataset.unit;
    var out = demoEl.querySelector("[data-demo-value]");
    demoEl.style.insetInlineStart = from + "%";
    out.textContent = fmt(min.toFixed(dec), unit);
    setTimeout(function () {
      demoEl.style.opacity = "1";
      var t0 = null;
      function step(now) {
        if (t0 === null) t0 = now;
        var k = Math.min(1, (now - t0) / TRAVEL);
        var e = strong(k);
        demoEl.style.insetInlineStart = (from + (to - from) * e) + "%";
        out.textContent = fmt((min + (value - min) * e).toFixed(dec), unit);
        if (k < 1) requestAnimationFrame(step);
        else demoEl.style.opacity = "";
      }
      requestAnimationFrame(step);
    }, delay);
  }

  function play(sheetEl) {
    var id = sheetEl.dataset.sheet;
    if (drawn[id]) return;
    drawn[id] = true;
    var demoAt = schedule(sheetEl);
    // Two frames so the hidden state is painted before the transition runs.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        sheetEl.classList.add("drawn");
        sheetEl.querySelectorAll("[data-demo]").forEach(function (d, i) { travel(d, demoAt + i * STAGGER * 2); });
      });
    });
  }

  function arm() {
    if (observer) observer.disconnect();
    var sheets = chaptersEl.querySelectorAll("[data-sheet]");
    sheets.forEach(function (s) {
      // Already played (a language switch re-renders): show finished, no replay.
      if (drawn[s.dataset.sheet] || reduce.matches || !("IntersectionObserver" in window)) {
        drawn[s.dataset.sheet] = true;
        s.classList.add("instant", "drawn");
      }
    });
    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { observer.unobserve(e.target); play(e.target); }
      });
    }, { rootMargin: "0px 0px -40% 0px" });
    sheets.forEach(function (s) { if (!drawn[s.dataset.sheet]) observer.observe(s); });
  }

  /* ── Toggles ──────────────────────────────────────────────────────── */
  function setLang(next) {
    lang = next;
    root.lang = next;
    root.dir = next === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.lang === next ? "true" : "false");
    });
    render();
  }
  function setTheme(next) {
    root.setAttribute("data-theme", next);
    document.querySelectorAll("[data-theme-set]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.themeSet === next ? "true" : "false");
    });
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.dataset.lang); });
  });
  document.querySelectorAll("[data-theme-set]").forEach(function (b) {
    b.addEventListener("click", function () { setTheme(b.dataset.themeSet); });
  });

  // ?lang=ar&theme=dark for review links and headless checks.
  var q = new URLSearchParams(location.search);
  setTheme(q.get("theme") || root.getAttribute("data-theme") || "light");
  setLang(q.get("lang") === "ar" ? "ar" : "en");
})();
</script>
</body>
</html>
