  --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);

  --section-y: clamp(6rem, 11vw, 10rem);
}
html[data-theme="dark"] {

  --muted: hsl(0 0% 62%);

  --sheet: hsl(0 0% 10%);

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--page); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow-x: clip; }

p, ul, ol { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
.mono { font-family: "Geist Mono", ui-monospace, monospace; }

/* ── prototype chrome ── */
.bar { position: fixed; inset-block-start: 12px; inset-inline: 12px; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
.bar > * { pointer-events: auto; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: hsl(0 0% 12% / .85); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); }
.seg button { padding: 7px 12px; border-radius: 9px; color: hsl(0 0% 80%); font: 500 13px/1 Inter, sans-serif; }
.seg button[aria-pressed="true"] { background: #fff; color: hsl(0 0% 8%); }
.note { position: fixed; inset-block-end: 12px; inset-inline-start: 12px; z-index: 50; max-width: 27rem; padding: 12px 14px; border-radius: 12px; background: hsl(0 0% 12% / .92); backdrop-filter: blur(12px); border: 1px solid hsl(0 0% 100% / .1); color: hsl(0 0% 82%); font: 400 12.5px/1.5 Inter, sans-serif; direction: ltr; text-align: left; }

.stub { background: var(--bg); padding: 16vh 0; border-bottom: 1px solid var(--border); }
.stub p { font: 300 clamp(1.5rem, 3vw, 2.5rem)/1.1 Outfit, sans-serif; opacity: .3; }

/* ── section frame (AuditSection) ── */
.scene { background: var(--bg); color: var(--fg); padding-block: var(--section-y); }
.head { display: grid; gap: 1.1rem; max-width: 52rem; margin-bottom: clamp(3.5rem, 6vw, 5.5rem); }
.title { font-size: clamp(2.25rem, 5vw, 4rem); line-height: 1.04; letter-spacing: -.03em; font-weight: 300; text-wrap: balance; }
.title .acc { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.desc { font-size: 1.0625rem; line-height: 1.65; color: var(--muted); max-width: 40rem; }
.honesty { margin-top: 3rem; font-size: .8125rem; line-height: 1.6; color: var(--muted); max-width: 40rem; }
.rv { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--ease-smooth), transform .7s var(--ease-smooth); transition-delay: calc(var(--i, 0) * 60ms); }
.rv.in { opacity: 1; transform: none; }
.lbl { font-family: "Geist Mono", monospace; font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .lbl { font-family: Vazirmatn, sans-serif; letter-spacing: 0; font-size: .8125rem; }

.tag { font-size: .8125rem; color: var(--muted); white-space: nowrap; }
.tag b { font-weight: 500; color: var(--fg); }
.tag.hi b { color: var(--accent); }

/* ── A · the sort, played once ── */
.a-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-strong); }

.a-btns { margin-inline-start: auto; display: flex; gap: 1.25rem; }
.a-btns button { font-size: .9375rem; color: var(--muted); border-bottom: 1px solid transparent; padding-bottom: 2px; transition: color .3s; }
.a-btns button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.a-list { position: relative; }
.a-group { display: grid; gap: .25rem 2rem; padding: 2rem 0 .75rem; border-bottom: 1px solid var(--border-strong); animation: fadeIn .6s var(--ease-smooth) both; animation-delay: .35s; }
@media (min-width: 900px) { .a-group { grid-template-columns: 3rem minmax(0, 1fr) minmax(0, 22rem); align-items: baseline; } }
.a-group .gn { font-family: Outfit, sans-serif; font-size: 1.5rem; color: var(--accent); }
.a-group h3 { font-size: clamp(1.625rem, 2.6vw, 2.25rem); font-weight: 300; letter-spacing: -.025em; }
.a-group p { font-size: .9375rem; line-height: 1.55; color: var(--muted); }

.a-row { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: .35rem 2rem; align-items: baseline; padding: .95rem 0; border-bottom: 1px solid var(--border); will-change: transform; }

.a-row .n { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.a-row .nm { font-size: 1.0625rem; line-height: 1.4; }
.a-row .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
@media (min-width: 900px) { .a-row .tags { grid-column: 3; } }
.sorted .a-row[data-g="first"] .n { color: var(--accent); }

/* ── B · two questions, one map ── */
.b-map { position: relative; display: grid; grid-template-columns: 2.5rem 1fr; grid-template-rows: 1fr auto; }
.b-yaxis { grid-row: 1; display: flex; align-items: center; justify-content: center; }
.b-yaxis span { writing-mode: vertical-rl; transform: rotate(180deg); }
[dir="rtl"] .b-yaxis span { transform: none; }
.b-xaxis { grid-column: 2; display: flex; justify-content: space-between; padding-top: 1rem; }
.b-quads { grid-row: 1; grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; border-inline-start: 2px solid var(--fg); border-bottom: 2px solid var(--fg); }
.b-q { padding: clamp(1.25rem, 2.5vw, 2.25rem); min-height: 17rem; }

.b-q:nth-child(2) { border-bottom: 1px solid var(--border-strong); }
.b-q:nth-child(3) { border-inline-end: 1px solid var(--border-strong); }
.b-q .top { display: flex; align-items: baseline; gap: .75rem; }

.b-q h3 { font-size: clamp(1.25rem, 1.9vw, 1.625rem); font-weight: 400; letter-spacing: -.015em; }
.b-q .why { margin-top: .6rem; font-size: .875rem; line-height: 1.55; color: var(--muted); max-width: 34ch; }

.b-q li { padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .9375rem; line-height: 1.4; }
.b-corner { font-size: .75rem; }
.b-mobile-axes { display: none; }
@media (max-width: 767px) {
  .b-map { display: block; }

  .b-mobile-axes { display: block; margin-bottom: 1.5rem; font-size: .9375rem; color: var(--muted); }

.c-layout { display: grid; gap: 3rem; }

.c-q { font-family: Outfit, sans-serif; font-weight: 300; font-size: clamp(1.75rem, 2.8vw, 2.5rem); line-height: 1.12; letter-spacing: -.025em; text-wrap: balance; padding: 1.25rem 0; border-bottom: 1px solid var(--border); }
.c-q:first-of-type { border-top: 1px solid var(--border-strong); }
.c-q .k { display: block; margin-bottom: .5rem; }
.c-side .after { margin-top: 1.5rem; font-size: 1rem; line-height: 1.6; color: var(--muted); max-width: 34ch; }
.sheet { background: var(--sheet); border: 1px solid var(--border-strong); border-radius: var(--panel-md); padding: clamp(1.5rem, 4vw, 3.5rem); box-shadow: 0 1px 0 var(--border), 0 30px 60px -40px hsl(0 0% 0% / .25); }
.sheet-top { display: flex; justify-content: space-between; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 2px solid var(--fg); }
.sheet-title { font-size: clamp(1.5rem, 2.4vw, 2rem); letter-spacing: -.02em; margin-top: 1.75rem; }
.c-sec { display: grid; gap: .75rem 2rem; padding-top: 2rem; }
@media (min-width: 760px) { .c-sec { grid-template-columns: minmax(0, 1fr) 12rem; } }
.c-sec h4 { font: 400 1.125rem/1.3 Outfit, sans-serif; display: flex; gap: .6rem; align-items: baseline; margin: 0 0 .5rem; }
[dir="rtl"] .c-sec h4 { font-family: Vazirmatn, sans-serif; }
.c-sec h4 .gn { color: var(--accent); }
.c-sec li { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: .25rem 1rem; padding: .7rem 0; border-top: 1px solid var(--border); }
.c-sec li .n { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: .15rem; }
.c-sec li .nm { font-size: .9688rem; line-height: 1.4; }
.c-sec li .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: .15rem 1rem; }
.c-sec li .tag { font-size: .75rem; }
.c-sec .margin { font-size: .8125rem; line-height: 1.55; color: var(--muted); }
@media (min-width: 760px) { .c-sec .margin { border-inline-start: 1px solid var(--border); padding-inline-start: 1rem; padding-top: 2.1rem; } }
.sheet-foot { margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid var(--border-strong); font-size: .8125rem; color: var(--muted); }
</style>
</head>

      structuredData: "البيانات المنظمة وتغطية الوصف", analytics: "سلامة التحليلات والأحداث",
      pipeline: "خط البناء ومسار التراجع", environmentParity: "تطابق البيئات",
      contentModel: "نموذج المحتوى ومخاطر الترحيل", backupRestore: "النسخ الاحتياطي والاستعادة، مُختبَرَين فعلاً",
      integrationFailure: "أنماط فشل الخدمات الخارجية", accountControl: "التحكم في المستودع والنطاق والحسابات",
    },
  },
};
const NOTES = {
  a: "<b>Idea:</b> show the claim happening. The list arrives as a scan finds it — unordered — and when it scrolls into view it sorts itself once into three groups (Fix first / Plan next / When convenient). One toggle to see it again; no jargon, every row says damage and work in words. Motion = the proof (cost-curve rule: a one-shot demonstration). Replaces the 3 tabs + leverage bars.",
  b: "<b>Idea:</b> the rule as a picture everyone already reads — two axes (damage if left × work to fix), four quadrants, numbered in the order you work: 1 Fix first, 2 Tidy up, 3 Plan next, 4 Leave on purpose. Static; the checks sit inside their quadrant as plain text, no dots to decode (RUL-007). Below 768 it stacks as four numbered groups.",
  c: "<b>Idea:</b> what you buy is a written report, so show the page of it that matters — the fix order — as the one document box on the page (consulting rule: a box only for a document). The two questions sit beside it, large and sticky; the page is sorted into three sections with a plain reason in its margin. Static, calmest.",
};
const state = { v: "a", lang: "en", theme: "light", sorted: false, played: false };
const digits = (s, lang) => lang === "ar" ? String(s).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(s);
const pad = (n, lang) => digits(String(n).padStart(2, "0"), lang);
const tags = (c, k) => `<span class="tag ${k.risk >= 4 ? "hi" : ""}">${c.dmg}: <b>${c.dmgV[k.risk]}</b></span><span class="tag">${c.work}: <b>${c.workV[k.effort]}</b></span>`;

function heading(c) {
  return `<header class="head rv"><p class="eyebrow">${c.eyebrow}</p>
    <h2 class="title">${c.t1} <span class="acc">${c.t2}</span></h2><p class="desc">${c.desc}</p></header>`;
}
const honesty = c => `<p class="honesty rv">${c.honesty}</p>`;
const sortedChecks = () => GROUPS.flatMap(g => CHECKS.filter(k => group(k) === g).sort(byLeverage));

/* ── A ── */
function aListHTML(c, lang) {
  if (!state.sorted) return CHECKS.map((k, i) => aRow(c, lang, k, i)).join("");
  let i = 0, html = "";
  for (const g of GROUPS) {
    html += `<div class="a-group"><span class="gn">${digits(GROUPS.indexOf(g) + 1, lang)}</span><h3>${c.g[g][0]}</h3><p>${c.g[g][1]}</p></div>`;
    for (const k of CHECKS.filter(k => group(k) === g).sort(byLeverage)) html += aRow(c, lang, k, i++);
  }
  return html;
}
const aRow = (c, lang, k, i) => `<div class="a-row" data-id="${k.id}" data-g="${group(k)}"><span class="n">${pad(i + 1, lang)}</span><span class="nm">${c.names[k.id]}</span><span class="tags">${tags(c, k)}</span></div>`;
function renderA(c, lang) {
  return heading(c) + `<div class="rv a-wrap">
    <div class="a-ctl"><p class="a-status" id="a-status" aria-live="polite">${state.sorted ? c.aStatusSorted : c.aStatusFound}</p>
      <div class="a-btns"><button data-s="0" aria-pressed="${!state.sorted}">${c.aFound}</button><button data-s="1" aria-pressed="${state.sorted}">${c.aSorted}</button></div></div>
    <div class="a-list ${state.sorted ? "sorted" : ""}" id="a-list">${aListHTML(c, lang)}</div></div>` + honesty(c);
}
function setSorted(v) {
  if (v === state.sorted) return;
  const c = COPY[state.lang], list = document.getElementById("a-list");
  const before = new Map([...list.querySelectorAll(".a-row")].map(r => [r.dataset.id, r.getBoundingClientRect().top]));
  state.sorted = v;
  list.classList.toggle("sorted", v);
  list.innerHTML = aListHTML(c, state.lang);
  document.getElementById("a-status").textContent = v ? c.aStatusSorted : c.aStatusFound;
  document.querySelectorAll(".a-btns button").forEach(b => b.setAttribute("aria-pressed", (b.dataset.s === "1") === v));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  list.querySelectorAll(".a-row").forEach((r, i) => {
    const d = before.get(r.dataset.id) - r.getBoundingClientRect().top;
    if (d) r.animate([{ transform: `translateY(${d}px)` }, { transform: "none" }], { duration: 1100, delay: i * 18, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" });
  });
}

/* ── B ── */
function renderB(c, lang) {
  const q = k => CHECKS.filter(x => quad(x) === k).sort(byLeverage);
  return heading(c) + `
  <p class="b-mobile-axes rv">${c.mAxes}</p>
  <div class="b-map rv">
    <div class="b-yaxis"><span class="lbl">${c.yAxis}</span></div>
    <div class="b-quads">${QUADS.map(k => `
      <section class="b-q"><div class="top"><span class="ord">${digits(QORDER[k], lang)}</span><h3>${c.g[k][0]}</h3></div>
        <p class="why">${c.g[k][1]}</p>
        <ul>${q(k).map(x => `<li>${c.names[x.id]}</li>`).join("")}</ul></section>`).join("")}</div>
    <div class="b-xaxis"><span class="lbl">${c.xStart}</span><span class="lbl">${c.xLbl}</span><span class="lbl">${c.xEnd}</span></div>
  </div>` + honesty(c);
}

/* ── C ── */
function renderC(c, lang) {
  let n = 0;
  return heading(c) + `<div class="c-layout">
    <div class="c-side rv">
      <p class="c-q"><span class="lbl k">${c.qk1}</span>${c.q1}</p>
      <p class="c-q"><span class="lbl k">${c.qk2}</span>${c.q2}</p>
      <p class="after">${c.after}</p>
    </div>
    <article class="sheet rv" aria-label="${c.sheetKicker} — ${c.sheetTitle}">
      <div class="sheet-top"><span class="lbl">${c.sheetKicker}</span><span class="lbl">${c.sheetMeta}</span></div>
      <h3 class="sheet-title">${c.sheetTitle}</h3>
      ${GROUPS.map((g, gi) => `<div class="c-sec">
        <div><h4><span class="gn">${digits(gi + 1, lang)}</span>${c.g[g][0]}</h4>
          <ol>${CHECKS.filter(k => group(k) === g).sort(byLeverage).map(k => `<li><span class="n">${pad(++n, lang)}</span><span class="nm">${c.names[k.id]}</span><span class="tags">${tags(c, k)}</span></li>`).join("")}</ol></div>
        <p class="margin">${c.g[g][1]}</p></div>`).join("")}
      <p class="sheet-foot">${c.sheetFoot}</p>
    </article></div>` + honesty(c);
}

let io, playIo;
function render() {
  const c = COPY[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = state.theme;
  document.getElementById("stub-top").textContent = c.stubTop;
  document.getElementById("stub-bot").textContent = c.stubBot;
  document.getElementById("root").innerHTML = { a: renderA, b: renderB, c: renderC }[state.v](c, state.lang);
  document.getElementById("note-title").textContent = document.querySelector(`#opt [data-v="${state.v}"]`).textContent;
  document.getElementById("note-body").innerHTML = NOTES[state.v];
  io?.disconnect(); playIo?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -15% 0px" });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
  document.querySelectorAll(".a-btns button").forEach(b => b.addEventListener("click", () => { state.played = true; setSorted(b.dataset.s === "1"); }));
  const list = document.getElementById("a-list");
  if (list && !state.played) {
    playIo = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && !state.played) { state.played = true; playIo.disconnect(); setTimeout(() => setSorted(true), 900); }
    }), { threshold: 0.35 });
    playIo.observe(list);
  }
}
function seg(id, key) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    state[key] = b.dataset.v;
    if (key === "v") { state.sorted = false; state.played = false; }
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    const y = scrollY; render(); scrollTo(0, y);
  }));
}
seg("opt", "v"); seg("lang", "lang"); seg("theme", "theme");
render();
</script>
</body>
</html>
