<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero v5 · A / B / C</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* Values mirror packages/ui tokens.css (--brand 214 89% 48%) and globals.css .accent-iris (dark). */
:root{
  --brand:hsl(214 89% 48%);--brand-on-dark:hsl(214 95% 64%);
  --iris:linear-gradient(90deg,hsl(212 96% 64%),hsl(250 92% 70%),hsl(276 88% 72%));
  --iris-light:linear-gradient(90deg,hsl(218 86% 48%),hsl(250 76% 58%),hsl(272 72% 56%));
  --ink:#0A0B0E;--paper:#F6F6F4;--muted:#5B606B;--line:rgba(10,11,14,.1);
  --ease:cubic-bezier(.22,1,.36,1);
  --pad:clamp(16px,2.4vw,36px);
  --display:"Outfit",sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:"Geist Mono",ui-monospace,monospace
}
[dir=rtl]{--display:"Vazirmatn",sans-serif;--serif:"Vazirmatn",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir=rtl] body{font-family:Vazirmatn,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block}

/* ---------- nav ---------- */
.nav{position:absolute;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:20px var(--pad)}
.nav b{font:500 15px/1 var(--display);letter-spacing:.14em}
.nav ul{display:flex;gap:28px;list-style:none;font-size:14px}
.nav .cta{padding:10px 16px;border-radius:8px;background:var(--brand);color:#fff;font-size:13px;font-weight:500}
.on-dark .nav{color:#fff}
@media(max-width:900px){.nav ul{display:none}}

/* ---------- shared type ---------- */
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
[dir=rtl] .eyebrow{letter-spacing:0;font-family:Vazirmatn;font-size:13px}
h1{font-family:var(--display);font-weight:300;letter-spacing:-.045em;line-height:.94}
[dir=rtl] h1{letter-spacing:0;line-height:1.3;font-weight:300}
[dir=rtl] h1 .ln{padding-block:.1em .2em;margin-block:-.1em}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em;white-space:nowrap}
h1 .ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.4s var(--ease)}
h1 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em;padding-inline-end:.06em}
[dir=rtl] h1 em{font-style:normal;font-weight:500}
.iris{background:var(--iris);-webkit-background-clip:text;background-clip:text;color:transparent}
.iris-l{background:var(--iris-light);-webkit-background-clip:text;background-clip:text;color:transparent}
.in h1 .ln>span{transform:none}
.in h1 .ln:nth-child(2)>span{transition-delay:.12s}
.sub{font-size:clamp(15px,1.15vw,18px);line-height:1.55;max-width:38ch}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{padding:13px 20px;border-radius:10px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:10px}
.btn.p{background:var(--brand);color:#fff}
.btn.g{border:1px solid currentColor}
.btn .ar{transition:transform .5s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}
[dir=rtl] .btn .ar{transform:scaleX(-1)}
.credit{font:400 10px/1 var(--mono);letter-spacing:.08em;opacity:.55}

/* ---------- A · Cinematic stage ---------- */
.A{position:relative;height:100svh;min-height:680px;padding:10px;background:var(--paper)}
.A .stage{position:relative;height:100%;border-radius:22px;overflow:hidden;background:#05070c;color:#fff}
.A .img{position:absolute;inset:0;transform:scale(1.12);transition:transform 2.6s var(--ease)}
.A .img img{width:100%;height:100%;object-fit:cover}
.A .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,12,.35) 0%,rgba(5,7,12,0) 30%,rgba(5,7,12,.15) 55%,rgba(5,7,12,.82) 100%)}
.in .A .img{transform:none}
.A .copy{position:absolute;inset:auto var(--pad) calc(var(--pad) + 8px) var(--pad);display:grid;grid-template-columns:8fr 4fr;gap:32px;align-items:end}
.A h1{font-size:clamp(3rem,7.2vw,8.5rem);margin-top:22px}
.A .side .sub{color:rgba(255,255,255,.78)}
.A .btn.g{color:#fff;border-color:rgba(255,255,255,.4)}
.A .eyebrow{color:rgba(255,255,255,.8)}
.A .credit{position:absolute;top:84px;inset-inline-end:var(--pad);color:#fff}
@media(max-width:900px){.A .copy{grid-template-columns:1fr}}

/* ---------- B · Editorial split ---------- */
.B{padding:124px var(--pad) 10px}
.B .top{display:grid;grid-template-columns:7fr 5fr;gap:40px;align-items:end;margin-bottom:clamp(36px,5vw,72px)}
.B h1{font-size:clamp(3rem,6.6vw,7.5rem);margin-top:22px}
.B .eyebrow{color:var(--muted)}
.B .sub{color:var(--muted)}
.B .btn.g{color:var(--ink);border-color:var(--line)}
.B .panel{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:21/9;background:#05070c;clip-path:inset(8% 4% 0 4% round 22px);transition:clip-path 1.8s var(--ease)}
.in .B .panel{clip-path:inset(0 0 0 0 round 22px)}
.B .panel img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 2.4s var(--ease)}
.in .B .panel img{transform:none}
.B .glass{position:absolute;inset-inline-start:24px;bottom:24px;max-width:300px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);color:#fff;font-size:13px;line-height:1.5}
.B .glass b{display:block;font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
.B .credit{position:absolute;top:20px;inset-inline-end:20px;color:#fff}
@media(max-width:900px){.B .top{grid-template-columns:1fr}.B .panel{aspect-ratio:4/5}}

/* ---------- C · Blue world ---------- */
.C{position:relative;height:100svh;min-height:680px;background:var(--brand);color:#fff;overflow:hidden}
.C .img{position:absolute;inset:0;mix-blend-mode:luminosity;opacity:.55;transform:scale(1.1);transition:transform 2.6s var(--ease)}
.C .img img{width:100%;height:100%;object-fit:cover}
.C::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,hsl(214 89% 30% / .0) 40%,hsl(214 89% 22% / .6));pointer-events:none}
.in .C .img{transform:none}
.C .copy{position:absolute;z-index:2;inset:auto var(--pad) calc(var(--pad) + 8px) var(--pad)}
.C h1{font-size:clamp(3rem,10vw,12rem);font-weight:200;letter-spacing:-.055em}
[dir=rtl] .C h1{font-weight:200}
.C .row{display:flex;justify-content:space-between;align-items:end;gap:32px;margin-top:28px;flex-wrap:wrap}
.C .sub{color:rgba(255,255,255,.85)}
.C .btn.p{background:#fff;color:var(--brand)}
.C .btn.g{color:#fff;border-color:rgba(255,255,255,.5)}
.C .eyebrow{color:rgba(255,255,255,.85);position:absolute;top:96px;inset-inline-start:var(--pad);z-index:2}
.C .credit{position:absolute;top:96px;inset-inline-end:var(--pad);color:#fff;z-index:2}

/* ---------- next section peek ---------- */
.next{padding:18vh var(--pad);display:grid;grid-template-columns:200px 1fr;gap:28px}
.next p{font:300 clamp(28px,3.4vw,54px)/1.12 var(--display);letter-spacing:-.03em;max-width:22ch}
[dir=rtl] .next p{letter-spacing:0;line-height:1.4}
.next .eyebrow{color:var(--muted)}
@media(max-width:900px){.next{grid-template-columns:1fr}}

/* ---------- switcher ---------- */
.dock{transition:opacity .4s,transform .4s var(--ease);position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;font:500 12px Inter;direction:ltr}
.bar{display:flex;gap:3px;padding:4px;border-radius:12px;background:rgba(14,16,22,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.bar button{all:unset;cursor:pointer;padding:7px 11px;border-radius:8px}
.bar button.on{background:#fff;color:#0A0B0E}
.bar .thumb{padding:3px;display:flex}
.bar .thumb img{width:44px;height:28px;object-fit:cover;border-radius:5px;opacity:.6}
.bar .thumb.on{background:#fff}
.bar .thumb.on img{opacity:1}
.bar .sep{width:1px;background:rgba(255,255,255,.15);margin:4px 3px}
.bar .lbl{padding:7px 8px;color:#7d8596}
.dock.away{opacity:0;transform:translate(-50%,16px);pointer-events:none}
@media(max-width:700px){h1 .ln{white-space:normal}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="root"></main>

<div class="dock">
  <div class="bar" id="imgs"><span class="lbl">Image</span></div>
  <div class="bar">
    <span class="lbl">Direction</span>
    <button data-l="A">A · Cinematic stage</button>
    <button data-l="B">B · Editorial split</button>
    <button data-l="C">C · Blue world</button>
    <span class="sep"></span>
    <button data-lang="en">EN</button>
    <button data-lang="ar">AR</button>
    <span class="sep"></span>
    <button id="replay">Replay ↺</button>
  </div>
</div>

<script>
// Unsplash shortlist, 2026-09-28. Hotlinked for the prototype only; the picked one gets downloaded into public/brand/hero/.
const IMAGES=[
  {id:"photo-1760224254117-7a40f7f03fe2",by:"Alexander X.",name:"Navy fabric, soft light"},
  {id:"photo-1775217945499-099a9dd6a8e7",by:"Universtock",name:"Light across blue ribs"},
  {id:"photo-1787404149197-6d278b14c79b",by:"Cai Fang",name:"Blue wall, light bands"},
  {id:"photo-1553095066-5014bc7b7f2d",by:"Greg Rosenke",name:"One lamp, dark wall"},
  {id:"photo-1760224254228-78ca793b7f6d",by:"Alexander X.",name:"Blue light streaks"},
  {id:"photo-1631535845625-8d88c59a2541",by:"Franck V.",name:"Blue concrete"},
  {id:"photo-1633259584604-afdc243122ea",by:"Pawel Czerwinski",name:"Blue folds"}
];
const T={
  en:{eyebrow:"Web engineering studio · Cairo",l1:"Engineered,",l2:"not assembled.",sub:"Custom web systems, built in Cairo in Arabic and English — for businesses whose website carries revenue.",p:"Start a project",g:"See how we build",nav:["Services","Work","Process","Pricing"],navcta:"Let's talk",
      glassT:"Built here",glass:"Every line of this site was written by us, in Arabic and English.",
      nextE:"The problem",next:"Most business websites are assembled from parts nobody owns. When they break, nobody can fix them."},
  ar:{eyebrow:"استوديو هندسة ويب · القاهرة",l1:"نُهندِس،",l2:"لا نُركِّب.",sub:"أنظمة ويب مخصصة نبنيها في القاهرة بالعربية والإنجليزية — للشركات التي يحمل موقعها إيراداتها.",p:"ابدأ مشروعك",g:"كيف نبني",nav:["الخدمات","الأعمال","المنهج","الأسعار"],navcta:"تواصل معنا",
      glassT:"مبني هنا",glass:"كل سطر في هذا الموقع كتبناه بأنفسنا، بالعربية والإنجليزية.",
      nextE:"المشكلة",next:"معظم مواقع الشركات مُركَّبة من أجزاء لا يملكها أحد. وحين تتعطل، لا أحد يستطيع إصلاحها."}
};
const q=new URLSearchParams(location.search);
let S={l:q.get("l")||"A",img:+(q.get("img")||0),lang:q.get("lang")||"en"};
const src=(i,w)=>`https://images.unsplash.com/${IMAGES[i].id}?w=${w}&q=80&auto=format&fit=crop`;
const arrow=`<svg class="ar" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.4"/></svg>`;

function render(){
  const t=T[S.lang],im=IMAGES[S.img];
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  const nav=`<nav class="nav"><b>ALTRUVEX</b><ul>${t.nav.map(n=>`<li>${n}</li>`).join("")}</ul><a class="cta">${t.navcta}</a></nav>`;
  const credit=`<span class="credit">Unsplash · ${im.by}</span>`;
  const btns=`<div class="btns"><a class="btn p">${t.p}${arrow}</a><a class="btn g">${t.g}</a></div>`;
  const pic=`<img src="${src(S.img,2400)}" alt="">`;
  let hero="";
  if(S.l==="A") hero=`<section class="A on-dark"><div class="stage">${nav}<div class="img">${pic}</div>${credit}
      <div class="copy"><div><span class="eyebrow">${t.eyebrow}</span><h1><span class="ln"><span>${t.l1}</span></span><span class="ln"><span><em class="iris">${t.l2}</em></span></span></h1></div>
      <div class="side"><p class="sub">${t.sub}</p>${btns}</div></div></div></section>`;
  if(S.l==="B") hero=`<div style="position:relative">${nav}</div><section class="B"><div class="top"><div><span class="eyebrow">${t.eyebrow}</span><h1><span class="ln"><span>${t.l1}</span></span><span class="ln"><span><em class="iris-l">${t.l2}</em></span></span></h1></div>
      <div><p class="sub">${t.sub}</p>${btns}</div></div>
      <div class="panel">${pic}${credit}<div class="glass"><b>${t.glassT}</b>${t.glass}</div></div></section>`;
  if(S.l==="C") hero=`<section class="C on-dark">${nav}<div class="img">${pic}</div><span class="eyebrow">${t.eyebrow}</span>${credit}
      <div class="copy"><h1><span class="ln"><span>${t.l1}</span></span><span class="ln"><span><em>${t.l2}</em></span></span></h1>
      <div class="row"><p class="sub">${t.sub}</p>${btns}</div></div></section>`;
  document.getElementById("root").innerHTML=hero+`<section class="next"><span class="eyebrow">${t.nextE}</span><p>${t.next}</p></section>`;
  document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===S.l));
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
  document.querySelectorAll(".thumb").forEach((b,i)=>b.classList.toggle("on",i===S.img));
  history.replaceState(null,"",`?l=${S.l}&img=${S.img}&lang=${S.lang}`);
  play();
}
function play(){
  const root=document.getElementById("root");root.classList.remove("in");
  const img=root.querySelector("section img");
  const go=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add("in")));
  if(img.complete)go();else{img.onload=go;img.onerror=go;setTimeout(go,1500)}
}
const bar=document.getElementById("imgs");
IMAGES.forEach((im,i)=>{const b=document.createElement("button");b.className="thumb";b.title=im.name+" · "+im.by;b.innerHTML=`<img src="${src(i,120)}" alt="">`;b.onclick=()=>{S.img=i;render()};bar.appendChild(b)});
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.l=b.dataset.l;render();scrollTo(0,0)});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;render()});
document.getElementById("replay").onclick=play;
render();
// The dock hides itself so it never covers the hero; move the pointer to the bottom edge (or press any key) to bring it back.
const dock=document.querySelector(".dock");let idle;
const wake=()=>{dock.classList.remove("away");clearTimeout(idle);idle=setTimeout(()=>{if(!dock.matches(":hover"))dock.classList.add("away")},2500)};
addEventListener("mousemove",e=>{if(e.clientY>innerHeight-150)wake()});addEventListener("keydown",wake);addEventListener("touchstart",wake);wake();
</script>
</body>
</html>
