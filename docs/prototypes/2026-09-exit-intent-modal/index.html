<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit-intent modal · 3 directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* light — packages/ui/src/styles/tokens.css :root */
  --background:0 0% 98%; --foreground:0 0% 6%;
  --card:0 0% 100%; --muted-foreground:0 0% 40%;
  --border-subtle:hsl(0 0% 6% / .1); --border-mid:hsl(0 0% 6% / .18);
  --n8:0 0% 6%; --n0:0 0% 98%;
  --brand:214 89% 48%; --brand-text:214 90% 43%;
  --danger:0 65% 51%;
  --world-orange:27 90% 35%; --world-orange-soft:hsl(27 90% 35% / .08);
  --radius-panel-md:calc(1rem + 12px);
  --ease-strong:cubic-bezier(.23,1,.32,1); --ease-smooth:cubic-bezier(.25,.46,.45,.94); --ease-default:cubic-bezier(.4,0,.2,1);
  --motion-hover:150ms; --motion-drawer:300ms; --motion-fast:400ms;
  color-scheme: light;
}
html.dark{
  --background:0 0% 7%; --foreground:0 0% 94%;
  --card:0 0% 9%; --muted-foreground:0 0% 58%;
  --border-subtle:hsl(0 0% 100% / .1); --border-mid:hsl(0 0% 100% / .18);
  --world-orange:27 78% 61%; --world-orange-soft:hsl(27 78% 61% / .1);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:hsl(var(--background)); color:hsl(var(--foreground));
  font-family:"Inter",-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  min-height:100vh; overflow-x:hidden;
}
html[dir="rtl"] body{ font-family:"Vazirmatn","Inter",sans-serif; }
.mono{ font-family:"JetBrains Mono",ui-monospace,monospace; }
[dir="rtl"] .mono{ direction:ltr; unicode-bidi:isolate; }

/* ---------- mock page behind the modal ---------- */
.mockpage{ max-width:920px; margin:0 auto; padding:88px 24px 400px; }
.mockpage .kicker{ font-family:"JetBrains Mono",monospace; font-size:.6875rem; letter-spacing:.22em; text-transform:uppercase; color:hsl(var(--brand-text,214 90% 43%)); margin:0 0 18px; }
.mockpage h1{ font-family:"Outfit",sans-serif; font-weight:600; font-size:clamp(2.25rem,5vw,3.5rem); line-height:1.05; letter-spacing:-.02em; margin:0 0 20px; max-width:16ch; }
.mockpage p{ font-size:1.0625rem; line-height:1.65; color:hsl(var(--muted-foreground)); max-width:56ch; margin:0 0 14px; }
.mockpage .lines{ margin-top:64px; display:grid; gap:1px; background:hsl(var(--border-subtle)); border-top:1px solid hsl(var(--border-subtle)); }
.mockpage .lines div{ background:hsl(var(--background)); padding:20px 0; color:hsl(var(--muted-foreground)); font-size:.9375rem; }

/* ---------- dock: direction / lang / theme switcher ---------- */
.dock{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:200; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:94vw; }
.bar{ display:flex; align-items:center; gap:2px; background:#14161b; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:4px; box-shadow:0 12px 32px -12px rgba(0,0,0,.5); }
.bar button{ font-family:"Inter",sans-serif; font-size:12.5px; font-weight:500; color:#9ba3b4; background:none; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; transition:background .15s,color .15s; white-space:nowrap; }
.bar button:hover{ color:#fff; }
.bar button.on{ background:#fff; color:#111; }
.bar .lbl{ padding:0 8px; color:#5d6373; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
.bar .sep{ width:1px; align-self:stretch; background:rgba(255,255,255,.12); margin:4px 2px; }
.dock-note{ position:fixed; left:50%; bottom:74px; transform:translateX(-50%); z-index:200; color:#7d8596; font-family:"JetBrains Mono",monospace; font-size:11px; background:#14161b; border:1px solid rgba(255,255,255,.1); padding:6px 12px; border-radius:8px; max-width:94vw; text-align:center; }

/* ---------- overlay shell ---------- */
.overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center; padding:16px; }
@media(min-width:640px){ .overlay{ align-items:center; } }
.scrim{ position:absolute; inset:0; background:hsl(var(--n8,0 0% 6%) / .55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fade var(--motion-drawer) var(--ease-default) both; }
html.dark .scrim{ background:hsl(0 0% 0% / .6); }
@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes rise{ from{opacity:0; transform:translateY(14px) scale(.98)} to{opacity:1; transform:translateY(0) scale(1)} }
@keyframes tray-up{ from{opacity:0; transform:translateY(100%)} to{opacity:1; transform:translateY(0)} }
@keyframes stagger-in{ from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:translateY(0)} }

.glass{
  background: linear-gradient(180deg, hsl(var(--card) / .82), hsl(var(--card) / .72));
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border:1px solid hsl(var(--border-mid));
}
.elevated{ box-shadow: 0 2px 4px hsl(0 0% 0% / .06), 0 32px 64px -24px hsl(0 0% 0% / .35); }
html.dark .elevated{ box-shadow: 0 2px 4px hsl(0 0% 0% / .3), 0 32px 64px -24px hsl(0 0% 0% / .7); }

.eyebrow{ display:flex; align-items:center; gap:9px; font-family:"JetBrains Mono",monospace; font-size:.6875rem; letter-spacing:.22em; text-transform:uppercase; color:hsl(var(--muted-foreground)); }
.dot{ width:6px; height:6px; border-radius:999px; background:hsl(var(--world-orange)); flex-shrink:0; }
.hl{ color:hsl(var(--world-orange)); font-style:italic; font-family:Georgia,serif; }

.close-btn{ display:grid; place-items:center; width:40px; height:40px; border-radius:8px; border:0; background:none; color:hsl(var(--muted-foreground)); cursor:pointer; transition:color .15s,background .15s; }
.close-btn:hover{ color:hsl(var(--foreground)); background:hsl(var(--border-subtle)); }

label.flabel{ display:block; margin-bottom:4px; }
.field{ border-bottom:1.5px solid hsl(var(--foreground) / .45); transition:border-color .15s; }
.field:focus-within{ border-color:hsl(var(--world-orange)); }
.field.err{ border-color:hsl(var(--danger)); }
.field input{ width:100%; height:48px; background:transparent; border:0; outline:0; font-size:17px; color:hsl(var(--foreground)); font-family:"Inter",sans-serif; }
.field input::placeholder{ color:hsl(var(--foreground) / .4); }
.hint{ margin-top:8px; font-size:12px; color:hsl(var(--muted-foreground)); }
.hint.err{ color:hsl(var(--danger)); }

.btn-primary{
  width:100%; height:52px; border-radius:10px; border:0; cursor:pointer;
  background:hsl(var(--world-orange)); color:hsl(var(--n0,0 0% 98%));
  font-family:"Inter",sans-serif; font-weight:600; font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .15s var(--ease-default), filter .15s;
}
html.dark .btn-primary{ color:#161105; }
.btn-primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.btn-primary:active{ transform:translateY(0) scale(.99); }
.btn-primary:disabled{ opacity:.6; cursor:default; transform:none; }

.btn-ghost{ display:block; margin:8px auto 0; background:none; border:0; color:hsl(var(--muted-foreground)); font-size:12.5px; padding:9px 12px; cursor:pointer; transition:color .15s; }
.btn-ghost:hover{ color:hsl(var(--foreground)); }

.panel{ position:relative; outline:none; }
.panel.entering{ animation: rise var(--motion-fast) var(--ease-strong) both; }
.panel.tray-entering{ animation: tray-up var(--motion-fast) var(--ease-strong) both; }

/* ======================================================
   DIRECTION A — the direct ask (refined centered card)
   ====================================================== */
.panel.dirA{ width:100%; max-width:27rem; border-radius:var(--radius-panel-md); overflow:hidden; }
.dirA .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 26px 0; }
.dirA .body{ padding:18px 26px 30px; }
.dirA h2{ font-family:"Outfit",sans-serif; font-weight:600; font-size:2rem; line-height:1.1; letter-spacing:-.02em; margin:10px 0 0; }
.dirA .desc{ margin:12px 0 0; font-size:15px; line-height:1.6; color:hsl(var(--muted-foreground)); }
.dirA .strip{ margin-top:26px; display:flex; border-top:1px solid hsl(var(--border-subtle)); border-bottom:1px solid hsl(var(--border-subtle)); }
.dirA .strip > div{ flex:1; padding:13px 4px; text-align:center; border-inline-start:1px solid hsl(var(--border-subtle)); animation:stagger-in var(--motion-fast) var(--ease-strong) both; }
.dirA .strip > div:first-child{ border-inline-start:0; }
.dirA .strip .v{ font-size:13px; font-weight:600; }
.dirA .strip .l{ margin-top:3px; font-size:10.5px; color:hsl(var(--muted-foreground)); text-transform:uppercase; letter-spacing:.06em; }
.dirA form{ margin-top:24px; }
.dirA .ticket{ padding:30px 26px 32px; }
.dirA .ticket-code{ margin-top:18px; padding-top:18px; border-top:1.5px dashed hsl(var(--border-mid)); position:relative; }
.dirA .ticket-code::before,.dirA .ticket-code::after{ content:""; position:absolute; top:-7px; width:14px; height:14px; border-radius:999px; background:hsl(var(--background)); }
.dirA .ticket-code::before{ inset-inline-start:-26px; }
.dirA .ticket-code::after{ inset-inline-end:-26px; }
.dirA .ticket-code .code{ font-size:2rem; letter-spacing:.04em; font-weight:600; }
.dirA .ticket-code .num{ margin-top:14px; display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:hsl(var(--muted-foreground)); }
.dirA .ticket-code .num b{ color:hsl(var(--foreground)); font-weight:500; }

/* ======================================================
   DIRECTION B — split interception (photo + content)
   ====================================================== */
.panel.dirB{ width:100%; max-width:44rem; border-radius:var(--radius-panel-md); overflow:hidden; display:grid; grid-template-columns:38% 1fr; }
[dir="rtl"] .panel.dirB{ grid-template-columns:1fr 38%; }
.dirB .photo{ position:relative; min-height:100%; background:#0b1420; }
.dirB .photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92; }
.dirB .photo::after{ content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(6,10,18,.86),rgba(6,10,18,.05) 55%); }
.dirB .photo .cap{ position:absolute; inset-inline:16px; bottom:16px; z-index:1; color:#e8ecf3; font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.05em; line-height:1.5; }
.dirB .photo .cap b{ display:block; font-size:12px; color:#fff; margin-bottom:2px; font-family:"Inter",sans-serif; font-weight:600; }
.dirB .content{ padding:26px 30px 30px; display:flex; flex-direction:column; }
.dirB .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.dirB h2{ font-family:"Outfit",sans-serif; font-weight:600; font-size:1.75rem; line-height:1.12; letter-spacing:-.02em; margin:14px 0 0; }
.dirB .desc{ margin:10px 0 0; font-size:14px; line-height:1.6; color:hsl(var(--muted-foreground)); }
.dirB form{ margin-top:22px; }
.dirB .trust{ margin-top:16px; font-size:11.5px; color:hsl(var(--muted-foreground)); display:flex; align-items:center; gap:7px; }
.dirB .trust .dot{ width:4px; height:4px; }
@media(max-width:640px){
  .panel.dirB{ grid-template-columns:1fr; grid-template-rows:88px 1fr; max-height:88vh; overflow-y:auto; }
  [dir="rtl"] .panel.dirB{ grid-template-columns:1fr; }
  .dirB .photo .cap{ display:none; }
}

/* ======================================================
   DIRECTION C — last call (bottom tray, low interruption)
   ====================================================== */
.overlay.dirC{ align-items:flex-end; padding:0; }
.overlay.dirC .scrim{ background:hsl(var(--n8,0 0% 6%) / .18); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }
.dirC .panel{ width:100%; max-width:none; border-radius:0; border-inline:0; border-bottom:0; }
.dirC .row{ max-width:1120px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; gap:28px; }
.dirC .msg{ flex:0 1 auto; min-width:0; }
.dirC .msg .eyebrow{ margin-bottom:4px; }
.dirC h2{ font-family:"Outfit",sans-serif; font-weight:600; font-size:1.25rem; letter-spacing:-.01em; margin:0; white-space:nowrap; }
.dirC .trustline{ margin-top:4px; font-size:11px; color:hsl(var(--muted-foreground)); font-family:"JetBrains Mono",monospace; letter-spacing:.02em; }
.dirC .action{ flex:1; display:flex; align-items:center; gap:10px; }
.dirC .field{ flex:1; max-width:260px; }
.dirC .field input{ height:44px; font-size:15px; }
.dirC .btn-primary{ width:auto; padding:0 22px; height:44px; flex-shrink:0; }
.dirC .close-btn{ margin-inline-start:4px; flex-shrink:0; }
.dirC .btn-ghost{ margin:0; }
.dirC form{ display:contents; }
@media(max-width:820px){
  .dirC .row{ flex-wrap:wrap; padding:16px 20px 18px; }
  .dirC .msg{ flex:1 1 100%; }
  .dirC h2{ white-space:normal; }
  .dirC .action{ flex:1 1 100%; }
  .dirC .field{ max-width:none; }
}

/* success shared */
.success-wrap{ animation:stagger-in var(--motion-fast) var(--ease-strong) both; }
</style>
</head>
<body>
<div id="root"></div>

<div class="dock-note" id="note"></div>
<div class="dock">
  <div class="bar" id="dirbar">
    <span class="lbl">Direction</span>
    <button data-d="A">A · Direct ask</button>
    <button data-d="B">B · Split interception</button>
    <button data-d="C">C · Last call</button>
  </div>
  <div class="bar">
    <button id="themeBtn">◐ Theme</button>
    <span class="sep"></span>
    <button data-lang="en">EN</button>
    <button data-lang="ar">AR</button>
    <span class="sep"></span>
    <button id="stateBtn">Success state →</button>
    <button id="replayBtn">Replay ↺</button>
  </div>
</div>

<script>
const COPY = {
  en:{
    kicker:"Web engineering studio · Cairo",
    h1:"The problem with most agency sites",
    body:"This is a stand-in page so the exit-intent overlay has something real to sit above — scroll, move your cursor toward the top of the window, or just look at the panel below.",
    lines:["01 — Discovery","02 — Build","03 — Ship","04 — Own it"],
    m:{
      subtitle:"Wait — before you go",
      title_pre:"Let's ", title_hl:"pressure-test", title_post:" your scope.",
      description:"Not sure if we are a fit? A 30-minute technical discovery call is enough to find out - no pitch, no pressure.",
      stats:[["30 min","No Sales Pitch"],["Free","No Commitment"],["Direct","Founder Access"]],
      phoneLabel:"Phone (WhatsApp)", phonePlaceholder:"+201... or +971...",
      phoneHint:"We will only call to coordinate the time.", phoneError:"Please enter a valid phone number",
      buttonText:"Request a Call", submitting:"Sending...", secondary:"Maybe later", close:"Close dialog",
      successTitle:"Talk soon.", successDescription:"We have received your number. We will reach out within 2 business hours to coordinate.",
      photoCapTitle:"Founder-reviewed", photoCapBody:"Every discovery call, taken by the person who signs off the build.",
      trustLine:"30 min · free · no pitch · direct access",
      ticketLabel:"CONFIRMATION", numberLabel:"Number on file"
    }
  },
  ar:{
    kicker:"استوديو هندسة ويب · القاهرة",
    h1:"مشكلة أغلب مواقع الوكالات",
    body:"هذه صفحة بديلة فقط ليكون للنافذة المنبثقة خلفية حقيقية — مرّر الصفحة، أو حرّك المؤشر نحو أعلى النافذة، أو انظر إلى اللوحة أدناه مباشرة.",
    lines:["٠١ — الاكتشاف","٠٢ — البناء","٠٣ — الإطلاق","٠٤ — الملكية"],
    m:{
      subtitle:"انتظر - قبل أن تغادر",
      title_pre:"دعنا ", title_hl:"نختبر", title_post:" تفاصيل مشروعك.",
      description:"لست متأكداً من أننا المناسبون؟ مكالمة اكتشاف تقنية مدتها ٣٠ دقيقة كافية لمعرفة ذلك - لا عرض ترويجي ولا ضغط.",
      stats:[["٣٠ دقيقة","لا عرض مبيعات"],["مجاني","لا التزام"],["مباشر","وصول للمؤسس"]],
      phoneLabel:"الهاتف (واتساب)", phonePlaceholder:"+201... / +971...",
      phoneHint:"سنتصل فقط لتنسيق الموعد.", phoneError:"الرجاء إدخال رقم هاتف صحيح",
      buttonText:"اطلب مكالمة", submitting:"جارٍ الإرسال...", secondary:"ربما لاحقاً", close:"إغلاق الحوار",
      successTitle:"نراك قريباً.", successDescription:"استلمنا رقمك. سنتواصل خلال ساعتي عمل لتنسيق الموعد.",
      photoCapTitle:"بمراجعة المؤسس", photoCapBody:"كل مكالمة اكتشاف يحضرها الشخص الذي يعتمد التنفيذ فعلياً.",
      trustLine:"٣٠ دقيقة · مجاني · بلا عرض · وصول مباشر",
      ticketLabel:"تأكيد", numberLabel:"الرقم المسجل"
    }
  }
};

const q = new URLSearchParams(location.search);
let S = {
  d: q.get("d") || "A",
  lang: q.get("lang") || "en",
  dark: q.get("theme") !== "light",
  success: false,
  anim: true,
};

function code(){ return "AX-" + (7000 + Math.floor(Math.random()*900)); }
let TICKET = code();

function applyHtmlAttrs(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  document.documentElement.classList.toggle("dark", S.dark);
}

function mockPage(t){
  return `<div class="mockpage">
    <p class="kicker">${t.kicker}</p>
    <h1>${t.h1}</h1>
    <p>${t.body}</p>
    <div class="lines">${t.lines.map(l=>`<div>${l}</div>`).join("")}</div>
  </div>`;
}

function eyebrow(t){
  return `<div class="eyebrow"><span class="dot"></span>${S.success ? t.successTitle : t.subtitle}</div>`;
}

function closeBtn(t){
  return `<button type="button" class="close-btn" aria-label="${t.close}" onclick="onClose()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>`;
}

function form(t, compact){
  return `<form onsubmit="onSubmit(event)">
    <label class="flabel" for="phone"><span class="eyebrow" style="margin-bottom:${compact?0:'4px'}">${t.phoneLabel}</span></label>
    <div class="field" id="field">
      <input id="phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="${t.phonePlaceholder}" oninput="onPhoneInput()">
    </div>
    ${compact ? "" : `<p class="hint" id="hint">${t.phoneHint}</p>`}
    <button class="btn-primary" id="submitBtn" type="submit">${t.buttonText}</button>
    ${compact ? "" : `<button type="button" class="btn-ghost" onclick="onClose()">${t.secondary}</button>`}
  </form>`;
}

function successBlock(t, phone, opts){
  opts = opts || {};
  return `<div class="success-wrap">
    <h2 style="${opts.h2style||''}">${t.successTitle}</h2>
    <p class="desc">${t.successDescription}</p>
    ${opts.ticket ? `
    <div class="ticket-code">
      <p class="hint mono" style="margin:0 0 6px;letter-spacing:.15em;text-transform:uppercase;font-size:10px;">${t.ticketLabel}</p>
      <div class="code mono">${TICKET}</div>
      <div class="num"><span>${t.numberLabel}</span><b class="mono" dir="ltr">${phone||"+20 10• ••• ••••"}</b></div>
    </div>` : `
    <div class="hint" style="margin-top:14px;">
      <span>${t.numberLabel}: </span><b class="mono" dir="ltr" style="color:hsl(var(--foreground))">${phone||"+20 10• ••• ••••"}</b>
    </div>`}
  </div>`;
}

function renderA(t){
  const phone = document.getElementById("phone")?.value;
  return `<div class="overlay" onclick="onScrimClick(event)">
    <div class="scrim"></div>
    <div class="panel dirA glass elevated ${S.anim?'entering':''}" role="dialog" aria-modal="true" tabindex="-1">
      ${S.success ? `
        <div class="top">${eyebrow(t)}${closeBtn(t)}</div>
        <div class="body ticket">
          ${successBlock(t, phone, {ticket:true})}
        </div>
      ` : `
        <div class="top">${eyebrow(t)}${closeBtn(t)}</div>
        <div class="body">
          <h2>${t.title_pre}<span class="hl">${t.title_hl}</span>${t.title_post}</h2>
          <p class="desc">${t.description}</p>
          <div class="strip">
            ${t.stats.map((s,i)=>`<div style="animation-delay:${120+i*70}ms"><div class="v mono">${s[0]}</div><div class="l">${s[1]}</div></div>`).join("")}
          </div>
          ${form(t,false)}
        </div>
      `}
    </div>
  </div>`;
}

function renderB(t){
  const phone = document.getElementById("phone")?.value;
  return `<div class="overlay" onclick="onScrimClick(event)">
    <div class="scrim"></div>

function renderC(t){
  const phone = document.getElementById("phone")?.value;
  return `<div class="overlay dirC" onclick="onScrimClick(event)">
    <div class="scrim"></div>
    <div class="panel glass elevated ${S.anim?'tray-entering':''}" role="dialog" aria-modal="true" tabindex="-1">
      ${S.success ? `
        <div class="row">
          <div class="msg" style="flex:1">
            <div class="eyebrow">${t.successTitle}</div>
            <p class="trustline mono" style="margin-top:6px">${t.successDescription}</p>
          </div>
          ${closeBtn(t)}
        </div>
      ` : `
        <div class="row">
          <div class="msg">
            ${eyebrow(t)}
            <h2>${t.title_pre}<span class="hl">${t.title_hl}</span>${t.title_post}</h2>
            <div class="trustline">${t.trustLine}</div>
          </div>
          <div class="action">${form(t,true)}</div>
          ${closeBtn(t)}
        </div>
      `}
    </div>
  </div>`;
}

function render(){
  applyHtmlAttrs();
  const t = COPY[S.lang], m = t.m;
  document.getElementById("root").innerHTML = mockPage(t) + (
    S.d === "A" ? renderA(m) : S.d === "B" ? renderB(m) : renderC(m)
  );
  document.querySelectorAll("#dirbar button").forEach(b=>b.classList.toggle("on", b.dataset.d===S.d));
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on", b.dataset.lang===S.lang));
  document.getElementById("themeBtn").textContent = S.dark ? "☾ Dark" : "☀ Light";
  document.getElementById("stateBtn").textContent = S.success ? "← Form state" : "Success state →";
  document.getElementById("note").textContent =
    S.d==="A" ? "A · Direct ask — refined centered card, ticket-style confirmation (RUL-073, RUL-094, MAT-030)"
    : S.d==="B" ? "B · Split interception — mood photo pane, no stat rows, type-led (RUL-131 glass, brand-imagery mood photo)"
    : "C · Last call — bottom tray, low-interruption, single line trust copy (STU-087 restraint)";
  S.anim = false;
}

window.onSubmit = function(e){
  e.preventDefault();
  const val = document.getElementById("phone").value.replace(/\D/g,"");
  if(val.length < 8){
    document.getElementById("field").classList.add("err");
    const h = document.getElementById("hint");
    if(h){ h.textContent = COPY[S.lang].m.phoneError; h.classList.add("err"); }
    return;
  }
  TICKET = code();
  S.success = true; S.anim = false;
  render();
};
window.onPhoneInput = function(){
  document.getElementById("field").classList.remove("err");
};
window.onClose = function(){
  S.success = false; S.anim = true;
  render();
};
window.onScrimClick = function(e){
  if(e.target.classList.contains("scrim")) onClose();
};
document.addEventListener("keydown", e=>{ if(e.key==="Escape") onClose(); });

document.getElementById("dirbar").addEventListener("click", e=>{
  const b = e.target.closest("button[data-d]"); if(!b) return;
  S.d = b.dataset.d; S.success = false; S.anim = true; render();
});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click", ()=>{ S.lang=b.dataset.lang; S.anim=false; render(); }));
document.getElementById("themeBtn").addEventListener("click", ()=>{ S.dark=!S.dark; S.anim=false; render(); });
document.getElementById("stateBtn").addEventListener("click", ()=>{ S.success=!S.success; S.anim=true; render(); });
document.getElementById("replayBtn").addEventListener("click", ()=>{ S.anim=true; render(); });

render();
</script>
</body>
</html>
