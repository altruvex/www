<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing · A — Quote sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.stage{display:grid;grid-template-columns:5fr 7fr;gap:64px;padding:56px 0 96px;align-items:start}
@media(max-width:1000px){.stage{grid-template-columns:1fr;gap:32px}}
.index{border-top:2px solid var(--fg)}
.index .h{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.svc{display:grid;grid-template-columns:1fr auto;gap:4px 16px;width:100%;text-align:start;padding:20px 0;border-bottom:1px solid var(--line);position:relative;transition:background var(--m-hover)}
.svc:hover{background:var(--brand-soft)}
.svc .n{font-family:Outfit;font-size:24px;font-weight:300;letter-spacing:-.02em}
html[lang="ar"] .svc .n{font-family:Vazirmatn;font-size:21px}
.svc .d{grid-column:1;font-size:13px;color:var(--muted);line-height:1.5;max-width:40ch}
.svc .f{grid-row:1/3;grid-column:2;align-self:center;text-align:end;font-size:14px}
.svc .f small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.svc[aria-pressed="true"]::before{content:"";position:absolute;inset-block:0;inset-inline-start:-14px;width:3px;background:var(--brand);border-radius:2px}
.svc[aria-pressed="true"] .n{color:var(--brand-text)}
.scope{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.sheetwrap{position:sticky;top:80px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:28px 32px 26px;box-shadow:0 30px 60px -36px rgba(0,0,0,.3)}
.sheet .top{display:flex;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--fg)}
.sheet .big{padding:26px 0 18px;border-bottom:1px solid var(--line)}
.sheet .big .fig{font-family:Outfit;font-weight:300;font-size:clamp(2rem,4.2vw,3.4rem);letter-spacing:-.03em;line-height:1.08;display:block;margin-top:8px;color:var(--fg)}
html[lang="ar"] .sheet .big .fig{font-family:Vazirmatn;letter-spacing:0}
.line{display:grid;grid-template-columns:9rem 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.line dt{color:var(--muted)}
.line ul{list-style:none;display:grid;gap:8px}
.line li::before{content:"";display:inline-block;width:6px;height:6px;background:var(--brand);border-radius:50%;margin-inline-end:10px;vertical-align:middle}
.tag{display:inline-block;border:1px solid var(--brand);color:var(--brand-text);background:var(--brand-soft);border-radius:999px;padding:3px 12px;font-size:12px}
.tag.plain{border-style:dashed;border-color:var(--line-strong);color:var(--muted);background:none}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:20px;flex-wrap:wrap}
@media(max-width:600px){.sheet{padding:22px 18px}.line{grid-template-columns:1fr;gap:4px}}
</style></head>
<body>
<main class="wrap">
  <header class="hero" id="hero"></header>
  <div id="doors" class="doors"></div>
  <div class="stage">
    <section aria-labelledby="ix">
      <div class="index" role="group">
        <div class="h"><span class="eyebrow" id="ixl"></span><span class="eyebrow" id="ixs"></span></div>
        <div id="list"></div>
      </div>
      <div class="scope"><span class="eyebrow" id="scl"></span><div class="seg" id="seg" role="group"></div></div>
    </section>
    <div class="sheetwrap"><article class="sheet" id="sheet" aria-live="polite"></article></div>
  </div>
</main>
<script src="data.js"></script><script src="shared.js"></script>
<script>
let S = "website", B = "standard";
P.chrome("a");
function render() {
  const t = P.t(); P.hero(document.getElementById("hero"));
  P.doors(document.getElementById("doors"), S, (s) => { S = s; render(); });
  document.getElementById("ixl").textContent = t.service; document.getElementById("ixs").textContent = P.bands().find((b) => b.id === B).label;
  document.getElementById("scl").textContent = t.scope;
  document.getElementById("list").innerHTML = P.rows().map((r) => { const c = P.cell(r.serviceId, B);
    return `<button class="svc" data-s="${r.serviceId}" aria-pressed="${r.serviceId === S}"><span class="n">${r.name}</span><span class="d">${r.description}</span><span class="f num">${c.priceLabel}<small>${c.weeksLabel}</small></span></button>`; }).join("");
  document.querySelectorAll(".svc").forEach((b) => (b.onclick = () => { S = b.dataset.s; render(); }));
  document.getElementById("seg").innerHTML = P.bands().map((b) => `<button data-b="${b.id}" aria-pressed="${b.id === B}">${b.label}</button>`).join("");
  document.querySelectorAll("#seg button").forEach((b) => (b.onclick = () => { B = b.dataset.b; render(); }));
  sheet();
}
function sheet() {
  const t = P.t(), r = P.row(S), c = P.cell(S, B), tier = P.tier(c.tierId), band = P.bands().find((b) => b.id === B).label;
  const href = tier ? tier.estimatorHref : `/transparency?projectType=${S}`;
  const el = document.getElementById("sheet");
  el.innerHTML = `
    <div class="top"><span class="eyebrow">${t.quote}</span><span class="eyebrow mono">${t.ref} · ${S}/${B}</span></div>
    <div class="big"><span class="eyebrow">${t.price}</span><span class="fig num" id="fig"></span></div>
    <dl>
      <div class="line"><dt>${t.service}</dt><dd>${r.name}</dd></div>
      <div class="line"><dt>${t.scope}</dt><dd>${band}</dd></div>
      <div class="line"><dt>${t.delivery}</dt><dd class="num">${c.weeksLabel}</dd></div>
      <div class="line"><dt>${t.package}</dt><dd>${tier ? `<span class="tag">${tier.buyerLabel}</span>` : `<span class="tag plain">${t.unnamed}</span>`}</dd></div>
      ${tier ? `<div class="line"><dt>${t.idealFor}</dt><dd>${tier.idealFor}</dd></div>
      <div class="line"><dt>${t.includes}</dt><dd><ul>${tier.features.map((f) => `<li>${f}</li>`).join("")}</ul></dd></div>
      <div class="line"><dt>${t.notIn}</dt><dd>${tier.notIncluded}</dd></div>` : `<div class="line"><dt></dt><dd>${t.unnamedNote}</dd></div>`}
    </dl>
    <div class="foot"><span class="note" style="max-width:34ch">${t.floorNote}</span><a class="pill p" href="${href}">${tier ? t.ctaNamed(tier.buyerLabel) : t.cta}</a></div>`;
  P.settle(document.getElementById("fig"), c.priceLabel);
}
P.onChange(render);
</script></body></html>
