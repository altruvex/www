<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 2 · The headline, built</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Before paint: theme follows the OS; `js` always, `motion` only when motion
  // is allowed. Every hidden initial state below is gated on `.motion`, so no
  // JS / reduced motion paints the final headline straight away (no flash, no replay).
  (function () {
    var r = document.documentElement, dark = false, still = false;
    try { dark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    try { still = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    try { var q = new URLSearchParams(location.search); if (q.get("theme")) dark = q.get("theme") === "dark"; if (q.get("still")) still = true; } catch (e) {}
    r.setAttribute("data-theme", dark ? "dark" : "light");
    r.classList.add("js");
    if (!still) r.classList.add("motion");
  })();
</script>
<style>
/* ── Tokens — copied from the live code, not picked ──────────────────────
   packages/ui/src/styles/tokens.css  :root / .dark
   apps/www/app/globals.css  .accent-world-blue, .accent-iris, .accent-world-orange */
:root {
  --n-0: 0 0% 98%;
  --n-8: 0 0% 6%;
  --brand: 214 89% 48%;
  --brand-hover: 214 89% 41%;
  --brand-text-on-light: 214 90% 43%;
  --brand-text-on-dark: 214 95% 64%;

  --background: var(--n-0);
  --foreground: var(--n-8);
  --muted-foreground: 0 0% 40%;
  --s-border: hsl(var(--n-8) / 0.1);
  --border-subtle: var(--s-border);
  --control-edge: hsl(var(--foreground) / 0.45);

  /* accent-world-blue (light) */
  --local-accent: hsl(var(--brand-text-on-light));
  --local-accent-text: var(--local-accent);
  /* accent-iris (light) */
  --grad-from: hsl(218 86% 48%);
  --grad-via: hsl(250 76% 58%);
  --grad-to: hsl(272 72% 56%);
  /* accent-world-orange (light) — the next section's stub only */
  --orange-accent: hsl(27 90% 35%);

  /* Construction lines: the problem-drawings family. */
  --guide: hsl(var(--foreground) / 0.45);
  --guide-strong: hsl(var(--foreground) / 0.7);

  --font-outfit: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
  --font-vazirmatn: "Vazirmatn", sans-serif;

  --section-y-top: clamp(5rem, 10vh, 8rem);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --d-fast: 200ms;

  --bar-h: 44px;
  --nav-h: 64px;

  color-scheme: light;
}

[data-theme="dark"] {
  --background: 0 0% 7%;
  --foreground: 0 0% 94%;
  --muted-foreground: 0 0% 58%;
  --s-border: hsl(var(--n-0) / 0.1);

  /* .dark .accent-world-blue */
  --local-accent: hsl(var(--brand));
  --local-accent-text: hsl(var(--brand-text-on-dark));
  /* .dark .accent-iris */
  --grad-from: hsl(212 96% 64%);
  --grad-via: hsl(250 92% 70%);
  --grad-to: hsl(276 88% 72%);
  /* .dark .accent-world-orange */
  --orange-accent: hsl(27 78% 61%);

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; }
body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-inter);
  font-size: 17px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  transition: background-color 400ms var(--ease), color 400ms var(--ease);
}
[dir="rtl"] body { font-family: var(--font-vazirmatn); }

.container { width: 100%; max-width: 1408px; margin-inline: auto; padding-inline: 24px; }
@media (min-width: 640px)  { .container { padding-inline: 32px; } }
@media (min-width: 768px)  { .container { padding-inline: 48px; } }
@media (min-width: 1024px) { .container { padding-inline: 64px; } }

/* ── Prototype chrome (always LTR) ───────────────────────────────────── */
.proto-bar {
  min-height: var(--bar-h);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 6px 12px; padding: 6px 12px;
  border-bottom: 1px dashed var(--border-subtle);
}
.proto-label { font: 400 11px/1.5 var(--font-mono); letter-spacing: 0.04em; color: hsl(var(--muted-foreground)); }
.toolbar { display: flex; gap: 8px; }
.seg { display: flex; padding: 2px; border-radius: 999px; border: 1px solid var(--control-edge); }
.seg button {
  font: 500 12px/1 var(--font-inter); color: hsl(var(--muted-foreground));
  background: transparent; border: 0; border-radius: 999px;
  padding: 7px 11px; min-width: 40px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: hsl(var(--foreground)); color: hsl(var(--background)); }
.seg button:focus-visible { outline: 2px solid hsl(var(--brand)); outline-offset: 2px; }

/* ── Nav stub (mirrors components/layout/nav.tsx: h-16, 1fr auto 1fr) ─── */
.nav { border-bottom: 1px solid var(--border-subtle); }
.nav-row { height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; }
@media (min-width: 1024px) { .nav-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; } }
.wordmark { font: 500 15px/1 var(--font-outfit); letter-spacing: 0.18em; color: hsl(var(--foreground)); text-decoration: none; }
.nav-links { display: none; gap: 4px; list-style: none; }
@media (min-width: 1024px) { .nav-links { display: flex; } }
.nav-links a {
  display: block; padding: 8px 14px; border-radius: 999px;
  font: 500 14px/1.2 var(--font-inter); color: hsl(var(--muted-foreground)); text-decoration: none;
}
[dir="rtl"] .nav-links a { font-family: var(--font-vazirmatn); }
.nav-end { display: none; align-items: center; justify-self: end; gap: 4px; white-space: nowrap; }
@media (min-width: 1024px) { .nav-end { display: flex; } }
.nav-icon {
  display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px;
  border-radius: 999px; font: 500 13px/1 var(--font-inter); color: hsl(var(--muted-foreground));
}
.nav-sep { width: 1px; height: 16px; background: hsl(var(--foreground) / 0.2); margin-inline: 8px; }
.nav-cta {
  display: inline-flex; align-items: center; height: 40px; padding-inline: 18px; border-radius: 999px;
  background: hsl(var(--foreground)); color: hsl(var(--background));
  font: 500 14px/1 var(--font-inter); text-decoration: none; margin-inline-start: 8px;
}
[dir="rtl"] .nav-cta { font-family: var(--font-vazirmatn); }
.burger { width: 44px; height: 44px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; margin-inline-end: -10px; }
.burger i { display: block; width: 22px; height: 1.5px; border-radius: 2px; background: hsl(var(--foreground)); }
@media (min-width: 1024px) { .burger { display: none; } }

/* ── Hero ────────────────────────────────────────────────────────────── */
.hero { position: relative; overflow: clip; }
.hero-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  padding-top: 2.25rem; padding-bottom: 3rem;
}
@media (min-width: 768px) {
  .hero-inner { min-height: calc(100dvh - var(--bar-h) - var(--nav-h)); padding-top: 3rem; padding-bottom: 3.5rem; }
}

.eyebrow {
  font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.5;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--local-accent-text);
}
@media (min-width: 640px) { .eyebrow { font-size: 0.875rem; } }
[dir="rtl"] .eyebrow { font-family: var(--font-vazirmatn); letter-spacing: 0; text-transform: none; font-size: 0.9375rem; font-weight: 500; }

.hero-main { margin-top: auto; padding-top: 3.5rem; }
@media (min-width: 768px) { .hero-main { padding-top: 5rem; } }

.headline {
  font-family: var(--font-outfit); font-weight: 300;
  font-size: clamp(2.75rem, 12vw, 3.5rem);
  line-height: 1.02; letter-spacing: -0.035em;
  color: hsl(var(--foreground));
}
@media (min-width: 640px) { .headline { font-size: clamp(3.5rem, 8.5vw, 9rem); } }
[dir="rtl"] .headline { font-family: var(--font-vazirmatn); font-weight: 600; letter-spacing: 0; line-height: 1.3; }

.headline .ln { display: block; }
.headline .w { display: inline-block; }
.headline .bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
/* Dim = muted-foreground (≥4.5:1 in both themes). */
.headline .dim { color: hsl(var(--muted-foreground)); }
/* Accent: the iris gradient, running start → end. */
.headline .acc {
  background-image: linear-gradient(90deg, var(--grad-from), var(--grad-via), var(--grad-to));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  padding-inline-end: 0.04em; /* gradient box covers the last glyph's overhang */
}
[dir="rtl"] .headline .acc { background-image: linear-gradient(270deg, var(--grad-from), var(--grad-via), var(--grad-to)); padding-inline-end: 0; }

/* The one line that stays: 2px ink rule, brand-blue segment at its start. */
.rule { position: relative; height: 2px; margin-top: clamp(1.25rem, 2.6vw, 2.25rem); background: hsl(var(--foreground)); }
.rule i { position: absolute; top: 0; inset-inline-start: 0; height: 100%; width: clamp(3rem, 6vw, 5.5rem); background: var(--local-accent); transform-origin: left center; }
[dir="rtl"] .rule i { transform-origin: right center; }

.foot { display: flex; flex-direction: column; gap: 1.75rem; margin-top: 1.75rem; }
.sub { max-width: 40ch; font-size: 1.0625rem; line-height: 1.6; color: hsl(var(--muted-foreground)); text-wrap: pretty; }
[dir="rtl"] .sub { line-height: 1.85; }
@media (min-width: 1024px) {
  /* lg: CTAs hold the start column under the headline's first letter; the sub
     balances the end column, so the right half carries weight. */
  .foot { display: grid; grid-template-columns: 1fr minmax(0, 36rem); align-items: start; gap: 3rem; margin-top: 2.25rem; }
  .sub { grid-column: 2; grid-row: 1; font-size: 1.1875rem; max-width: 36rem; }
  .ctas { grid-column: 1; grid-row: 1; }
}

.ctas { display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 640px) { .ctas { flex-direction: row; flex-wrap: wrap; } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  height: 52px; padding-inline: 26px; border-radius: 999px;
  font: 500 15px/1 var(--font-inter); text-decoration: none; white-space: nowrap;
  transition: background-color var(--d-fast) var(--ease), border-color var(--d-fast) var(--ease), color var(--d-fast) var(--ease);
}
[dir="rtl"] .btn { font-family: var(--font-vazirmatn); font-size: 16px; }
.btn:focus-visible { outline: 2px solid hsl(var(--brand)); outline-offset: 3px; }
.btn-primary { background: hsl(var(--brand)); color: hsl(var(--n-0)); }
.btn-outline { border: 1px solid var(--control-edge); color: hsl(var(--foreground)); }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: hsl(var(--brand-hover)); }
  .btn-outline:hover { border-color: hsl(var(--foreground)); }
}

/* ── Construction overlay ────────────────────────────────────────────── */
.build { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
.build .g, .build .dimln, .build .tk {
  fill: none; stroke: var(--guide); stroke-width: 1.5; stroke-linecap: round;
  vector-effect: non-scaling-stroke; transform-box: fill-box;
}
.build .dimln, .build .tk { stroke: var(--guide-strong); }
.build .keep { stroke: var(--guide-strong); }
.build .box {
  fill: none; stroke: var(--guide); stroke-width: 1; stroke-dasharray: 4 4;
  vector-effect: non-scaling-stroke; transform-box: fill-box;
}
.build text { font: 400 11px var(--font-mono); letter-spacing: 0.04em; fill: hsl(var(--foreground) / 0.62); }
[dir="rtl"] .build text { font: 500 12px var(--font-vazirmatn); letter-spacing: 0; }
.build .hover { opacity: 0; transition: opacity var(--d-fast) var(--ease); }
.build .hover.on { opacity: 1; }
.build .hover .g, .build .hover .box { stroke: hsl(var(--foreground) / 0.28); }

/* Initial states — only when motion is allowed and the build hasn't finished.
   Glyphs are clipped (never faded or blurred); the rule waits for the hand-off. */
.motion:not(.built) .headline .w { clip-path: inset(-0.3em 100% -0.4em -0.15em); }
[dir="rtl"].motion:not(.built) .headline .w { clip-path: inset(-0.3em -0.15em -0.4em 100%); }
.motion:not(.built) .rule { opacity: 0; }

/* ── Next-section stub ───────────────────────────────────────────────── */
.stub-below { border-top: 1px solid var(--border-subtle); padding-top: var(--section-y-top); padding-bottom: 30vh; }
.stub-below .eyebrow { color: var(--orange-accent); }
.section-title {
  margin-top: 0.75rem; font-family: var(--font-outfit); font-weight: 400;
  font-size: clamp(28px, 4.5vw, 52px); line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance;
}
[dir="rtl"] .section-title { font-family: var(--font-vazirmatn); letter-spacing: 0; line-height: 1.3; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="proto-bar" dir="ltr">
  <p class="proto-label">Prototype 2 — The headline, built · draft copy</p>
  <div class="toolbar" role="group" aria-label="Prototype controls">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ar" aria-pressed="false" lang="ar">AR</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
    <div class="seg" role="group" aria-label="Replay">
      <button type="button" id="replay">Replay</button>
    </div>
  </div>
</div>

<header class="nav">
  <div class="container nav-row">
    <a class="wordmark" href="#" dir="ltr">ALTRUVEX</a>
    <ul class="nav-links" id="nav-links"></ul>
    <div class="nav-end">
      <span class="nav-icon" dir="ltr">EN</span>
      <span class="nav-icon" lang="ar">ع</span>
      <span class="nav-sep"></span>
      <span class="nav-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </span>
      <a class="nav-cta" href="#" data-i18n="navCta"></a>
    </div>
    <span class="burger" aria-hidden="true"><i></i><i></i></span>
  </div>
</header>

<main>
  <section class="hero accent-world-blue" aria-labelledby="hero-title">
    <svg class="build" id="build" aria-hidden="true" focusable="false"></svg>
    <div class="container hero-inner">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <div class="hero-main">
        <h1 class="headline" id="hero-title"></h1>
        <div class="rule" id="rule" aria-hidden="true"><i></i></div>
        <div class="foot">
          <p class="sub" data-i18n="sub"></p>
          <div class="ctas">
            <a class="btn btn-primary" href="#" data-i18n="cta1"></a>
            <a class="btn btn-outline" href="#" data-i18n="cta2"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="stub-below" aria-hidden="true">
    <div class="container">
      <p class="eyebrow" data-i18n="nextEyebrow"></p>
      <p class="section-title" data-i18n="nextTitle"></p>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var COPY = {
    en: {
      nav: ["Work", "Services", "Pricing", "About", "Contact"],
      navCta: "Get an Estimate",
      eyebrow: "Web engineering studio · Cairo",
      lines: [{ words: ["Engineered,"], acc: 0 }, { words: ["not", "assembled."], dim: true }],
      sub: "Custom web systems, built in Cairo in Arabic and English — for businesses whose website carries revenue.",
      cta1: "Request a Scope →",
      cta2: "See a Real Build →",
      nextEyebrow: "The Industry Problem",
      nextTitle: "Most businesses aren't getting engineering.",
      labels: { dim: "cap", base: "baseline", extra: "−0.035em" }
    },
    ar: {
      nav: ["أعمالنا", "خدماتنا", "التسعير", "من نحن", "تواصل معنا"],
      navCta: "احصل على تقدير",
      eyebrow: "استوديو هندسة ويب · القاهرة",
      lines: [{ words: ["نُهندِس،"], acc: 0 }, { words: ["لا", "نُركِّب."], dim: true }],
      sub: "أنظمة ويب مخصصة نبنيها في القاهرة بالعربية والإنجليزية — للشركات التي يحمل موقعها إيراداتها.",
      cta1: "اطلب تحديد النطاق ←",
      cta2: "شاهد بناءً حقيقيًا ←",
      nextEyebrow: "مشكلة الصناعة",
      nextTitle: "معظم الشركات لا تحصل على هندسة برمجية.",
      labels: { dim: "الألف", base: "خط الأساس", extra: "ارتفاع السطر ١٫٣" }
    }
  };

  var NS = "http://www.w3.org/2000/svg";
  var EASE = "cubic-bezier(0.2, 0.8, 0.2, 1)";
  var root = document.documentElement;
  var svg = document.getElementById("build");
  var hero = svg.parentNode;
  var h1 = document.getElementById("hero-title");
  var rule = document.getElementById("rule");
  var lang = "en";
  var anims = [];
  var running = false;
  var ctx = document.createElement("canvas").getContext("2d");
  var fine = matchMedia("(hover: hover) and (pointer: fine)");

  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function r1(n) { return Math.round(n * 10) / 10; }

  /* ── Copy ─────────────────────────────────────────────────────────── */
  function applyCopy() {
    var c = COPY[lang];
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = c[n.getAttribute("data-i18n")]; });
    document.getElementById("nav-links").innerHTML = c.nav.map(function (t) { return '<li><a href="#">' + t + "</a></li>"; }).join("");
    // Headline: one block per line, one inline-block per word (the clip unit),
    // a zero-size baseline marker inside each word.
    h1.textContent = "";
    c.lines.forEach(function (line) {
      var ln = document.createElement("span");
      ln.className = "ln" + (line.dim ? " dim" : "");
      line.words.forEach(function (w, i) {
        if (i) ln.appendChild(document.createTextNode(" "));
        var s = document.createElement("span");
        s.className = "w" + (line.acc === i ? " acc" : "");
        s.textContent = w;
        var bl = document.createElement("i");
        bl.className = "bl";
        bl.setAttribute("aria-hidden", "true");
        s.appendChild(bl);
        ln.appendChild(s);
      });
      h1.appendChild(ln);
      h1.appendChild(document.createTextNode(" "));
    });
  }

  /* ── Measurement: real boxes from the rendered text ───────────────── */
  function measure() {
    var cs = getComputedStyle(h1);
    var size = parseFloat(cs.fontSize);
    var ar = lang === "ar";
    ctx.font = cs.fontWeight + " " + size + "px " + (ar ? "Vazirmatn" : "Outfit");
    var mt = function (t) { return ctx.measureText(t); };
    // Guides above the baseline: cap + x-height (LTR); alif height (AR).
    // Below: none in LTR (no descenders in the copy); the ب-dot line in AR.
    var up = ar ? [{ k: "alif", y: mt("ا").actualBoundingBoxAscent }]
                : [{ k: "cap", y: mt("H").actualBoundingBoxAscent }, { k: "x", y: mt("x").actualBoundingBoxAscent }];
    var down = ar ? mt("ب").actualBoundingBoxDescent : 0;

    var H = hero.getBoundingClientRect();
    var words = [].map.call(h1.querySelectorAll(".w"), function (w) {
      var r = w.getBoundingClientRect();
      var base = w.querySelector(".bl").getBoundingClientRect().top - H.top;
      var m = mt(w.textContent);
      return {
        el: w, base: base,
        l: r.left - H.left, r: r.right - H.left,
        top: base - m.actualBoundingBoxAscent, bot: base + Math.max(m.actualBoundingBoxDescent, 0)
      };
    });
    // Group words into visual lines by baseline (wrapping-safe).
    var lines = [];
    words.forEach(function (w) {
      var ln = lines.filter(function (l) { return Math.abs(l.base - w.base) < 2; })[0];
      if (!ln) { ln = { base: w.base, words: [] }; lines.push(ln); }
      ln.words.push(w);
    });
    var R = rule.getBoundingClientRect();
    return {
      W: H.width, Hh: H.height, ar: ar, up: up, down: down, lines: lines, words: words,
      rule: { l: R.left - H.left, r: R.right - H.left, y: R.top - H.top + R.height / 2 },
      labels: window.innerWidth >= 640
    };
  }

  /* ── Drawing the construction ─────────────────────────────────────── */
  function draw(m) {
    svg.textContent = "";
    svg.setAttribute("viewBox", "0 0 " + r1(m.W) + " " + r1(m.Hh));
    var start = m.ar ? "right" : "left", end = m.ar ? "left" : "right";
    var out = { guides: [], boxes: [], labels: [], keep: null };
    var gG = el("g", {}, svg), gB = el("g", {}, svg), gL = el("g", {}, svg);
    var last = m.lines[m.lines.length - 1];

    m.lines.forEach(function (ln) {
      var ys = m.up.map(function (u) { return ln.base - u.y; });
      if (m.down) ys.push(ln.base + m.down);
      ys.forEach(function (y) { out.guides.push(el("path", { d: "M0 " + r1(y) + "H" + r1(m.W), "class": "g" }, gG)); });
      if (ln !== last) out.guides.push(el("path", { d: "M0 " + r1(ln.base) + "H" + r1(m.W), "class": "g" }, gG));
    });
    // The last baseline is drawn at the rule's width: it is the line that stays.
    out.keep = el("path", { d: "M" + r1(m.rule.l) + " " + r1(last.base) + "H" + r1(m.rule.r), "class": "g keep" }, gG);
    out.guides.forEach(function (p) { p.style.transformOrigin = start + " center"; });
    out.keep.style.transformOrigin = start + " center";

    m.words.forEach(function (w) {
      var b = el("rect", {
        x: r1(w.l - 6), y: r1(w.top - 8), width: r1(w.r - w.l + 12), height: r1(w.bot - w.top + 16), "class": "box"
      }, gB);
      b.style.transformOrigin = start + " center";
      out.boxes.push(b);
    });

    if (m.labels) {
      var c = COPY[lang].labels, first = m.lines[0], fw = first.words[0];
      var sign = m.ar ? 1 : -1;

      // 1 — vertical dimension beside the first word: baseline → cap / alif.
      var dx = m.ar ? fw.r + 18 : fw.l - 18;
      var topY = first.base - m.up[0].y;
      var g1 = el("g", {}, gL);
      el("path", { d: "M" + r1(dx) + " " + r1(topY) + "V" + r1(first.base), "class": "dimln" }, g1);
      el("path", { d: "M" + r1(dx - 4) + " " + r1(topY) + "H" + r1(dx + 4) + "M" + r1(dx - 4) + " " + r1(first.base) + "H" + r1(dx + 4), "class": "tk" }, g1);
      // The label sits in the start gutter, outside the dimension line.
      var t1 = el("text", { x: r1(dx + sign * 8), y: r1((topY + first.base) / 2 + 4), "text-anchor": "end" }, g1);
      t1.textContent = c.dim;
      if (m.ar) t1.setAttribute("direction", "rtl");
      out.labels.push(g1);

      // 2 — the last baseline, named at the end side, with a tick.
      var bx = m.ar ? m.rule.l + 2 : m.rule.r - 2;
      var g2 = el("g", {}, gL);
      el("path", { d: "M" + r1(bx) + " " + r1(last.base - 6) + "V" + r1(last.base + 6), "class": "tk" }, g2);
      var t2 = el("text", { x: r1(bx + (m.ar ? 8 : -8)), y: r1(last.base - 10), "text-anchor": "end" }, g2);
      if (m.ar) t2.setAttribute("direction", "rtl");
      t2.textContent = c.base;
      out.labels.push(g2);

      // 3 — tracking (LTR) / line height (AR), off the first word's end corner.
      var ex = m.ar ? fw.l : fw.r, ey = fw.top - 8;
      var g3 = el("g", {}, gL);
      el("path", { d: "M" + r1(ex) + " " + r1(ey - 4) + "V" + r1(ey - 16) + "H" + r1(ex + (m.ar ? -14 : 14)), "class": "tk" }, g3);
      var t3 = el("text", { x: r1(ex + (m.ar ? -20 : 20)), y: r1(ey - 12), "text-anchor": "start" }, g3);
      if (m.ar) t3.setAttribute("direction", "rtl");
      t3.textContent = c.extra;
      out.labels.push(g3);
    }
    return out;
  }

  /* ── The one motion: construct → fill → retract, ≤1.4s, then still ── */
  function play(o, m) {
    var start = m.ar ? "right" : "left", endSide = m.ar ? "left" : "right";
    var clipFrom = m.ar ? "inset(-0.3em -0.15em -0.4em 100%)" : "inset(-0.3em 100% -0.4em -0.15em)";
    var clipTo = "inset(-0.3em -0.15em -0.4em -0.15em)";
    var A = function (node, kf, t) { var a = node.animate(kf, Object.assign({ fill: "both", easing: EASE }, t)); anims.push(a); return a; };

    // 0–600: guides draw from the start side.
    o.guides.forEach(function (g, i) { A(g, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 440, delay: i * 35 }); });
    A(o.keep, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 440, delay: 60 });
    // 120–: word boxes.
    o.boxes.forEach(function (b, k) { A(b, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 340, delay: 140 + k * 70 }); });
    // labels step in (mono, not display type), out before the retract ends.
    o.labels.forEach(function (l, k) {
      A(l, [{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], { duration: 760, delay: 260 + k * 60, easing: "linear" });
    });
    // 380–1020: glyphs fill word by word, reading direction.
    var words = h1.querySelectorAll(".w");
    [].forEach.call(words, function (w, k) { A(w, [{ clipPath: clipFrom }, { clipPath: clipTo }], { duration: 440, delay: 380 + k * 120 }); });
    // Boxes retract once their word has filled.
    // (fill "forwards": a backwards fill would override the draw during the delay.)
    o.boxes.forEach(function (b, k) {
      A(b, [{ transform: "scaleX(1)", transformOrigin: endSide + " center" }, { transform: "scaleX(0)", transformOrigin: endSide + " center" }], { duration: 300, delay: 760 + k * 110, fill: "forwards" });
    });
    // 880–1300: guides retract toward the end side.
    o.guides.forEach(function (g, i) {
      A(g, [{ transform: "scaleX(1)", transformOrigin: endSide + " center" }, { transform: "scaleX(0)", transformOrigin: endSide + " center" }], { duration: 360, delay: 880 + i * 25, fill: "forwards" });
    });
    // The last baseline drops onto the rule and thickens; the DOM rule takes over.
    var dy = m.rule.y - parseFloat(o.keep.getAttribute("d").split(" ")[1]);
    A(o.keep, [
      { transform: "translateY(0) scaleX(1)", strokeWidth: 1.5, stroke: "hsl(var(--foreground) / 0.7)" },
      { transform: "translateY(" + r1(dy) + "px) scaleX(1)", strokeWidth: 2, stroke: "hsl(var(--foreground))" }
    ], { duration: 320, delay: 900, fill: "forwards" });
    A(o.keep, [{ visibility: "visible" }, { visibility: "hidden" }], { duration: 1, delay: 1220, easing: "linear", fill: "forwards" });
    A(rule, [{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: 1220, easing: "linear" });
    A(rule.firstElementChild, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 180, delay: 1220 });
    return Promise.all(anims.map(function (a) { return a.finished.catch(function () {}); }));
  }

  function done() {
    root.classList.add("built");
    anims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    anims = [];
    svg.textContent = "";
    running = false;
  }

  var ready = null;
  function run() {
    anims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    anims = [];
    if (!root.classList.contains("motion")) { root.classList.add("built"); return Promise.resolve(); }
    root.classList.remove("built");
    running = true;
    return fontsReady().then(function () {
      var m = measure();
      var o = draw(m);
      var p = play(o, m);
      window.__heroStarted = true;
      return p;
    }).then(done, done);
  }

  function fontsReady() {
    if (!document.fonts) return Promise.resolve();
    var fam = lang === "ar" ? ['600 64px "Vazirmatn"'] : ['300 64px "Outfit"'];
    return Promise.race([
      Promise.all(fam.map(function (f) { return document.fonts.load(f, lang === "ar" ? "نُهندِس" : "Engineered"); })).then(function () { return document.fonts.ready; }),
      new Promise(function (res) { setTimeout(res, 1500); })
    ]);
  }

  /* ── Hover: faint guides for the word under the pointer ───────────── */
  var hoverG = null, hoverWord = null;
  function showHover(w) {
    if (running || !root.classList.contains("js")) return;
    if (w === hoverWord) return;
    hoverWord = w;
    if (!hoverG || !hoverG.isConnected) {
      svg.textContent = "";
      var m0 = measure();
      svg.setAttribute("viewBox", "0 0 " + r1(m0.W) + " " + r1(m0.Hh));
      hoverG = el("g", { "class": "hover" }, svg);
    }
    if (!w) { hoverG.classList.remove("on"); return; }
    var m = measure();
    var wd = m.words.filter(function (x) { return x.el === w; })[0];
    if (!wd) return;
    hoverG.classList.remove("on");
    hoverG.textContent = "";
    var x0 = wd.l - 28, x1 = wd.r + 28;
    m.up.forEach(function (u) { el("path", { d: "M" + r1(x0) + " " + r1(wd.base - u.y) + "H" + r1(x1), "class": "g" }, hoverG); });
    if (m.down) el("path", { d: "M" + r1(x0) + " " + r1(wd.base + m.down) + "H" + r1(x1), "class": "g" }, hoverG);
    el("path", { d: "M" + r1(x0) + " " + r1(wd.base) + "H" + r1(x1), "class": "g" }, hoverG);
    el("rect", { x: r1(wd.l - 6), y: r1(wd.top - 8), width: r1(wd.r - wd.l + 12), height: r1(wd.bot - wd.top + 16), "class": "box" }, hoverG);
    hoverG.getBoundingClientRect();
    hoverG.classList.add("on");
  }
  h1.addEventListener("pointermove", function (e) {
    if (!fine.matches || e.pointerType !== "mouse") return;
    showHover(e.target.closest ? e.target.closest(".w") : null);
  });
  h1.addEventListener("pointerleave", function () { hoverWord = null; if (hoverG) hoverG.classList.remove("on"); });

  /* ── Controls ─────────────────────────────────────────────────────── */
  function setLang(next) {
    lang = next;
    root.lang = next;
    root.dir = next === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === next)); });
    hoverG = null; hoverWord = null;
    applyCopy();
    ready = run();
    window.__heroDone = ready;
  }
  function setTheme(next) {
    root.setAttribute("data-theme", next);
    document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeSet === next)); });
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang); }); });
  document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.addEventListener("click", function () { setTheme(b.dataset.themeSet); }); });
  document.getElementById("replay").addEventListener("click", function () { hoverG = null; ready = run(); window.__heroDone = ready; });

  // Resize mid-build: geometry is stale, so land on the final state at once.
  // After the build nothing is positioned by JS (the rule is plain DOM); hover
  // guides measure fresh each time.
  var rt;
  addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (running) anims.forEach(function (a) { try { a.finish(); } catch (e) {} });
      hoverG = null; hoverWord = null; if (!running) svg.textContent = "";
    }, 120);
  });
  matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", function (e) {
    if (e.matches) { root.classList.remove("motion"); anims.forEach(function (a) { try { a.finish(); } catch (x) {} }); }
  });

  setTheme(root.getAttribute("data-theme") || "light");
  var q = new URLSearchParams(location.search);
  setLang(q.get("lang") === "ar" ? "ar" : "en");
})();
</script>
</body>
</html>
