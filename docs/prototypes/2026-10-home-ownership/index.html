<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage ownership section — prototypes A / B / C</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Standalone prototype. House values mirrored from packages/ui/src/styles/tokens.css;
   not production code. The build reads the real tokens. */
:root{
  --bg:#fff;--fg:#1a1a1a;--muted:#666;--faint:#9a9a9a;--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.45);
  --brand:hsl(214 89% 48%);--brand-text:hsl(214 89% 42%);
  --serif:Georgia,"Times New Roman",serif;--mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--gutter:clamp(16px,4vw,56px);
  /* C: five depths, surface to foundation */
  --d1:#fff;--d2:hsl(214 60% 96%);--d3:hsl(214 62% 90%);--d4:hsl(216 60% 20%);--d5:hsl(218 65% 10%);
}
html[data-theme="dark"]{
  --bg:#121212;--fg:#f0f0f0;--muted:#949494;--faint:#6b6b6b;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.45);
  --brand-text:hsl(214 95% 68%);
  --d1:#121212;--d2:hsl(216 22% 11%);--d3:hsl(216 38% 14%);--d4:hsl(216 58% 19%);--d5:hsl(214 78% 27%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:clip;line-height:1.6}
[dir="rtl"] body{font-family:Vazirmatn,Inter,sans-serif}
h2,h3,.display{font-family:Outfit,sans-serif;font-weight:300;letter-spacing:-.035em;line-height:1.04}
[dir="rtl"] :is(h2,h3,.display){font-family:Vazirmatn,sans-serif;letter-spacing:0!important;line-height:1.3}
em.acc{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--brand-text);letter-spacing:-.02em}
[dir="rtl"] em.acc{font-family:inherit;font-style:normal;font-weight:500}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .eyebrow{font-family:Vazirmatn,sans-serif;letter-spacing:0;font-size:14px}
.mono{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
[dir="rtl"] .mono{font-family:Vazirmatn,sans-serif}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gutter)}
.neighbour{padding:56px 0;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.neighbour.after{border-bottom:0;border-top:1px solid var(--line)}

section.own{padding:clamp(96px,14vh,168px) 0;display:none}
section.own.on{display:block}

/* shared heading — SectionHeading shape */
.head{display:grid;grid-template-columns:8fr 4fr;gap:32px 48px;align-items:end;margin-bottom:clamp(56px,8vh,88px)}
.head h2{font-size:clamp(34px,4.4vw,68px);max-width:20ch;margin-top:20px}
.head p{color:var(--muted);font-size:17px;max-width:40ch}
@media (max-width:900px){.head{grid-template-columns:1fr}}

.closing{margin-top:clamp(48px,7vh,80px);font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(22px,2.2vw,32px);letter-spacing:-.02em;line-height:1.2;max-width:30ch}
[dir="rtl"] .closing{font-family:Vazirmatn,sans-serif;letter-spacing:0;line-height:1.5}

/* ───────── A · One line, two positions ───────── */
.a-bar{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;border-top:2px solid var(--fg);padding:18px 0 clamp(28px,5vh,56px)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line-strong);border-radius:10px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:9px 18px;border-radius:7px;font-size:14px;color:var(--muted);transition:background .3s var(--ease),color .3s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.a-tower{list-style:none;position:relative}
.a-tower li{display:grid;grid-template-columns:56px minmax(0,7fr) minmax(0,4fr);gap:8px 32px;align-items:baseline;padding:clamp(6px,1vh,12px) 0}
.a-tower .name{font-size:clamp(44px,8.2vw,132px);line-height:1;transition:color .7s var(--ease)}
[dir="rtl"] .a-tower .name{line-height:1.25;font-size:clamp(40px,7vw,112px)}
.a-tower .say{font-size:16px;line-height:1.5;max-width:36ch;position:relative;min-height:3em}
.a-tower .say span{display:block;transition:opacity .45s var(--ease),transform .6s var(--ease)}
.a-tower .say .rent{position:absolute;inset:0 0 auto 0;color:var(--muted);opacity:0;transform:translateY(8px)}
.a-tower[data-state="template"] .say .rent{opacity:1;transform:none}
.a-tower[data-state="template"] .say .owned{opacity:0;transform:translateY(-8px)}
.a-tower[data-state="template"] li:not(:first-child) .name{color:var(--faint)}
.a-cut{position:absolute;inset-inline:0;top:0;height:0;border-top:2px dashed var(--brand);transition:transform 1s var(--ease);pointer-events:none}
.a-cut b{position:absolute;inset-inline-end:0;top:8px;font:400 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--brand-text);white-space:nowrap}
[dir="rtl"] .a-cut b{font-family:Vazirmatn,sans-serif;letter-spacing:0;font-size:14px}
.a-tower{padding-bottom:40px}
@media (max-width:900px){
  .a-tower li{grid-template-columns:32px minmax(0,1fr);padding:10px 0 18px}
  .a-tower li{padding-bottom:36px}
  .a-tower .say{grid-column:2;min-height:4.5em}
  .a-cut b{top:auto;bottom:8px}
}

/* ───────── B · Under the surface (photo stage) ───────── */
.b-stage{position:relative;margin:0 clamp(8px,1.2vw,16px);border-radius:28px;overflow:hidden;color:#fff;background:#06101f}
.b-stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.14);transition:transform 2.6s var(--ease)}
.b-stage.in>img{transform:scale(1)}
.b-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(3,8,18,.5),rgba(3,8,18,.72))}
.b-in{position:relative;z-index:1;padding:clamp(28px,5vw,72px);display:grid;grid-template-columns:6fr 5fr;gap:48px 64px}
.b-surface{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.b-stage .eyebrow{color:rgba(255,255,255,.72)}
.b-list{list-style:none}
.b-list button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:20px;width:100%;padding:10px 0;color:rgba(255,255,255,.5);transition:color .4s var(--ease)}
.b-list button .mono{color:inherit}
.b-list button .display{font-size:clamp(34px,4.6vw,72px)}
.b-list button[aria-selected="true"],.b-list button:hover{color:#fff}
.b-list button:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:6px}
.b-list li:first-child{border-bottom:2px dashed rgba(255,255,255,.6);padding-bottom:14px;margin-bottom:14px;position:relative}
.b-list li:first-child::after{content:attr(data-cut);position:absolute;inset-inline-end:0;bottom:-28px;font:400 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75)}
[dir="rtl"] .b-list li:first-child::after{font-family:Vazirmatn,sans-serif;letter-spacing:0;font-size:13px}
.b-list li:nth-child(2){padding-top:22px}
.b-panel{align-self:end;padding-bottom:10px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end}
.b-panel>*{transition:opacity .35s var(--ease),transform .5s var(--ease)}
.b-panel.swap>*{opacity:0;transform:translateY(10px)}
.b-panel .spec{font-size:15px;color:rgba(255,255,255,.72);margin-top:10px}
.b-panel .detail{font-size:16px;color:rgba(255,255,255,.82);margin-top:14px;max-width:46ch}
.b-panel .ownl{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.4)}
.b-panel .ownt{font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(21px,2vw,28px);line-height:1.25;letter-spacing:-.015em;margin-top:8px;max-width:26ch}
[dir="rtl"] .b-panel .ownt{font-family:Vazirmatn,sans-serif;letter-spacing:0;line-height:1.5}
.b-foot{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.25);padding-top:22px;margin-top:8px}
.b-foot .closing{margin-top:0}
@media (max-width:900px){
  .b-in{grid-template-columns:minmax(0,1fr)}
  .b-panel{min-height:0}
  .b-stage{border-radius:20px}
}

/* ───────── C · Lift the surface (sheets, CSS sticky — not a pin) ───────── */
.c-stack{list-style:none;--h:clamp(400px,58vh,560px);--t:16vh}
.c-sheet{position:sticky;bottom:calc(100vh - var(--t) - var(--h));height:var(--h);border-radius:22px;padding:clamp(24px,3.4vw,52px);display:grid;grid-template-columns:7fr 5fr;gap:24px 56px;align-content:space-between;background:var(--d);color:var(--fg);box-shadow:0 18px 40px -22px rgba(0,0,0,.45);border:1px solid var(--line)}
.c-sheet:nth-child(1){--d:var(--d1);z-index:5}
.c-sheet:nth-child(2){--d:var(--d2);z-index:4}
.c-sheet:nth-child(3){--d:var(--d3);z-index:3}
.c-sheet:nth-child(4){--d:var(--d4);z-index:2;color:#fff}
.c-sheet:nth-child(5){--d:var(--d5);z-index:1;color:#fff}
.c-sheet:nth-child(n+4){--muted:rgba(255,255,255,.72);--line-strong:rgba(255,255,255,.45);--brand-text:hsl(214 95% 76%)}
.c-sheet .top{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px}
.c-sheet .name{font-size:clamp(48px,8vw,128px);line-height:1;align-self:end}
[dir="rtl"] .c-sheet .name{line-height:1.25;font-size:clamp(44px,7vw,108px)}
.c-sheet .side{align-self:end}
.c-sheet .detail{font-size:16px;color:var(--muted);max-width:44ch}
.c-sheet .ownl{margin-top:20px;padding-top:14px;border-top:1px solid var(--line-strong)}
.c-sheet .ownl .eyebrow{color:var(--brand-text)}
.c-sheet .ownt{font-size:17px;margin-top:6px;max-width:40ch}
.c-sheet .cut{grid-column:1/-1;border-top:2px dashed var(--brand);padding-top:10px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.c-sheet .cut .eyebrow{color:var(--brand-text)}
@media (max-width:900px){
  .c-sheet{position:static;height:auto;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:12px;box-shadow:none}
}

/* prototype chrome */
.switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(20,22,28,.9);font:500 12px Inter,sans-serif;border:1px solid rgba(255,255,255,.14)}
.switch button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;color:#cbd5e1;white-space:nowrap}
.switch button.on{background:#fff;color:#07080B}
.switch button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.switch .sep{width:1px;background:rgba(255,255,255,.18);margin:6px 4px}
.about{position:fixed;top:12px;inset-inline-end:12px;z-index:60;max-width:380px;font:12px/1.5 Inter,sans-serif;background:rgba(20,22,28,.92);color:#cbd5e1;border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.14)}
.about b{color:#fff;font-weight:500}
@media (max-width:900px){.about{position:static;max-width:none;border-radius:0}.switch{max-width:96vw;overflow-x:auto}}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .b-stage>img{transform:none}
  .c-sheet{position:static;height:auto;margin-top:12px}
}
</style>
</head>
<body>

<div class="about" id="about" dir="ltr"></div>

<div class="wrap neighbour">↑ problem-section (five drawn rows) sits above on the homepage</div>

<!-- ════════ A ════════ -->
<section class="own" data-d="a" aria-labelledby="ha">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-k="eyebrow"></p><h2 id="ha" data-title></h2></div>
      <p data-k="subtitle"></p>
    </div>
    <div class="a-bar">
      <span class="eyebrow" data-k="compare"></span>
      <div class="seg" role="group" data-aria="compare">
        <button type="button" data-state="template" aria-pressed="false" data-k="segTemplate"></button>
        <button type="button" data-state="altruvex" aria-pressed="true">Altruvex</button>
      </div>
    </div>
    <ol class="a-tower" id="a-tower" data-state="altruvex" data-in></ol>
    <p class="closing" data-k="closing"></p>
  </div>
</section>

<!-- ════════ B ════════ -->
<section class="own" data-d="b" aria-labelledby="hb">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-k="eyebrow"></p><h2 id="hb" data-title></h2></div>
      <p data-k="subtitle"></p>
    </div>
  </div>
  <div class="b-stage" data-in>
    <img src="img/blue-folds.webp" alt="">
    <div class="b-in">
      <div class="b-surface"><span class="eyebrow" data-k="surface"></span><span class="eyebrow" data-k="legendAltruvex"></span></div>
      <ol class="b-list" id="b-list" role="tablist"></ol>
      <div class="b-panel" id="b-panel" role="tabpanel" aria-live="polite"></div>
      <div class="b-foot"><p class="closing" data-k="closing"></p></div>
    </div>
  </div>
</section>

<!-- ════════ C ════════ -->
<section class="own" data-d="c" aria-labelledby="hc">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-k="eyebrow"></p><h2 id="hc" data-title></h2></div>
      <p data-k="subtitle"></p>
    </div>
    <ol class="c-stack" id="c-stack"></ol>
    <p class="closing" data-k="closing"></p>
  </div>
</section>

<div class="wrap neighbour after">↓ services-section (dark scene, rows that open) follows on the homepage</div>

<div class="switch" role="group" aria-label="Prototype controls">
  <button data-set-d="a">A · One line</button>
  <button data-set-d="b">B · Under the surface</button>
  <button data-set-d="c">C · Lift the surface</button>
  <span class="sep"></span>
  <button id="lang">AR</button>
  <button id="theme">Dark</button>
</div>

<script>
// Copy: existing strings from apps/www/messages/{en,ar}/ownershipStack.json.

const T = {

    layers: [

};

const ABOUT = {
  a: "<b>A · One line, two positions.</b> The five layers are one block of display type; the only rule in the section is the dashed line. Under <i>A template</i> it sits below Interface and the four layers beneath go grey; under <i>Altruvex</i> it drops below Infrastructure. It plays once on arrival, then the switch is yours. Proof = comparison. Sources: large text service list (OIC Design, Awwwards element, 2023); two-state comparison is ADI's own free device; the moving line and the switch are mine. <b>Risk:</b> a control on the homepage; the detail paragraphs are dropped; new template-side lines are unreviewed copy.",

let lang = "en", dir = "a", bSel = 1;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, "0");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ownedHalf = s => s.split(" — ")[0] + ".";

/* A */
function setA(state) {
  const tower = $("#a-tower"), items = $$("li", tower), cut = $(".a-cut", tower);
  tower.dataset.state = state;
  $$(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.state === state)));
  const li = items[state === "template" ? 0 : items.length - 1];
  if (!li) return;
  cut.style.transform = `translateY(${li.offsetTop + li.offsetHeight}px)`;
  $("b", cut).textContent = state === "template" ? T[lang].templateStops : T[lang].legendAltruvex;
}

/* B */
function setB(i, instant) {
  bSel = i;
  const t = T[lang], l = t.layers[i], panel = $("#b-panel");
  $$("#b-list button").forEach((b, n) => b.setAttribute("aria-selected", String(n === i)));
  const fill = () => {
    panel.innerHTML = `<span class="mono" style="color:rgba(255,255,255,.72)"><bdi dir="ltr">${pad(i + 1)} / ${pad(t.layers.length)}</bdi></span><p class="spec">${l[1]}</p><p class="detail">${l[2]}</p><div class="ownl"><span class="eyebrow">${t.ownLabel}</span><p class="ownt">${l[3]}</p></div>`;
    panel.classList.remove("swap");
  };
  if (instant || reduced) return fill();
  panel.classList.add("swap"); setTimeout(fill, 220);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $$("[data-k]").forEach(el => { el.textContent = t[el.dataset.k]; });
  $$("[data-aria]").forEach(el => el.setAttribute("aria-label", t[el.dataset.aria]));
  $$("[data-title]").forEach(el => { el.innerHTML = `${t.title} <em class="acc">${t.titleAccent}</em>`; });

  $("#a-tower").innerHTML = t.layers.map((l, i) =>
    `<li><span class="mono">${pad(i + 1)}</span><h3 class="name">${l[0]}</h3><p class="say"><span class="owned">${ownedHalf(l[3])}</span><span class="rent" aria-hidden="true">${l[4]}</span></p></li>`).join("")
    + `<div class="a-cut" aria-hidden="true"><b></b></div>`;

  $("#b-list").innerHTML = t.layers.map((l, i) =>
    `<li${i === 0 ? ` data-cut="${t.templateStops}"` : ""}><button type="button" role="tab" data-i="${i}"><span class="mono">${pad(i + 1)}</span><span class="display">${l[0]}</span></button></li>`).join("");
  $$("#b-list button").forEach(b => {
    const go = () => { if (+b.dataset.i !== bSel) setB(+b.dataset.i); };
    b.addEventListener("click", go); b.addEventListener("mouseenter", go); b.addEventListener("focus", go);
  });
  setB(bSel, true);

  $("#c-stack").innerHTML = t.layers.map((l, i) =>
    `<li class="c-sheet"><div class="top"><span class="mono"><bdi dir="ltr">${pad(i + 1)} / ${pad(t.layers.length)}</bdi></span><span class="eyebrow">${l[1]}</span></div><h3 class="name">${l[0]}</h3><div class="side"><p class="detail">${l[2]}</p><div class="ownl"><span class="eyebrow">${t.ownLabel}</span><p class="ownt">${l[3]}</p></div></div>${i === 0 ? `<div class="cut"><span class="eyebrow">${t.templateStops}</span><span class="eyebrow">↓ ${t.legendAltruvex}</span></div>` : ""}</li>`).join("");

  $$(".own").forEach(s => s.classList.toggle("on", s.dataset.d === dir));
  $$("[data-set-d]").forEach(b => b.classList.toggle("on", b.dataset.setD === dir));
  $("#about").innerHTML = ABOUT[dir];
  $("#lang").textContent = lang === "en" ? "AR" : "EN";
  setA("altruvex");
  observe();
}

let io;
function observe() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    e.target.classList.add("in");
    // A's one signature: the line shows where a template stops, then drops to where Altruvex does
    if (e.target.id === "a-tower" && !reduced) { setA("template"); setTimeout(() => setA("altruvex"), 1700); }
  }), { threshold: .2 });
  $$(".own.on [data-in]").forEach(el => { el.classList.remove("in"); io.observe(el); });
}

$$(".seg button").forEach(b => b.addEventListener("click", () => setA(b.dataset.state)));
addEventListener("resize", () => setA($("#a-tower").dataset.state));
$$("[data-set-d]").forEach(b => b.addEventListener("click", () => { dir = b.dataset.setD; render(); scrollTo(0, 0); }));
$("#lang").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; render(); });
$("#theme").addEventListener("click", e => {
  const h = document.documentElement, dark = h.dataset.theme !== "dark";
  h.dataset.theme = dark ? "dark" : "light"; e.target.textContent = dark ? "Light" : "Dark";
});
document.fonts.ready.then(() => setA($("#a-tower").dataset.state));
render();
</script>
</body>
</html>
