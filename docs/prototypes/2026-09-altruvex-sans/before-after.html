<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altruvex Sans before/after</title>
<!-- Before = the prototype as it was before stress-test changes J1–J6 (before-j/). After = the current files.
     Both frames scroll together (anchored on section heads), and the page controls are mirrored. -->
<style>
  :root { --bg: #f7f7f5; --fg: #16161a; --muted: #6b6b73; --border: #d9d9de; --surface: #fff; --before: #b4531f; --after: #2c6e49; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111114; --fg: #ededf0; --muted: #9a9aa3; --border: #2e2e35; --surface: #1a1a1f; --before: #e58a57; --after: #6cc28f; } }
  :root[data-theme="dark"] { --bg: #111114; --fg: #ededf0; --muted: #9a9aa3; --border: #2e2e35; --surface: #1a1a1f; --before: #e58a57; --after: #6cc28f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; display: flex; flex-direction: column; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .bar b { letter-spacing: .08em; text-transform: uppercase; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button, select { font: inherit; color: var(--fg); background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
  select { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); max-width: 100%; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg button:focus-visible, select:focus-visible { outline: 2px solid var(--after); outline-offset: 2px; }
  .hint { color: var(--muted); }
  .stage { flex: 1; min-height: 0; display: grid; }
  .pane { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pane > .lbl { padding: 4px 16px; font-weight: 600; border-bottom: 3px solid; }
  .pane.before > .lbl { color: var(--before); border-color: var(--before); }
  .pane.after > .lbl { color: var(--after); border-color: var(--after); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  /* flip: both frames stay laid out at full size so scroll positions stay in step; only one is visible */
  .stage[data-mode="flip"] .pane { grid-area: 1 / 1; }
  .stage[data-mode="flip"] .pane[hidden-pane] { visibility: hidden; }
  .stage[data-mode="side"] { grid-template-columns: 1fr 1fr; }
  .stage[data-mode="side"] .pane.before { border-inline-end: 1px solid var(--border); }
  .flip-only { display: contents; }
  body[data-mode="side"] .flip-only > * { display: none; }
  @media (max-width: 767px) { .stage[data-mode="side"] { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body data-mode="flip">
<div class="bar" role="toolbar" aria-label="Before and after controls">
  <b>Before / after J1–J6</b>
  <label>Page <select id="page"><option value="compare.html">compare.html</option><option value="stress-test.html">stress-test.html</option></select></label>
  <span class="seg" id="mode"><button type="button" data-v="flip" aria-pressed="true">Flip</button><button type="button" data-v="side" aria-pressed="false">Side by side</button></span>
  <span class="flip-only"><span class="seg" id="which"><button type="button" data-v="before" aria-pressed="true">Before</button><button type="button" data-v="after" aria-pressed="false">After</button></span>
  <span class="hint">press <kbd>D</kbd> to flip</span></span>
  <label>Jump <select id="jump"></select></label>
</div>
<div class="stage" id="stage" data-mode="flip">
  <div class="pane before"><div class="lbl">Before · prototype before the stress-test changes</div><iframe id="fb" title="Before"></iframe></div>
  <div class="pane after" hidden-pane><div class="lbl">After · J1–J6 applied</div><iframe id="fa" title="After"></iframe></div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const fb = $("#fb"), fa = $("#fa"), stage = $("#stage");
  const frames = [fb, fa];
  const other = (f) => (f === fb ? fa : fb);
  let mode = "flip", showing = "before", lead = fb, mirroring = false;

  const ANCHORS = ".part-head, section[id] > h2";
  const anchors = (f) => [...f.contentDocument.querySelectorAll(ANCHORS)];

  // Keep the other frame at the same place relative to the nearest section head above the fold.
  function sync(src) {
    const dst = other(src);
    if (!src.contentDocument || !dst.contentDocument) return;
    const a = anchors(src), b = anchors(dst);
    let i = -1;
    a.forEach((el, k) => { if (el.getBoundingClientRect().top <= 1) i = k; });
    const w = dst.contentWindow;
    if (i < 0 || !b[i]) { w.scrollTo(0, src.contentWindow.scrollY); return; }
    const offset = -a[i].getBoundingClientRect().top;
    w.scrollTo(0, b[i].getBoundingClientRect().top + w.scrollY + offset);
  }

  function buildJump() {
    const sel = $("#jump");
    sel.innerHTML = '<option value="-1">top</option>' + anchors(fa).map((el, k) => `<option value="${k}">${el.textContent.trim().slice(0, 60)}</option>`).join("");
  }
  $("#jump").addEventListener("change", (e) => {
    const k = +e.target.value, f = lead;
    if (k < 0) f.contentWindow.scrollTo(0, 0); else anchors(f)[k].scrollIntoView();
    sync(f);
  });

  // Mirror the page's own controls: the Nth button / select in one frame drives the Nth in the other.
  function wire(f) {
    const d = f.contentDocument, w = f.contentWindow;
    w.addEventListener("scroll", () => { if (f === lead) sync(f); }, { passive: true });
    d.addEventListener("pointerenter", () => { if (mode === "side") lead = f; });
    d.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || mirroring) return;
      const i = [...d.querySelectorAll("button")].indexOf(btn);
      const twin = other(f).contentDocument.querySelectorAll("button")[i];
      if (twin) { mirroring = true; twin.click(); mirroring = false; }
      setTimeout(() => sync(f), 50);
    });
    d.addEventListener("change", (e) => {
      if (e.target.tagName !== "SELECT" || mirroring) return;
      const i = [...d.querySelectorAll("select")].indexOf(e.target);
      const twin = other(f).contentDocument.querySelectorAll("select")[i];
      if (twin) { mirroring = true; twin.value = e.target.value; twin.dispatchEvent(new Event("change", { bubbles: true })); mirroring = false; }
      setTimeout(() => sync(f), 50);
    });
    w.addEventListener("keydown", (e) => {
      if (e.key === "d" || e.key === "D") { flip(); return; }
      if (mirroring || e.target.closest?.("input, select, textarea")) return;
      mirroring = true; other(f).contentWindow.dispatchEvent(new KeyboardEvent("keydown", { key: e.key, bubbles: true })); mirroring = false;
    });
  }

  function setShowing(v) {
    showing = v;
    fb.parentElement.toggleAttribute("hidden-pane", v !== "before");
    fa.parentElement.toggleAttribute("hidden-pane", v !== "after");
    const prev = lead; lead = v === "before" ? fb : fa;
    if (prev !== lead) sync(prev);
    $("#which").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  }
  const flip = () => { if (mode === "flip") setShowing(showing === "before" ? "after" : "before"); };
  $("#which").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setShowing(b.dataset.v); });
  $("#mode").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.v; stage.dataset.mode = mode; document.body.dataset.mode = mode;
    $("#mode").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    setTimeout(() => sync(lead), 100);
  });
  addEventListener("keydown", (e) => { if ((e.key === "d" || e.key === "D") && !e.target.closest("select")) flip(); });

  function load(page) {
    let n = 0;
    const done = () => { if (++n === 2) { frames.forEach(wire); buildJump(); } };
    fb.onload = done; fa.onload = done;
    const v = "?v=" + Date.now();  // python's http.server sends no cache headers; always show the files on disk
    fb.src = "before-j/" + page + v; fa.src = page + v;
  }
  $("#page").addEventListener("change", (e) => load(e.target.value));
  load("compare.html");
</script>
</body>
</html>
