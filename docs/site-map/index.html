const ORDER = ["New","Core","Services","Commercial","Proof","Company","Content","Legal"];

function report(){

    ["أقسام من غير هدف", r.missing],

  return `<div class="report">${rows.map(([t, list]) =>
    `<b>${t} (${list.length})</b><ul>${list.map(x => `<li><code class="ltr">${esc(x)}</code></li>`).join("")}</ul>`).join("")}</div>`;
}

function buildIndex(){

  for (const g of ORDER){
    const list = pages.map((p,i)=>[p,i]).filter(([p])=>(GROUPS[p.group]?p.group:"New")===g);
    if (!list.length) continue;
    h += `<div class="grp" style="--c:${col(g)}"><i></i>${grp(g)[0]}</div>`;
    for (const [p,i] of list) h += `<button class="pg" type="button" data-i="${i}"><span class="ltr">${esc(p.route)}</span><small>${holes(p)?`<span class="flag">●</span> `:""}${p.sections.length}</small></button>`;

}

      ${s.headingAr && s.headingAr!==s.heading?`<div class="ar">${esc(s.headingAr)}</div>`:""}
      ${partsList(s.parts)}
      <div class="gl${s.goal?"":" none"}">${s.goal?esc(s.goal):"هدف غير مكتوب"}</div>
      ${p.manual?"":`<div class="key ltr">${esc(s.key)}</div>`}
    </article>`).join("");
  const prev = i>0?`<button class="pill" type="button" data-go="${i-1}">→ <span class="ltr">${esc(pages[i-1].route)}</span></button>`:"<span></span>";
  const next = i<pages.length-1?`<button class="pill" type="button" data-go="${i+1}"><span class="ltr">${esc(pages[i+1].route)}</span> ←</button>`:"<span></span>";
  view.innerHTML = `
    <div class="map" style="--c:${c}">
      <section class="root">
        <span class="tag">${grp(p.group)[0]}</span>
        <div class="route ltr">${esc(p.route)}</div>
        <p class="goal">${p.goal?esc(p.goal):`<span style="color:var(--warn)">هدف الصفحة غير مكتوب</span>`}</p>
        ${p.primaryCta?`<div class="meta">الزرار الأساسي: <span class="ltr">${esc(p.primaryCta)}</span></div>`:""}
        <div class="meta">${p.sections.length} أقسام${p.manual?" · مكتوبة يدويًا (خارج main)":""}</div>
        ${p.instances?`<details><summary>${p.instances.length} صفحات بنفس القالب</summary><ul>${p.instances.map(x=>`<li class="ltr">${esc(x)}</li>`).join("")}</ul></details>`:""}
      </section>
      <div class="branches"><span class="root-link"></span>${nodes || `<div class="ok">مفيش أقسام اتقرأت من الصفحة دي.</div>`}</div>
    </div>
    <div class="pager">${prev}${next}</div>`;
  mark(i); remember(i);
}
function showAll(){
  let h = `<div class="ov">${report()}`;
  for (const g of ORDER){
    const list = pages.map((p,i)=>[p,i]).filter(([p])=>(GROUPS[p.group]?p.group:"New")===g);
    if (!list.length) continue;
    h += `<h2 style="--c:${col(g)}"><i></i>${grp(g)[0]}</h2><div class="cards">`;
    for (const [p,i] of list) h += `<button class="card" type="button" style="--c:${col(g)}" data-go="${i}"><div class="route ltr">${esc(p.route)}</div><p>${esc(p.goal)}</p><ol>${p.sections.map(s=>`<li class="ltr${s.goal?"":" none"}">${esc(s.heading)}</li>`).join("")}</ol></button>`;
    h += `</div>`;
  }
  h += `<div class="note">للتحديث بعد أي تغيير في الصفحات: شغّل الموقع (<code class="ltr">bun run dev --filter=www</code>) وبعدين <code class="ltr">bun run site-map</code>. القسم الجديد بيظهر هنا بعلامة "هدف غير مكتوب" لحد ما هدفه يتكتب في <code class="ltr">docs/site-map/goals.json</code> تحت نفس الـ key.</div></div>`;
  view.innerHTML = h; mark("all"); remember("all");
}
function go(i){ i==="all" ? showAll() : showPage(+i); window.scrollTo({top:0}); }
function remember(i){ try{ localStorage.setItem("site-map-page", i); }catch(e){} }
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-i],[data-go]"); if(!b) return;
  go(b.dataset.i ?? b.dataset.go);
});
const modes=["auto","light","dark"], labels={auto:"تلقائي",light:"فاتح",dark:"داكن"};
let m="auto"; try{ m = localStorage.getItem("site-map-theme")||"auto"; }catch(e){}
function applyTheme(){ if(m==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme=m; document.getElementById("theme").textContent="الوضع: "+labels[m]; }
document.getElementById("theme").onclick=()=>{ m=modes[(modes.indexOf(m)+1)%3]; try{localStorage.setItem("site-map-theme",m)}catch(e){} applyTheme(); };
applyTheme(); buildIndex();
let start="all"; try{ start = localStorage.getItem("site-map-page") ?? "all"; }catch(e){}
go(start==="all"||pages[start]? start : "all");
</script>
</body>
