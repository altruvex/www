<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة موقع Altruvex</title>
<!-- Generated by apps/www/scripts/site-map/build.mjs from this template. Edit the template, not docs/site-map/index.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#eef1f5;--fg:#141518;--muted:#5b616b;--line:#d5dae2;
  --brand:#0d6be8;--brand-text:#0b5dc9;--iris:#6b4ce6;--brand-soft:rgba(13,107,232,.08);--warn:#b4560a;--warn-soft:rgba(180,86,10,.08);
  --g-core:#0d6be8;--g-services:#6b4ce6;--g-commercial:#0e8a6a;--g-proof:#c2561a;--g-company:#8a5a00;--g-content:#b0336b;--g-legal:#5b616b;--g-new:#b4560a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212;--surface:#1b1c1f;--surface-2:#24262a;--fg:#f0f0f0;--muted:#a3a8b1;--line:#34373d;
    --brand:#2f86f6;--brand-text:#4a9bff;--iris:#9b86ff;--brand-soft:rgba(74,155,255,.12);--warn:#f0a050;--warn-soft:rgba(240,160,80,.1);
    --g-core:#4a9bff;--g-services:#9b86ff;--g-commercial:#3fc79f;--g-proof:#f08a4b;--g-company:#e0b04a;--g-content:#f07aaf;--g-legal:#a3a8b1;--g-new:#f0a050;
  }
}
:root[data-theme="dark"]{
  --bg:#121212;--surface:#1b1c1f;--surface-2:#24262a;--fg:#f0f0f0;--muted:#a3a8b1;--line:#34373d;
  --brand:#2f86f6;--brand-text:#4a9bff;--iris:#9b86ff;--brand-soft:rgba(74,155,255,.12);--warn:#f0a050;--warn-soft:rgba(240,160,80,.1);
  --g-core:#4a9bff;--g-services:#9b86ff;--g-commercial:#3fc79f;--g-proof:#f08a4b;--g-company:#e0b04a;--g-content:#f07aaf;--g-legal:#a3a8b1;--g-new:#f0a050;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Vazirmatn","Outfit",system-ui,sans-serif;font-size:15px;line-height:1.7;overflow-x:hidden}
.ltr{font-family:"Outfit","Vazirmatn",sans-serif;direction:ltr;unicode-bidi:isolate;text-align:right}
header.top{padding:28px 16px 12px;max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font-weight:300;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2}
h1 b{font-weight:500;background:linear-gradient(90deg,var(--brand),var(--iris));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:6px 0 0;color:var(--muted);max-width:64ch}
.stamp{font-size:12.5px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:13px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.layout{max-width:1280px;margin:0 auto;padding:8px 16px 48px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
nav.index{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;padding-inline-end:4px}
.grp{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.grp i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pg{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;border:0;background:none;color:var(--fg);padding:6px 10px;border-radius:10px;font-size:14px}
.pg:hover{background:var(--surface-2)}
.pg[aria-current="true"]{background:var(--brand-soft);color:var(--brand-text);font-weight:500}
.pg small{color:var(--muted);font-size:12px}
.pg .flag{color:var(--warn)}
.all{width:100%;margin-bottom:6px}
main{min-width:0}
.report{border:1px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:13.5px}
.report b{color:var(--warn);font-weight:500}
.report ul{margin:4px 0 8px;padding-inline-start:18px}
.report code{font-family:"Outfit",monospace;font-size:12.5px}
.ok{border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin-bottom:16px;font-size:13.5px;color:var(--muted)}
/* mind map */
.map{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);align-items:start}
.root{position:sticky;top:12px;background:var(--surface);border:1.5px solid var(--c);border-radius:22px;padding:20px}
.root .tag{display:inline-block;font-size:12px;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 10px;margin-bottom:8px}
.root .route{font-size:22px;font-weight:500}
.root .goal{margin:8px 0 12px}
.root .meta{font-size:13px;color:var(--muted)}
.root .meta span{color:var(--brand-text);font-weight:500}
.root details{margin-top:8px;font-size:12.5px;color:var(--muted)}
.root details ul{margin:4px 0 0;padding-inline-start:16px}
.branches{position:relative;padding-inline-start:44px;display:grid;gap:10px}
.branches::before{content:"";position:absolute;inset-inline-start:22px;top:48px;bottom:28px;border-inline-start:1.5px solid var(--c)}
.root-link{position:absolute;inset-inline-start:0;top:48px;width:22px;border-top:1.5px solid var(--c)}
.node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.node::before{content:"";position:absolute;inset-inline-start:-23px;top:50%;width:22px;border-top:1.5px solid var(--c)}
.node::after{content:"";position:absolute;inset-inline-start:-27px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--c)}
.node > *:not(.num){grid-column:2}
.num{grid-row:1 / span 6;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--c);display:grid;place-items:center;font-size:13px;font-weight:600;font-family:"Outfit",sans-serif}
.node .nm{font-weight:500;font-size:14px}
.node .ar{font-size:13px;color:var(--muted)}
.node .gl{font-size:14px}
.node .gl::before{content:"الهدف: ";color:var(--c);font-weight:500}
.node .gl.none{color:var(--warn)}
.node .gl.none::before{color:var(--warn)}
.node .key{font-size:11.5px;color:var(--muted);opacity:.8}
.badge{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);margin-inline-start:6px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px;padding:0;list-style:none}
.parts li{font-size:12px;border:1px dashed var(--c);border-radius:999px;padding:1px 10px;color:var(--fg)}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
/* overview */
.ov h2{font-weight:400;font-size:20px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.ov h2 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-top:3px solid var(--c);background:var(--surface);border-radius:16px;padding:14px;text-align:start;color:var(--fg)}
.card:hover{border-color:var(--c)}
.card .route{font-weight:500}
.card p{margin:4px 0 8px;font-size:13.5px;color:var(--muted)}
.card ol{margin:0;padding-inline-start:18px;font-size:13px}
.card li{margin:2px 0}
.card li.none{color:var(--warn)}
.note{margin-top:28px;padding:14px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13.5px}
.note code{font-family:"Outfit",monospace}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.index{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  nav.index .grp{display:none}
  .pg{white-space:nowrap;width:auto;border:1px solid var(--line);border-radius:999px}
  .pg small{display:none}
  .all{width:auto;margin:0;white-space:nowrap}
  .map{grid-template-columns:minmax(0,1fr)}
  .root{position:relative;top:auto}
  .root-link{display:none}
  .branches{padding-inline-start:30px;padding-top:14px}
  .branches::before{inset-inline-start:12px;top:0}
  .node::before{inset-inline-start:-17px;width:16px}
  .node::after{inset-inline-start:-21px}
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>خريطة موقع <b class="ltr">Altruvex</b></h1>
    <p class="lede">كل صفحة، والأقسام اللي جواها بترتيب ظهورها، وهدف كل قسم. الهيكل بيتقرا من الموقع نفسه، والأهداف مكتوبة في <span class="ltr">docs/site-map/goals.json</span>.</p>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="tools">
    <button class="pill" id="theme" type="button">الوضع: تلقائي</button>
  </div>
</header>
<div class="layout">
  <nav class="index" id="index" aria-label="الصفحات"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<script>
const DATA = __DATA__;
const GROUPS = {Core:["الأساسية","--g-core"],Services:["الخدمات","--g-services"],Commercial:["السعر والقرار","--g-commercial"],Proof:["الدليل","--g-proof"],Company:["الاستوديو","--g-company"],Content:["المحتوى","--g-content"],Legal:["القانونية","--g-legal"],New:["صفحات جديدة","--g-new"]};
const ORDER = ["New","Core","Services","Commercial","Proof","Company","Content","Legal"];
const pages = DATA.pages;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grp = g => GROUPS[g] || GROUPS.New;
const col = g => `var(${grp(g)[1]})`;
const holes = p => p.sections.filter(s => !s.goal).length + (p.goal ? 0 : 1);
const idx = document.getElementById("index"), view = document.getElementById("view");

document.getElementById("stamp").textContent =
  "آخر تحديث: " + new Date(DATA.generatedAt).toLocaleString("ar-EG-u-nu-latn", {dateStyle:"medium", timeStyle:"short"});

function report(){
  const r = DATA.report, rows = [
    ["أقسام من غير هدف", r.missing],
    ["أهداف لأقسام اختفت", r.orphaned],
    ["صفحات ما اتقرأتش", r.unreachable],
  ].filter(([, list]) => list.length);
  if (!rows.length) return `<div class="ok">كل الأقسام ليها هدف مكتوب.</div>`;
  return `<div class="report">${rows.map(([t, list]) =>
    `<b>${t} (${list.length})</b><ul>${list.map(x => `<li><code class="ltr">${esc(x)}</code></li>`).join("")}</ul>`).join("")}</div>`;
}

function buildIndex(){
  let h = `<button class="pill all" type="button" data-i="all">كل الصفحات</button>`;
  for (const g of ORDER){
    const list = pages.map((p,i)=>[p,i]).filter(([p])=>(GROUPS[p.group]?p.group:"New")===g);
    if (!list.length) continue;
    h += `<div class="grp" style="--c:${col(g)}"><i></i>${grp(g)[0]}</div>`;
    for (const [p,i] of list) h += `<button class="pg" type="button" data-i="${i}"><span class="ltr">${esc(p.route)}</span><small>${holes(p)?`<span class="flag">●</span> `:""}${p.sections.length}</small></button>`;
  }
  idx.innerHTML = h;
}
function mark(i){
  idx.querySelectorAll("[data-i]").forEach(b=>{
    const on = String(b.dataset.i)===String(i);
    b.setAttribute(b.classList.contains("all")?"aria-pressed":"aria-current", on);
  });
}
function partsList(list){
  return list && list.length ? `<ul class="parts">${list.map(x=>`<li class="ltr">${esc(x)}</li>`).join("")}</ul>` : "";
}
function showPage(i){
  const p = pages[i], c = col(p.group);
  const nodes = p.sections.map((s,n)=>`
    <article class="node">
      <span class="num">${n+1}</span>
      <div class="nm ltr">${esc(s.heading)}${s.onlyOn?`<span class="badge">في ${esc(s.onlyOn)}</span>`:""}</div>
      ${s.headingAr && s.headingAr!==s.heading?`<div class="ar">${esc(s.headingAr)}</div>`:""}
      ${partsList(s.parts)}
      <div class="gl${s.goal?"":" none"}">${s.goal?esc(s.goal):"هدف غير مكتوب"}</div>
      ${p.manual?"":`<div class="key ltr">${esc(s.key)}</div>`}
    </article>`).join("");
  const prev = i>0?`<button class="pill" type="button" data-go="${i-1}">→ <span class="ltr">${esc(pages[i-1].route)}</span></button>`:"<span></span>";
  const next = i<pages.length-1?`<button class="pill" type="button" data-go="${i+1}"><span class="ltr">${esc(pages[i+1].route)}</span> ←</button>`:"<span></span>";
  view.innerHTML = `
    <div class="map" style="--c:${c}">
      <section class="root">
        <span class="tag">${grp(p.group)[0]}</span>
        <div class="route ltr">${esc(p.route)}</div>
        <p class="goal">${p.goal?esc(p.goal):`<span style="color:var(--warn)">هدف الصفحة غير مكتوب</span>`}</p>
        ${p.primaryCta?`<div class="meta">الزرار الأساسي: <span class="ltr">${esc(p.primaryCta)}</span></div>`:""}
        <div class="meta">${p.sections.length} أقسام${p.manual?" · مكتوبة يدويًا (خارج main)":""}</div>
        ${p.instances?`<details><summary>${p.instances.length} صفحات بنفس القالب</summary><ul>${p.instances.map(x=>`<li class="ltr">${esc(x)}</li>`).join("")}</ul></details>`:""}
      </section>
      <div class="branches"><span class="root-link"></span>${nodes || `<div class="ok">مفيش أقسام اتقرأت من الصفحة دي.</div>`}</div>
    </div>
    <div class="pager">${prev}${next}</div>`;
  mark(i); remember(i);
}
function showAll(){
  let h = `<div class="ov">${report()}`;
  for (const g of ORDER){
    const list = pages.map((p,i)=>[p,i]).filter(([p])=>(GROUPS[p.group]?p.group:"New")===g);
    if (!list.length) continue;
    h += `<h2 style="--c:${col(g)}"><i></i>${grp(g)[0]}</h2><div class="cards">`;
    for (const [p,i] of list) h += `<button class="card" type="button" style="--c:${col(g)}" data-go="${i}"><div class="route ltr">${esc(p.route)}</div><p>${esc(p.goal)}</p><ol>${p.sections.map(s=>`<li class="ltr${s.goal?"":" none"}">${esc(s.heading)}</li>`).join("")}</ol></button>`;
    h += `</div>`;
  }
  h += `<div class="note">للتحديث بعد أي تغيير في الصفحات: شغّل الموقع (<code class="ltr">bun run dev --filter=www</code>) وبعدين <code class="ltr">bun run site-map</code>. القسم الجديد بيظهر هنا بعلامة "هدف غير مكتوب" لحد ما هدفه يتكتب في <code class="ltr">docs/site-map/goals.json</code> تحت نفس الـ key.</div></div>`;
  view.innerHTML = h; mark("all"); remember("all");
}
function go(i){ i==="all" ? showAll() : showPage(+i); window.scrollTo({top:0}); }
function remember(i){ try{ localStorage.setItem("site-map-page", i); }catch(e){} }
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-i],[data-go]"); if(!b) return;
  go(b.dataset.i ?? b.dataset.go);
});
const modes=["auto","light","dark"], labels={auto:"تلقائي",light:"فاتح",dark:"داكن"};
let m="auto"; try{ m = localStorage.getItem("site-map-theme")||"auto"; }catch(e){}
function applyTheme(){ if(m==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme=m; document.getElementById("theme").textContent="الوضع: "+labels[m]; }
document.getElementById("theme").onclick=()=>{ m=modes[(modes.indexOf(m)+1)%3]; try{localStorage.setItem("site-map-theme",m)}catch(e){} applyTheme(); };
applyTheme(); buildIndex();
let start="all"; try{ start = localStorage.getItem("site-map-page") ?? "all"; }catch(e){}
go(start==="all"||pages[start]? start : "all");
</script>
</body>
</html>
